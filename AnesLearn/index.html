<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#F4F2EE;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column;}
button,select,input,textarea{font-family:'Inter',sans-serif;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:#ddd;border-radius:10px;}
.fade{animation:fadeUp .18s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
input:focus,select:focus{outline:2px solid #CFB87C;outline-offset:1px;}
a{color:inherit;text-decoration:none;}

/* ── HEADER ── */
#hdr-top{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:50px;background:#1B1B1B;border-bottom:1px solid rgba(255,255,255,.08);}
#hdr-nav{background:#1B1B1B;border-bottom:2px solid #A8924A;display:flex;overflow-x:auto;padding:0 8px;scrollbar-width:none;}
#hdr-nav::-webkit-scrollbar{display:none;}
header{position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);flex-shrink:0;}
.hdr-actions{display:flex;align-items:center;gap:6px;}

/* ── MAIN CONTENT ── */
#main-content{flex:1;max-width:1160px;width:100%;margin:0 auto;padding:20px 16px;}

/* ── DASHBOARD GRID ── */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}

/* ── COURSES GRID ── */
.courses-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}

/* ── KUDOS ── */
.kudos-grid{display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start;}

/* ── MODAL ── */
.modal-wrap{position:fixed;inset:0;background:rgba(27,27,27,.7);z-index:600;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px);}
.modal-inner{background:#fff;border-radius:14px;padding:28px 32px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.25);animation:fadeUp .18s ease;}

/* ── PAGE TITLES ── */
.pg-title{font-size:28px;font-weight:800;font-family:'Playfair Display',serif;line-height:1.2;}

/* ── ADMIN PANEL ── */
.admin-resident-actions{display:flex;gap:6px;flex-shrink:0;}

/* ── MOBILE ── */
@media(max-width:640px){
  #hdr-top{padding:0 12px;height:48px;}
  #main-content{padding:14px 12px;}

  /* header: hide text label, shrink buttons */
  .hdr-logo-text{display:none;}
  .hdr-admin-label{display:none;}
  .hdr-switch-label{display:none;}
  .hdr-bell{padding:5px 7px !important;}
  .hdr-admin{padding:5px 8px !important;}
  .hdr-user{padding:3px 4px 3px 4px !important;}

  /* dashboard */
  .dash-grid{grid-template-columns:1fr;}
  .stats-grid{grid-template-columns:repeat(2,1fr);}

  /* courses */
  .courses-grid{grid-template-columns:1fr;}

  /* admin panel full width */
  .admin-panel-inner{max-width:100% !important;}
  .admin-resident-actions{flex-wrap:wrap;}

  /* kudos */
  .kudos-grid{grid-template-columns:1fr;}

  /* modal */
  .modal-wrap{padding:8px;}
  .modal-inner{padding:20px 16px;border-radius:12px;max-width:100%;}

  /* page titles */
  .pg-title{font-size:21px;}
}

@media(max-width:400px){
  .stats-grid{grid-template-columns:1fr 1fr;}
  #hdr-top{gap:6px;}
}
</style>

// ─── SUPABASE HELPERS ─────────────────────────────────────────────────────────
async function dbGet(table, col, val){
  const q = val!==undefined ? sb.from(table).select('*').eq(col,val) : sb.from(table).select('*');
  const {data,error} = await q;
  if(error) console.error('dbGet',table,error);
  return data||[];
}
async function dbUpsert(table, row){
  const {error} = await sb.from(table).upsert(row);
  if(error) console.error('dbUpsert',table,error);
}
async function dbDelete(table, col, val){
  const {error} = await sb.from(table).delete().eq(col,val);
  if(error) console.error('dbDelete',table,error);
}
async function dbSet(key, value){
  await sb.from('settings').upsert({key, value: JSON.stringify(value)});
}
async function dbGetSetting(key, def){
  const {data} = await sb.from('settings').select('value').eq('key',key).single();
  if(!data) return def;
  try{return JSON.parse(data.value);}catch{return def;}
}

// ─── PERSIST (Supabase-backed) ────────────────────────────────────────────────
async function persist(key, val){
  S[key] = val;
  draw();
  if(key==='courses'){
    // Store each course as a row
    await Promise.all(val.map(c => dbUpsert('courses', {id:c.id, data:c})));
  } else if(key==='residents'){
    await Promise.all(val.map(r => dbUpsert('residents', {
      id:r.id, name:r.name, year:r.year, chief:!!r.chief, enrolled:r.enrolled
    })));
  } else if(key==='events'){
    // Full replace: delete all then insert
    await sb.from('events').delete().neq('id','___');
    if(val.length) await sb.from('events').insert(val.map(e=>{
      return {id:String(e.id), title:e.title, date:e.date, time:e.time||'', type:e.type||'Lecture'};
    }));
  } else if(key==='icsUrl'){
    await dbSet('icsUrl', val);
  } else if(key==='kudos'){
    // kudos are appended individually — see submitKudos
  }
}

function detectType(url){
  if(!url)return'other';
  if(/youtube\.com\/watch|youtu\.be\//.test(url))return'youtube';
  if(/docs\.google\.com\/presentation/.test(url))return'gslides';
  if(/drive\.google\.com|docs\.google\.com/.test(url))return'gdrive';
  if(/open\.spotify\.com\/(episode|show|track)/.test(url))return'spotify';
  if(/sharepoint\.com|onedrive\.live|1drv\.ms/.test(url))return'sharepoint';
  if(/accrac\.com|buzzsprout\.com|podbean\.com|simplecast\.com|transistor\.fm|anchor\.fm|spreaker\.com|soundcloud\.com|pinecast\.com|captivate\.fm|podcasts\.apple\.com|podcast\.apple\.com/.test(url))return'podcast';
  if(/\.pdf($|\?)/.test(url))return'pdf';
  return'other';
}
function buildEmbed(url,type){
  try{
    if(type==='youtube'){const m=url.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);if(m)return`https://www.youtube.com/embed/${m[1]}?rel=0&modestbranding=1`;}
    if(type==='gslides'){const m=url.match(/\/presentation\/d\/([^/]+)/);if(m)return`https://docs.google.com/presentation/d/${m[1]}/embed?start=false&loop=false`;}
    if(type==='gdrive'){const m=url.match(/\/d\/([^/]+)/);if(m)return`https://drive.google.com/file/d/${m[1]}/preview`;if(url.includes('/preview'))return url;}
    if(type==='spotify'){const m=url.match(/open\.spotify\.com\/(episode|show|track)\/([a-zA-Z0-9]+)/);if(m)return`https://open.spotify.com/embed/${m[1]}/${m[2]}?utm_source=generator`;}
    if(type==='podcast'&&url.includes('accrac.com')){
      // ACCRAC WordPress embed — just append /embed/ to episode URL
      return url.replace(/\/+$/,'')+'/embed/';
    }
    if(type==='pdf')return url;
    if(type==='upload')return url; // base64 data URL stored in IndexedDB
  }catch{}return null;
}

// ─── CALENDAR ─────────────────────────────────────────────────────────────────
function pgCalendar(){
  const icsReady = (S.icsEvents||[]).length > 0;
  const hasUrl   = !!(S.icsUrl||'').trim();
  const fetching = !!S.icsFetching;

  // Merge: ICS events take over if connected, otherwise fall back to manual events
  const allEvents = icsReady ? S.icsEvents : S.events;
  const y=S.calYear, m=S.calMonth;
  const days=new Date(y,m+1,0).getDate();
  const first=new Date(y,m,1).getDay();
  const mName=new Date(y,m).toLocaleString('default',{month:'long'});
  const evForDay=d=>allEvents.filter(e=>{const ed=new Date(e.date+'T00:00:00');return ed.getFullYear()===y&&ed.getMonth()===m&&ed.getDate()===d;});
  const upcoming=[...allEvents].filter(e=>new Date(e.date+'T00:00:00')>=new Date()).sort((a,b)=>new Date(a.date)-new Date(b.date));

  let grid=['S','M','T','W','T','F','S'].map(d=>`<div style="text-align:center;font-size:10px;font-weight:700;color:#bbb;padding:4px 0;">${d}</div>`).join('');
  for(let i=0;i<first;i++)grid+='<div></div>';
  for(let d=1;d<=days;d++){
    const evs=evForDay(d),isSel=S.calSel===d,isToday=d===3&&m===2&&y===2026;
    grid+=`<div onclick="calSel(${d})" style="aspect-ratio:1;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:12px;background:${isToday?'#1B1B1B':isSel?'#FAF3DF':'transparent'};color:${isToday?'#CFB87C':'#1a1a1a'};border:1.5px solid ${isSel?'#A8924A':'transparent'};font-weight:${isToday||isSel?700:400};">${d}${evs.length?`<div style="display:flex;gap:2px;margin-top:1px;">${evs.slice(0,3).map(()=>`<div style="width:3px;height:3px;border-radius:50%;background:${isToday?'#CFB87C':'#A8924A'};"></div>`).join('')}</div>`:''}</div>`;
  }

  const selH=S.calSel&&evForDay(S.calSel).length?`<div style="margin-top:16px;padding-top:14px;border-top:1px solid #F0EDE8;">
    <div style="${sLbl}margin-bottom:8px;">${mName} ${S.calSel}</div>
    ${evForDay(S.calSel).map(ev=>`<div style="display:flex;gap:10px;padding:8px 0;align-items:flex-start;">
      <div style="width:3px;min-height:32px;border-radius:2px;background:#2D5B9E;flex-shrink:0;margin-top:3px;"></div>

    </div>`).join('')}
  </div>`:'';

  const upH=upcoming.length?upcoming.map((ev,i)=>{
    const d=new Date(ev.date+'T00:00:00');
    const col=icsReady?'#2D5B9E':(EC[ev.type]||'#555');
    const bg=icsReady?'#EDF1FB':(col+'18');
    return `${i?dvd:''}<div style="display:flex;align-items:center;gap:14px;padding:13px 0;">
      <div style="text-align:center;min-width:44px;background:${icsReady?'#EDF1FB':'#F4F2EE'};border-radius:9px;padding:7px 6px;border:1px solid ${icsReady?'#B8C8E8':'#E8E5DF'};flex-shrink:0;">
        <div style="font-size:9px;font-weight:700;color:${icsReady?'#2D5B9E':'#A8924A'};text-transform:uppercase;">${d.toLocaleString('default',{month:'short'})}</div>
        <div style="font-size:19px;font-weight:800;font-family:'Playfair Display',serif;line-height:1.2;">${d.getDate()}</div>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${ev.title}</div>
        <div style="font-size:12px;color:#aaa;margin-top:2px;">${ev.time||'All day'}${ev.location?' · 📍'+ev.location:''}</div>
      </div>
      ${icsReady?'':`<span style="${tag(bg,col)}">${ev.type}</span>`}
    </div>`;
  }).join(''):`<p style="font-size:13px;color:#aaa;padding:8px 0;">${hasUrl?'No upcoming events in your Outlook calendar.':'No events yet.'}</p>`;

  // Status bar
  const statusBar = hasUrl ? `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:${icsReady?'#EDF1FB':'#FFF8EE'};border-radius:9px;margin-bottom:16px;gap:12px;flex-wrap:wrap;">
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="font-size:14px;">${fetching?'⟳':icsReady?'🔄':'⚠️'}</span>
      <div>
        <div style="font-size:12px;font-weight:600;color:${icsReady?'#2D5B9E':'#B87C2D'};">${fetching?'Syncing with Outlook…':icsReady?'Synced from Outlook':'Sync pending'}</div>
        <div style="font-size:11px;color:#aaa;">${S.icsLastFetched?'Last updated: '+new Date(S.icsLastFetched).toLocaleTimeString():'Fetching on load…'}</div>
      </div>
    </div>
    <button onclick="fetchICS()" ${fetching?'disabled':''} style="${pBtn('#2D5B9E','#fff')}font-size:11px;padding:6px 14px;opacity:${fetching?0.5:1};">🔄 Sync now</button>
  </div>` : `<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#FAF3DF;border-radius:9px;margin-bottom:16px;border:1px solid #E2CFA0;">
    <span style="font-size:14px;">📡</span>
    <div style="flex:1;font-size:12px;color:#A8924A;font-weight:500;">No Outlook feed connected. ${S.adminUnlocked?`<span onclick="setAT('feeds');S.showAdmin=true;draw()" style="cursor:pointer;text-decoration:underline;font-weight:700;">Set up in Admin →</span>`:'Unlock Admin to connect your Outlook calendar.'}</div>
  </div>`;

  return `<div class="fade">
  <div style="margin-bottom:24px;"><div style="${sLbl}margin-bottom:6px;">Schedule</div><h1 class="pg-title">Calendar</h1></div>
  ${statusBar}
  <div style="display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:start;">
    <div style="${card}padding:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <button onclick="calNav(-1)" style="${gBtn}padding:4px 10px;border:none;font-size:16px;">‹</button>
        <span style="font-weight:700;font-size:14px;font-family:'Playfair Display',serif;">${mName} ${y}</span>
        <button onclick="calNav(1)" style="${gBtn}padding:4px 10px;border:none;font-size:16px;">›</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">${grid}</div>
      ${selH}
    </div>
    <div style="${card}padding:22px 24px;">
      <div style="${sLbl}margin-bottom:18px;">${icsReady?'Upcoming from Outlook':'Upcoming Events'}</div>
      ${upH}
    </div>
  </div>
</div>`;
}

      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button onclick="uploadRosterCSV()" style="${gBtn}font-size:12px;padding:7px 14px;">📥 Import CSV</button>
        <button onclick="newAcademicYear()" style="${gBtn}font-size:12px;padding:7px 14px;border-color:#F59E0B;color:#B45309;">🎓 New Academic Year</button>

      <div style="font-size:11px;font-weight:700;color:#1D4ED8;margin-bottom:5px;">📋 CSV FORMAT</div>
      <div style="font-size:12px;color:#374151;line-height:1.6;">Required columns: <code style="background:#E0EDFF;padding:1px 4px;border-radius:3px;">name, email, year</code> &nbsp;·&nbsp; Optional: <code style="background:#E0EDFF;padding:1px 4px;border-radius:3px;">degree, chief, enrolled</code><br>
      Year values: <code style="background:#E0EDFF;padding:1px 4px;border-radius:3px;">Intern</code> <code style="background:#E0EDFF;padding:1px 4px;border-radius:3px;">CA-1</code> <code style="background:#E0EDFF;padding:1px 4px;border-radius:3px;">CA-2</code> <code style="background:#E0EDFF;padding:1px 4px;border-radius:3px;">CA-3</code> &nbsp;·&nbsp;

      <a href="#" onclick="downloadRosterTemplate();return false;" style="color:#1D4ED8;font-weight:600;">⬇ Download template CSV</a></div>
    </div>
    ${resH}`;
  }
  if(tab==='events'){
    const evH=[...S.events].sort((a,b)=>new Date(a.date)-new Date(b.date)).map(ev=>{
      const d=new Date(ev.date+'T00:00:00');const col=EC[ev.type]||'#555';
      return `<div style="${card}margin-bottom:10px;padding:14px 20px;"><div style="display:flex;align-items:center;gap:14px;">
        <div style="text-align:center;min-width:44px;background:#F4F2EE;border-radius:8px;padding:7px 6px;border:1px solid #E8E5DF;flex-shrink:0;">

        <div style="flex:1;"><div style="font-weight:700;font-size:14px;">${ev.title}</div><div style="font-size:12px;color:#aaa;margin-top:3px;">${ev.time} · <span style="${tag(col+'18',col)}">${ev.type}</span></div></div>
        <div style="display:flex;gap:8px;flex-shrink:0;">
          <button onclick="editEv(${ev.id})" style="${gBtn}padding:6px 12px;font-size:12px;">✏️ Edit</button>
          <button onclick="delEv(${ev.id})" style="${dBtn}">Delete</button>
        </div>
      </div></div>`;
    }).join('');
    body=`<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;"><div><div style="${sLbl}">Schedule</div><h2 style="font-size:20px;font-weight:800;font-family:'Playfair Display',serif;">Events</h2></div><button onclick="editEv('new')" style="${pBtn()}">+ Add Event</button></div>${evH}`;
  }

  if(tab==='kudos'){
    const now = Date.now();
    const THIRTY = 30*24*60*60*1000;
    const active = S.kudos.filter(k => (now - k.ts) < THIRTY).sort((a,b)=>b.ts-a.ts);
    const rows = active.length ? active.map(k => {
      const daysLeft = Math.ceil((THIRTY - (now - k.ts)) / (24*60*60*1000));
      return `<div style="${card}margin-bottom:10px;padding:14px 18px;">
        <div style="display:flex;align-items:center;gap:12px;">
          <span style="font-size:24px;flex-shrink:0;">${k.badgeEmoji}</span>
          <div style="flex:1;min-width:0;">
            <div style="font-weight:700;font-size:13px;">${k.recipientName} <span style="font-weight:400;color:#aaa;">· ${k.badgeLabel}</span></div>
            <div style="font-size:12px;color:#555;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">"${k.message}"</div>

          <button onclick="adminDeleteKudo('${k.id}')" style="${dBtn}padding:5px 10px;font-size:11px;flex-shrink:0;">🗑 Delete</button>
        </div>
      </div>`;
    }).join('') : `<div style="${card}padding:40px;text-align:center;color:#aaa;font-size:13px;">No active kudos in the last 30 days.</div>`;

      <div><div style="${sLbl}">Active (last 30 days)</div><h2 style="font-size:20px;font-weight:800;font-family:'Playfair Display',serif;">Kudos</h2></div>
      <span style="font-size:12px;color:#aaa;">${active.length} active · older kudos auto-expire</span>
    </div>${rows}`;
  }
  if(tab==='evals'){
    const evals = S.evaluations || [];

    const byModule = {};
    evals.forEach(e => {
      const key = e.module_id;
      if(!byModule[key]) byModule[key] = {title: e.module_title || 'Module '+e.module_id, course_id: e.course_id, items: []};
      byModule[key].items.push(e);
    });
    const modules = Object.entries(byModule).sort((a,b) => b[1].items.length - a[1].items.length);

    const exportCSV = () => {
      const rows = [['Module','Course','Feedback','Flagged','Date']];
      evals.forEach(e => {
        rows.push([
          (e.module_title||'').replace(/,/g,' '),
          e.course_id,
          (e.feedback||'').replace(/,/g,' ').replace(/\n/g,' '),
          e.flagged ? 'Yes' : 'No',
          e.ts ? new Date(e.ts).toLocaleDateString() : ''
        ]);
      });
      const csv = rows.map(r => r.join(',')).join('\n');
      const a = document.createElement('a');
      a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
      a.download = 'aneslearn_evaluations.csv';
      a.click();

    const flaggedCount = evals.filter(e => e.flagged).length;

    const moduleCards = modules.length ? modules.map(([modId, mod]) => {

    const ics = S.icsUrl||'';
    body=`

    <div style="${card}padding:24px;margin-bottom:20px;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
        <div style="width:36px;height:36px;border-radius:9px;background:#EDF1FB;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">🔄</div>
        <div><div style="font-size:15px;font-weight:700;">Outlook / Microsoft 365</div><div style="font-size:12px;color:#aaa;">ICS feed — syncs your calendar every time you open the app</div></div>

      <div style="margin-bottom:12px;">

        ${ics?`<button onclick="fetchICS()" style="${pBtn('#2D5B9E','#fff')}font-size:12px;padding:7px 16px;">🔄 Sync Now</button>`:''}

      <div style="font-size:12px;color:#666;line-height:1.7;">
        <strong>Outlook ICS:</strong> The app fetches your published ICS feed on page load and parses it into the custom event list. Hit "Sync Now" to refresh manually. Note: Outlook's ICS URLs may be blocked by browser CORS policy when running as a local file — if sync fails, try opening the app through a local web server (e.g. VS Code Live Server, or Python's <code style="background:#F4F2EE;padding:1px 4px;border-radius:3px;">python -m http.server</code>).
      </div>
    </div>`;
  }

  if(tab==='danger'){
    const resetRow = (icon, title, desc, fn, color='#C0392B') => `
    <div style="${card}padding:20px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;">

      <div style="flex:1;min-width:180px;">
        <div style="font-size:14px;font-weight:700;color:#1a1a1a;">${title}</div>

    </div>`;

    body=`
    <div style="margin-bottom:24px;">
      <div style="${sLbl}">Admin Controls</div>

      <p style="font-size:13px;color:#777;margin-top:6px;">These actions permanently delete data from the database. They cannot be undone.</p>
    </div>

    <div style="${card}padding:22px 24px;margin-bottom:24px;border:2px solid #C0392B;background:#FDF5F5;">

          <div style="font-size:15px;font-weight:800;color:#C0392B;">Reset Everything</div>

// ─── NOTES ────────────────────────────────────────────────────────────────────
let _noteTimer = null;

function noteChanged(val, key) {
  if(!S._notesDirty) S._notesDirty = {};
  S._notesDirty[key] = val;
  const el = document.getElementById('note-status');
  if(el) el.textContent = 'Unsaved…';
  clearTimeout(_noteTimer);
  _noteTimer = setTimeout(() => saveNote(key, true), 1800);
}

async function saveNote(key, auto=false) {
  const el = document.getElementById('note-area');
  const val = el ? el.value : (S._notesDirty?.[key] ?? '');
  if(!S._notes) S._notes = {};
  S._notes[key] = val;
  if(S._notesDirty) S._notesDirty[key] = val;
  const st = document.getElementById('note-status');
  if(st) st.textContent = 'Saving…';
  try {
    await sb.from('settings').upsert({key, value: JSON.stringify(val)});
    if(st) st.textContent = 'Saved ✓';
    if(!auto) draw(); // re-render to update tab indicator
  } catch(e) {
    if(st) st.textContent = 'Save failed — check connection';
  }
}

async function clearNote(key) {
  if(!confirm('Clear these notes?')) return;
  if(!S._notes) S._notes = {};
  S._notes[key] = '';
  await sb.from('settings').upsert({key, value: JSON.stringify('')});
  draw();
}

async function loadAllNotes(resId) {
  if(!resId) return;
  try {
    const {data} = await sb.from('settings').select('key,value').like('key', `note_${resId}_%`);
    if(!S._notes) S._notes = {};
    (data||[]).forEach(row => {
      try { S._notes[row.key] = JSON.parse(row.value); } catch { S._notes[row.key] = row.value; }
    });
  } catch(e) { console.warn('loadAllNotes:', e); }
}

function exportNotes() {
  const res = getRes();
  if(!res) return;
  const notes = S._notes || {};
  const allCourses = S.courses;
  let lines = [];
  lines.push(`ANESLEARN — PERSONAL NOTES`);
  lines.push(`${res.name} · ${res.year}`);
  lines.push(`Exported: ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}`);
  lines.push('═'.repeat(60));
  let hasAny = false;
  allCourses.forEach(course => {
    const courseNotes = [];
    course.modules.forEach(mod => {
      const key = `note_${res.id}_${mod.id}`;
      const txt = (notes[key] || '').trim();
      if(txt) courseNotes.push({mod, txt});
    });
    if(!courseNotes.length) return;
    hasAny = true;
    lines.push('');
    lines.push(`${course.icon}  ${course.title.toUpperCase()}`);
    lines.push('─'.repeat(60));
    courseNotes.forEach(({mod, txt}) => {
      lines.push('');
      lines.push(`  Week ${mod.week}: ${mod.title}`);
      if(mod.date) lines.push(`  📅 ${mod.date}${mod.faculty?' · 👩‍⚕️ '+mod.faculty:''}`);
      lines.push('');
      txt.split('\n').forEach(l => lines.push('  ' + l));
      lines.push('');
    });
  });
  if(!hasAny) { alert('No notes to export yet.'); return; }
  const blob = new Blob([lines.join('\n')], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `AnesLearn_Notes_${res.name.replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

const VAPID_PUBLIC = 'BIFGZZ9ZfWBPMl1pbGRQ8my_YLShMQbu4Y_jH2HqU8cegRyHZLIw8rxbj8vnehcctf00MhWA4yRD6F3fkVvzEcA';

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

async function checkPushStatus() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      S.pushRegistered = true;
      draw();
    }
  } catch(e) { console.warn('Push check failed:', e); }
}

async function registerPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    alert('Push notifications are not supported in this browser.');
    return;
  }
  try {
    const permission = await Notification.requestPermission();
    if (permission === 'denied') {
      alert('Notifications are blocked. In Safari: go to Safari → Settings → Websites → Notifications, allow this site, then try again.');
      return;
    }
    if (permission !== 'granted') {
      alert('Notification permission was not granted (status: ' + permission + ').');
      return;
    }
    const reg = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC)
    });
    const res = getRes();
    if (res) {
      await dbUpsert('settings', { key: 'push_' + res.id, value: JSON.stringify(sub) });
    }
    S.pushRegistered = true;
    draw();
    alert('✅ Notifications enabled!');
  } catch(e) {
    console.error('Push registration failed:', e);
    alert('Could not enable notifications: ' + (e.message || e));
  }
}

async function unregisterPush() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) await sub.unsubscribe();
    const res = getRes();
    if (res) await dbDelete('settings', 'key', 'push_' + res.id);
    S.pushRegistered = false;
    S.modal = null;
    draw();
  } catch(e) { console.error('Unregister failed:', e); }
}

function togglePushPrompt() {
  if (S.pushRegistered) {
    S.modal = { type: 'pushSettings', data: {} };
    draw();
  } else {
    registerPush();
  }
}

function downloadRosterTemplate() {
  const csv = [
    'name,email,year,degree,chief,enrolled',
    'Jane Smith,jane.smith@ucdenver.edu,CA-1,MD,false,"1,2,4"',
    'John Doe,john.doe@ucdenver.edu,CA-2,MD,false,"1,3,4"',
    'Alex Chief,alex.chief@ucdenver.edu,CA-3,MD,true,"1,2,3,4"',
  ].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'aneslearn_roster_template.csv';
  a.click();
}

function uploadRosterCSV() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.csv';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    const text = await file.text();
    const parsed = parseRosterCSV(text);
    if (!parsed.length) { alert('No valid rows found. Check your CSV format.'); return; }
    // Show preview before committing
    S.modal = { type: 'rosterPreview', data: { residents: parsed } };
    draw();
  };
  input.click();
}

function parseRosterCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/"/g,''));
  const nameIdx    = headers.findIndex(h => h === 'name');
  const emailIdx   = headers.findIndex(h => h === 'email');
  const yearIdx    = headers.findIndex(h => h === 'year');
  const degreeIdx  = headers.findIndex(h => h === 'degree');
  const chiefIdx   = headers.findIndex(h => h === 'chief');
  const enrollIdx  = headers.findIndex(h => h === 'enrolled');

  if (nameIdx === -1 || emailIdx === -1 || yearIdx === -1) {
    alert('CSV must have name, email, and year columns.');
    return [];
  }

  const results = [];
  for (let i = 1; i < lines.length; i++) {
    // Handle quoted fields
    const cols = lines[i].match(/(".*?"|[^,]+|(?<=,)(?=,)|(?<=,)$|^(?=,))/g) || [];
    const clean = cols.map(c => c.replace(/^"|"$/g,'').trim());
    const name = clean[nameIdx];
    if (!name) continue;
    const enrolledRaw = enrollIdx >= 0 ? (clean[enrollIdx]||'') : '';
    const enrolled = enrolledRaw ? enrolledRaw.split(',').map(x=>parseInt(x.trim())).filter(n=>!isNaN(n)) : [];
    results.push({
      id: 'r' + Date.now() + '_' + i,
      name:    name,
      email:   clean[emailIdx]  || '',
      year:    clean[yearIdx]   || 'CA-1',
      degree:  degreeIdx >= 0 ? (clean[degreeIdx] || 'MD') : 'MD',
      chief:   chiefIdx >= 0 ? (clean[chiefIdx]||'').toLowerCase() === 'true' : false,
      enrolled,
    });
  }
  return results;
}

function importCalendar(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    const isICS = file.name.toLowerCase().endsWith('.ics');
    const parsed = isICS ? parseICS(text) : parseOutlookCSV(text);
    if (!parsed.length) {
      alert('No events found in this file. Make sure it is an Outlook CSV or .ics calendar export.');
      input.value = '';
      return;
    }
    S.modal = {
      type: 'importPreview',
      data: { events: parsed }
    };
    input.value = '';
    draw();
  };
  reader.readAsText(file);
}

function parseOutlookCSV(text) {
  const lines = text.split('\n').map(l=>l.replace(/\r$/,'')).filter(l=>l.trim());
  if (lines.length < 2) return [];
  // Parse header
  const header = parseCSVLine(lines[0]).map(h => h.trim().toLowerCase());
  const col = name => {
    const aliases = {
      title:    ['subject','title','summary','event'],
      date:     ['start date','date','start','startdate','dtstart'],
      time:     ['start time','time','starttime'],
      end:      ['end date','end','enddate','dtend'],
      type:     ['categories','category','type','label'],
      location: ['location'],
    };
    for (const a of (aliases[name]||[name])) {
      const i = header.indexOf(a);
      if (i !== -1) return i;
    }
    return -1;
  };

  const events = [];
  for (let i = 1; i < lines.length; i++) {
    const cells = parseCSVLine(lines[i]);
    const title = cells[col('title')]?.trim();
    const rawDate = cells[col('date')]?.trim();
    const rawTime = cells[col('time')]?.trim() || '';
    const rawType = cells[col('type')]?.trim() || '';
    if (!title || !rawDate) continue;
    const date = normalizeDate(rawDate);
    if (!date) continue;
    const time = normalizeTime(rawTime);
    const type = mapEventType(rawType);
    events.push({ id: Date.now() + Math.random(), title, date, time, type });
  }
  return events;
}

function parseICS(text) {
  const events = [];
  const vevents = text.split('BEGIN:VEVENT').slice(1);
  for (const block of vevents) {
    const get = key => {
      const m = block.match(new RegExp(key + '[^:]*:([^\r\n]+)'));
      return m ? m[1].trim() : '';
    };
    const summary = get('SUMMARY').replace(/\,/g, ',').replace(/\n/g, ' ');
    const dtstart = get('DTSTART');
    const categories = get('CATEGORIES');
    const location = get('LOCATION');
    if (!summary || !dtstart) continue;
    const date = parseICSDate(dtstart);
    const time = parseICSTime(dtstart);
    if (!date) continue;
    events.push({ id: Date.now() + Math.random(), title: summary, date, time, type: mapEventType(categories) });
  }
  return events;
}

function parseCSVLine(line) {
  const result = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQ = !inQ; }
    else if (ch === ',' && !inQ) { result.push(cur); cur = ''; }
    else cur += ch;
  }
  result.push(cur);
  return result;
}

function normalizeDate(raw) {
  if (!raw) return null;
  // MM/DD/YYYY or M/D/YYYY
  let m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  // YYYY-MM-DD
  m = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  // DD-Mon-YYYY
  m = raw.match(/^(\d{1,2})-([A-Za-z]+)-(\d{4})$/);
  if (m) {
    const months = {jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
    const mon = months[m[2].toLowerCase().slice(0,3)];
    if (mon) return `${m[3]}-${mon}-${m[1].padStart(2,'0')}`;
  }
  return null;
}

function normalizeTime(raw) {
  if (!raw) return '';
  // Already formatted like "3:30 PM"
  const m = raw.match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  if (!m) return raw;
  let h = parseInt(m[1]), min = m[2], ampm = (m[3]||'').toUpperCase();
  if (!ampm) ampm = h < 12 ? 'AM' : 'PM';
  if (ampm === 'PM' && h < 12) h += 12;
  if (ampm === 'AM' && h === 12) h = 0;
  const disp = (h % 12 || 12) + ':' + min + ' ' + (h < 12 ? 'AM' : 'PM');
  return disp;
}

function parseICSDate(dtstart) {
  const m = dtstart.match(/(\d{4})(\d{2})(\d{2})/);
  return m ? `${m[1]}-${m[2]}-${m[3]}` : null;
}

function parseICSTime(dtstart) {
  const m = dtstart.match(/T(\d{2})(\d{2})/);
  if (!m) return '';
  let h = parseInt(m[1]), min = m[2];
  return (h % 12 || 12) + ':' + min + ' ' + (h < 12 ? 'AM' : 'PM');
}

function mapEventType(raw) {
  if (!raw) return 'Event';
  const r = raw.toLowerCase();
  if (/lecture|grand round|talk|didactic|conference/.test(r)) return 'Lecture';
  if (/workshop|lab|hands.on|skill/.test(r)) return 'Workshop';
  if (/sim|simulation/.test(r)) return 'Simulation';
  if (/deadline|due|exam|test|quiz/.test(r)) return 'Deadline';
  return 'Event';
}

function saveICS(){
  const url = document.getElementById('ics_url')?.value?.trim()||'';
  persist('icsUrl', url);
  if(url){ S.showAdmin=false; fetchICS(); }
  else draw();
}
function clearICS(){ S.icsUrl=''; S.icsEvents=[]; saveS('al6_ics',''); draw(); }

async function fetchICS(){
  const url = (S.icsUrl||'').trim();
  if(!url){ draw(); return; }
  S.icsFetching=true; draw();
  try {
    // Try direct fetch first, fall back to CORS proxy
    let text = null;
    const proxies = [
      url,  // direct (works if server has CORS headers or app is served, not file://)
      `https://corsproxy.io/?${encodeURIComponent(url)}`,
      `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    ];
    for(const src of proxies){
      try {
        const res = await fetch(src, {cache:'no-store'});
        if(res.ok){ text = await res.text(); break; }
      } catch(e){ continue; }
    }
    if(text && text.includes('BEGIN:VCALENDAR')){
      const events = parseICS(text);
      S.icsEvents = events;
      S.icsLastFetched = Date.now();
      saveS('al6_ics_cache', JSON.stringify({events, fetched: S.icsLastFetched}));
    } else {
      // Try loading from cache
      const cached = loadS('al6_ics_cache', null);
      if(cached){ S.icsEvents=cached.events; S.icsLastFetched=cached.fetched; }
      if(!text) alert('Could not fetch Outlook ICS feed. This is usually a CORS restriction when running as a local HTML file.\n\nTry opening the app via a local web server:\n  python3 -m http.server\nThen visit http://localhost:8000');
    }
  } catch(e){
    const cached = loadS('al6_ics_cache', null);
    if(cached){ S.icsEvents=cached.events; S.icsLastFetched=cached.fetched; }
  }
  S.icsFetching=false; draw();
}

// Auto-fetch ICS on load if URL is set
(function autoFetchOnLoad(){
  if(S.icsUrl){
    // Load cache immediately for instant display, then refresh in background
    const cached = loadS('al6_ics_cache', null);
    if(cached){ S.icsEvents=cached.events; S.icsLastFetched=cached.fetched; }
    setTimeout(fetchICS, 800); // slight delay so initial render is fast
  }
})();


// ─── INDEXED DB — PDF STORAGE ─────────────────────────────────────────────────
const DB_NAME = 'AnesLearnDB', DB_VER = 1, STORE = 'pdfs';
let _db = null;

function openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => e.target.result.createObjectStore(STORE, {keyPath: 'id'});
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror = () => reject(req.error);
  });
}

async function idbSave(id, dataUrl, name) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put({id, dataUrl, name});
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

async function idbGet(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const req = db.transaction(STORE,'readonly').objectStore(STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function idbDelete(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

// Upload a PDF file, store in IndexedDB, attach to current module
async function uploadPDF() {
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'application/pdf';
  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    if (!file) return;
    if (file.type !== 'application/pdf') { alert('Please select a PDF file.'); return; }

    // Show loading state
    const btn = document.getElementById('uploadPdfBtn');
    if (btn) { btn.textContent = 'Uploading…'; btn.disabled = true; }

    const reader = new FileReader();
    reader.onload = async e => {
      const dataUrl = e.target.result;
      const sizeMB = (dataUrl.length * 0.75 / 1024 / 1024).toFixed(1);
      const label = document.getElementById('ct_label')?.value?.trim() || file.name.replace(/\.pdf$/i,'');
      const id = 'pdf_' + Date.now();

      try {
        await idbSave(id, dataUrl, file.name);
        // Set the form fields so saveCt picks it up
        const labelEl = document.getElementById('ct_label');
        const urlEl   = document.getElementById('ct_url');
        const typeEl  = document.getElementById('ct_type');
        if (labelEl && !labelEl.value.trim()) labelEl.value = file.name.replace(/\.pdf$/i,'');
        if (urlEl)  urlEl.value  = id;   // store the IDB key as the "url"
        if (typeEl) typeEl.value = 'upload';
        const hint = document.getElementById('ct_hint');
        if (hint) {
          hint.textContent = `✓ PDF stored locally (${sizeMB} MB) — click Attach to save`;
          hint.style.color = '#2D7D4F';
        }
      } catch(err) {
        alert('Failed to store PDF: ' + err.message);
      }
      if (btn) { btn.textContent = '📎 Upload PDF'; btn.disabled = false; }
    };
    reader.readAsDataURL(file);
  };
  fileInput.click();
}

// Open a stored PDF in a new tab (for the ↗ button)
async function openStoredPDF(id) {
  try {
    const rec = await idbGet(id);
    if (!rec) { alert('PDF not found in local storage. It may have been cleared.'); return; }
    const blob = dataURLToBlob(rec.dataUrl);
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  } catch(e) { alert('Could not open PDF: ' + e.message); }
}

function dataURLToBlob(dataUrl) {
  const [header, data] = dataUrl.split(',');
  const mime = header.match(/:(.*?);/)[1];
  const bytes = atob(data);
  const arr = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  return new Blob([arr], {type: mime});
}

// Render a stored PDF inside an iframe using a blob URL
// Called after pgModule renders — attaches blob URL to iframe
async function renderStoredPDF(iframeId, idbKey) {
  try {
    const rec = await idbGet(idbKey);
    if (!rec) return;
    const blob = dataURLToBlob(rec.dataUrl);
    const url = URL.createObjectURL(blob);
    const iframe = document.getElementById(iframeId);
    if (iframe) iframe.src = url;
  } catch(e) { console.error('renderStoredPDF:', e); }
}

// Delete PDF from IndexedDB when content item is removed
async function deleteStoredPDF(idbKey) {
  try { await idbDelete(idbKey); } catch(e) {}
}

// ─── QUIZ UPLOAD & PARSE ──────────────────────────────────────────────────────
function uploadQuiz() {
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = '.docx';
  fileInput.multiple = true;
  fileInput.onchange = () => handleQuizFiles(Array.from(fileInput.files));
  fileInput.click();
}

async function handleQuizFiles(files) {
  if (!files.length) return;
  S.modal = { type: 'quizUploading', data: { total: files.length, done: 0, errors: [] } };
  draw();
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    try {
      const arrayBuffer = await file.arrayBuffer();
      const docxBytes = Array.from(new Uint8Array(arrayBuffer));
      const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer.slice(0) });
      const questions = await parseQuizWithAI(result.value);
      await dbUpsert('quizzes', {
        id: 'quiz_' + Date.now() + '_' + i,
        name: file.name.replace(/\.docx$/i, ''),
        questions: questions,
        docx_bytes: docxBytes,
        attempts: 0
      });
    } catch(e) {
      S.modal.data.errors.push(file.name + ': ' + e.message);
    }
    S.modal.data.done = i + 1;
    draw();
  }
  const qrows = await dbGet('quizzes');
  S.quizzes = qrows.map(q=>({...q, docxBytes:q.docx_bytes}));
  S.modal = null;
  draw();
}

function parseQuizWithAI(text) {
  // Parse locally — no API call needed
  return Promise.resolve(parseQuizLocally(text));
}

function parseQuizLocally(text) {
  const questions = [];
  // Split on numbered question patterns: "1." "1)" "Q1." "Question 1"
  const lines = text.split(/\n/).map(l => l.trim()).filter(l => l);
  let currentQ = null;
  const qPattern = /^(?:Q(?:uestion)?\s*)?\d+[.):]\s+(.+)/i;

  for (const line of lines) {
    const match = line.match(qPattern);
    if (match) {
      if (currentQ) questions.push(currentQ);
      currentQ = { q: match[1], answer: '' };
    } else if (currentQ && line.length > 0) {
      // If line doesn't look like a new question number, treat as continuation
      if (!line.match(/^\d+[.)]/)) {
        currentQ.q += ' ' + line;
      }
    }
  }
  if (currentQ) questions.push(currentQ);

  // If numbered pattern found nothing, try splitting on blank lines
  // and treat each non-empty paragraph as a question
  if (!questions.length) {
    const paras = text.split(/\n\s*\n/).map(p => p.replace(/\n/g,' ').trim()).filter(p => p.length > 20);
    return paras.map(p => ({ q: p, answer: '' }));
  }
  return questions;
}

function downloadQuizDocx(id) {
  const quiz = (S.quizzes||[]).find(q => q.id === id);
  const bytes = quiz.docxBytes || quiz.docx_bytes;
  if (!quiz || !bytes) { alert('Original file not available.'); return; }
  const blob = new Blob([new Uint8Array(bytes)], {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = quiz.name + '.docx'; a.click();
  URL.revokeObjectURL(url);
}

function revealAnswer(idx) {
  // Save whatever was typed before revealing
  const ta = document.getElementById('resp_' + idx);

    S.quizResponses = {...(S.quizResponses||{}), [key]: ta.value};

  draw();
}

function podcastUrlHint(url) {
  const el = document.getElementById('pc-url-hint');
  if(!el) return;
  const t = detectType(url);
  if(!url) { el.textContent=''; return; }
  if(t==='spotify') el.textContent='✓ Spotify detected — will embed inline';
  else if(t==='podcast') el.textContent='✓ Podcast host detected — will open in external player';
  else el.textContent='⚠ Unrecognized host — will open in external player';
  el.style.color = (t==='spotify'||t==='podcast') ? '#2D7D4F' : '#B87C2D';
}

async function savePodcast(editId) {
  const label = document.getElementById('pc-label')?.value.trim();
  const url = document.getElementById('pc-url')?.value.trim();
  const desc = document.getElementById('pc-desc')?.value.trim();
  const tags = document.getElementById('pc-tags')?.value.trim();
  if(!label||!url) { alert('Title and URL are required.'); return; }
  const type = detectType(url);
  const lib = [...(S.podcastLibrary||[])];
  if(editId) {
    const idx = lib.findIndex(p=>p.id===editId);
    if(idx>=0) lib[idx] = {...lib[idx], label, url, type, description:desc, tags};
  } else {
    lib.push({id:'pc_'+Date.now(), label, url, type, description:desc, tags});
  }
  S.podcastLibrary = lib;
  S.showPodcastForm = false;
  S.podcastEditId = null;
  await sb.from('settings').upsert({key:'podcast_library', value:JSON.stringify(lib)});
  draw();
}

function editPodcast(id) {
  S.podcastEditId = id;
  S.showPodcastForm = true;
  draw();
}

async function deletePodcast(id) {
  if(!confirm('Delete this podcast?')) return;
  S.podcastLibrary = (S.podcastLibrary||[]).filter(p=>p.id!==id);
  await sb.from('settings').upsert({key:'podcast_library', value:JSON.stringify(S.podcastLibrary)});
  draw();
}

function cancelPodcastForm() {
  S.showPodcastForm = false;

}

function openModuleFromPodcast(courseId, modId) {
  S.activeCourseId = courseId;

// ─── NOTES PAGE ───────────────────────────────────────────────────────────────
function pgNotes() {
  const res = getRes();
  if(!res) return '';
  const notes = S._notes || {};

  // Build list of all modules with notes across all enrolled courses
  const myCourses = S.courses.filter(c => res.enrolled.includes(c.id));
  const allNotedModules = [];
  myCourses.forEach(course => {
    course.modules.forEach(mod => {
      const key = `note_${res.id}_${mod.id}`;
      const txt = (notes[key] || '').trim();
      if(txt) allNotedModules.push({course, mod, key, txt});
    });
  });

  // Search/filter
  const q = (S.notesSearch || '').toLowerCase();
  const courseFilter = S.notesFilterCourse || 'all';
  let filtered = allNotedModules;
  if(q) filtered = filtered.filter(n => n.txt.toLowerCase().includes(q) || n.mod.title.toLowerCase().includes(q));
  if(courseFilter !== 'all') filtered = filtered.filter(n => String(n.course.id) === courseFilter);

  // Course filter buttons
  const courseFilterBtns = [
    {id:'all', label:'All Courses'},
    ...myCourses.map(c => ({id: String(c.id), label: c.icon + ' ' + c.title.split(' ').slice(0,3).join(' ')}))

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff/60000);
  const h = Math.floor(diff/3600000);
  const d = Math.floor(diff/86400000);
  if (m < 1)  return 'just now';
  if (m < 60) return m + 'm ago';
  if (h < 24) return h + 'h ago';
  if (d < 7)  return d + 'd ago';
  return new Date(ts).toLocaleDateString();
}

          <button onclick="identitySubmitPin()" style="${pBtn()}flex:1;">Sign In</button>
        </div>
      </div>
    </div>`;

          <button onclick="identityBack()" style="${gBtn}flex:1;">← Back</button>

    return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;padding:20px;">

          style="${inp}text-align:center;font-size:28px;letter-spacing:.4em;padding:14px;max-width:180px;margin:0 auto 6px;display:block;"/>

function identityBack() {
  _identityStep = 'pick';
  _identityResId = null;
  _identityNewPin = null;
  draw();
}

async function identityNext() {
  const id = document.getElementById('identity_select')?.value;
  if (!id) { alert('Please select your name.'); return; }
  _identityResId = id;
  // Check if this resident already has a PIN in Supabase
  try {
    const rows = await dbGet('settings', 'key', 'pin_' + id);
    if (rows && rows.length > 0) {
      _identityStep = 'pin';
    } else {
      _identityStep = 'setpin';
    }
  } catch(e) {
    _identityStep = 'setpin';
  }
  draw();
  setTimeout(() => document.getElementById('pin_input')?.focus(), 100);
}

async function identitySubmitPin() {
  const entered = document.getElementById('pin_input')?.value;
  if (!entered || entered.length < 4) return;
  try {
    const rows = await dbGet('settings', 'key', 'pin_' + _identityResId);
    const stored = rows?.[0]?.value?.replace(/"/g, '');
    if (entered === stored) {
      await identityComplete(_identityResId);
    } else {
      document.getElementById('pin_err').textContent = 'Incorrect PIN. Try again.';
      document.getElementById('pin_input').value = '';
      document.getElementById('pin_input').focus();
    }
  } catch(e) {
    document.getElementById('pin_err').textContent = 'Error checking PIN. Try again.';
  }
}

function identityConfirmPin() {
  const pin = document.getElementById('pin_input')?.value;
  if (!pin || pin.length < 4) return;
  _identityNewPin = pin;
  _identityStep = 'confirmpin';
  draw();
  setTimeout(() => document.getElementById('pin_input')?.focus(), 100);
}

async function identityFinishSetPin() {
  const confirm = document.getElementById('pin_input')?.value;
  if (!confirm || confirm.length < 4) return;
  if (confirm !== _identityNewPin) {
    document.getElementById('pin_err').textContent = 'PINs don\'t match. Try again.';
    document.getElementById('pin_input').value = '';
    document.getElementById('pin_input').focus();
    return;
  }
  // Save PIN to Supabase
  await dbUpsert('settings', { key: 'pin_' + _identityResId, value: JSON.stringify(_identityNewPin) });
  await identityComplete(_identityResId);
}

async function identityComplete(id) {
  saveL('al6_identity', id);
  S.activeResidentId = id;
  _identityStep = 'pick';
  _identityResId = null;
  _identityNewPin = null;
  // Load progress
  if (S.dbReady) {
    try {
      const progressRows = await dbGet('progress', 'resident_id', id);
      const completedModIds = new Set(progressRows.filter(p=>p.completed).map(p=>String(p.module_id)));
      S.courses = S.courses.map(c => ({...c, modules: c.modules.map(m => ({
        ...m, completed: completedModIds.has(String(m.id))
      }))}));
    } catch(e) {}
    // Load notes in background
    loadAllNotes(id);
  }
  S.view = 'dashboard';
  draw();
}

function confirmIdentity() {
  // Legacy stub — no longer used but kept to avoid errors
  identityNext();
}


// ─── APP BOOTSTRAP ────────────────────────────────────────────────────────────
async function bootstrap() {
  draw(); // show loading screen

  try {
    // Seed residents if table is empty
    const existingResidents = await dbGet('residents');
    if (!existingResidents.length) {
      await Promise.all(DEF_RESIDENTS.map(r => dbUpsert('residents', {
        id:r.id, name:r.name, year:r.year, chief:!!r.chief, enrolled:r.enrolled
      })));
    }

    // Seed courses if table is empty
    const existingCourses = await dbGet('courses');
    if (!existingCourses.length) {
      await Promise.all(COURSES_DATA.map(c => dbUpsert('courses', {id:c.id, data:c})));
    }

    // Load all data in parallel
    const [resRows, courseRows, eventRows, kudosRows, quizRows, evalRows, icsUrlSetting, podcastLibSetting] = await Promise.all([
      dbGet('residents'),
      dbGet('courses'),
      dbGet('events'),
      dbGet('kudos'),
      dbGet('quizzes'),
      dbGet('evaluations'),
      dbGetSetting('icsUrl', ''),
      dbGetSetting('podcast_library', '[]'),
    ]);

    // Hydrate residents
    S.residents = resRows.map(r => ({
      id:r.id, name:r.name, year:r.year, chief:r.chief, enrolled:r.enrolled||[]
    }));

    // Hydrate courses — merge with progress for this resident
    const resId = S.activeResidentId;
    const progressRows = resId ? await dbGet('progress','resident_id',resId) : [];
    const completedModIds = new Set(progressRows.filter(p=>p.completed).map(p=>String(p.module_id)));

    S.courses = courseRows.map(row => {
      const c = row.data;
      return {...c, modules: c.modules.map(m => ({
        ...m, completed: completedModIds.has(String(m.id))
      }))};
    }).sort((a,b) => a.id - b.id);

    // Hydrate events
    S.events = eventRows;

    // Hydrate kudos
    S.kudos = kudosRows.sort((a,b) => b.ts - a.ts).map(k => ({
      ...k, recipientId:k.recipient_id, recipientName:k.recipient_name,
      badgeId:k.badge_id, badgeEmoji:k.badge_emoji, badgeLabel:k.badge_label
    }));

    // Hydrate quizzes
    S.quizzes = quizRows.map(q => ({...q, docxBytes:q.docx_bytes}));

    // Hydrate evaluations
    S.evaluations = evalRows || [];

    // Hydrate ICS url
    S.icsUrl = icsUrlSetting || '';
    try { S.podcastLibrary = JSON.parse(podcastLibSetting || '[]'); } catch { S.podcastLibrary = []; }

    S.dbReady = true;

    // Check if we need identity selection
    const savedId = loadL('al6_identity', null);
    const validId = savedId && S.residents.find(r => r.id === savedId);
    if (!validId) {
      S.view = 'identity';
    } else {
      S.activeResidentId = savedId;
      S.view = 'dashboard';
      // Load notes in background for returning resident
      loadAllNotes(savedId);
    }

  } catch(e) {
    console.error('Bootstrap failed:', e);
    // Fall back to static data
    S.dbReady = false;
    S.view = 'identity';
  }

  draw();

  // Auto-fetch ICS if configured
  if (S.icsUrl) {
    try { fetchICS(); } catch(e) {}
  }

  // Check push status and register if first time
  await checkPushStatus();
  if (!S.pushRegistered && Notification.permission === 'default') {
    // Prompt after a short delay so it doesn't feel abrupt
    setTimeout(registerPush, 3000);
  }
}

bootstrap();
