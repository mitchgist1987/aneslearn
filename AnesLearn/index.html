normal resident lectures (ITE, Grand Rounds, etc). There is Pain Medicine Didactic Lecture/journal club Wednesdays at 0700. The clinic is closed on weekends and holidays (see call below regarding holiday call).</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Call: </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The residents and fellow will divide call for the month. It is home pager call, so you do not need to stay within 30 minutes of the hospital. However, you must be in town while carrying the pager and able to return a page within 5-10 minutes if there is a call back number. The fellow will email you the call schedule and pager instructions prior to the rotation. You will need to forward the pain pager (303-266-7291) to your personal cell phone by 7am on the day you start call.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Typically, calls and pages are patients with chronic pain. Almost all outpatient issues can be handled by phone initially. If you are at all concerned, have the patient go to the ED. If you do not think there is an urgent/emergent element to the call, then in addition to handling it over the phone, have the patient call the clinic the following business day to follow-up (720-848-1970). Also mention it to the clinic staff so they can call the patient to check in.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">While the clinic is closed on holidays and weekends, you may be assigned call over a holiday (Christmas, New Year’s or Thanksgiving). Holiday call is no different than weekday and weekend call. You must be in town and return the page within the designated time frame. However, for any non-urgent issue the patient will need to follow up in clinic when business resumes after the holiday. If the issue is urgent or you feel concerned, please refer the patient to the ED.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Formal consults must be answered and documented in the patient’s chart. Even if the consult is a phone consult from the ED or a patient’s advice request always remember to check the patient list (Pain Management: Chronic – Initial Consults” list.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Didactics </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Each Thursday morning from 7:00-8:00 am, didactics, journal club or board review with residents and attendings is held. The didactics consists of 30-45 minutes presenting on an ACGME topic. It is mandatory to attend. The lectures have mostly been held via zoom but have moved to in person. The lectures will cover fundamental pain medicine keyword topics.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The PM&R fellow oversees the journal club schedule, but the pain fellow is responsible for the topics related to anesthesia. Together with the pain fellow and other residents also on the rotation you will create a PowerPoint presentation on a pain related topic and present at journal club.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Schedule </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The pain fellow will make the schedule (which will be emailed to you prior to the start of the rotation). Double check the schedule as it may change day-to-day. This will determine when you arrive each day but try to arrive 15 mins before your first patient.  Time slots are typically 15 - 30 minutes per patient for procedures, 1 hour for new patient visit. There are usually 15 - 20+ patients per day. Lunch is from 12 to 1. The last patient is scheduled around 1545. After that you will finish notes then go home. UCH is fast paced but you will adapt quickly.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The day will typically be split between the fluoro suite (procedure) side and the clinic side. On the fluoro suite side you will see the patient briefly in the pre-op area before performing the procedures. On the clinic side you will see new patients and perform some head and face nerve blocks and Botox injections.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Procedures </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">For procedures, there are five steps:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">1) After the patient has arrived and their dot turns green on EPIC, copy forward their last procedure note, update it accordingly, then share it.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">2) Go see the patient and consent for the procedure and get an update.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">3) Remove appropriate drugs from the Pyxis. If unsure ask your attending. (Attendings usually draw them up anyway.) Ready the procedure room.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">4) Perform the procedure.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">5) Finish the note.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">A medication guide near the Pyxis lists what drugs you should pull for a given procedure. Supplies for procedures are in the fluoro room and the ancillary staff will help you set up. For notes, the best way to learn is to have the fellow or a returning resident show you. In brief, for returning patients (vast majority), you will copy forward an old note and update the \"Plan\" section with the date of the new injection. For new patients receiving their very first injection, make a new note from one of the Amb Pain templates. Learning Epic notes takes practice but is crucial to make the day run smoothly.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">When you see the patient in pre-op you should discuss today's procedure with them and have them sign the consent. There is a list of common side effects and complications for each injection located by the procedure computer that you should mention. Then, ask the patient how much and for how long their last injection helped them (you can find out what type of injection they last had from previous pain notes in Epic). Include in your procedure note “Plan” how much benefit they received last time, what you did today, and what injection(s) you plan on doing next time. It is important to actually read through the whole note to make sure it is up to date and accurate, as sometimes the notes have been copied forward incorrectly a few times and therefore contain errors.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">For new patients on the clinic side, the MA will bring the patient’s paperwork to the workroom once the patient is checked in. Review any useful notes in Epic from other providers, and any available imaging. It is recommended to start your H&P then fill out parts before and while talking to the patient; it is now possible to “Pre-Chart” on the patient days in advance; if the patient does not present for the visit your documentation with disappear within 30 days. Then, go see the patient and perform a history and appropriate physical exam. Then, report to the attending. You will return to see the patient together. Finally, type/finish a new patient H&P. The fellow or attending will show you the Epic note template plus the instructions will be in your emailed information.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Additional information </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Pain clinic is a fun rotation in which you get to experience a side of anesthesia away from the OR. The pain attendings and fellows are great individuals to work with and are a great resource to ask questions and learn more about the procedures performed in clinic. The UC Health Pain clinic is strictly non-opioid management (performs only interventional procedures). If a patient is referred to the clinic and is interested in opioid management, we will refer them to another provider in the community.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">All patients seen in clinic or for procedures are adults. However, Dr. Wiktor is a trained pediatric and pain anesthesiologist. Thus, some of her patients are former pediatric patients who have “outgrown” Children’s Hospital and are now seen at University Hospital. As such, they have longer appointment times in clinic (usually 1 hour in length).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There are a handful of spinal cord stimulations (SCS) performed (by Dr. V) a year. However, these procedures are infrequent. The spinal cord stimulator trials are performed in the pain clinic and permanent placement occurs in the general OR under sedation. As the procedures performed in pain clinic are under fluoroscopy always make sure to have lead on including a thyroid shield. I hope this information helps you be well prepared for your pain rotation!</p>",
  "ct": "<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">Cardiothoracic Anesthesia Rotation Guide</h1>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Attendings</strong>:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><em>Lyndsey Grae, Ben Abrams, Bryan Ahlgren, Nathan Clendenen, Tamas Seres, Breandan Sullivan, Barb Wilkey, Sarah Alber, Doug Rooke, Broc Burke, Markus Kowalsky</em></p>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!TIP]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">Some attendings have provided <a href=\"../ref/ct-att.md\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">specific preferences</a> for how they like staff and/or run their cases</div>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The cardiothoracic month can be one of the more grueling rotations for residents during their anesthesia training. The combination of elaborate case setups, long call shifts, high acuity cases with the sickest patients in the hospital tends invoke a level of anxiety when first rotating through. You will endure a gauntlet of complex patients testing your physiology, pharmacology, and procedural skills. Yes, it’s tough, but with committed teamwork amongst your resident co hort and support from attending/fellows for the month, the CT rotation can be the most rewarding and beneficial to your anesthesia training.</p>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!WARNING]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">New as of 12/2024 there will be required education modules where the expectation is to complete 2 for every month on CT</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">You can search for these modules on cupropofol.com or (maybe) using this <a href=\"https://olucdenver.sharepoint.com/sites/Anesthesiology/Shared%20Documents/Forms/AllItems.aspx.aspx?FolderCTID=0x01200043094399E131D24E92B2DEFFBE59067D&id=%2Fsites%2FAnesthesiology%2FShared+Documents%2FOLD+Manuals+%26+Protocols%2FResident+Training+Manuals%2FCardiothoracic%2FUpdated+Curriculum%2FCT+Resident+Modules\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">direct link</a> and links to the quizzes for each module should be sent out in your CT welcome email.</div>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Rotation Breakdown</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Residents are assigned CT1 CT6 shifts throughout the week on a rotating schedule and can be assigned</li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">to the general OR pool if there are not enough cardiac and/or thoracic cases.</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Typically, CT fellows will be CT1 on Monday / Wednesday.</li>\n<li style=\"font-size:13px;\">All residents are on (home) call until 7am the following morning.</li>\n<li style=\"font-size:13px;\">Relief is in a waterfall system the highest number leaving first (CT5, then CT4, etc)</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- The CT1 resident is the last to leave, very unlikely that you will be called back in as a CT 3 or 4</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- The culture (and your expe rience) on CT can be defined by how you and your CT co residents collaborate and help each other with breaks, preops, consents, etc. This is very much a team sport rotation.</p>\n<li style=\"font-size:13px;\">If a resident stays till past 9pm they will have a post call day the next day.</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- If you are postcall, please send an email to the chiefs email and charge email prior to leaving the hospital, as well as writing your name and postcall on the board. Further in structions can be found under the <a href=\"../supplemental/house-keeping-items.md\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">House Keeping Items section</a></p>\n<li style=\"font-size:13px;\">During some weeks/rotations, night float will be available to provide relief for cases running late, however their duties are split between CT and Liver transplant, so availability depends on what else is going on in the OR.</li>\n<li style=\"font-size:13px;\">Cardiac conference (via Zoom) is every Thursday morning at 6:30 am and Echo rounds are Friday morning at 6:30am. Att endance is required for both. You can find these links in your calander emailed to you.</li>\n</ul>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!TIP]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">To significantly improve everyone’s experience and wellbeing while on the rotation teamwork is a key aspect</div>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">When you are finished with your cases, or at any point when you have extended downtime, help comp leting CT preops and consent inpatients for the following day (even if they are not your patients).</li>\n<li style=\"font-size:13px;\">Call your co residents to offer breaks prior to leaving or relieve the higher number call resident if applicable.</li>\n<li style=\"font-size:13px;\">Beneficial to start a CT group chat to communicate with one another on completing preops and breaks.</li>\n</ul>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!IMPORTANT]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">Discuss the specifics of the anesthetic plan with your attending or CT fellow prior to each case, including which medications to have prepared vs readily available</div>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">When you first start, focus on learning how to take care of the patients and understanding the cardiothoracic pathophysiology, pharmacology, and types of procedures. This will help when you’re rotating in the CTICU.</li>\n<li style=\"font-size:13px;\"><strong>Your most important role is to take care of the patient. If you are ever unsure of anything, ask the fellow or attending. These patients are SICK, and things move quickly in the operating room.</strong> It is your responsibility to respond to changes in the patient’s condition and vital signs, including during line placement, and communicate them effectively when needed.</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Cardiac Commandments</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">1) Remember to place “TEE for Anesthesia” order morning of case. This pulls patient into TEE machine for techs.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">2) A well set up and organized room makes the difference in response and flow in complex cases</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">3) Heparin is an emergency should be drawn up and close by in case you need to crash onto bypass.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">4) Ensure blood products discussed with attending/fellow are order before patient arrives to room.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">5) Epicardial wires on right side are atrium and left side are ventricular. Label them!</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">6) Know your patients echo pathology (i.e. Aortic Stenosis), your hemodynamic goals for this pathology, and how you will achieve this pharmacologically.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">7) Never give calcium chloride while on bypass unless directed by CT surgeon.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">8) Thou shalt send rewarming labs (fibrinogen + platelets) at 34 degrees.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">9) Patient will not come off bypass until 35.5 degrees.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">10) <strong>NEVER EVER</strong> give protamine while on bypass do not even have it near cart. You’ll get it from OR RN when appropriate. Send labs post protamine (ACT, ABG, TEG w/ and w/o heparinase, PT/INR, PTT, Plt count)</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Heart room setup</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">The anesthesia techs will help setup the triple transducer, Level One, Swan box (ex-vivo calibration), pacer box, TEE machine, etc. Would recommend double checking their setup as there are new techs still learning the ropes.</li>\n<li style=\"font-size:13px;\">Alaris PC unit x2 with infusion pumps x4.</li>\n<li style=\"font-size:13px;\">Level 1 primed with Plasma-Lyte.</li>\n<li style=\"font-size:13px;\">TEE machine/probe. Fellow or attending can help with setup.</li>\n<li style=\"font-size:13px;\">Pacing box (batteries must be replaced the day of surgery and the date must be clearly displayed on the box).</li>\n<li style=\"font-size:13px;\">Oximetric swan box, plus Swan-Ganz pulmonary artery catheter</li>\n<li style=\"font-size:13px;\">Cerebral oximeter, plus head monitoring sticker, usually on R side of drug chart</li>\n<li style=\"font-size:13px;\">Triple transducer.</li>\n<li style=\"font-size:13px;\">BIS or Sedline - <a href=\"../ref/ct-att.md#seres\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">Dr. Seres only</a></li>\n<li style=\"font-size:13px;\">There is a higher incidence of intra-operative awareness during cardiac surgery, so if your patient is at high risk, it is a reasonable consideration. Most attendings prefer to start the precedex infusion at 0.5 mcg/kg/hr during CPB for this reason.</li>\n<li style=\"font-size:13px;\">Check that the lines are zeroed, free of bubbles, stopcocks are properly aligned, and connections are tight.</li>\n<li style=\"font-size:13px;\">Make sure the patient’s information has been entered into the Swan box (ex-vivo calibration).</li>\n<li style=\"font-size:13px;\"><strong>TIVA may be needed for some aortic cases. (MEP neuromonitorying)</strong></li>\n</ul>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!NOTE]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\"><strong>Rule of thumb:</strong> if it involves anything past the arch (i.e. elephant trunk, Buffalo trunk, and some type As), then TIVA is needed. As the stent may cover the vertebral artery. Alternatively, speak with neuromonitoring for clarification.</div>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">CPB case flow</h2>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Preop</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Consider having a lower threshold for video laryngoscopy in the room as these patients may not tolerate hypoxemia or hypercarbia well. Just get the tube in safely and swiftly.</li>\n<li style=\"font-size:13px;\">Place A-line in preop or roll back early to OR- since the patients are awake use lidocaine and ultrasound.</li>\n</ul>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!TIP]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">Once A-line is established draw your ABG lab immediately - you’ll have your labs ready to review before induction.</div>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">After getting standard monitors on remember to put on cerebral oximeter headsets before oxygenation and induction. This aids perfusionist establishing patient baselines.</li>\n<li style=\"font-size:13px;\">If EP is needed to turn off/reprogram AICD/pacemaker, have them do it in the room and after induction (especially for heart transplants and VAD placements).</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Induction</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">“Cardiac Induction” to which your attending will say there’s no such thing. Basically, you want a slow + smooth hemodynamically stable induction.</li>\n<li style=\"font-size:13px;\">Obviously, this is very patient (and attending) specific. You won’t go wrong with benzo and opioid based induction most of the time.</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Post-induction</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Usually attending placing 2nd large bore PIV (14 or 16g) while you and fellow establishing/securing airway.</li>\n<li style=\"font-size:13px;\">OG placement and removal.</li>\n<li style=\"font-size:13px;\">Fellow or attending will insert the TEE while you gown and glove for central access.</li>\n<li style=\"font-size:13px;\">Establish cordis or MAC</li>\n<li style=\"font-size:13px;\">Float Swan (common for most cardiac cases). Fellow or attending will walk you through swan checks and placement. </li>\n</ul>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!WARNING]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\"><strong>Some exceptions:</strong> normal EF CABG, isolated aortic valve replacement, and ASD closures.</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">May park the swan past the thermistor if the patient has LBBB until chest is open</div>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Titrate anesthesia to a BP within 20% of baseline.</li>\n<li style=\"font-size:13px;\">The nurse will place a temperature-sensing Foley - important for establishing core temp during rewarming.</li>\n<li style=\"font-size:13px;\">Connect Level 1 to the side port of the cordis or distal port (brown) MAC.</li>\n<li style=\"font-size:13px;\">Connect drips to the VIP (usually white) port of the PAC or SLIC (only after PAC has been floated, otherwise connect it to a side port). Make sure there isn’t too much tension on the central line (tape it to the bed or hook it on to the Christmas tree).</li>\n<li style=\"font-size:13px;\">Attach the monkey bar (L shaped bar) to bed.</li>\n<li style=\"font-size:13px;\">Draw baseline ACT (give to perfusionist) and ABG</li>\n<li style=\"font-size:13px;\">The surgeons will pass you the pacing wires. Connect them to the pacer box (right side is atrial pacer, left side is ventricular pacer). Attach the coronary sinus line to the PA port at the transducer and flush when the surgeons ask you to.</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Sternotomy</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Per attending, give fentanyl prior to sternotomy. Hold ventilation. Start TXA bolus then infusion at sternotomy.</li>\n<li style=\"font-size:13px;\">Prior to cannulation and initiation of CPB, give heparin bolus (300U/kg, confirm dose with perfusionist) and draw ACT three minutes later. ACT goal >400. You may need to re-dose heparin. If unable to achieve goal ACT, consider heparin resistance in the setting of ATIII deficiency.</li>\n<li style=\"font-size:13px;\">MAP goal ~70, SBP < 110 during aortic cannulation as HTN increases the risk of aortic dissection. Therefore, titrate gas or consider test dose of nicardipine or nitroglycerin or propofol to see how the patient responds.</li>\n<li style=\"font-size:13px;\">Measure UOP prior to CPB. Usually empty bag prior to cannulation. Perfusionist is going to ask UOP while on bypass.</li>\n<li style=\"font-size:13px;\">Chart aortic and venous cannulation - Events button -> Cardiac</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- If bicaval cannulation, chart 2 venous cannulation with memo. Usually, SVC then IVC.</p>\n<li style=\"font-size:13px;\">Chart cross clamp and bypass times (ask perfusionist for times if you miss them) - these are under Timer button</li>\n<li style=\"font-size:13px;\">You may need to re-dose paralytic, narcotics, or midazolam at initiation of CPB or immediately after (higher risk of awareness during CPB).</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Bypass</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Turn the ventilator to bypass mode and turn gas off when pump flows are adequate. Make sure perfusionist has turned on their volatile agent.</li>\n<li style=\"font-size:13px;\">The perfusionist will draw labs and transfuse blood when needed during CPB.</li>\n<li style=\"font-size:13px;\">You need to follow H/H, glucose, UOP, MAP readings between (60-70s), cerebral oximetery treat as indicated (communicate with the attending/fellow, surgeon, and perfusionist).</li>\n<li style=\"font-size:13px;\">MAP goal >65. Titrate drips as needed (usually vasopressin or phenylephrine). The perfusionist may also give vasopressin or phenylephrine boluses.</li>\n<li style=\"font-size:13px;\">No fluids running except your infusions.</li>\n<li style=\"font-size:13px;\">UOP goal ≥100mL/hr. Follow UOP and inform perfusionist if less than goal.</li>\n<li style=\"font-size:13px;\">TEE on standby.</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Weaning from bypass</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">During rewarming (33 -34C) and preparation to discontinue bypass, assess the functional status of the heart and peripheral vasculature to determine what pressors, inotropes, or vasodilators will be needed for successful separation.</li>\n<li style=\"font-size:13px;\">Rewarming labs at (33.5 -34) - Platelets (purple) and Fibrinogen (light blue)</li>\n<li style=\"font-size:13px;\">Turn on all monitors and alarms.</li>\n<li style=\"font-size:13px;\">Consider midazolam, fentanyl, or Dilaudid.</li>\n<li style=\"font-size:13px;\">Depending on the heart rhythm and rate, defibrillation or pacing may be necessary.</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Cleveland’s CABGs will require lidocaine/magnesium prior to uncross clamp. Discuss if additional lidocaine/magnesium is needed.</p>\n<li style=\"font-size:13px;\">Give calcium chloride 1g after 10min of the cross clamp being released and the QRS has narrowed - usually surgeon will state when to give.</li>\n<li style=\"font-size:13px;\">When asked, re-expand the lungs until visually reinflated. Make sure there is no tension on the LIMA graft. Turn the vent back on.</li>\n<li style=\"font-size:13px;\">The protamine dose will be provided by the OR RN.</li>\n<li style=\"font-size:13px;\">Confirm dose and timing with attending. If no evidence of reaction, slowly give the remaining protamine. Inform the surgeon and perfusionist when one third of the total dose has been given.</li>\n<li style=\"font-size:13px;\">Draw an ACT (along with off-pump labs below) three minutes later.</li>\n<li style=\"font-size:13px;\">After successful wean from CPB, send ABG, PT/INR, PTT, fibrinogen, platelets, TEG with and without heparinase.</li>\n<li style=\"font-size:13px;\">Continue to follow ABGs.</li>\n<li style=\"font-size:13px;\">Record UOP while on CPB and tell perfusionist.</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Post-bypass/transport</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Follow coags/TEG and bleeding status. Transfuse products as indicated (discuss with attending/fellow).</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Consider DDAVP for patients with renal failure</p>\n<li style=\"font-size:13px;\">Continue dexmedetomidine drip.</li>\n<li style=\"font-size:13px;\">Remove TEE, organize lines, buff cap/disconnect PIVs for transport, leave infusions/carrier running, and have a bolus line hooked up to the side port of the cordis/MAC.</li>\n<li style=\"font-size:13px;\">Replace dressing on cordis/MAC if necessary (antibiotic disc and Tegaderm).</li>\n<li style=\"font-size:13px;\">Patient remains intubated 95% of the time.</li>\n<li style=\"font-size:13px;\">Transport to CTICU (bring emergency drugs).</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">CTS edge cases</h2>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Robotic mitral valve</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Exclusions:</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- moderate AI or worse</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- BMI >40</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- EF <30%</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- no femoral vascular access</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- pulmonary function prohibiting one lung ventilation</p>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">##### Major differences</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Cannulation: Peripheral fem access for CPB, usually with a dual stage cannula</li>\n</ul>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!WARNING]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">CTS favors leaving LIJ for them just in case</div>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Airway: <strong>DLT</strong> <a href=\"https://www.google.com/url?sa=i&url=https%3A%2F%2Fwww.nejm.org%2Fdoi%2Ffull%2F10.1056%2FNEJMvcm2026684&psig=AOvVaw0ARpxNWFxWjgddbkPyc5NP&ust=1738768930279000&source=images&cd=vfe&opi=89978449&ved=0CBEQjRxqFwoTCJDdu5WpqosDFQAAAAAdAAAAABAE\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">Sizing guide</a></li>\n</ul>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!TIP]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">You will need to exchange DLT for standard ETT at end of the case</div>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Access: <strong>LIJ</strong> MAC/Swan, <strong>LRAL</strong></li>\n<li style=\"font-size:13px;\">Pain: Pre-op ESP w/ APS</li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><a href=\"https://olucdenver-my.sharepoint.com/:b:/g/personal/elijah_christensen_cuanschutz_edu/EWMxkJ2gbAZJm2_fFC2qUvMBfXQbGnvOCIqGeBP_BhgSVQ?e=cAlDen\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">MVproto</a></p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Thoracic</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">These are typically straightforward cases, many are robotic. Almost all will get a second PIV</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Bronchoscopy</h3>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!WARNING]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">If its a first case, expect Mitchell to ask to roll back early</div>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Airway:</strong> Often LMA or large ETT if NMB needed</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>GA:</strong> Usually propofol TIVA, can't rely on consistent gas delivery</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Lobectomy</h3>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!WARNING]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">During Timeout they will ask about SQH and that a T&S is available</div>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Airway:</strong> DLT <a href=\"https://www.google.com/url?sa=i&url=https%3A%2F%2Fwww.nejm.org%2Fdoi%2Ffull%2F10.1056%2FNEJMvcm2026684&psig=AOvVaw0ARpxNWFxWjgddbkPyc5NP&ust=1738768930279000&source=images&cd=vfe&opi=89978449&ved=0CBEQjRxqFwoTCJDdu5WpqosDFQAAAAAdAAAAABAE\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">Sizing guide</a></li>\n<li style=\"font-size:13px;\"><strong>GA:</strong> Usually sevo</li>\n<li style=\"font-size:13px;\"><strong>Access:</strong> usually 2nd PIV, possible A-line</li>\n<li style=\"font-size:13px;\"><strong>Gtts:</strong> phenylephrine available but not wet down</li>\n<li style=\"font-size:13px;\"><strong>Pain:</strong> Most of the surgeons are ok w/ pre-emergence ESP's</li>\n</ul>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!TIP]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">Ask the tech's for a bronch tower w/ CMAC</div>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Shoot for 3-5cc/kg IBW for tidal volumes with one-lung ventilation. I usually do this using PSV instead of PCV-VG</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">dotphrases</h2>\n<details style=\"margin:8px 0;border:1px solid #E8E5DF;border-radius:8px;padding:10px 14px;\"><summary style=\"cursor:pointer;font-weight:600;font-size:13px;\">.ctplan</summary><div style=\"margin-top:10px;\">\n</div></details>\n<details style=\"margin:8px 0;border:1px solid #E8E5DF;border-radius:8px;padding:10px 14px;\"><summary style=\"cursor:pointer;font-weight:600;font-size:13px;\">.tavrplan</summary><div style=\"margin-top:10px;\">\n</div></details>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Resources</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><a href=\"https://www.cardiacengineering.com/cardiaca.htm\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">Cardiac Anesthesiology Made Incredibly Simple</a></li>\n<li style=\"font-size:13px;\"><a href=\"https://olucdenver.sharepoint.com/sites/Anesthesiology/Shared%20Documents/Forms/AllItems.aspx.aspx?FolderCTID=0x01200043094399E131D24E92B2DEFFBE59067D&id=%2Fsites%2FAnesthesiology%2FShared+Documents%2FOLD+Manuals+%26+Protocols%2FResident+Training+Manuals%2FCardiothoracic%2FUpdated+Curriculum%2FCT+Resident+Modules\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">CT Resident Modules</a></li>\n<li style=\"font-size:13px;\"><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC5293623/\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">Anesthetic considerations in robotic mitral valve surgery</a></li>\n<li style=\"font-size:13px;\"><a href=\"https://olucdenver-my.sharepoint.com/:w:/g/personal/connor_lester_cuanschutz_edu/EcrUS-uZDJFBjeTxvZkHQDgB455FxVT70tj9GXFXaUIWEQ?e=85zdAf\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">CTICU Handoff</a></li>\n</ul>",
  "cticu": "<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">CTICU at UCH</h1>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Important People</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>CTICU Attendings</strong></p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Sarah Alber, MD</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Sam Gilliland, MD</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Kenji Tanabe MD</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Hans Tregear MD</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Jenna Cottral MD</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Andrew Hennigan MD</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Marianne Wallis MD</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>CTICU APPs</strong>:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Caitlin Blaine, PA (lead), Lisa Bauers NP, Terra Busse PA, Kelly Dever NP, Phil Logan PA, Sean Meehan PA, Nora Metz NP, Stephanie Schneider PA</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Overview</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The CTICU is split up between two provider teams (Red/Blue) each with their own attending. Attendings rotate</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">on a weekly basis changing over each Monday. The attendings alternate days for admissions. You will bounce</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">between teams (sometimes split between teams) based on which patients you are assigned. Typically, the APPs</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">will send out a text the night before with the next day’s patient assignments. Generally, the CTICU is well</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">staffed. You will typically be assigned 3-4 patients during the day.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Daily Workflow</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Most days follow the same pattern, first thing in the morning is fellow rounds with the CT Surgery fellow,</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">followed by pre-rounding, ICU/Attending rounds, then everything else before signout at 4p.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Fellow rounds</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Arrive around 5:45 – 6:00 AM depending on the census. I overnight resident will have</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">printed off a sign out list for you and filled in many of the numbers (Vitals, Swan numbers, I/Os) The</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">overnight residents/APP will then present all the cardiac patients on fellow rounds. The night resident</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">will briefly present cardiac patients ONLY to the cardiac fellow. – There you will</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">hear a brief daily plan from the fellow/night resident. Thereafter, the night resident</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">will give sign out on the rest of the unit patients (Thoracic and Vascular patients)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">and answer any questions.</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Goal of 2-3 mins per patient</li>\n<li style=\"font-size:13px;\">One liner with notable 24H events</li>\n<li style=\"font-size:13px;\">Remains in the ICU for the following</li>\n<li style=\"font-size:13px;\">Resp status (how much NC or vent settings)</li>\n<li style=\"font-size:13px;\">Review of vasoactives</li>\n<li style=\"font-size:13px;\">Overall I/O total and did we hit our goal; what's our diuresis plan, is CRRT something like we need to consider?</li>\n<li style=\"font-size:13px;\">Drains in place with outputs and how we will manage them</li>\n<li style=\"font-size:13px;\">Pacing wires present? How will we manage them?</li>\n<li style=\"font-size:13px;\">Pertinent labs: CBC, coags, SCr, ABG</li>\n<li style=\"font-size:13px;\">AC plans?</li>\n<li style=\"font-size:13px;\">Finally, high-priority, patient specific items if needed</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Pre-rounds</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You then have time between fellow rounds and attending rounds to completely lookup and</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">familiarize yourself with your patients. Including: talking to their RN, performing a quick and focused</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">exam, reviewing patient data (labs, I/Os) in EPIC, starting the daily progress note and write any urgent</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">orders (transfuse, electrolytes replacement, etc.); always try to glance at the daily CXR before rounds.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Make sure everyone is seen by the time rounds start. There are rare days where you will be assigned more or less.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Attending rounds</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">CTICU attending rounds start around 8 AM and the length is quite variable</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">depending on the attending, ranging from brief to comprehensive (surgical attendings prefer brevity).</p>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!TIP]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\"><strong>Attending rounds presentations</strong>:</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">- Start with Name, POD# s/p surgery. Note any significant intraoperative events.</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">- Then significant 24hr events.</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">- Then jump to Assessment/Plan by system (Neuro-including sedation/pain, CV, Pulm, Renal, ID, Endo, FEN.</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">- Finish with review of invasive lines, meds and dispo.</div>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Shifts</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There are essentially 4 types of shifts: Weekday rounding (6AM-4PM), Admitting M-F (10AM-10PM), Weekday night call (4PM-7AM), Weekend</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">24h call (7AM-7AM)</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Weekday Rounding</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">6AM-4PM, you should plan on arriving shortly before fellow rounds. The</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">overnight resident/APP will present the cardiac patients, so you don’t need to worry about fully looking</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">up your patients prior to fellow rounds. Fellow rounds will begin at 6 AM T/W and 6:30 AM M/Th/F.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Fellow rounds are BRIEF and typically take 2- 5 minutes per patient. The presentation should be</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">concise and focus on drips (inotropes, vasopressors), drains, line, and wire management. The fellows</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">will make decisions on which drains to pull based on your I/O info. Pay close attention to the location of</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">the drains, typically mediastinal or pleural (sided R or L).</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Admitting</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Weekdays 10AM-10PM: When you are assigned an admitting shift</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">(generally a few times per month), you arrive at 10AM, check the OR board or that</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">days cardiac/thoracic cases destined for the CTICU. Check in with some of the</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">APPs they usually know the latest info about the cases. You will then prep the handoff, put in ICU</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">admission orders and await the new admits arrival. You will admit the days post-op patients, stabilize</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">and cross-cover them until signout around 10PM. If it is slow and no other patient on the unit is</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">crashing, you may be able to sign out early.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Weekday Night Call</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Shift begins at 4PM, you split the list with an APP or surgery moonlighter and get</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">signout. At approx. 10PM or earlier if it is slow, the admitting provider will sign out the days admits for</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">you to cross-cover overnight. If any admits come in after the admitter goes home, you are responsible</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">for admitting (alternating with APP/moonlighter) and staffing with the attending overnight.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Weekend 24h Call</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Shift is 7AM- ~8AM the following day. Arrive shortly before 7AM for fellow</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">rounds with the overnight team. You will split the unit with 1-2 APPs. You will round and carry out</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">duties as normal. You will split daytime and overnight admissions with the other provider on the unit.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">At 4PM the day APP signs out and you will split the list with either another APP or a general surgery</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">moonlighter. Fellow rounds begin the next day at 7AM on Sunday and 6:30 AM on Monday. You are</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">responsible for pulling drains/tubes/wires as discussed on fellow rounds prior to going home.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Call Schedule</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">It isQ4 call in the CTICU. Weekday call shifts start @ 4 pm. You will get sign-out from the day team and then</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">cross-cover those patients until the morning. The weekday admitter will sign out the days new admits to you</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">around 10 PM (potentially earlier if it is slow). You will present the cardiac patients at fellow rounds in the</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">morning and sign out thoracic patients directly to the day resident/APP covering those patients. For weekend</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">24h call you arrive on Sat/Sun at 7AM with fellow rounds shortly to follow. The overnight resident is then</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">allowed to go home, and the day resident and one or more APP split up the unit. The APP will typically stay</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">until around 4pm on weekends when a general surgery moonlighter arrives, at that point you re-distribute the</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">unit for overnight coverage.</p>",
  "dh": "<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">General OR - Denver Health Medical Center</h1>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Denver Health is our Level 1 trauma and community hospital here in Denver. It is a resident favorite rotation; the attendings are very helpful, nice, and funny. This is where you will get a lot of your trauma experience so try to jump in on as many as you can!</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Before you start  </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Dr. Arboleda should send you an email outlining the following, but if not. Speak to Veronica at least 2-3 weeks prior to your arrival to arrange the following: parking tag, ID badge, scrub machine access, who to call for computer access codes and Pyxis access code.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Resident parking is located at the Acoma Garage (550 Acoma) during regular hours, when overnight or the weekend you can park in the upper levels of the Delaware Street Garage</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You can contact the Help Desk for passwords at 303-436-3777.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Before you start for the first time, you need to tour and check that all of your access work. . If Dr. Arboleda should arrange this to ensure you can get scrubs, access the pyxis, badge in, and access the computers.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Have someone show you how to navigate DH Epic (it is similar, but not the same as the University Epic). This will make reviewing patient records much easier for your pre-ops.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Preparing for the Weekday Daily Workflow</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If on the schedule you are listed as “Res DH OR”, that is the designation for a normal, non-call weekday. Arrive at the usual time in the morning and you will generally be relieved around 3-5 PM.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If on the schedule you are listed as “late” (C2), arrive at the usual time in the morning and you will work 7AM to 7PM. You typically are relieved when the night resident arrives at 7pm unless there are more than 2 rooms running after 7 pm (rare).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The OR schedule for the next day is usually assigned on EPIC by 2-3PM the day prior, usually earlier. The patient, surgical procedure, anesthesia and surgical attending, and OR # will be listed for you. If you are post-call, you can access EPIC and complete your pre-ops from home, (see instructions below).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Some patients may go to the pre-op clinic prior to their procedure and the pre-op assessment on EPIC will be completed for you by one of the APPs, though these are normally just copy and paste and often lack information. Most of the time, you will need to do it yourself. If you are scheduled to take care of an INPATIENT, you MUST see the patient in person, perform a focused H&P, obtain consent from the patient and complete the pre-op assessment in EPIC before you head home the night before.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You should call your attending the afternoon/early evening the night before your case to discuss your anesthetic plans for the day.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Make sure to arrive with enough time prior to the morning conference (0630-0655) to set your room up in the morning and possibly consent if planning to do a pre-op block.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Conference & Education </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Mondays- Grand rounds are teleconferenced to DH at 6:45 a.m. on Education channel 2.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Typically watched in the Anesthesia Lounge</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Lectures on Tuesday, Thursday, and Friday are from 6:30-655 a.m. in conference room A 2537 (this is behind the surgical waiting area). Dr. Stein or Deis should email you the schedule</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Each Friday lecture will be assigned to one of you to give a presentation.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Getting ready for the OR</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Get all medications (including narcotics) out of the Pyxis in your OR room.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Currently, Propofol is NOT considered a scheduled drug at Denver Health like it is at UCH.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You must remember to label all medications w/ the date, time, and your initials that you keep in the next case drawer of your Pyxis as they may get thrown away by Pharmacy if not and it is a JCO violation.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Remember to lock your Pyxis whenever you leave the OR for any reason. Do not leave any controlled mediations on the top of the Pyxis.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Some meds (remi, sufent, P50s, Precedex, Norepi poppers) are found in the pyxis in the anesthesia workroom across from the RN charge/status board.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Also, if you take a non-controlled med, make sure you click it on the pyxis touch screen, otherwise pharmacy will not refill it which is a huge headache in the evening and overnight.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">After conference, see your patient in pre-op. There is a large monitor in pre-op with your patient’s name and the assigned bay number . Finish the pre-assessment on EPIC (physical exam, anesthetic plan), consent the patient, and make sure to click the Anesthesia Ready for Procedure (located under the pre-procedure tab at the bottom) button once you have finished with the pre-op assessment/consent/etc.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Consents are done virtually, you open it on the pre-eval tab, and make sure it is associated with the current procedure. You click to sign for the patient or have them sign on your phone.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">After all consents have been signed and the circulator and pre-op RNs have completed their handoff, the patient can have pre-medication and can be brought back to the OR.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">At DH, you transport your own patients to the OR, except for first case starts.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Don’t transport patients past the main OR bridge (as it violates HIPPA w/ patient identifiers listed on the computer monitors on the wall), you must go the long way around.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Call or overhead page your attending when you are in the room if you have not already seen so that you can perform timeout. Unlike other sites, the anesthesia attending much be present for timeout</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">At DH, they do not have Cisco, so you will overhead page or use your cell phone.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">I recommend calling your attending on their cell</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">To overhead page: After picking up the phone, press the “OH page” button and then say your message (“Dr. Chandler ready for timeout/waking up in OR 5” or “Anesthesia tech, please bring the Glidescope to room 1”) then hang up the phone. If you pick up the phone, press “OH page,” then hear a busy signal, then someone else is paging overhead at that time, so just try again in a few seconds.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You can get the Anesthesia Tech by using the mounted, in room phone and call Vocera. Then say “Anesthesia Tech” and it will connect you</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If you want to leave the room, you need to write your personal on the board or communicate a plan with the circulator.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Upon arrival to the PACU, you should give a detailed report of your patient’s intra-op course to the PACU RN (PMHx, anesthetic used, meds given, EBL/fluids/UOP, etc). Under the post-procedure tab, you should click both the Handoff to Receiving Nurse AND the Anesthesia Stop buttons. You do not have to fill in a post-procedure evaluation note like you do at the University as your attending will do this for you.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Wasting Narcotics</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">They make a big deal of this, because we always mess it up</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Unused narcotics must be “wasted” utilizing special numbered tamper-proof waste bags from the pharmacy.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">These bags are on top of the disposal bins next to the anesthesia machines in the OR or in PACU.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Record your medication dosing in the Pyxis (select “all” if you drew meds from multiple pyxis).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">To return meds, requires a witness and you will place the medication directly (no bag) into the disposal bin.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Transferring meds also requires a witness and is generally frowned upon because it leads to errors.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Have the attendings do this with you the first couple times to make them happy and ensure compliance.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Eating at DH: </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The cafeteria (including Starbucks) is in the basement of the hospital.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Arguably the best cafeteria of the sites we rotate at for price and quality</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Veronica will give you a cafeteria meal card at the beginning of your rotation.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Vending machines are located near the elevators between PAV A and PAV B on the second and ground floor.  There is a resident lounge on the 1st floor next to the pre-op clinic/Pav A elevators.  The door says, “staff only” and the code is 5210*.  There are TVs, couches, and a mini fridge stocked with juice, milk, sandwiches, etc.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Sometimes we get a meal card for the Subway located on the 1st floor near the hospital entrance. Subway is open 24 hours and is the place to go for late-night food when on call (the cafeteria closes at 6PM on weekdays and around 1-2 PM on weekends).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There is also an all-staff RISE (resilience in stressful events) lounge with snacks and massage chairs etc. Located on the 1st floor between the Subway and the gift shop.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Computer programs for patient information:  </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">EPIC: EMR that you will use at Denver Health (intra-op charting, pre-op assessments, intubation notes, etc). You will have EPIC training during your orientation week at the University. There are small differences between EPIC at UCH and Denver Health, but for the most part, it is very intuitive and easy to navigate.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You should have instructions for remote access ((https://dhremoteaccess.dhha.org) from Dr. Arboleda, but in short you need to request access from the Help Desk. Contact them if you have any issues.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You can also get it for Haiku; you just have to switch configurations.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Call Nights/Weekends  </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Call (C1/C1P) - 7 pm-7am. Check in with the charge attending to see where to go when you first arrive. Nights at DH can be very busy, so do not expect much sleep. You do not switch off with the CRNA like at University, so you will provide anesthesia for all the cases unless a second OR opens which the overnight CRNA will cover.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">When you arrive for call, ensure that the Trauma ORs (OR 1, 9 or 10) and Neuro OR (OR 5) have been set-up. Confirm rooms with RN charge as they have been mixing it up. Make sure that both trauma rooms have at least the following items available:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Arterial line setup, Central line supply kit, IV setup</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">ETTs (7.0, 8.0) w/ stylet & 10 cc syringe, Oropharyngeal Airways, OGT/NGTs</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Laryngoscope X 2 (ensure blade light works)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Level 1 fluid warmer w/ available NS fluid bag (don’t wet down until the trauma arrives in the room)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Alaris Infusion pumps (located in anesthesia supply room)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Glidescope / video laryngoscopes (located in anesthesia supply room)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Forced Air Warmer, Temp probe.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Emergency medications stocked (succinylcholine, etomidate, vasopressors, etc.). Most emergency medications are in prefilled syringes. Please do not draw up other medications until you are planning to use them as DH has a tight budget and we want to minimize waste.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Syringes</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">It is important to have the trauma ORs set-up ahead of time. You are more likely to crash up here, so you may be limited on time.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The anesthesia techs will usually stay until 10-11 PM on the weeknights and 3-4PM on the weekends. It is your responsibility to turn over your anesthesia workstation (replace the breathing circuit and suction, Caviwipe down monitor wires, etc.) once the anesthesia techs go home for the evening. Transport monitors that have been used to transfer patients to the SICU from the OR should be placed in the soiled utility room for cleaning located near the main ORs behind the charge desk.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The call room is in the main hall by the elevators near the hospital chapel.  Room number is B285. Code to the room is 89999#. Have another resident/CRNA show you where this room is on your first day.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">On-Call Resident Phone (28994): </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You will carry this when you are on call.  The float CRNA/on-call resident will give it to you when you arrive, and you can hand it off post-call to the new float CRNA/senior resident.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Always call yourself when you first get the phone to ensure that it is functioning - if not, give your cell phone number to the charge nurse (you can also write it on the whiteboard underneath the computer monitors at the charge desk). The OR charge nurse also has the number to the call room if they can’t get in touch with you by resident phone or cell.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Often the attending will have you take or forward the pain service phone as well. Discuss their expectations for how they want you to handle this</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The attending also carries a phone while on call. They can be reached at 28999. Call your attending when you get called to codes and emergent airways. Let them know where you are heading. They will also need to be called before starting emergent over-night cases.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Airway box - It is just inside the anesthesia workroom to the right on top of the shelf when you walk in (grey tacklebox). There is also a peds airway box so make sure you grab the correct one.  The Glidescope and Fiberoptic cart are also stored in this room.  You should grab the airway box prior to heading to any code/emergent airway page. The ICUs will usually have an intubation tray with emergency drugs as well as a glidescope waiting for you so the airway box will usually not even have to be opened. However, if you called to the floor you need to bring the airway box and videoscope. If you do open the airway box, make sure you or the anesthesia tech replace whatever was removed so that it is ready for the next code/airway you are paged to. It is wise to carry a stick of succinylcholine, etomidate and phenylephrine in your pocket, just in case. You should always ask when the patient has last eaten and what their most recent K+ level is prior to emergent intubations in the ICU or on the floor. MICU door code is 1-5-9, everywhere else is accessed using your DH badge.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You will also carry the trauma pager when you are on call. This pager should only alert you for TRAUMA ACTIVATIONS and CODE BLUEs. If you are not in a case, go down to the ED to see the flow and ascertain if you will be crashing up to OR. You are also on standby for airway assistance, but generally the ED handles this and you just want to stay out of the way.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">To get to the ED, you can take the elevator in the ORs or you can take the stairwell near the OR board.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Pretending/AIC  </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">CA-3s have the opportunity to “pre-tend” while at DH. You split your time between being in a room or supervising CA-1s. You usually get the first pick of cases for the day if you are in a room. When you are not in a room, you will round on APS patients and act as first call for any blocks, or traumas that arise. You will be given priority for awake intubations. With this comes the responsibility of staying aware of what is going on in the ORs at all times so that you can be in the room at the right time.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">AIC residents will also hold the pain service phone. Ask the attending your first day to add you to the shared list for pain patients. You are expected to round on these patients and write daily progress notes. You are also expected to see new consults as they arise.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Resources</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">To be added</li>\n</ul>",
  "inverness": "<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>People to Know:</strong></p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Jeremy Bengson, MD – Medical Director of Inverness Orthopedics and Spine Surgery Center</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Location and parking:</strong></p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Inverness is located at 175 Inverness Drive West. You have two free parking options—uncovered spots are located outside of the main entrance and a parking garage is located to the left of the main entrance.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Walk through the main entrance, turn right once you enter the lobby, and proceed down the hallway toward the elevator bank. Take the elevators or stairs up to the surgery center on the fourth floor.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Before you start: </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Schedule a time to visit Inverness in advance of your rotation start date (ideally on an off/post-call day, in order to see normal daily operations). Meet with Dr. Bengson, Lisa Dettmer, or Benny Dhanoa to get a thorough walkthrough of the surgery center, ensure badge/Pyxis access, and meet key members of the surgical and nursing staff.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Review the Orientation Welcome Packet written by Dr. Bengson (heavily referenced here) prior to your first day</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Review the “UCHealth Inverness Exclusion Criteria” document to understand patient candidacy for surgery at Inverness</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Review the “UCHealth Inverness Surgeon Preference Guide”</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Contact the attendings you will be working with the night before your first day (INV_C2 will be your point person; INV_OR will be a second attending likely also overseeing rooms) and make a plan of action for first case blocks. It is possible to have upwards of six first case blocks, which is amazing and wonderful and obviously can get crazy, so plan and communicate effectively J</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Important contacts within the Department of Anesthesiology:</strong></p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Chris Lace, MD, Vice Chair of Clinical Strategy, Community Engagement, and Quality, Medical Executive Committee (MEC) Member  </li>\n<li style=\"font-size:13px;\">Jeremy Bengson, MD, Medical Director of Anesthesia Services, MEC Member  </li>\n<li style=\"font-size:13px;\">Lisa Dettmer, CRNA, APP Co-Lead  </li>\n<li style=\"font-size:13px;\">Benny Dhanoa, CAA, APP Co-Lead</li>\n<li style=\"font-size:13px;\">Mike Rosario, Anesthesia Tech </li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">See the Orientation Welcome Packet referenced above for additional surgical, perioperative, and pharmaceutical staff.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Codes and logins:  </h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Door Access (e.g. locker room, conference rooms, ORs, etc): UCH resident badge  </li>\n<li style=\"font-size:13px;\">Epic Environment / Context: IP INVERNESS ANESTHESIA </li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Schedule</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">First case starts are generally at 7:00 am Monday through Friday (with every last Monday of the month reserved for administrative meetings = 8:00 am start). Cases are generally not scheduled past 5 pm.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Arrive to Inverness at 6:00 am to change into scrubs and begin consenting patients. Always check with the preop RN if it is an appropriate time for you to chat with the patient while they complete other tasks. You will typically be finished around 3:00 pm, depending on the schedule.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Layout:  </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Surgery center on the fourth floor:</strong> take the elevators or stairs from the lobby up to the surgery center on the fourth floor</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Turn right out of the elevator bank/stairwell on the fourth floor and proceed toward the two conference rooms on the left side of the hallway, enter whichever is unoccupied, and badge through to make your way into the surgery center. If both conference rooms are locked/occupied, you may enter the surgery center through the patient entrance left of the check-in desk when you exit the elevator bank.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Locker room:</strong> located toward the “back” of the surgery center, if you are entering from the check-in desk or conference rooms; proceed past preop/PACU/OR entrances and toward the back hallway of administrative offices, turn right, and badge into the appropriate locker room</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">After proceeding into the locker room, you will see an assortment of green scrubs (these don’t require badge access). Please return these at the end of the day (i.e. do not bring them home / exchange them at AMC)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Change into green scrubs and place your belongings into one of the generic “Anesthesia” lockers. Then, make your way out to pre-op.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Preop and PACU:</strong> Preop and PACU bays are separated; patients will roll back with their brick/monitors and return to PACU with the brick/monitors</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>ORs:</strong> Inverness has 6 ORs</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Typically, two attending anesthesiologists will be assigned to Inverness and either split coverage of rooms with APPs or one attending will sit their own cases while the other oversees 3-4 ORs</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Break room: located along the back hallway, past preop; does not require a badge or code for entry</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Has a water station, sink, microwave, multiple fridges, tables and chairs that you are welcome to use</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Daily workflow: </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Per the Orientation Welcome Packet, your “primary goal is to learn how to work effectively in a fast-paced, high-performance orthopedic practice, with an emphasis on efficiency, communication, and perioperative management and teamwork.” You will be generally paired with the AIC attending on any given day and be working directly with a team of orthopedic surgeons and sports medicine experts to provide high quality care to a number of patients (including professional and college athletes as a result of UCHealth partnerships). You will bolster your regional anesthesia techniques, become more confident in your abilities to supervise multiple rooms, and see the results of your management plans and peripheral nerve blocks through patient recovery. With that said, daily resident tasks are as follows:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Arrive at 6:00 am and cha
