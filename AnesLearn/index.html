nge into green scrubs</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Grab the anesthesia charge phone from one of the Cisco phone charging banks (familiarize yourself with the location of these on the day of your tour) and let the INV_C2 attending know once you have it in your possession</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Make your way to preop, introduce yourself to nursing staff, review any changes to the schedule and note patients in need of consent/blocks</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">It is expected that all preops and consents are completed prior to 6:45 am, so that patients can be blocked as appropriate and make it into the OR for their 7:00 am starts. Be sure to update the Encounter Date of the note as preop notes are generally started / signed ~2 weeks prior</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The lead APP will create and add you to a daily group text chat—it’s awesome and will make you wish we did this everywhere else…</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Be present for induction in all rooms that you are supervising; let the charge attending know when you are heading to induce (or if you are busy with a task that will preclude you from getting to the OR in a timely manner, i.e. IV placement, preop consent, etc.)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Perform all blocks with the assigned attending(s) present</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Ensure that APPs/in-room providers get ample time for breaks/lunch; they are encouraged to get their own breaks whenever possible, but it is ultimately an AIC/pre-tending responsibility to ensure this is completed</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Before heading out for the day, review the schedule for the next day with your attending and call ALL patients with possible first case blocks. Calling the day before allows you to 1) gather all relevant medical and anesthetic history as you would in preop and to address any “red flags,” 2) to answer any questions the patient may have about their block without making them feel rushed, and 3) to streamline the following day team’s workflow.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Pharmacy:</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There are two main Pyxis machines (OR sterile corridor, preop/PACU) and a Pyxis machine in each OR. Returns can be made at either of the main Pyxis machines, but waste of controlled substances must be performed at an OR Pyxis with a witness. If you need premeds to perform a block, do your best to grab them in advance from the in-room provider (alternatively, pull them yourself from the preop Pyxis). Inverness does not have narcotic bags or a centralized pharmacy on the 4th floor.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Blocks:  </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Inverness has a surgeon preferences document that must be referenced prior to considering and offering blocks to different patients. If you did not receive or have lost access to this document, reach out to a colleague or Dr. Bengson prior to starting your rotation. It will save you a lot of time and headache. QR codes for the Surgeon Preference Guide are posted by all of the anesthesia computer workstations around the ORs and in preop with the most up-to-date version of the “live” document.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The block cart at Inverness is located in the preop nurses’ station by the charge desk, across from preop bay 7. The code to access the cart is 1267 Enter. Confirm the block with your attending and touch base with the pre-op nurse in advance to let them know about your plans and timing. The APPs who preop these patients ahead of time are great at entering ultrasound orders into Epic. DO NOT enter another ultrasound order without checking to see if the patient already has one and cannot be pulled up on any given US worklist. Discuss block dosages with your attending prior to drawing up meds from the block cart.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Once consents are signed/dated and the patient has an appropriate site mark from a PA, attending surgeon or fellow*, you may proceed with the block. Fentanyl sedation can be given prior to the circulator seeing the patient, but any additional sedation including midazolam requires that the circulator see the patient and confirm the necessary paperwork is complete. Perform the timeout with the patient’s bedside RN, save all images from the ultrasound, and chart the block procedure note and premeds as you do on APS.</p>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!WARNING]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">Unlike at other UCHealth facilities, at Inverness, a surgical consent must be obtained by an attending, fellow, or PA.</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">Surgical residents may NOT obtain consent from or mark the patient.  </div>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Anesthesia tech: </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Mike Rosario is the anesthesia tech for Inverness. He makes it into the OR to help with induction before you can get there almost 100% of the time. He is amazing. He is part of the daily group chat, his cell phone number is included below, and his number is also affixed to every anesthesia machine. Call him for any technical or supply issues in the ORs or preop/PACU.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Key phone numbers:  </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Anesthesiologist In Charge (Anesthesiologist On Call, INV_C2 on QGenda) x6-9900</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">2nd Attending Phone (2nd Anesthesiologist, INV_OR on QGenda) x6-9896</p>\n<details style=\"margin:8px 0;border:1px solid #E8E5DF;border-radius:8px;padding:10px 14px;\"><summary style=\"cursor:pointer;font-weight:600;font-size:13px;\">**Anesthesia OR Numbers**</summary><div style=\"margin-top:10px;\">\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">OR 1 x6-9891</li>\n<li style=\"font-size:13px;\">OR 2 x6-9892</li>\n<li style=\"font-size:13px;\">OR 3 x6-9893</li>\n<li style=\"font-size:13px;\">OR 6 x6-9890</li>\n<li style=\"font-size:13px;\">OR 7 x6-9888</li>\n<li style=\"font-size:13px;\">OR 8 x6-9889  </li>\n</div></details>\n</ul>\n<details style=\"margin:8px 0;border:1px solid #E8E5DF;border-radius:8px;padding:10px 14px;\"><summary style=\"cursor:pointer;font-weight:600;font-size:13px;\">**Nursing OR Numbers**</summary><div style=\"margin-top:10px;\">\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">OR 1 x6-9857</li>\n<li style=\"font-size:13px;\">OR 2 x6-9858</li>\n<li style=\"font-size:13px;\">OR 3 x6-9859</li>\n<li style=\"font-size:13px;\">OR 6 x6-9862</li>\n<li style=\"font-size:13px;\">OR 7 x6-9860</li>\n<li style=\"font-size:13px;\">OR 8 x6-9861</li>\n<li style=\"font-size:13px;\">OR Charge x6-9884 </li>\n</div></details>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Preop/PACU Charge x6-9899  </li>\n<li style=\"font-size:13px;\">Preop x6-9845</li>\n<li style=\"font-size:13px;\">PACU x6-9844</li>\n<li style=\"font-size:13px;\">Control Desk x6-9849</li>\n<li style=\"font-size:13px;\">Anesthesia Tech (Mike Rosario) x6-9881, 815-342-6639 (cell)</li>\n<li style=\"font-size:13px;\">PAT RNs (Mary Griffith, Karen Egan, Jill Pandolfo) x6-9869</li>\n<li style=\"font-size:13px;\">OR Schedulers (Margaret Joy, Taylor Breyer) x6-9868</li>\n<li style=\"font-size:13px;\">Radiology Techs (Tracey Clay, Brian Bodkin) x6-9886</li>\n</ul>",
  "neuro": "<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">Neuroanesthesia</h1>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Neuro Attendings:</strong> _Claudia Clavijo MD, Julio Montejano MD, Tony Oliva MD/PhD, Ben Scott MD, Colby Simmons DO, Scott Vogel DO_</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The neuroanesthesia rotation may be familiar to you by the time that you begin your actual rotation. It is common to provide anesthesia for patients undergoing craniotomies, spines or emergent IR stroke cases while on call or general OR days. This rotation allows you to see a wide variety of procedures and the considerations that come with each of them.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Before starting your rotation, you will receive an orientation email from the neuroanesthesia team. Below is an education schedule from the orientation email if you want to get a head start:</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Week 1: CNS Anatomy, Physiology and Pharmacology </li>\n<li style=\"font-size:13px;\">Week 2: Neurosurgical Anesthesia </li>\n<li style=\"font-size:13px;\">Week 3: CNS Monitoring </li>\n<li style=\"font-size:13px;\">Week 4: Head trauma, Supratentorial tumors, Posterior fossa </li>\n<li style=\"font-size:13px;\">Week 5: Intracranial aneurysms, Cerebral ischemia, Neuroendocrine tumors </li>\n<li style=\"font-size:13px;\">Week 6: Cerebral protection, Epilepsy and epilepsy surgery, Interventional neuroradiology </li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">EVD</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">In anesthesia, we often do not manage EVDs daily, however many of our patients coming to the operating room for NSGY procedures will have EVDs that we will need to know how to manage upon transport as well as in the operating room.</p>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!WARNING]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\"><strong>DO NOT ATTACH A PRESSURE BAG TO AN EVD. A PRESSURE BAG IS NOT NECESSARY AND CAN CAUSE HARM</strong></div>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If you don't feel comfortable setting up an EVD or have questions, call a neuroanesthesia attending, contact a neurosurgery resident or call the neuro ICU charge for help.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Neuro ICU Charge: x83590</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">EVD protocol can be found under the neuroanesthesia protocols under “EVD Management.”</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Instructions above written by Dr. Clavijo.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Case Types</h2>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Intracranial Procedures  </h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Perform your preoperative evaluation like you would for a general case.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Look through the notes to find out if the patient shows any sign of increased ICP. If there are any neurologic deficits at baseline or any other concerning factors, document those changes in the pre-op evaluation. Do your own basic neurological exam as part of your pre-operative evaluation the day of surgery.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Include imaging description as part of your evaluation. It is useful view the imaging yourself to know the size/location of a tumor and the surrounding structures that may be at risk.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Most patients will simply need 0.5-1.0 MAC of gas and narcotic/propofol mix unless there is evidence of increased ICP on imaging/symptoms, PONV considerations, or neuromonitoring (NM) is requested.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">It is necessary to know the NM techniques that will be used for the particular case since your anesthetic technique of choice may need to be changed or modified based on the NM test performed.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Inhalational agents and neuromuscular blockers can’t be used if motor evoked potentials (MEPs) are included in the NM.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Neuromuscular blockers can’t be used if EMG monitoring is selected as part of the NM technique.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">On the other hand, both inhalational agents and neuromuscular blockade can be used if ABRs are the only NM technique selected.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Open the pdf attachment in the scheduling email that is sent the day before, titled “OR Daily Schedule”. If you scroll to your patient, you will find important information regarding whether neuromonitoring will be used, whether the procedure be awake vs asleep, whether MRI will be done prior to the procedure, etc. This will help to prepare your anesthetic plan prior to calling your attending. (I am not sure the PDF now is as useful for some of this info)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Some patients undergoing MRI prior to the procedure will require intubation after having a frame placed under local anesthetic preoperatively by the neurosurgeon. This will require an awake intubation, which can be discussed with your attending. Ideally you will see the patient in pre-op before they go down to MRI, but do not delay their transport to MRI to complete the consent.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Neurosurgical patients will be turned either 90 or 180 degrees from induction position in most instances. All lines need to be organized in a way that they are secured and not at risk of being pulled while turning and positioning. This includes having extensions on your circuit and CO2 lines when needed.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Lastly, make sure you grab a neuro box for EVERY case. The neuro box contains most of the medications needed for neuro cases: (mannitol (with filter), Keppra, labetalol, nicardipine, adenosine, fluorescein, IC green, and Albumin when not on shortage). Also grab any blood pressure infusions you may need (uppers and downers) as these patients often have very narrow blood pressure ranges and having things in the room and ready to spike is always in your best interest. You will also need plenty of pumps for the different infusions. Generally, two brains are needed.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The surgeon will tell you the doses and of which meds they want for the procedure during time out. Always repeat dosing and clarify timing of medications with them.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">A bolus of propofol or opioid is commonly given before head pinning to prevent excessive increases in blood pressure. You should have enough left from induction to bolus or have a second syringe ready before pinning. –Also, antihypertensive medications (esmolol, labetalol, nicardipine) are useful during this time. You have to have them ready. Feel free to let the NSGY resident/fellow know when the patient is “ready” for pinning from an anesthetic/amnestic/analgesic perspective.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">When waking up, be prepared for hemodynamic swings as the anesthesia wears off, though your goal will be to stay within the already designated BP range designated by the NSGY team; Have a plan with your attending regarding which poppers (again, uppers AND downers) in which concentrations (because you will likely make them yourself) you should have ready.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Awake craniotomies have a few extra items to prepare in advance.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If the procedure will be done awake, have an iGel LMA available in the event of urgent airway management during the procedure as the head frame makes mask ventilation and intubation practically impossible.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Surgeons usually defer the sedation plan to us but check with them to see if any considerations need made. Propofol and remifentanil is a common combination used for sedation for arterial line and bladder catheter placement as well as frame placement if it wasn’t done in preop. While Precedex can be used, it often is not.  (This surgeon is no longer at UCH) Your attending will know the most common sedation technique for the particular case. The surgeons are typically good at providing decent pain relief with local anesthetic for accessing the cranial vault and meninges, but I would have some propofol in line just in case.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Seizures may occur during awake craniotomies, so have a plan A, B, C, D for how to break a seizure if it were to happen (midazolam vs. propofol vs cold water infiltration by the surgeon, etc.). Some of these decisions need to be carefully planned as they may impact the rest of the case (i.e., if you give midazolam, that patient may not be as aware as the surgeon needs to proceed).</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Pituitary Tumors and Other Sellar Pathologies</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Patient might be scheduled for a microscopic or endoscopic endonasal transsphenoidal approach. Both procedures require endotracheal intubation.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Please tape the ETT to the left angle of the mouth to avoid interference with the surgical field. The operating table will be moved 90 or 180 from the original induction position. If planning on using an oral RAE ETT please be mindful of your patient’s height and size up appropriately.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The head of the bed is removed, and the patient is placed in pins for the microscopic approach but remains in place for the endoscopic approach.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">DO NOT GIVE STEROIDS without consulting with the neurosurgeon.  In most cases, such as pituitary tumors, steroids are not given since they interfere with the post-operative endocrinology evaluation.  In other cases, steroids are given after tumor sample has been sent to pathology and pathology has confirmed an adequate sample, or not given at all due to the risk of infection.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Patients should be extubated when they are fully protecting their airway. Positive pressure ventilation to rescue the airway should be AVOIDED due to the risk of creating/producing pneumocephalus. Have an LMA easily accessible in the event the patient requires PPV.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Hemodynamic goals are similar to other intracranial procedures with SBP <140 mmHg. An arterial line is not required for the procedure, but patient and tumor characteristics may warrant placement.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Spines  </h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Most of you will have done plenty of spines prior to starting this rotation. You know that flipping can be challenging, especially if the case is anterior and posterior. Work on line management and finding a strategy that works best for you to make flipping the patient smooth.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Some other general considerations:</strong></p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Sedline monitoring is commonly used in spine cases. Secure it well with tegaderms, steri-strips, tape, etc, otherwise it will detach when patient is in prone.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Have a prone view available unless Mayfield frame will be used.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Tape, tegaderm, and check that the connections on your ETT are tight not once, twice but THREE times prior to flipping. It is a sad day when the ETT comes out on a prone patient.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If this were to happen, alert the surgical team, call your attending ASAP, and decide how stable the patient is (and where you are in the procedure) if you should flip back on to the stretcher vs place an LMA as a temporizing measure.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Esophageal temperature probe is preferable since nasopharyngeal probe can easily come out in prone position.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Know what type of neuromonitoring will be involved and plan appropriately.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Soft bite blocks are needed for most spine surgeries. TWO are mandatory if motor evoked potentials are going to be performed.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Many patients have chronic pain. Have a plan in place to provide adequate pain control as these can be very painful procedures. Consider alerting APS ahead of time if the patient is on numerous pain medications at home and is at high risk for significant and prolonged post-operative pain.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Be prepared for possible but significant blood loss – multi level fusions and osteotomies can result in significant blood loss. Make sure you have the access, blood products and resources (arterial line, level 1, Belmont etc.) available that you may need.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Know baseline neurologic deficits and document these deficits in the pre-op evaluation.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Take a peek at the neuromonitoring and ask questions. This might help solidify concepts that are typically tested.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">dotphrases</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">general neuroplan</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">crani w/ neuromonitorying</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">crani w/o neuromonitorying</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">awake crani</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Resources</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Cottrell and Young: https://www.clinicalkey.com/#!/browse/book/3-s2.0-C20130051870 </li>\n<li style=\"font-size:13px;\">Miller: https://www.clinicalkey.com/#!/browse/book/3-s2.0-C20161020047 </li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Other options: Barash, Newfield, Faust</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Library e-books link to find these books if the above links are broken: https://library.cuanschutz.edu/ebooks (this link is broken)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Neuro Protocols</strong></p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><a href=\"https://olucdenver-my.sharepoint.com/:f:/g/personal/elijah_christensen_cuanschutz_edu/Eq-Kue-gjxtMspUvzz99qvkB0fhInw_mQ3q8L_a5NMUoQg?e=wImL8h\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">OneDrive</a></li>\n<li style=\"font-size:13px;\">Epic >> Preop >> Manuals & FAQ Tab >> Neuroanesthesia Protocols</li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>REQUIRED READING</strong></p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Week 1: CNS Anatomy, Physiology and Pharmacology</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Faust’s Anesthesiology Review, Fourth Ed., Ch 55-57, 131, 132</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Clinical Anesthesiology, Barash et al, Seventh Ed, Pg 996-1000</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Miller’s Anesthesia, Miller et al, Eighth Ed, Pages 387-419</p>\n<li style=\"font-size:13px;\">Week 2: Neurosurgical Anesthesia</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Faust’s Anesthesiology Review, Fourth Ed., Ch 133-140</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Clinical Anesthesiology, Barash et al, Seventh Ed, Pg 1009-24</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Miller’s Anesthesia, Miller et al, Eighth Ed, Pg 2158-2196</p>\n<li style=\"font-size:13px;\">Week 3: CNS Monitoring</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Clinical Anesthesiology, Barash et al, Seventh Ed, Pages 1000-1009</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Miller’s Anesthesia, Miller et al, Eighth Ed, Pg 1487-1521</p>\n<li style=\"font-size:13px;\">Week 4: Controversies in Neuroanesthesia</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Processed EEG</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- BP management</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- TIVA vs IA - Stroke Alert GA vs MAC - Consent in AMS patient</p>\n</ul>",
  "nora": "<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">---</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">title: NORA</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">outline: [2,3]</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">---</p>\n<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">Non-OR Anesthesia (NORA)</h1>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Overview</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">More and more, anesthesia providers are asked to care for patients outside of traditional OR settings. This Non-Operating Room Anesthesia (NORA) rotation exposes you to these environments where anesthesia is provided to complex patients (GI, EP, IR, MRI, CT). In the past, the proceduralist provided the sedation, but has become not always adequate or safe as the complexity and acuity of patients continues to increase. As more advanced and complex procedures are introduced with ever-expanding indications and sicker patients, the need for Anesthesia services increases. Patients who previously were considered poor candidates for high-risk invasive procedures are now receiving these equally high-risk but minimally invasive procedures. Coordinating patient care in these settings is a challenge, not only because of the type of procedures and patient population, but also due to working with different non-OR team members in an unfamiliar environment, often lacking equipment anesthesia providers are accustomed to in the OR.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Cases may or may not start strictly on-time because of the coordination of other providers and specific equipment. As always, try to be available and ready for when they do decide to start the case. One dedicated anesthesia tech covers the NORA cases; however, they are typically also turning over rooms in the main OR. If you need special equipment, collect it for your first case, or notify them early on. Communication is incredibly important as you will be engaging with different RNs and physicians. Ask questions and make your needs known.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">For your daily assignment, please refer to the daily schedule email sent out. Sometimes, you will have to look past the cover sheet into the actual room assignments. Occasionally, your room assignment with be listed on the preprocedure tab in the top right along with the name of the procedure being done.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">For this chapter, locations will be covered one by one given the distinct differences in workflow and locations.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">HVC - IR/EP/Cath lab</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The HVC is on AIP2 3rd floor. There are typically four anesthesia teams in this area for a normal day. We may be involved with IR, neuro-IR, interventional cardiology, and EP cases. The CT-guided ablations are typically a HVC team, although these occur in the basement CT scanner. On occasion, we provide anesthesia for vascular surgery, pulmonology (bronchoscopies), MSK (kyphoplasties), and the ECHO cardiology service (sedation for TEE) as well.</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">The HVC anes tech phone is <strong>x8-7967</strong></li>\n<li style=\"font-size:13px;\">The tube station is <strong>645</strong></li>\n<li style=\"font-size:13px;\">HVC pre/post tube station (<strong>687</strong>)</li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The culture in the HVC is quite different than the operating room. If you open a dialogue with folks generally you will find that they are very willing to help, but don’t know what to do. Try to engage the procedure room nurses when you are inducing and emerging. This will help them both learn what you need and allow them to be helpful in the case of emergency. Write your phone number and your attending’s phone number on the white board in the room. While this is the typical practice in the general OR, it is especially important in HVC as your attending can be far away and the rooms are not arranged with the anesthesia team in mind. Unlike in the main OR, the nurses in the HVC usually do not have an up-to-date phone list. It will take time for them to find your attending’s phone number if you need them to call for help!</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Supplies:</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">The anesthesia equipment room is next to procedure room 1, it is room #3365 (the code to get in is the room number). It should have things like a CMAC, level 1, etc. There are other random anesthesia goodies on a shelf in the back left corner (circuits, tubes, etc.…).</li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If your room does not have an anesthesia machine or cart when you get there in the morning, just call your tech (<strong>x8-7967</strong>) for assistance.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If you run into an emergency, <strong>CALL FOR EQUIPMNET EARLY</strong> as it may take some time to get there.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Medications:</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">There is a pyxis in Rm 3.2319.; in-between the EP hallway and the hallway to the IR/Cath control room. The door code to 3.2319 is 3231#. If you forget what the code is, just remember is the first 4 numbers of the room number.</li>\n<li style=\"font-size:13px;\">You should plan to get most of the medications and boxes you need from the main OR pharmacy and pyxis.</li>\n<li style=\"font-size:13px;\">Other meds you need when you can’t go back downstairs can be sent to the HVC pre/post tube station (<strong>#687</strong>). If you request medications during a case, pharmacy will send it to the tube station rather than walk it to you like in the main OR. Tell one of the nurses that you’re waiting for a medication, and they will check for you.</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">IR Cookbook</h3>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\"><strong>Rooms 7, 8, 9, 10, 14, 16</strong></div>\n<h4 style=\"font-size:14px;font-weight:700;margin:16px 0 6px;\">Fistulogram</h4>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">MAC or GETA</li>\n<li style=\"font-size:13px;\">Supine, operative arm out</li>\n<li style=\"font-size:13px;\">Angioplasty is very painful</li>\n<li style=\"font-size:13px;\">Confirm last dialysis, K+</li>\n</ul>\n<h4 style=\"font-size:14px;font-weight:700;margin:16px 0 6px;\">Embolization</h4>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">MAC or GETA</li>\n<li style=\"font-size:13px;\">supine</li>\n<li style=\"font-size:13px;\">For active bleeding, keep in mind longer transit times for labs and blood and prepare ahead!</li>\n</ul>\n<h4 style=\"font-size:14px;font-weight:700;margin:16px 0 6px;\">Percutaneous gastrostomy</h4>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">MAC or GETA, light MAC strongly preferred for ALS patients</li>\n<li style=\"font-size:13px;\">supine</li>\n<li style=\"font-size:13px;\">NG will be placed for gastric insufflation</li>\n<li style=\"font-size:13px;\">Glucagon administered prior to gastrostomy, proceduralist will request dose at appropriate time</li>\n<li style=\"font-size:13px;\">Ultrasound and fluoroscopy guidance for percutaneous access to gastric lumen, then gastrostomy tube is placed, and NG tube removed</li>\n</ul>\n<h4 style=\"font-size:14px;font-weight:700;margin:16px 0 6px;\">Kyphoplasty</h4>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">MAC or GETA</li>\n<li style=\"font-size:13px;\">Prone</li>\n<li style=\"font-size:13px;\">Bone cement used</li>\n</ul>\n<h4 style=\"font-size:14px;font-weight:700;margin:16px 0 6px;\">Nephrostomy (PCN)</h4>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">MAC or GETA</li>\n<li style=\"font-size:13px;\">Prone</li>\n</ul>\n<h4 style=\"font-size:14px;font-weight:700;margin:16px 0 6px;\">PTCA (Percutaneous Transhepatic Cholangiogram) and PTBD (Percutaneous Biliary Drain)</h4>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Usually GETA, occasionally MAC</li>\n<li style=\"font-size:13px;\">Supine</li>\n<li style=\"font-size:13px;\">Procedure length dependent on whether bile duct is dilated</li>\n<li style=\"font-size:13px;\">High risk for intraop sepsis</li>\n</ul>\n<h4 style=\"font-size:14px;font-weight:700;margin:16px 0 6px;\">TACE (Transarterial Chemoembolization) aka Y90</h4>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">GETA or light MAC (frequent breath holds needed)</li>\n<li style=\"font-size:13px;\">supine</li>\n<li style=\"font-size:13px;\">Chemotherapy is injected directly into the vessels supplying a liver tumor</li>\n<li style=\"font-size:13px;\">Decadron/Zofran usually ordered and administered pre-op, check the MAR, don’t double dose</li>\n</ul>\n<h4 style=\"font-size:14px;font-weight:700;margin:16px 0 6px;\">TIPS</h4>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">GETA</li>\n<li style=\"font-size:13px;\">Supine, R IJ access, sometimes femoral as well</li>\n<li style=\"font-size:13px;\">For control or prevention of variceal hemorrhage and/or intractable ascites</li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">BRTO/CARTO sometimes done in conjunction with TIPS to reduce the risk of bleeding in gastric esophageal varices. Catheter is used to access the varices, coils are deployed to occlude flow at the distal end. A sclerosing agent is then injected into the varices to harden the tissue and prevent blood flow</p>\n<h4 style=\"font-size:14px;font-weight:700;margin:16px 0 6px;\">Chest Port</h4>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">MAC</li>\n<li style=\"font-size:13px;\">These are usually done with RN administered moderate sedation</li>\n<li style=\"font-size:13px;\">Patients with history of OSA on CPAP require anesthesia consult prior to moderate sedation with RN. If pt is pending chemo initiation they are just scheduled with anesthesia to expedite their treatment rather than awaiting PPS visit. MAC is usually appropriate</li>\n</ul>\n<h4 style=\"font-size:14px;font-weight:700;margin:16px 0 6px;\">Spinal Angiogram</h4>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">GETA, neuromonitoring</li>\n<li style=\"font-size:13px;\">Supine</li>\n<li style=\"font-size:13px;\">Post-op directly to Neuro ICU</li>\n</ul>\n<h4 style=\"font-size:14px;font-weight:700;margin:16px 0 6px;\">Cerebral angiogram +/- embolization</h4>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">GETA, maintain paralysis</li>\n<li style=\"font-size:13px;\">Supine</li>\n<li style=\"font-size:13px;\">Administer heparin, check ACTs</li>\n<li style=\"font-size:13px;\">PO aspirin and Plavix taken pre-op, if not, will place NGT and administer ASA/Brilinta intraop</li>\n<li style=\"font-size:13px;\">If EVD in place, IR nurse will monitor</li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Post-op directly to Neuro ICU</p>\n<h4 style=\"font-size:14px;font-weight:700;margin:16px 0 6px;\">Stroke</h4>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Emergent case, time = brain!</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">GETA, consider TIVA</li>\n<li style=\"font-size:13px;\">IR staff will be prepping while we are inducing</li>\n<li style=\"font-size:13px;\">Femoral arterial access obtained, have Aline setup ready to transduce. Do not delay case start to place our own Aline</li>\n<li style=\"font-size:13px;\">Post-op directly to Neuro ICU</li>\n</ul>\n<h4 style=\"font-size:14px;font-weight:700;margin:16px 0 6px;\">PE</h4>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">MAC with very minimal sedation vs GETA, proceduralists VERY strongly prefer no intubation</li>\n<li style=\"font-size:13px;\">With MAC, be very cautious to avoid hypoventilation</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">EP Cookbook</h3>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\"><strong>rooms: #2, 11, 12, and 13</strong></div>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">General ablation notes</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Headsets are worn during procedures when one or more team members are working in the control room. Headsets will be given to anesthesia providers and need to be worn as this is how the team will communicate information relevant to the case and patient care.</li>\n<li style=\"font-size:13px;\">Communicate significant hemodynamic changes and initiation or escalation of pressor support with EP physicians. Pericardial effusion, cardiogenic shock, acute blood loss all must be considered with hemodynamic instability</li>\n<li style=\"font-size:13px;\">Communicate regarding anesthetic plan prior to administration of any medications, all anesthetics can be antiarrhythmic. Some arrhythmias require awake mapping prior to administration of sedation</li>\n<li style=\"font-size:13px;\"><strong>Limit fluids</strong>. Catheter ablation uses an irrigated catheter which can result in a large volume of fluid administered over the duration of a case (2-4+ liters). Lasix is often indicated for large positive fluid balance</li>\n<li style=\"font-size:13px;\">EP RN will monitor hourly I+O</li>\n<li style=\"font-size:13px;\">Heparin administered if working in left side of the heart. Dosing directed by proceduralist. Anesthesia administers boluses, EP RN maintains infusion and draws ACTs.</li>\n<li style=\"font-size:13px;\">If heparin indicated, anesthesia places 2nd PIV. Typically IV on Left side is designated for EP RN use, IV on Right side for anesthesia use</li>\n<li style=\"font-size:13px;\">Have soft bite block ready in case cardioversion or defibrillation is required</li>\n</ul>\n<h4 style=\"font-size:14px;font-weight:700;margin:16px 0 6px;\">AFib/pulmonary vein isolation (PVI)</h4>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">GETA</li>\n<li style=\"font-size:13px;\">Supine, femoral access</li>\n<li style=\"font-size:13px;\">A-line only if patient condition warrants; 2nd PIV, heparinization indicated</li>\n<li style=\"font-size:13px;\">No paralysis redosed after induction. Ablation occurs near a branch of the phrenic nerve, need to avoid thermal injury. They will identify the location of the nerve by pacing and observing for diaphragm response.</li>\n<li style=\"font-size:13px;\">Place esophageal temperature probe. During ablation on the posterior wall, this is observed closely, and the room will determine who is responsible for monitoring. An increase of 0.1 degree Celsius needs to be reported. Increased esophageal temperature is associated with esophageal injury, including ulceration, perforation and atria-esophageal fistula</li>\n<li style=\"font-size:13px;\">Protamine at case end. Our EP physicians prefer we administer a 1 mg test dose. After ensuring no reaction to the test dose the rest of the protamine can be given slowly, at a rate of 5mg/min</li>\n</ul>\n<h4 style=\"font-size:14px;font-weight:700;margin:16px 0 6px;\">SVT/AFlutter ablation</h4>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">MAC (GETA in some cases, depending on complexity of procedure and patient assessment)</li>\n<li style=\"font-size:13px;\">Supine, femoral access</li>\n<li style=\"font-size:13px;\">Most SVTs and typical AFlutter are ablated in the right atrium. Some areas can be painful during ablation</li>\n<li style=\"font-size:13px;\">If left atrial access is needed, heparinization is indicated</li>\n</ul>\n<h4 style=\"font-size:14px;font-weight:700;margin:16px 0 6px;\">PVC ablation</h4>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">MAC (discuss with proceduralist before ANY meds administered, often they begin with mapping while fully awake)</li>\n<li style=\"font-size:13px;\">Supine, femoral access</li>\n</ul>\n<h4 style=\"font-size:14px;font-weight:700;margin:16px 0 6px;\">VT ablation</h4>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">GETA most common, MAC in some cases</li>\n<li style=\"font-size:13px;\">Supine</li>\n<li style=\"font-size:13px;\">Aline indicated</li>\n<li style=\"font-size:13px;\">Endocardial approach is most common (femoral vein/artery access). Epicardial access is sometimes indicated (subxiphoid approach is typically used)</li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">##### Typical procedure:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">1. Voltage mapping in sinus rhythm</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">2. Programmed stimulation with goal of arrhythmia induction</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">3. Activation mapping in VT if hemodynamically tolerated (pressor support often indicated, communicate with EP physician) If hemodynamically unstable, VT can be terminated by internal pacing or external cardioversion</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">4. Ablation, can be extensive</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">5. End-point assessment (often performed multiple times before case end). Can include re-induction of arrhythmia, pacing various sites that have been ablated, repeat mapping.</p>\n<h4 style=\"font-size:14px;font-weight:700;margin:16px 0 6px;\">Implanted devices (pacemakers and ICDs)</h4>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">MAC</li>\n<li style=\"font-size:13px;\">sometimes a venogram on the operative side is indicated. We may need to place an IV for this</li>\n</ul>\n<h4 style=\"font-size:14px;font-weight:700;margin:16px 0 6px;\">Subcutaneous ICD</h4>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">GETA</li>\n<li style=\"font-size:13px;\">Very stimulating when leads are tunneled</li>\n<li style=\"font-size:13px;\">VF will be induced to test device, external defibrillation if device fails (have bite block ready)</li>\n</ul>\n<h4 style=\"font-size:14px;font-weight:700;margin:16px 0 6px;\">Leadless pacemaker</h4>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">MAC, groin access</p>\n<h4 style=\"font-size:14px;font-weight:700;margin:16px 0 6px;\">Cardioversions</h4>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">Room 2 or sometimes bedside</div>\n<h4 style=\"font-size:14px;font-weight:700;margin:16px 0 6px;\">EP Lab #13</h4>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">This is an MRI room. Stereotaxis navigation system has a low Tesla magnet that is always on.</li>\n<li style=\"font-size:13px;\">MRI screening forms for patients and staff are only needed if the navigation system will be used</li>\n<li style=\"font-size:13px;\">MRI compatible machine and monitors are present in this room</li>\n<li style=\"font-size:13px;\">Monitor in room and in control room must both be off Standby</li>\n<li style=\"font-size:13px;\">Monitor has wireless EKG and pulse oximeter. Battery charging dock is in the control room.</li>\n<li style=\"font-size:13px;\">Ventilator data (TV, PIP, PEEP) will not automatically transfer, needs to be manually entered</li>\n<li style=\"font-size:13px;\">Temperature is usually monitored by EP and manually entered, but the anesthesia monitor does have temperature capability</li>\n<li style=\"font-size:13px;\">Massimo pulse oximeter is present to use as a backup if monitor fails</li>\n<li style=\"font-size:13px;\">Computer is NOT MRI compatible, if moved too close to the magnet it may shut off</li>\n<li style=\"font-size:13px;\">The anesthesia cart and its contents including airway equipment are NOT MRI compatible. Keep the NON-MRI compatible equipment outside the lines indicated on the floor</li>\n<li style=\"font-size:13px;\">Additional anesthesia supplies are in the rolling cart beside the anesthesia cart</li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Standard MRI: 1-3 Tesla</li>\n<li style=\"font-size:13px;\">Stereotaxis system in Navigate position: 0.7 Tesla at magnet cover</li>\n<li style=\"font-size:13px;\">Stereotaxis system in stowed position: 0.2 Tesla at magnet cover</li>\n<li style=\"font-size:13px;\">Stereotaxis system in stowed position: 0.0005 Tesla outside brown circle marked on floor</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Misc</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Typically, time out is performed prior to starting your anesthetic with the procedure and anesthesia teams. Use this time to confirm that everyone is on the same page if you haven’t already.</li>\n<li style=\"font-size:13px;\">Once you are done with induction / starting sedation, tell the team. They don’t always realize when you’re ready for them to start.</li>\n<li style=\"font-size:13px;\">Specific to EP, when you take over a case, ask for a timeout. Use this as a chance to introduce yourself and review management issues with the EP proceduralist and current (leaving) anesthesia provider. Be sure to discuss any significant BP support being administered. Document the time out in the anesthesia record. ALWAYS wear the headset they give you; this is how everyone communicates, and you will miss important things without it. There have been many near misses when people have not used it. Just make sure that it’s on mute if you are signing out, complaining, etc.</li>\n<li style=\"font-size:13px;\">EP Room 13 has a notoriously bad reputation, because it is technically an MRI room (low-tesla magnet), and the EPIC/Vitals monitor interface is very finnicky, resulting in the need to manually enter vitals. Make sure your attending gives you a primer on the room before you start your case. There is also a laminated “how to EP room 13” sheet on the vent – give it a look over on the first day you're in the room.</li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- The EKG monitor and pulse have batteries that can be found in the room. When you arrive in the morning, one of the first things you should do is make sure that that batteries got taken out of the wireless monitors and put on the charger overnight. If not, get them on the charger ASAP. Also, the anesthesia machine in this room is MRI safe and thus not like the typical GE machines found elsewhere. Make sure to familiarize yourself with the machine the first time you use it.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Labs</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">For ABGs/ Blood Gas labs, from 0700 – 1900 someone from HVC must walk it to the OR lab (our stat lab personnel from the main OR are not expected to come pick up from HVC) or send it through the tube station; from 1900-0700, call 85309 and someone will walk from Leprino to pick it up. Let the nighttime person know if you will be sending repeated/frequent labs. All TEGs must be walked down, the sample cannot be used if it’s been sent by tube.</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Computers</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">The IP addresses for the data ports on the booms in the HVC expire if not used after 30 days. This means that if you are doing an anesthetic in a room that we don’t use often (like cath lab 5 or cath lab 6) there will not be internet access without a call to the computer help desk. This is primarily an issue for interventional cardiology. IF you see that you are scheduled to do a case in an infrequently used room, such as cath lab 5 or cath lab 6, please reach out ahead of time to the nurses in that area and ask that the data port be issued a new IP address. Interventional Cardiology will try to be pro-active with this, but please do your part by helping folks remember or make the call yourself.</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">ECT</h2>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Location</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The ECT suite is located inside the secured psychiatry ward on the 5th floor at AIP3. Make sure you have badge access to the locked ward prior to going on the NORA rotation. If taking Teal Service Elevators (the first set of elevators that you encounter coming in from the resident garage), the entrance to the psychiatry ward pre/post unit is directly across from the elevator lobby on the 5th floor. If coming from the Yellow Staff Elevators (by pre-op), make a right once you’ve exited the elevator lobby (walk away from the OBGYN ward), you should reach a front desk area where there will be staff members and a security guard. Proceed straight past the counter and through the double doors, the entrance to pre/post is to your right.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Chart preparation</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">All new ECT patients should have been seen by PPS unless they are transferred/referred from OSH or if they were admitted directly to inpatient. Returning patients will have their previous ECT anesthesia medications listed in the blue sticky note. Most likely the same regimen will be used again unless there are some dose titrations, which the attendings on both teams will discuss. If patient is new, the psychiatry team will have to perform their own pre-ECT eval and consent which could take some time.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Equipment</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">All necessary equipment and meds are located inside the ECT suite, including a stocked Pyxis. Each patient will need an Ambu bag and a foam bite block. Make sure to have airway adjuncts nearby and ready.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Medications</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Prior to the patient being brough into the suite, the anesthesia and psychiatry team jointly determines the dose adjustments between treatments if required. The goal is to achieve a therapeutic level seizure that doesn't last too long, while maintaining reasonable hemodynamics. Benzodiazepines may be held on the DOS because they increase the seizure threshold, this will be managed by the psychiatry team. Check their notes for recommendations. Below is a list of common drugs you’ll encounter in the ECT suite</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Preop seizure threshold modulation</strong></p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Anesthesia induction meds</strong></p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Methohexital</li>\n<li style=\"font-size:13px;\">Etomidate</li>\n<li style=\"font-size:13px;\">Ketamine</li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Muscle relaxation during seizure</strong></p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Succinylcholine</li>\n<li style=\"font-size:13px;\">Rocuronium</li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Post-procedural</strong></p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Propofol</li>\n<li style=\"font-size:13px;\">Midazolam</li>\n<li style=\"font-size:13px;\">Lorazepam</li>\n<li style=\"font-size:13px;\">Ketorolac</li>\n<li style=\"font-size:13px;\">Ondansetron, diphenhydramine, dexamethasone, scopolamine</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Choice of Anesthetic</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">-\tDrug of choice should have rapid onset of action and ideally should have minimal interference with inducing an effective therapeutic seizure.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">-\tThe minimum effective dose should be administered because lower doses are associated with increased rates of response to ECT.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">-\tBecause all anesthetic agents have the potential to interfere with the generation of a therapeutic seizure, the choice and dose of the anesthetic agent must be tailored to the individual needs of the patient during the course of their ECT sessions.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Workflow</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Prep meds, a new Ambu bag with an EtCO2 monitor line attached between the mask and the actual Ambu bag (this line will be connected to the monitor box when patient is brought to the room), and a soft bite block for each patient. The patients will be brought to the room by the ECT RN with monitors attached like the GI suite. Plug in the monitor brick into the wall mounted screen. The psychiatry team will get the patient ready by attaching the ECT delivery device to their head. Once their devices are attached, preoxygenate the patient via the Ambu bag to the face and wait. Encourage the patient to take deep, maximum-capacity breaths during this period.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Once all team members are ready, attending anesthesiologist will start induction. The ECT RN will place and inflate a NIBP cuff to the ankle to 20% above initial systolic BP to stop paralytics from reaching the ankle. This is done so the seizure strength and duration may be monitored during the ECT. Start hyperventilating the patient with Ambu bag once induction is successful. The soft bite block should be placed into patient’s mouth at this time. If indicated, flumazenil will be administered after induction agent for patients on high dose benzos.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Stop hyperventilating just prior to ECT delivery, which will be announced by the psychiatry team. As the ECT is delivered, both teams will observe for the onset and duration of seizures via foot motor contractions and EEG recording. Do not touch the patient while the EEG is recording – this is why the preoxygenation and hyperventilation is important prior to initiating the ECT.  During both the tonic and subsequent clonic phase of the seizure, the HR, rhythm, and BP are monitored to assess and promptly treat any significant prolonged cardiovascular response.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Once the seizure has spontaneously terminated, the patient is manually ventilated until the return of adequate spontaneous respirations. If the patient is spontaneously breathing and vitals are stable, they’ll be transported to the PACU by the anesthesia team; they will most likely return to the same bay as before.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Special Considerations</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">-\tLaryngospasm</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">-\tPatients who underwent ECT are at high risk of developing laryngospasm. Review presentation of laryngospasm and how to break it (jaw thrust, Larson maneuver, positive pressure ventilation, re-paralyze if still unable to break)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">-\tContraindications to succinylcholine</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">-\tWill likely need rocuronium and reversal with Sugammadex. Plan dosage and workflow adjustments as needed based on ECT duration</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">-\tBenzodiazepine reversal</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">-\tReview patient benzo regimen and dosing, flumazenil dosing. Discuss strategy and dose timing with psychiatry team</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">-\tBarbiturate allergies</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">-\tLikely second line would be etomidate, less likely propofol</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Complications / Side-effects:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">-\tTemporary memory loss</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">-\tPostictal disorientation</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">-\tHypertension</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">-\tBradycardia</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">-\tTachycardia</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">-\tProlonged seizure</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">MRI</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You may anesthetize patients in the MRI adjacent to OR 25 (3T) or in the basement MRI (1.5T). You need to fill out an MRI screening form annually while in residency that will be kept on file. If you have not done this, arrive early to one of the MRI rooms and notify the MRI tech, and they will be able to get you the paperwork to be allowed to enter the MRI. They will give you a small card to designate you have done this – it’s good for a year, put it with your badge so you always have it!</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Prior to entering the MRI room, don’t forget to remove ALL metal objects as well as other things that will be damaged by the magnet; you can leave these in the control room. The MRI Tech will typically have a plastic bucket for you to place your belongings. This includes many things that you may not even think of (pens, bobby pins/hair clips, watches, cell phone, all credit cards or badges, etc.). Oddly enough, rings and the needles on your syringes are ok.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The MRI tech will always be present when you have access to the MRI room. In the basement, there is usually a tech around; however, they only come up for scheduled scans (with or without our involvement) upstairs. The phone number to the upstairs control room is x81690. The anesthesia tech also relies on the MRI tech to get into the room to set up your machine and cart.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Pre-op</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Make sure the patient has filled out their MRI screening form before you give any sedation and go back to the room. Many of these patients are receiving anesthesia because they are claustrophobic. No proceduralist will be there because the scan was ordered by an outpatient provider.</li>\n<li style=\"font-size:13px;\">Non-sedated patients can walk into the MRI suite and get onto the bed themselves. Otherwise, park the gurney in the control room, the MRI tech will bring the MRI bed out and then help you wheel that in once the patient is on it. You will typically induce on this bed next to the MRI, the tech can help lower/raise/etc.</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Monitors</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There are instructions on which monitor to enter into MonCap on the computer (UCHOR iMRI). This will not acquire your vitals unless the screen in the control room is turned on. Many of these monitors have special components to them (I.e., MRI safe EKG stickers, finger pulse ox probe is specific to the wireless monitor, etc.). Just ask the MRI techs to help you locate these if you cannot find them.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">During the scan</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Once the scan has started, you may be able to enter the room between sequences, however if something happens in the middle of a sequence, the only way to get to the patient (administer meds, etc.) is to interrupt it then restart from the beginning once you’re done. Be sure to communicate with the MRI tech if there’s something you need, and they will pause/stop for you.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Misc</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">The MRI compatible pump is a giant pain. There are instructions for troubleshooting that should be with it. If possible, have someone walk you through getting it set up and get it working well before you actually need to use it. Typically, if you are running infusions, you just leave a non-MRI compatible pump outside the actual MRI room and run long extension tubing (ask the MRI tech for this tubing).</li>\n<li style=\"font-size:13px;\">Make sure to ask the MRI techs for the extra-long IV extension tubing if using the non-MRI compatible pump outside the room. Do keep in mind that this tubing has about 12 cc of fluid between the pump and the patient and as such changes made on the pump take a while to get to the patient unless you crank up the rate of your carrier</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">PACU</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You must call PACU at 86203 to let them know you are bringing your patient to them. In the OR, typically the circulator RN handles this for you. Call 15-20 min before you anticipate arriving. They will want to know the patient's name and whether they are going home after recovery.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If it is your first day there or you feel uncomfortable, let the MRI techs know! They are incredibly helpful, and they will help you through the day and all the small but important nuances of MRI safety.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Radiology</h2>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">Aka the basement</div>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You will sometimes go downstairs to the basement to sedate patients for LP or for procedures in the CT scanner. Overall, this is very similar to MRI (and the 1.5T MRI is down here, as discussed above), however you have access to these rooms without a tech. Make sure you have lead for yourself, particularly for the CT ablations and things where you’ll be in and out during the procedure and scanning. Don't give sedation until you're downstairs (often the proceduralist has not consented while your patient is in preop even though you have). These monitors don't always pull vitals into Epic, when this is the case, you will have to chart everything manually.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">As above, call PACU at 86203 to let them know to expect you. Depending on the procedure pre/post may be on the 2nd floor by the ORs or on 3 by CVC.</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Talk to your attendings about positioning specific to the procedure – sometimes it’ll be a surprise (i.e., radiology likes to have patients prone for LPs).</li>\n<li style=\"font-size:13px;\">The anesthesia tech will set up your machine and cart. They usually know when things are scheduled here but check in and keep them updated if scheduling changes. I would suggest calling them first thing of that day.</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">GI</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">GI is adjacent to the East ORs. There are a couple of suites as well as a small pre/post area between the GI suites and the East OR.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Medications:</strong></p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">The AOP pharmacy covers this area, their phone number is 81391. Similar to East OR, in the morning the pharmacy will have med bags pre-prepared for all your booked cases. You can pick up some or all bags in the morning, just remember that you can expect very fast room turnovers (~20 min), so find a system to keep up with administering and wasting medications for the correct patient, including when you get a break, or your attending gets something out of the top drawer.</li>\n<li style=\"font-size:13px;\">Some cases are simply done on the patient’s gurney while others will be done on a procedure table. The anesthesia tech will turn over your room, their number is on the anesthesia machine.</li>\n<li style=\"font-size:13px;\">As with some subspecialties, there are some minor differences in the anesthesia carts here (Unasyn instead of Ancef, glucagon in top drawer, albumin 500cc in bottom drawer).</li>\n<li style=\"font-size:13px;\">In general, you can anticipate to performing GETAs for: ERCPs and small bowel endoscopies. You will typically perform MAC for EGDs, colonoscopy, and some stent removals, however, as always, ultimately this depends on the pertinent details for that case or patient.</li>\n</ul>",
  "ob": "<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">OB Anesthesia Rotation Guide</h1>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><em>Most recently updated by Kevin Kim MD, Jason Papazian MD, Kelsey Repine MD, July 2023</em></p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Access Codes</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">4th Floor Work Room: 11154</li>\n<li style=\"font-size:13px;\">5th Floor Work Room: 11154</li>\n<li style=\"font-size:13px;\">UCHealth badge access</li>\n<li style=\"font-size:13px;\">Nutrition Rooms: 11154</li>\n<li style=\"font-size:13px;\">Women's Locker Room: 84111/ 23985</li>\n<li style=\"font-size:13px;\">Co-ED Locker Room: 84111</li>\n<li style=\"font-size:13px;\">Call Room: 0404</li>\n<li style=\"font-size:13px;\">Epidural Carts: 84111</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Phone Numbers</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">OB Att <a href=\"tel:+17208485973\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">x85973</a></li>\n<li style=\"font-size:13px;\">OB APP <a href=\"tel:+17208485911\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">x85911</a></li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Scheduled Meetings</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">06:00: Anesthesia resident sign out</li>\n<li style=\"font-size:13px;\">07:00: OB sign-out (we can go to Grand Rounds on Mondays but let the APP know you are leaving the unit)</li>\n<li style=\"font-size:13px;\">08:30: MOB signout at nurse station</li>\n<li style=\"font-size:13px;\">12:30 on Tuesday: MFM Clinic Meeting</li>\n<li style=\"font-size:13px;\">08:00 Thursday: Team meeting after sign-out</li>\n<li style=\"font-size:13px;\">18:00 Daily: PM anesthesia signout</li>\n<li style=\"font-size:13px;\">20:30: MOB signout at station</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Orientation</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You MUST orient with the OB anesthesia service the WEEK PRIOR to the start of your rotation. You will receive an email with details about 10 days before your rotation but just be aware that this is mandatory.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Reading</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You will receive an email before your rotation starts with several attachments containing information about the rotation:</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Standard doses for spinals/epidurals (The <a href=\"../ref/ob-cookbook.md\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">cookbook</a>)</li>\n<li style=\"font-size:13px;\">A <a href=\"https://olucdenver-my.sharepoint.com/:w:/g/personal/elijah_christensen_cuanschutz_edu/EcOr-g1Lh9RDmAu3L1PXrD0BsQSnC58v4j9DhMlVoluwsw?e=aFwn4f\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">procedure guide</a></li>\n<li style=\"font-size:13px;\">A reading list</li>\n</ul>\n<details style=\"margin:8px 0;border:1px solid #E8E5DF;border-radius:8px;padding:10px 14px;\"><summary style=\"cursor:pointer;font-weight:600;font-size:13px;\">Details</summary><div style=\"margin-top:10px;\">\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Reading list from 2024:</strong></p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><a href=\"/ACOG-PB-209.pdf\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">ACOG Practice Bulletin 209</a></li>\n<li style=\"font-size:13px;\"><a href=\"/ASA-RCL-2023.pdf\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">ASA-RCL-2023</a></li>\n<li style=\"font-size:13px;\"><a href=\"/OB-anesthesia-emergencies-review-2022.pdf\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">OB Anesthesia Emergencies</a></li>\n</ul>\n</div></details>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Read these before you start and print out the cookbook and procedure guide to carry with you. You will also receive an OB anesthesia work room. As always, Morgan and Mikhail is not a bad place to start.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Vacation</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Vacation is allowed on the OB rotation, though, if at all possible, please try to not take vacation the first week of the rotation. This first week is extremely valuable learning and orientation with the OB attendings and will help prepare you for when you go on nights. Nevertheless, we understand that some events cannot be moved (weddings, engagements, etc.), but if you have flexibility in your schedule, please take vacation one of the other three weeks.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Schedule</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The schedule on OB is different from every other rotation. You will be working 12-hour shifts from 6am-6pm or vice versa. Note: the start time of the shifts may be changed by the residents on any given month (most residents prefer 6-6 so you can get settled prior to sign-out).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There is also an OB-short resident that arrives at the same time but is usually released in the early afternoon by the attending, pending cases, workload and teaching completed for the day. Sometimes, residents decide that this resident comes in an hour earlier than the 12 hr resident, so please check with current residents prior to rotating through to confirm when each shift starts.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Please try to arrive with enough time to get hand off from the on-call resident so they can leave on time (about 15 minutes early). The 2 junior residents covering days during the first two weeks and then nights for the second two weeks and vice versa for the residents with prior OB experience. This will allow the residents new to OB to have more daytime teaching prior to starting nights.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">In addition to you, there is a CRNA/AA on at all times. They work 24-hour shifts, 7am-7am, so they will know what happened during the day shift which can be helpful on nights.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Don't plan to get much sleep on OB at night. This is not like an OR overnight call where once you knock out the cases on the board you have a good shot of getting a chunk of sleep for the rest of the night. You will always get the first call for any epidurals, C-sections, etc. This is so that we can get the experience that we need.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">A note for people with kids: it will be a hard month if you have small children because you might not see them a lot. Leaving at 5:30am and getting home around 7pm for 3-4 days in a row might mean that you won't see them for 3-4 days. (Not much to do about it - just a word of warning. You may want to enlist help/warn your spouse in advance, so they don't kill you.)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">That said, the OB rotation is a really good one, much loved by all for several reasons:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">1. We have great OB attendings that like to teach, and a good syllabus. The OB attendings are Joy Hawkins, Christina Wood, Jaime Daly, Jason Papazian, Rachel Kacmar, and Stephanie Kierstead. They all like to teach and will happily discuss any OB topic that you pick for the day provided that there is time. They are usually on service during the weekdays. That is especially helpful in the first month when you have no idea what you are doing. Most of the attendings that cover nights will let you run the show but should ALWAYS BE IMMEDIATELY AVAILABLE and should be present EVERY PROCEDURE. If you have any questions or concerns do not hesitate to call the attending overnight. This is why we all do a lot of days at the beginning of our first month. Make sure that you learn all you can from the OB attendings during days because at night you are managing much more.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">2. The OB nurses are great. They are very knowledgeable and helpful. They will call us for procedures so that we can get experience. Again, tough in the middle of the night sometimes, but that is what we are here for.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">3. There is a <a href=\"../ref/ob-cookbook.md\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">cookbook</a> with standard doses for spinals/epidurals. It is very helpful to print it out and put it in your pocket or attach the card to your badge.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">4. There is a cognitive aid on each epidural cart as well as in the OR that can help you work through decision making, dosing decisions, etc.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Pearls</h2>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!WARNING]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;bor
