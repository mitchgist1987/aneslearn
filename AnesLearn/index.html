case (i.e. Whipples & HIPECs).</li>\n<li style=\"font-size:13px;\">Keep your eye on the board and check in with OR charge before you leave for the day - you'll want to know if a transplant is added on later that evening. Typically charge or on-call attending will contact you.</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Before You Start (Highly Recommended)</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Reading the relevant chapters regarding anesthesia for patients with liver disease and liver transplantation in any of the major anesthesia textbooks (M&M, Barash, Miller, etc) provides a great background and helps you understand the physiologic changes associated with liver disease. Recommend the Liver Transplant section of the Jaffe book to get a very basic idea of the surgical procedure.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If you are hard-pressed for time to read chapters, here are some great review articles:</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><a href=\"https://anesthesia.ucsf.edu/sites/anesthesia.ucsf.edu/files/wysiwyg/pdfs/Anesthesia-for-Liver-Transplantation_Anesthesiology-Clinics.pdf\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">UCSF Anesthesia for Liver Transplantation Article</a></li>\n<li style=\"font-size:13px;\"><a href=\"https://journals.lww.com/transplantjournal/Fulltext/2021/10000/Hemodynamic_Instability_During_Liver.15.aspx\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">Hemodynamic Instability Article</a></li>\n<li style=\"font-size:13px;\"><a href=\"https://www.openanesthesia.org/keywords/hepatic-anatomy\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">Hepatic Anatomy</a></li>\n<li style=\"font-size:13px;\"><a href=\"https://www.openanesthesia.org/keywords/venovenous-bypass-during-liver-transplantation/\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">Venovenous Bypass During Liver Transplantation</a></li>\n<li style=\"font-size:13px;\"><a href=\"https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(14\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">Liver Cirrhosis</a>60121-5/abstract)</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">When You Get Called for a Liver Transplant</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">1. When the OR desk or on-call attending calls you on nights/weekends for a liver transplant, they will usually give you at least 3-4 hours' notice. Always call the desk again before heading into the hospital, as plans often change. Important information to get: patient name, MR#, donor procurement time (this gives you a better idea of the timeline), whether the attending has been notified.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">2. Before you leave your house, confirm that the case is still scheduled AND if so, go into EPIC or call the pharmacy and order your drips. This is especially important at night and on the weekends as the inpatient pharmacy is not as quick as the OR pharmacy. Have your drips tubed to the OR front desk. Use the guide on the Anesthesia Sharepoint website to figure out which drips to order, forget about antibiotics (low, intermediate or high risk- look at the protocol in the manual)!</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Pre-op</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Pre-op Note</strong>: Fill out the pre-op note as you normally would, always include TTE information and calculate a MELD (can use MDCalc), determine the risk category for blood products and antibiotics. There is a separate section for transplants on the pre-op note that should be filled out, titled \"Transplant\". It's fairly self-explanatory.</li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Consent</strong>: Usually the attendings like to consent the patient themselves, you can ask them this when you call to discuss the plan. If you do the consent: GA, arterial line, central line (+/- PA catheter), TEE (if planned), and possible post-op ventilation.</li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Pre-med</strong>: These patients will get Ativan instead of midazolam if premedication is used. Do not give any premedication until the UNOS time out has occurred in the OR.</li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Blood</strong>: The attending will order the initial blood products; you are responsible for confirming that the blood is in the room and checked prior to heading back to the OR. The nurses will usually check it for you, but always double-check that this has been done.</li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Always confirm that everyone is ready prior to heading back to the OR. Typically, you will be ready to roll and will have to wait for a green light from the surgical team (the organ must be confirmed as acceptable prior to heading back).</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Intra-op</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Chart</strong>: There is a separate macro for Liver transplants, again it should be self-explanatory.</li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Timeout</strong>: You will perform a UNOS timeout prior to induction, include this information in the Epic Record (there's a button for this).</li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Induction</strong>: RSI, all patients are presumed to have full stomachs. Succinylcholine for intubation, cisatracurium is the preferred drug for NMB maintenance (more rocuronium is now being considered on a case-by-case basis, discuss this with your attending). Do give lidocaine to patients with liver disease!</li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Lines</strong>: Discuss with your attending. Arterial line (typically right radial), two large bore PIVs (can convert one to a RIC), central access (usually a triple lumen CVC and/or a Cordis or Mahurkar). If you have not placed a RIC or Cordis before, or if it's been a long time since you last placed a central line, review these with a CA3 or a CA2 who has just finished transplant or cardiac to refresh your memory.</li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Connect your infusions (should all be connected to the manifold) to one of the central line ports, the CVP to another port and then crystalloid (can use the Level One tubing) to the third port.</li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">The Belmont is usually connected to the RIC, Cordis or Mahurkar. Use caution when connecting the Belmont or Level One to PIVs, infiltration can occur and compartment syndrome can develop extremely quickly.</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Liver Transplant Surgical Phases</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There are three phases/stages to the surgical procedure, they are very briefly explained below. The guide on the Sharepoint website will go through the anesthetic goals of each stage and any textbook will walk you through the other important aspects of each stage.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">1. Preanhepatic Phase (aka Dissection Phase)</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Blood loss is your main concern during dissection. Keeping up with blood loss and maintaining hemodynamic stability are the major goals. Low CVP is preferred (≤5 mmHg if tolerated) to reduce blood loss. Monitor ABGs, usually at least every 30 minutes. Monitor and correct coagulopathy as needed.</li>\n<li style=\"font-size:13px;\">Phase ends with clamping of the Suprahepatic + Infrahepatic IVC, portal vein, hepatic artery, and removal of liver.</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">2. Anhepatic Phase</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">The stage begins with the applications of multiple vascular clamps: 1) Hepatic artery 2) Portal vein 3) Infrahepatic Vena Cava 4) Suprahepatic Vena Cava. The mobilized liver is removed. Steroids will be given once fully anhepatic (confirm timing with surgeons).</li>\n<li style=\"font-size:13px;\">Ice-cold liver graft is placed in the field. 3 anastomoses are then completed:</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">1) Suprahepatic vena cava</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">2) Infrahepatic vena cava</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">3) Portal vein - critical for providing flow into the liver</p>\n<li style=\"font-size:13px;\">Prepare for reperfusion, the surgeons will often give you a 3-5 min warning. Discuss with your attending how to best prepare for reperfusion.</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">3. Neohepatic Phase</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Monitor for new graft function, avoid hepatic congestion, ensure hemodynamic stability to prepare for case end. Monitor ABGs and correct coagulopathy as needed (discuss continued lab draw timing with your attending).</li>\n<li style=\"font-size:13px;\">The surgeons will place a Yankauer in the abdomen, pack it and leave for about 30-45min (pay attention to the blood loss during this period). They will come back and re-inspect for any continued bleeding and fix any issues.</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Post-op</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Extubation</strong>: The goal is to wake up/extubate these patients at the end of the case. If this occurs, they usually go to PACU. It's a good idea to stick around for a little bit to make sure there's no significant bleeding or other issues which would require immediately returning to the OR.</li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Post-op intubation</strong>: If the patient has significant unresolved hemodynamic instability or very high blood loss, they may be left intubated and will therefore go to the STICU.</li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">It is always a good idea to go see these patients the next morning, not only will it give you feedback for your management but also good to know ahead of time if there are any complications.</li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Remember, if they return to the OR you are returning to the OR!</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Live Donor Liver Transplant</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">These cases are a bit different, they will be scheduled and the patients are usually not as sick. Here are a few specifics of these cases but this is a constantly evolving protocol and may change.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Living Donors</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">The living donor is managed by an attending (LT2) and an APP</li>\n<li style=\"font-size:13px;\">These patients are very important - complications in these cases are the type of thing that ends up on the news. It's not the type of media attention you want!</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Recipients</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">The recipient will be managed by the LT1 attending and the resident.</li>\n<li style=\"font-size:13px;\">These patients tend to be slightly healthier than patients who are receiving deceased donor organs, as they usually are not sick enough to get on the waitlist for a deceased donor organ.</li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Coordination between the two surgical and anesthesia teams is very important, communicate with the other room!</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Liver Transplant Setup</h2>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Drugs to have ready at case start</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Bicarb x 1</li>\n<li style=\"font-size:13px;\">CaCl x 3</li>\n<li style=\"font-size:13px;\">Epinephrine x 2</li>\n<li style=\"font-size:13px;\">Phenylephrine x 2</li>\n<li style=\"font-size:13px;\">Norepinephrine x 1</li>\n<li style=\"font-size:13px;\">Vasopressin x 1</li>\n<li style=\"font-size:13px;\">Protamine x 1</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Infusions set up on left side of patient (see image - Alaris pumps)</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Epinephrine</li>\n<li style=\"font-size:13px;\">Norepinephrine</li>\n<li style=\"font-size:13px;\">Vasopressin</li>\n<li style=\"font-size:13px;\">Calcium (use 25% - Currently not available at UCH)</li>\n<li style=\"font-size:13px;\">Albumin</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Antibiotics</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Please call pharmacy (x86132) to order appropriate antibiotics for your patient. Continue antibiotic infusions until surgery end.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Transplant Box (obtain from pyxis) contents</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">CaCl 1g (x3)</li>\n<li style=\"font-size:13px;\">Epinephrine 1mg (x2)</li>\n<li style=\"font-size:13px;\">Vasopressin 20 units (x1)</li>\n<li style=\"font-size:13px;\">Phenylephrine 100mcg (x2)</li>\n<li style=\"font-size:13px;\">Norepinephrine 4mg (x1)</li>\n<li style=\"font-size:13px;\">DDAVP 20mcg (not always used)</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Transplant Emergency Syringes Bag (obtain from pyxis) contents</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Epinephrine 100mcg/mL (x2)</li>\n<li style=\"font-size:13px;\">Phenylephrine 100mcg/mL (x2)</li>\n<li style=\"font-size:13px;\">Ephedrine 5mg/mL (x2)</li>\n<li style=\"font-size:13px;\">Atropine 0.4mg/mL (x2)</li>\n<li style=\"font-size:13px;\">Glycopyrrolate 0.2mg/mL (x2)</li>\n<li style=\"font-size:13px;\">Metoprolol 5mg vial (x2)</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Equipment to set up in the room</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Belmont (Wet down with 0.9% NS or Albumin)</li>\n<li style=\"font-size:13px;\">Level 1 (Attending dependent - most prefer Belmont so put outside room)</li>\n<li style=\"font-size:13px;\">Cell saver (discuss with attending whether to have it set up in the room or available outside the room)</li>\n<li style=\"font-size:13px;\">Rapid infuser</li>\n<li style=\"font-size:13px;\">TEE (if planning to place PAC)</li>\n<li style=\"font-size:13px;\">Defibrillator pads (have pads in the room, discuss with your attending whether or not to put them on prior to case start)</li>\n<li style=\"font-size:13px;\">HD machine (for patients who will need intraoperative HD, the dialysis RN will set up the machine in the room next to the belmont/next to cell saver). All orders for HD will be placed by your attending.</li>\n<li style=\"font-size:13px;\">Cooler with ice</li>\n<li style=\"font-size:13px;\">Lab tubes (pre-filled out blue top tubes, a few purple top tubes and at least 2 light green top tubes)</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Lines</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">All patients get an arterial line and at least one central line, sometimes two, discuss which lines to have ready with your attending:</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">RIC (most common line placed)</li>\n<li style=\"font-size:13px;\">Cordis</li>\n<li style=\"font-size:13px;\">Arrow MAC</li>\n<li style=\"font-size:13px;\">Triple lumen</li>\n<li style=\"font-size:13px;\">Mahurkar</li>\n<li style=\"font-size:13px;\">PA Catheter</li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">During dissection phase the frequency of further lab draws will vary by case and attending, discuss this with your attending.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><em></em>* 15 minutes after reperfusion of the hepatic artery:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">PT/INR, PTT, Fibrinogen (one blue top tube)*</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Definition of Ischemia Times and Operative Variables</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">A timeline of different phases of ischemic injuries for organs procured after cardiac death:</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Donor warm ischemia time (DWIT)</strong> is defined as the interval from withdrawal of life support to initiation of cold organ preservation</li>\n<li style=\"font-size:13px;\"><strong>Graft cold ischemia time (CIT)</strong> is defined as the interval from initiation of donor in vivo cold organ preservation to removal of the graft from 4°C cold storage</li>\n<li style=\"font-size:13px;\"><strong>Graft warm ischemia time (WIT)</strong> is defined as the interval from removal from cold storage to establishment of reperfusion of the liver graft. </li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Donor operative variables after withdrawal of life support were:</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Organ hypoperfusion (OH)</strong>, defined by a mean arterial pressure lower than 60 mm Hg</li>\n<li style=\"font-size:13px;\"><strong>Tissue hypoxemia (TH)</strong>, defined by tissue oxygen saturation less than 70%</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">What the hell is \"piggy-back\"?</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">A \"piggy-back\" refers to partial occlusion of the IVC intra-operatively, with an end-to-side anastomosis, instead of insertion of donor IVC.</p>",
  "uch": "<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">General OR - University of Colorado (UCH)</h1>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Before you start</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You must have your ID badge (use it for parking, getting scrubs and getting through doors), codes for Pyxis (talk to Clark Lyda at the OR Pharmacy window for problems with Log-in), and of course EPIC (which is the same username and password as your UCD webmail. Every time you change this in one system it changes it in the other)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">When in doubt, call Alyson, Aurora, the chiefs, or another resident. We have all been there and can help. Call a resident who is over at the University to give you a tour before starting.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Pre-ops can be done from home, if you haven’t already done them in the OR. This is accomplished by going to https://myapps.uchealth.org . Bookmark this page on your home computer and it will save you time in the future. Log-in using your webmail username and password. (The first time you log-in you will have to download Citrix to run EPIC. A link is posted for both Windows and Mac operating systems. Click this link and follow the instructions.) To log-in to EPIC PRD icon and log-in with your EPIC (same as webmail) username and password. Go to the OR Status or Snapboard and find your patient cases.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Phone Numbers </h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">AIP Charge: x85920 </li>\n<li style=\"font-size:13px;\">AIP Charge RN: x84351</li>\n<li style=\"font-size:13px;\">OR Rooms: x307XX (Ex. OR 3 is 30703) </li>\n<li style=\"font-size:13px;\">OR Pharmacy: x86132 </li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">EPIC</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Learning EPIC, the intraoperative charting system, is paramount before starting a case.  If this is your first month of CA-1 year, you will have an orientation scheduled for you at the University during orientation. You be paired with another CA-1 for a couple weeks and you’ll be a pro in no time!!!</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The system itself runs off the UCH OR board. To make sure this is your setting, click on the EPIC tab at the top left, find change context down towards the bottom and make sure your name is located under provider and that ZZ ANESTHESIA is below under department. Click ok and this will bring you to the Status Board setting window.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">On the OR Status Board all the cases for the day will appear in order of room number; add-ons appear at the top until they are assigned to a room. For the main OR, you will want to have the AIP Intra-op Status board or AIP all areas selected. Under the location tab it will show you the areas that will appear on your status board- this tab should always show \"AIP Operating Room\" (which are the main ORs) and AIP Ancillary Operating Rooms which shows cases posted for EP, IR, Rad sedation, cath lab and GI in addition.  Anesthesia AMC Main OR Status Board have all of the ORs for AMC.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">To get you to the cases that you have been scheduled for in the EPIC system, you can select My cases direct to the left of All ORs. If you don’t see your name here, check the SnapBoard and see what room you are assigned to.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If you have any difficulties with EPIC or want to try and schedule EPIC training, please contact the chiefs directly and they can help you ASAP.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The UCH IT support number is x84000 if you need it.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If you don’t start at the U, make sure to come in and have a resident show you the ropes prior to your first day. Orient yourself with the anesthesia machine and learn where things are stored on the anesthesia carts.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Weekday Daily Workflow</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Complete pre-ops the day prior and call to discuss pertinent topics/anesthesia plan with your attending the next day.  Work and personal cell phone numbers are available via SmartSheets at this link Smart Sheet Phone Roster. You will have to download and sign in via “company credentials” using your UCD email. You can also find it on the sharepoint (cupropofol.com). Plan to call your attending, but many people text first to coordinate a time.  </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Preop's should include: PMH, labs, EKG, CXR, TTE etc. from EPIC.  You will complete the Anesthesia pre-op evaluation note.  Pertinent information can be found under Chart Review, Patient Summary, Anesthesia Records, among many others.  </li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- The pre-op note can be found under the Preprocedure tab, which is found at the top once you open a patient’s chart. Click on \"Anesthesia Pre-Op Eval\" to open note. When you select this, it will open a template that you can directly select + / - on selection under each organ system. To add procedural information of pt. history specific to the diagnosis (like for example hypertension or sleep apnea) click on the actual diagnosis and a single line box will appear that will allow you to type history that you want to include in your pre-op. Try to be as inclusive as possible for this. The next screen you will need to complete is the physical exam, which can be filled out by clicking at the top left the physical exam tab. You basically go through and click the tab that fit each portion of the physical exam. Just like on the previous history tab, you can click on each individual part of the physical exam to add handwritten notes (for example, description of a murmur heard on cardiac exam). The final tab of the three to be filled out is the anesthetic plan. Here you click the appropriate boxes for ASA status, additional case details (arterial lines, fiberoptic intubations etc.), as well as consent (that it has been done). After you are done, you will sign by clicking this button in the lower right corner.</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Should you need to update or edit any additional information, you can find your pre-op on the pre-op page at the bottom and by hovering over the area an update button will appear. Click on this button and your pre-op will appear. You can edit any portion of it and sign as you previously did to save all changes. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">If there is a recent pre-op from another procedure/surgery, you can click on the notebook with the arrow pointing right labeled \"copy note\", found on the upper right corner of your pre-op after you open it.  This will copy all information from the previous anesthesia record, and you can update pertinent sections as needed. Remember to delete old text regarding procedure, physical exam, and plan. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Fill out the Pre-op Orders (this should be done the night before when completing your pre op note). Nurses need official orders to start the PIVs, hang IV fluids, EKG, labs, scopolamine patch prior to case starts.  The pre-op order set can be found under the order tab when you first open the pre-op page at the top (with the other tabs you frequently use on the pre-op page). The order sets can be found by searching within the box labeled \"order sets\".  To add sets to your favorites, you can do so by right clicking over the order set and clicking \"add to favorites\".   You want “UCHS Anesthesia Adult Pre-op.”  LR is ordered for most cases in the AIP. If any labs are needed… especially a type and cross/screen, try and make sure you order those the night before. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Other Order sets to favorite are UCHS Anesthesia PACU / Post-op, UCHS Anesthesia Intra-op Transfusion, UCHS Anesthesia Corneal Abrasion Management PACU / Post-op Orders. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Give yourself at least 30 minutes to set-up your OR before any morning conferences: </li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Monday- Grand Rounds 6:45</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Thursday- Cardiac lecture 6 :30 (when on Cardiac)</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Arterial lines:</strong>  Pressure bags and transducers are in the Anesthesia workroom. Usually there are a couple set up for the day. You can ask the tech if there are arterial lines wet down and where to find them. You should know how to wet these down in the event that there is not a tech available to help, and you need one emergently. Have a tech or your attending show you. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Be sure that if you need infusions, you have all the pumps you need in the room. Pumps can usually be found in each room. Extra channels are usually located in the Anesthesia workroom, or you can call one of the techs prior to your start. Prime all drips and place them on “hold”, ready to just hit run once induction is complete.  Always keep an extra channel for the possibility of pressors or addition of other agents. Make sure that you change the mode to the \"anesthesia mode\" under the options before you set the pumps up.  </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">In prone cases, be sure to check that you have a prone view pillow. Ask the techs or grab one from the workroom. You will start an extra IV for most prone/spine cases that require TIVA. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Get the patient’s narcotic bag from the Pyxis in Pre-op or from the pharmacy (It is called Narcotic Bag on the list) and includes the following controlled substances (with recent shortages the amounts below may change, always look at each bag closely!).  </li>\n</ul>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!TIP]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">Typical narc bag includes:</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">- 1x 2mg Versed </div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">- 2x 100mcg Fentanyl  </div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">- 1x 1mg Dilaudid</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">- 2x 200mg Propofol </div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">- 1x 50 mg Ephedrine </div>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Other meds like Phenylephrine/Mannitol/cisatricurium/Heparin/Insulin/Precedex are in the Pyxis/refrigerator in the substerile areas between the ORs and premade phenylephrine syringes are in the pre op pyxis, sterile core, or at pharmacy (where you get your narcotic bag) or the top drawer of the anesthesia cart. You can always call the pharmacy (86132) to make up a drip for you. Remifentanil is in the pyxis, it can be made up in 1mg or 2 mg/40 ccs for the low and high concentrations.  Clark Lyda, the head pharmacist, is always an excellent resource for all drug-related questions. All emergency drugs are in your cart in the OR. When adding extra narcotics or pulling out meds for a TIVA be sure to re-list the added meds you pulled out for the patient to your total on the narcotic bag. This is best accomplished with a sharpie. Example for a TIVA: get a large clear bag and write out what you pulled in regard to propofol on it. You can easily return the un-used propofols in the large bag. It also makes for easier accounting. Remi and Ketamine can be accounted for on the other narcotic tab on the narcotic bag. You can always pull out more narcotics for patient cases, just be sure to be diligent about accounting for them. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Make sure you get EPIC loaded up in the OR before you head to pre-op; you will want your intra-op screen for the case going into the OR up. Having this up will also allow you to click the next buttons easily as soon as you enter the room with the patient. Under the intraprocedural tab you will want to make sure you do the following prior to your patient arriving. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Make sure your anesthesia machine is connected to the correct workstation in EPIC. If you look at the top right of each monitor where the vitals are displayed, each will have a label with UCH OR then a two-letter state or AMCANES and a number. On the top left of the strip’s buttons located at the left of the intra-op record is button called “Device. Once you click this button, the correct label should be displayed. If not, then search for it in this window and add it. Once added correctly it should appear to the left.   </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">You also want to select you and your attendings names under “Staff” so that it auto logs when you click anesthesia start once the patient arrives. </li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Lastly, make sure that you select a “Macro” to load commonly used medications. “General” under public is a good one.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Before you leave the room, write you and your attending name and number on the board so the circulator can get ahold of you if needed.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Arrive in Pre-op around 6:45-7:00 (8:00 on Mondays).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Find your patient. (The EPIC screens in pre-op show the bay number and you can find it under the patient’s name in their chart.)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Complete pre-op H&P in EPIC while talking with the patient or once you get back to the room. Nurses chart vitals in the patient EPIC chart and you can see them on the main pre-op page. If not just ask and they can help you.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Consent the patient. (Check with attending about type of anesthesia first). The consent is found at the front of the chart or at the nurse’s station.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Start IV if not done already (rare). Try to put in 18 gauge or larger. PIV kits can be found at the bedside and IV fluids primed and ready to go are found around the Pre-op front desk. If you need anything else, just ask!</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Verify antibiotics and that they are on the bed, taped to the fluids, or on the way to the OR. The primary team is supposed to order, but they often forget (ortho) so check with surgical team or just draw up Ancef to be prepared.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The circulator will get the patient and bring them to the room. Make sure you are ready by 0720 at the latest. It’s a good idea to call you attending once the circulator leaves so, they can get there in time.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Once the patient rolls in the room, click “Start anesthesia,” Patient in Room,” and “Immediate Reassessment”. This will start the charting once vitals are collected as you start the case.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If your vitals don’t move over or you forget to click these buttons, you can still collect vitals by validating the vitals located in each monitor…. they save them, thankfully! By clicking on the \"Mon Caps\" button again, your monitor will be displayed at the left. Click on the monitor and a chart of your vitals will appear. Click the upper left corner of this chart and it will highlight all the vitals within the box in yellow. Click \"validate\" to add these to the patient record (alternatively, you can go through and highlight them individually and drag the yellow area over vitals you want included).  I recommend playing with this feature as a lot of times the vitals feature of EPIC is down, and you can manually add vitals into the record this way (instead of manually entering them).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Put on monitors. Start BP. Start pre-oxygenating.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Call your attending to tell them you are in the OR if they are not there. Have all the induction drugs ready to go, even plugged into the IV line. Do not push the sedative drugs yet, however titrating in fentanyl will allow it to work by the time you are ready to start induction.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Your attending will come in for the induction.... have fun!!</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">After induction, begin charting. Everything is charted in EPIC through buttons located on the left of the record. They are all pretty self-explanatory. Go through each and chart the specifics of each case. Meds is probably the most crucial along with the intubation. Common meds can be charted through a macro. You can also input meds manually as well through the meds tab. Gtts for TIVAs are under infusions. You just need to familiarize yourself with all these functions prior to starting a case.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Make sure you complete the PACU orders before going to PACU (can be done any time in the case). Use the macro you favorited earlier.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Click the appropriate events as/time to roughly when it happens. Make sure that they make sense and tell the right story. Some of these are metrics tracked by the hospital so getting them close does matter.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You’ll get attending specific instructions for what to call them for. If they don’t, then ask!</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Call attending prior to extubation, no exceptions. If they don’t show up immediately or give you a time frame, then make sure to call again!</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">After you extubate, fill out the extubation tab/LMA removed, then click “out of room” as the last thing you do before you leave to PACU.  It’s after “patient transported with oxygen.”</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Transport to PACU. Remember to look at epic (under the patient names) or ask the OR circulator the PACU bay # you are going to before leaving the room. If you forget, this can also be found on a whiteboard just inside the main PACU entrance. Complete Post-op note, and give brief report to PACU RN: Anesthetic type, drugs, drips, complications, IVF totals, UOP, and special orders.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Chart any meds given in PACU and fill in EBL / Urine output if you haven’t.    Remember to click “Anesthesia Stop” which you will find under your post op note. This is an audited metric because it ties into how we are paid, so get it close to accurate.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Write your totals on narcotic bag; make sure they match EPIC totals.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">No needles! Only blue caps!!!! Drop it off at the pharmacy window if possible. Otherwise, there are metal box next to the Pyxis in Pre-op or next and the pharmacy window.  Put your name and patient names/sticker. Get meds for the next case. (If you have quick cases, you may want to pull out multiple narcotics first thing in the morning).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Usually will get “coffee” (15min. morning around 9am), lunch (30min. 1100-1300), and “tea” (15min. afternoon around 1500) break.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The OR schedule with anesthesia assignments comes out around 2-3pm. It is emailed to us as a PDF, but you can also find your cases from the main Epic page by clicking My Cases. However, it will show up in the Snapboard first (typically around 1100/1200) Look up patients for the next day and call your attending the night before to discuss plans. Try to do this as early as possible and definitely before 2000. Try to see all inpatients the night before and have the consent signed.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Weekday Hours</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">R1: This means overnight call: 3pm-7am. You will finish all the late cases for the day and all the emergency overnight cases.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">12 hour: Normal am-7pm: Start with the first cases of the day and you are in house until 7pm.  Res-OR: You usually finish and can leave after you have finished your cases, or about 3-5p. If you finish early, always check with the charge anesthesia attending to see if you are needed elsewhere.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Call Nights/Weekend Call</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">On weekday call nights, arrive ready to start a case at 3pm. Check OR board and/or with Anes Charge (85920) to see where you’re needed (usually your name will be written in red on the main OR White board to tell you your assignment when you arrive). Keep your pager/Cell on during the day; they may need you to come in a little early if they are very busy (rarely, if ever, happens).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Weekend call is a 12-hour shift, 7am-7pm.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Call Room </h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Located on the 2nd floor between AOP and AIP. Room # 2016. Code is 5889#. We just got new stuff (Nespresso, Pillows, Mattress topper, etc) for the call room so please keep it nice!</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Pagers (Trauma activation and Code pager)</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">When on call, you will carry a code/airway pager as well as a trauma activation pager (see below). Codes (See Section “What to do at a code”): Your responsibility is the “A” of the ABCs. Get to the head of the bed, assess need for airway intervention. It’s OK to push RTs, RNs, and other residents out of the way. Before intubation remember “VISA” V-ventilator or ambu-bag ready? I- patent IV functioning?, S- suction ready?,  A- airway tools available?  Always remember to grab the Airway Box prior to heading to the code location.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Airway Bag Locations:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">1) main OR anesthesia charge station</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">2) in PACU</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">3) in STICU located at main nursing pod</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">4) CTICU by the signout roomYou will carry the trauma pager when on call at UCH as well</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">5) Resident workroom (aka the K-Hole)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If you are not in a case, you should go down to the ED for all trauma activations as we are a Level 1 Trauma center. The ED owns the airway, and we just stand by the door to help if needed. Your secondary objective is to determine if the case will rush up to the OR.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You should not start carrying this pager until after January, so ask your attending if you are unsure.</p>",
  "va": "<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">General OR - Rocky Mountain Regional VA Medical Center</h1>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Locations</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">ORs: 3rd floor, F building, Take Elevator 1 to the third floor.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Anesthesia Office and Lounge: Immediately off the hallway connecting buildings F and H, F3-294</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Pre-op:  Adjacent to PACU through the double doors in the main hallway</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">PACU:  Down the main hallway in the procedural area to the right the glass-walled OR office</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Locker rooms/Scrub Pyxis: South end of the main hallway in Building F (code: 1-4-5-#)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">SICU: Bridge to the ORs immediately next to the Anesthesia Offices (building H, floor 3)</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Before you start</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You will need an ID badge, scrub card, Omnicell access, and computer (CPRS and Innovian) access. This whole process will take several weeks, and likely 3-5 visits to the hospital.  You should contact the department coordinator (Dolores Colella, Dolores.Colella@va.gov) at least 6 weeks prior to starting there to make sure things are in motion.  There is a checklist of items you must complete, including fingerprinting, online computer training, and applications for credentials. This is a very harrowing process, and no one will be checking to make sure it is proceeding for you. If you stall (and sometimes even if you don’t), you will be stuck trying to get around without access for the first couple of weeks you are there. Not fun.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">1-2 months prior to starting: go to the badging office and get your fingerprints done. You don’t need an appointment, but they close at 4pm. After you get your fingerprints done, go to HR to get your WOC letter or email Dolores to get a copy (you will need your passport AND driver’s license or social security card for this). Email the coordinator prior to doing this so he can fill out the paperwork to “sponsor” you.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">1 month prior to starting: Go back to the badging office to get your ID – YOU WILL NEED AN APPOINTMENT (email the coordinator to have them arrange an appointment for you, you must have an appointment, or they will not do anything for your even if they aren’t busy). Also, at this point you need to start emailing the coordinator to make sure that they set up your computer access: you will need CPRS access (for patient notes/info), Innovian (Anesthesia EMR) AND Omnicell access (pharmacy/drugs access).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">2 Weeks prior to starting: Email the coordinator again to confirm that you have CPRS access, Innovian, and Omnicell access. At this point you will need to make another trip to the VA (once you have your badge) and have the coordinator set up OR access for your badge. At this time, make sure they give you your Omnicell login information (last initial +last 4 of SSN).  Go to a computer and make sure you can log in, also go to the Omnicell in the preop area and make sure you can login to this as well (these are the two most important things).  To get fingerprint access, you will need to talk to the head Anesthesia Tech, Kathi Conner.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Before you start you should have (1) your badge, (2) Omnicell access (VERY IMPORTANT), (3) CPRS access, (4) OR access for your badge, (5) Scrub card (You may be able to get a scrub card from the outgoing resident, coordinate with them),</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Your ID will grant you access to the north parking garage.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Again, having Omnicell access is essential prior to your first day (you really can’t do anything without it</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Being the VA, emailing does not guarantee that that the coordinator will start getting everything set up for you.  If you do not explicitly get a response from them, you should just stop by the VA and personally talk to them someone about getting everything started.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Write down your various codes – CPRS (Access/Verify and signature code), Innovian login, Computer PIV Pin number, Omnicell Login/Password</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Kathy Connor (the absolutely amazing lead anesthesia tech) is responsible for resident Voceras (in house paging system). She will orient you to how they work/what commands can be utilized.  You will need to sign these in/out to start and end the rotation.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Weekday Daily Workflow</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The pace at the Rocky Mountain Regional VA Medical Center is a little more leisurely than it is at the other hospitals, but they are really trying to get cases started on time and speed up turnovers as much as possible.  You can definitely help the process by putting gentle pressure on the OR nurses to get the room turned over, for example, by letting them know that you are ready to take the patient back (or once you get to know them better, suggest that you start taking the patient back “slowly”).  On the plus side, the slower pace gives you more time for placing blocks and lines without feeling rushed (check with your attending, but many will appreciate getting an arterial line placed before heading back to the OR in order to save time; this is something to consider later in the year once you have done a bunch asleep).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The anesthesia techs here are very friendly, some of the best we work with.  It is always appreciated if you set up your own arterial line for first case starts (either from a prepped aline bag in the workroom or put one together from the bottom drawer of your in-room Omnicell).  Don’t worry, you will still not be the limiting factor for starting the next case.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Make sure to turn on and log into your Vocera each morning.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Pacer magnets are on the fridge in the anesthesia workroom. You will have many patients with pacemakers/AICD’s.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Printed schedules for the next day are in a file next to the printer in the anesthesia offices. They are usually available by lunchtime. Changes are frequent, so make sure to check the OR board for the latest schedule. Outside OR1 along the main hallway (in between entrances to the ORs and PACU) is the most updated OR board. The whiteboard in the anesthesia office will also have the day’s cases, assignments, and add-ons, as well as room for you to mark when you’ve gotten breaks.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Because of CPRS (and limited ability to access it at home), preop your patients before you leave the VA for the day. Most of the attendings prefer a quick discussion in person instead of a phone call later in the evening.  You should try to look up at least your first case during lunch so you can talk with them before they head home for the day.  The VA computer system is archaic, but very thorough once you get it figured out.  You can now access CRPS from home, but connectivity is sometimes questionable so do not depend on this for your initial lookup.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Take the time to read old anesthesia records, discharge summaries, cardiology notes, TTE’s, etc. on your own to make sure nothing important has been missed. Ask for a brief run through from a co-resident of the CPRS system to be able to find what you’re looking for while pre-opping.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Cases start at 08:30 on Monday, and 08:00 Tuesday through Friday. PIVs are placed in pre-op, but most of the time they are smaller than we want (20g or less), so be aware if you think you need large-bore access.  Also, plan for time to do any blocks or epidurals if indicated (see below).  The surgeons include anesthesia consent into their own, so you don’t need the patient to sign anything.  However, since the surgeons typically have no idea what we actually do, you should still review your anesthetic plan and major risks with the patient when you meet them that morning.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You will do all your own nerve blocks and epidurals at the VA.  You should plan to start the procedure right after morning lecture (around 7:35 on days you have lecture). This means that before you go to lecture, you need to have your room ready, a functioning IV, and the patient needs to be on monitors with nasal cannula flowing before your attending arrives.  There is a dedicated block room (Bay 13 in preop) with all supplies and an ultrasound. Try to let the pre-op nurses know that you will be doing a regional procedure and confirm with your OR nurses before you start that it’s ok to block the patient.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Equipment and most medications for peripheral nerve blocks are in the block cart.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Ultrasounds are either in the tech room or in the block room in pre-op (Bay 13).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Once you’re done with a block, let the anesthesia techs know so they can turn over the block room.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There are four groups that must see a patient before any sedation is administered - pre-op holding nurse, surgeon (consent/marking), OR nurse, and anesthesia attending.  Notify the OR RN if you would like to proceed with a block that requires sedation and they have not seen the patient. Anesthesia can site mark/verify laterality for a block if a surgeon is not available.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Lectures: Mondays 06:45-07:45 is Grand Rounds (virtual). If you are the on-call resident, you should plan to be in the VA building by 7am in case a room needs to start urgently.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">All other days, lectures start at 07:00 and finish around 07:30.  This takes place in the Columbine room – outpatient 3rd floor, right across from elevator 3.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">To contact your attending, have the OR nurse Vocera/call overhead if urgent/emergent. If an FYI, Vocera or call/text your attending (cell service is spotty).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">All patients with planned admissions to the SICU go directly there after the case, even if they are stable and extubated.  This includes all patients with epidurals. Also, after hours and weekends, patients will go to SICU for wake up because there are no evening/weekend PACU nurses.  The SICU should send their own transport monitors with the bed (we have the same monitors available in the OR, but they inevitably go missing upon arrival to the SICU, which the anesthesia techs will give you a hard time about).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">On non-call days, you usually go home around 1530 - 17:00.  On call days, you stay until the last room is finished.   If you stay beyond 10:00pm, you will get at least 10 hours of rest/recovery and most likely a post-call day.  Be available by phone 10 hours after you leave or communicate with the charge attending before making plans.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Since you won’t be able to look patients up in the OR or from home, the residents need to help each other out with pre-ops.  For example, if the resident on call is going to have a late night in the OR, the other co-residents should try to look up their cases for them.  The same goes when residents are on vacation, and need their cases looked up for Monday, as well as oncoming residents for the next rotation. Be a friend- it makes life at the VA so much better.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Except for epidural orders (discussed below), residents don’t place any orders while at the VA, so no pre-op/post-op orders are needed.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There is a list normally hanging on the whiteboard in the anesthesia lounge that contains inpatients anesthesia took care of the day before. If one of your patients is on that list (AKA they were admitted after surgery), it is your responsibility to see them and write a quick anesthesia post op note. Often times this can be done on breaks or during turnovers, and you can let your attending know that you are going to see the post op. Once you’ve seen them, you can cross them out on the list.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Acute Pain Service</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The VA is the only hospital that has you follow your patients outside of the OR as an acute pain consultant.  This means you will need to round on all peripheral nerve and epidural catheters that you place while those patients are in the hospital.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The APS is only for blocks/neuraxial we have placed for the OR.  We do not staff pain consults routinely from the medicine service or ED.  This is at the discretion of the APS attending (days) or on call attending (after hours), so communicate with them.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The attendings understand that most CA-1’s will not have had an APS rotation yet, so they expect you to ask them about pretty much everything.  Don’t feel stupid asking ANYTHING.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Any issues over night or on weekends will be handled by the on-call team.  Sue or the attending covering the Pain service will find you and sign out around 1500.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">It is a good idea for the on-call resident to check on the epidurals before leaving for the night- this can prevent many phone calls at home and even having to return to the hospital later. Some attendings will grab you and round on epidurals before leaving so you are both on the same page as far as a plan, which is very helpful in the middle of the night. Make sure to ask about how to write epidural orders before going home on your first call. CPRS is NOT intuitive.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Epidurals can only be managed in the SICU, so patient transfers to the floor may be an indication for you to pull it.  Peripheral nerve catheters can go to the floor in place. It is likely that your peripheral catheters may go home with an On-Q system for continued pain control.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Rounding: It is definitely encouraged to follow-up and help with seeing an epidural or nerve catheter that you placed, however, there is now a team (consisting of a nurse named Sue or Wyatt) and an attending that will round and write daily notes on these patients during the week.  For the weekends, there is a sample note in the binder they give you, and this can be used to figure out what you need to know on rounds (pain at rest/exertion, PRN narcotic requirements, DVT prophylaxis, dermatome levels, infusion rate, LE symptoms, acute events over night, etc).  The peripheral catheters are less complex to round on—big things here include DVT prophylaxis and ensuring that you haven’t given a dense motor blockade that might put them at a fall risk (eg. assess quadriceps function on femoral nerve catheters). You will then staff your catheter with the attending that placed it with you, or the attending on call.  Finally, write a brief note following the template in your packet.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Some peripheral nerve catheters go home with the catheter and a “pain ball.”  You need to call them every day, and eventually walk them through pulling the catheter themselves over the phone.  You still need to staff these patients with an attending and write a quick “phone note” each day.  There is not an acute pain pager.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Over the weekend, the call person rounds on all catheter patients (see below).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There are both anesthesia intensivists and pulmonary/critical care intensivists that cover the SICU.  The former will do most of their own epidural troubleshooting, as they understand you are in the OR most of the day.  The latter are mostly clueless when it comes to epidural management, so it is particularly useful to see patients early when they are on service.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The attendings understand it is nearly impossible to manage epidurals from the OR, so don’t be afraid to ask them to cover your room briefly while you go troubleshoot.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">It is easiest to plan to pull epidurals around 10:00 am (4 hours after morning heparin, 2 hours before the afternoon dose).  Some of the nurse practitioners in the SICU will pull epidurals for you, so good coordination and rapport with them can save you some work.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">VA Computers</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Get all codes for general access and CPRS access. Codes expire after 1 month, so if this is a repeat performance at the VA, you need to come in ahead of time to get new codes.  An application for your access needs to be submitted by the department coordinator, so make sure this is done before you show up.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Make sure to set up a signature code in order to be able to sign orders and your notes.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Talk to pharmacy if you are unable to write orders, you may need to sign some narcotic paperwork through the pharmacy office.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Paperwork</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Intra-op: We use Innovian for intraop charting at the VA. Your attending will orient you on your first day.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Blood gases are uploaded into the computer, but if you are going to check a few, it is also nice to have the anesthesia techs print them out for you. You don’t have access to run blood gases, so you’ll need to call the anesthesia tech or your attending to help you use the iStat machine.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Check VISTA Imaging (Tools>Imaging Apps>VISTA Imaging) in CPRS for previous anesthesia records.  Also, if the patient has had an operation within the last calendar month, you can check CPRS.  Occasionally when a case is cancelled (frequently at the VA), someone has done a pre-op already and it’s accessible in Innovian.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Post-op Orders will be placed by your attending.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The VA is the only site with IV Acetaminophen (and albumin) at your disposal.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Pharmacy </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The Omnicell in the OR has most of the medications you will need, including narcotics.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Any Omnicell can be accessed with your same codes.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The wasting process is different than at the other hospitals; make sure you waste with your attending ASAP (most prefer to do so right before extubation or leaving the room) so as not to get things mixed up. Even if you use all the controlled drugs that you pull up, the amount of each that was given still needs to be entered into the Omnicell (does not need to be witnessed by an attending if everything was given and nothing needs to be wasted). Have the attending walk you through this the first time.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Equipment and most medications for peripheral nerve blocks are in the block cart and nearby cabinets in pre-op.  Code for the block cart and the blue cart in room is 1-2-3-4.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The OR pharmacy is not as available or efficient as the other hospitals. If you are going to need a special infusion for a case the following day (eg. Octreotide), let them know the day before the case.  You can Vocera “OR Pharmacist” to ask for special meds or drips.  They typically will deliver them to the room.  They are usually gone during lunch and for the day by about 3:00 pm and are not there on weekends.  There is an Omnicell in the sterile core with various medications like antibiotics/Heparin SQ that the circulator nurse can access for you.  There is an additional Omnicell in the anesthesia work room with more “fancy” anesthesia medications (vasoactive drugs, etc). Of course, you have access to all these Omnicells and can remove medications on your own when you are not in the OR. Look at both of these during your first week to get a sense of their contents.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There is a refrigerator in the anesthesia workroom with phenylephrine gtts, insulin, and cisatracurium.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You will make your own precedex infusions (except for cardiac cases). Precedex is available in the Pyxis in the Tech room and in most ORs. If your patient is going to the ICU on gtts, Vocera “OR Pharmacist” to have them make you a drip, otherwise the ICU has to dispose of them after arrival because they are not sterile.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Nitroglycerin is in the Pyxis in the tech room.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Call & Weekends</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Call at the VA is HOME CALL. Your cell phone number will appear on AMION (pw: VADEN) the day you are on call. It’s also worth making sure the nurses of patients with epidurals have the correct number when you tuck them in for the night.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">When you are on call, you may receive calls regarding catheters/patients during the day. Your number is listed on AMION (the call system) for that day and night, meaning sometimes you get random calls asking about anesthesia things. If you are in the OR, just let your attending know the situation and they will help orchestrate a solution.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Get a copy of the call schedule from the bulletin board at the beginning of each month- it has phone numbers for all the attendings.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">First: The surgery resident will call you when a case needs to go at night or on the weekend.  Your involvement in this step is essential for preventing delays.  Ask about any major medical problems, vitals, and lab abnormalities.  Depending on the case, this is the time to make sure the surgery resident has ordered appropriate blood products.  It is also important to make sure the resident has spoken to the surgery attending (this ensures that the patient actually needs surgery, and that you won’t have to wait an hour for the attending to show up to the hospital).  Some surgical residents will call just for a “heads up” about a possible case- clarify their intentions. You also need to make sure that the surgery resident has called the nursing supervisor to mobilize the OR staff (the surgery resident should do this! Do NOT let them try to make this your job.)  Finally, ask which OR the nursing supervisor is planning to use, so that you know which one to set up once you arrive. If this is not clear and you have a big set-up, begin setting up an OR and let the team know which OR you have set-up.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Second: Only call your attending about cases that are WITHOUT A DOUBT going to the OR.  They do NOT want to hear about possibilities for later.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You are expected to be within 30 minutes of the hospital while on call, and ready within 60 minutes for a case start.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Rarely, you will get calls for ED anesthesia or difficult airways.  These should be immediately discussed with the attending (do not come in first).  When in doubt, call your attending in this situation.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Try to clean up your anesthesia machine after night/weekend cases (pick up monitors, throw away drugs, etc.). All drugs not stocked by pharmacy need to be removed from your work area at the end of the day.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Weekend call is also Home Call.  You are expected to come in each day to round on ANY catheters and epidurals that were placed during the week.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">On-call Acute Pain Service: Consider showing up to the hospital around 09:00 on weekend days, so that you can evaluate patients and be able to pull catheters without issues involving their heparin dosing.  You may need to come into the hospital to troubleshoot epidurals, especially if a pulm/critical care attending is covering the SICU.  Do NOT try to work through issues over the phone, unless an anesthesia intensivist is involved.  When in doubt, drive in to go see the patient.  Call attendings with any issues (while they will get annoyed by phone calls about “possible” OR cases, they expect phone calls about issues with catheters).  Note that calling an attending with trouble-shooting questions is probably an indication for you to physically be at the hospital (an anticoagulation question is a common exception to this rule).  As you get more comfortable with the process and various attendings, you will likely just send them text messages with updates on the weekends.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">In general, Anesthesia is not responsible for intubations/codes outside of the OR. There are some circumstances when we do get involved. If you have any questions, call your attending.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Random Tips</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There are new Drager anesthesia machines at the VA now different from any machines at UCH, CHCO, or DH.  Ask a tech to go through the machine check with you.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Don’t leave any drugs out on the carts.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Don’t forget to utilize your classmates that have recently rotated at the VA, things change frequently, and they are an invaluable resource.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Check, re-check, triple check that your codes, badge, access is rolling before Day 1 start- this system is a quagmire, but you will emerge victorious if you are persistent!</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There often are anesthesia lockers available that get rotated through the residents there.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Lactation Rooms at RMR VAMC:  </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Location: K2-104 (No fridge), K3-104 (fridge) and DS-144 (fridge)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">RMR VAMC Code: 3265</p>",
  "ob-cookbook": "<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">Adapted from the <a href=\"https://olucdenver-my.sharepoint.com/:w:/g/personal/elijah_christensen_cuanschutz_edu/ERXAtW5cg7xDhUwT6gpvMQoBkygnnDVeeKJCY-CWoGyeUA?e=aAc7ss\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">CU OB Anesthesia Cookbook 2023</a></div>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Patients come into the hospital once they begin the <em>active</em> part of labor. OB anesthesiologists get involved to provide analgesia during both labor, delivery (C-section or vaginal), and post partum</p>\n<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">Labor Analgesia</h1>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Labor can be prolonged and painful, the most flexible option for pain control during labor is a lumbar epidural or a Combined Spinal Epidural (CSE). A lumbar epidural only will need a bolus/load.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">CSE Dosing</h2>\n<div style=\"overflow-x:auto;margin:12px 0;\"><table style=\"width:100%;border-collapse:collapse;font-size:12px;\">\n<tr><th style=\"padding:7px 10px;border:1px solid #E8E5DF;background:#F4F2EE;font-weight:700;text-align:left;\"></th><th style=\"padding:7px 10px;border:1px solid #E8E5DF;background:#F4F2EE;font-weight:700;text-align:left;\">Opiate</th><th style=\"padding:7px 10px;border:1px solid #E8E5DF;background:#F4F2EE;font-weight:700;text-align:left;\">Local</th></tr>\n<tr><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">0cm - 4cm _or_<br>\"walking PCEA\"</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">Fent 10-25mcg or<br>Sufent 2.5-mcg</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">None</td></tr>\n<tr><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">4cm - 8cm</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">Fent 10-25mcg</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">0.5mL of B0.25%</td></tr>\n<tr><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">8cm - 10cm</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">Fent 10-25mcg</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">1.0mL of B0.25%</td></tr>\n</table></div>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Always draw up spinal dose before skin local in the following order: Bupi -> Morphine -> Fent</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Epidural only</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Bupi 0.125%</strong> + <strong>Fent 5mcg/mL</strong></li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Can use Bupi 0.25% may be used in advanced labor but will cause motor block and needs attending approval</p>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">PCEA settings</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Stock concentration is <strong>Ropi 0.1%</strong> + <strong>Fent 2mcg/mL</strong></li>\n</ul>\n<div style=\"overflow-x:auto;margin:12px 0;\"><table style=\"width:100%;border-collapse:collapse;font-size:12px;\">\n<tr><th style=\"padding:7px 10px;border:1px solid #E8E5DF;background:#F4F2EE;font-weight:700;text-align:left;\"></th><th style=\"padding:7px 10px;border:1px solid #E8E5DF;background:#F4F2EE;font-weight:700;text-align:left;\"><strong>Basal</strong></th><th style=\"padding:7px 10px;border:1px solid #E8E5DF;background:#F4F2EE;font-weight:700;text-align:left;
