// ─── SUPABASE HELPERS ─────────────────────────────────────────────────────────
async function dbGet(table, col, val){
  const q = val!==undefined ? sb.from(table).select('*').eq(col,val) : sb.from(table).select('*');
  const {data,error} = await q;
  if(error) console.error('dbGet',table,error);
  return data||[];
}
async function dbUpsert(table, row){
  const {error} = await sb.from(table).upsert(row);
  if(error) console.error('dbUpsert',table,error);
}
async function dbDelete(table, col, val){
  const {error} = await sb.from(table).delete().eq(col,val);
  if(error) console.error('dbDelete',table,error);
}
async function dbSet(key, value){
  await sb.from('settings').upsert({key, value: JSON.stringify(value)});
}
async function dbGetSetting(key, def){
  const {data} = await sb.from('settings').select('value').eq('key',key).single();
  if(!data) return def;
  try{return JSON.parse(data.value);}catch{return def;}
}

// ─── PERSIST (Supabase-backed) ────────────────────────────────────────────────
async function persist(key, val){
  S[key] = val;
  draw();
  if(key==='courses'){
    // Store each course as a row
    await Promise.all(val.map(c => dbUpsert('courses', {id:c.id, data:c})));
  } else if(key==='residents'){
    await Promise.all(val.map(r => dbUpsert('residents', {
      id:r.id, name:r.name, year:r.year, chief:!!r.chief, enrolled:r.enrolled, email:r.email||'', phone:r.phone||''
    })));
  } else if(key==='events'){
    // Full replace: delete all then insert
    await sb.from('events').delete().neq('id','___');
    if(val.length) await sb.from('events').insert(val.map(e=>{
      return {id:String(e.id), title:e.title, date:e.date, time:e.time||'', type:e.type||'Lecture'};
    }));
  } else if(key==='icsUrl'){
    await dbSet('icsUrl', val);
  } else if(key==='kudos'){
    // kudos are appended individually — see submitKudos
  }
}

// ─── HTML ESCAPING ────────────────────────────────────────────────────────────
// Escape user-supplied text before interpolating into innerHTML strings, to
// prevent stored-XSS via free-text fields (kudos messages, suggestions, etc.).
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function detectType(url){
  if(!url)return'other';
  if(/youtube\.com\/watch|youtu\.be\//.test(url))return'youtube';
  if(/docs\.google\.com\/presentation/.test(url))return'gslides';
  if(/drive\.google\.com|docs\.google\.com/.test(url))return'gdrive';
  if(/open\.spotify\.com\/(episode|show|track)/.test(url))return'spotify';
  if(/sharepoint\.com|onedrive\.live|1drv\.ms/.test(url))return'sharepoint';
  if(/accrac\.com|buzzsprout\.com|podbean\.com|simplecast\.com|transistor\.fm|anchor\.fm|spreaker\.com|soundcloud\.com|pinecast\.com|captivate\.fm|podcasts\.apple\.com|podcast\.apple\.com/.test(url))return'podcast';
  if(/\.pdf($|\?)/.test(url))return'pdf';
  return'other';
}
function buildEmbed(url,type){
  try{
    if(type==='youtube'){const m=url.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);if(m)return`https://www.youtube.com/embed/${m[1]}?rel=0&modestbranding=1`;}
    if(type==='gslides'){const m=url.match(/\/presentation\/d\/([^/]+)/);if(m)return`https://docs.google.com/presentation/d/${m[1]}/embed?start=false&loop=false`;}
    if(type==='gdrive'){const m=url.match(/\/d\/([^/]+)/);if(m)return`https://drive.google.com/file/d/${m[1]}/preview`;if(url.includes('/preview'))return url;}
    if(type==='spotify'){const m=url.match(/open\.spotify\.com\/(episode|show|track)\/([a-zA-Z0-9]+)/);if(m)return`https://open.spotify.com/embed/${m[1]}/${m[2]}?utm_source=generator`;}
    if(type==='podcast'&&url.includes('accrac.com')){
      // ACCRAC WordPress embed — just append /embed/ to episode URL
      return url.replace(/\/+$/,'')+'/embed/';
    }
    if(type==='pdf')return url;
    if(type==='upload')return url; // base64 data URL stored in IndexedDB
  }catch{}return null;
}

    if(alreadySubmitted) return `

// ─── MODULE MANAGEMENT ────────────────────────────────────────────────────────
function showEditModule() { S.editingModule = true; draw(); }

async function saveModuleEdits() {
  const c = getCourse(), m = getMod();
  if(!c || !m) return;
  const title     = document.getElementById('em-title')?.value.trim();
  const faculty   = document.getElementById('em-faculty')?.value.trim();
  const date      = document.getElementById('em-date')?.value.trim();
  const week      = parseInt(document.getElementById('em-week')?.value) || m.week;
  const subspec   = document.getElementById('em-subspec')?.value.trim();
  const tags      = (document.getElementById('em-tags')?.value||'').split(',').map(x=>x.trim()).filter(Boolean);
  const advanced  = document.getElementById('em-advanced')?.value.trim();
  const reading   = document.getElementById('em-reading')?.value.trim();
  if(!title) { alert('Title is required.'); return; }
  const updMod = {...m, title, faculty, date, week, subspecialty:subspec, tags, advanced, reading, speakerConfirmed: faculty ? true : m.speakerConfirmed};
  const updCourse = {...c, modules: c.modules.map(x => x.id===m.id ? updMod : x)};
  S.courses = S.courses.map(x => x.id===c.id ? updCourse : x);
  S.editingModule = false;
  await persist('courses', S.courses);
}

async function deleteModule() {
  const c = getCourse(), m = getMod();
  if(!c || !m) return;
  S._confirmFn = async () => {
    const updCourse = {...c, modules: c.modules.filter(x => x.id !== m.id)};
    S.courses = S.courses.map(x => x.id===c.id ? updCourse : x);
    await persist('courses', S.courses);
    go('course');
  };
  S.modal = {type:'confirm', data:{title:`Delete "${m.title}"?`, msg:'This will permanently delete this module and all its content. This cannot be undone.'}};
  draw();
}

async function addModuleBelow() {
  const c = getCourse(), m = getMod();
  if(!c || !m) return;
  const newMod = {
    id: Date.now(),
    week: (m.week || 1) + 1,
    title: 'New Module',
    faculty: '',
    date: '',
    subspecialty: '',
    reading: '',
    advanced: '',
    tags: [],
    content: [],
    completed: false
  };
  const idx = c.modules.findIndex(x => x.id === m.id);
  const newModules = [...c.modules.slice(0, idx+1), newMod, ...c.modules.slice(idx+1)];
  const updCourse = {...c, modules: newModules};
  S.courses = S.courses.map(x => x.id===c.id ? updCourse : x);
  await persist('courses', S.courses);
  S.editingModule = true;
  openMod(newMod.id);
}


// ─── COURSE MANAGEMENT ────────────────────────────────────────────────────────
function showEditCourse() { S.editingCourse = true; draw(); }

async function saveCourseEdits() {
  const c = getCourse();
  if(!c) return;
  const title    = document.getElementById('ec-title')?.value.trim();
  const subtitle = document.getElementById('ec-subtitle')?.value.trim();
  const icon     = document.getElementById('ec-icon')?.value.trim() || '📋';
  const category = document.getElementById('ec-cat')?.value.trim();
  if(!title) { alert('Title is required.'); return; }
  const updCourse = {...c, title, subtitle, icon, category};
  S.courses = S.courses.map(x => x.id===c.id ? updCourse : x);
  S.editingCourse = false;
  await persist('courses', S.courses);
}

async function deleteCourse() {
  const c = getCourse();
  if(!c) return;
  S._confirmFn = async () => {
    S.courses = S.courses.filter(x => x.id !== c.id);
    await persist('courses', S.courses);
    go('courses');
  };
  S.modal = {type:'confirm', data:{title:`Delete "${c.title}"?`, msg:'This will permanently delete this entire course and ALL its modules. This cannot be undone.'}};
  draw();
}

async function addNewCourse() {
  const newCourse = {
    id: Date.now(),
    icon: '📋',
    title: 'New Course',
    subtitle: '',
    category: 'New',
    modules: []
  };
  S.courses = [...S.courses, newCourse];
  await persist('courses', S.courses);
  S.editingCourse = true;
  openCourse(newCourse.id);
}

async function addNewModule() {
  const c = getCourse();
  if(!c) return;
  const newMod = {
    id: Date.now(),
    week: (c.modules.length > 0 ? Math.max(...c.modules.map(m => m.week||0)) : 0) + 1,
    title: 'New Module',
    faculty: '',
    date: '',
    subspecialty: '',
    reading: '',
    advanced: '',
    tags: [],
    content: [],
    completed: false
  };
  const updCourse = {...c, modules: [...c.modules, newMod]};
  S.courses = S.courses.map(x => x.id===c.id ? updCourse : x);
  await persist('courses', S.courses);
  S.editingModule = true;
  openMod(newMod.id);
}

// ─── CALENDAR ─────────────────────────────────────────────────────────────────
function pgCalendar(){
  const icsReady = (S.icsEvents||[]).length > 0;
  const hasUrl   = !!(S.icsUrl||'').trim();
  const fetching = !!S.icsFetching;

  // Merge: ICS events take over if connected, otherwise fall back to manual events
  const allEvents = icsReady ? S.icsEvents : S.events;
  const y=S.calYear, m=S.calMonth;
  const days=new Date(y,m+1,0).getDate();
  const first=new Date(y,m,1).getDay();
  const mName=new Date(y,m).toLocaleString('default',{month:'long'});
  const evForDay=d=>allEvents.filter(e=>{const ed=new Date(e.date+'T00:00:00');return ed.getFullYear()===y&&ed.getMonth()===m&&ed.getDate()===d;});
  const upcoming=[...allEvents].filter(e=>new Date(e.date+'T00:00:00')>=new Date()).sort((a,b)=>new Date(a.date)-new Date(b.date));

  let grid=['S','M','T','W','T','F','S'].map(d=>`<div style="text-align:center;font-size:10px;font-weight:700;color:#bbb;padding:4px 0;">${d}</div>`).join('');
  for(let i=0;i<first;i++)grid+='<div></div>';
  for(let d=1;d<=days;d++){
    const evs=evForDay(d),isSel=S.calSel===d,isToday=d===3&&m===2&&y===2026;
    grid+=`<div onclick="calSel(${d})" style="aspect-ratio:1;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:12px;background:${isToday?'#1B1B1B':isSel?'#FAF3DF':'transparent'};color:${isToday?'#CFB87C':'#1a1a1a'};border:1.5px solid ${isSel?'#A8924A':'transparent'};font-weight:${isToday||isSel?700:400};">${d}${evs.length?`<div style="display:flex;gap:2px;margin-top:1px;">${evs.slice(0,3).map(()=>`<div style="width:3px;height:3px;border-radius:50%;background:${isToday?'#CFB87C':'#A8924A'};"></div>`).join('')}</div>`:''}</div>`;
  }

  const selH=S.calSel&&evForDay(S.calSel).length?`<div style="margin-top:16px;padding-top:14px;border-top:1px solid #F0EDE8;">
    <div style="${sLbl}margin-bottom:8px;">${mName} ${S.calSel}</div>
    ${evForDay(S.calSel).map(ev=>`<div style="display:flex;gap:10px;padding:8px 0;align-items:flex-start;">
      <div style="width:3px;min-height:32px;border-radius:2px;background:#2D5B9E;flex-shrink:0;margin-top:3px;"></div>
      <div><div style="font-weight:600;font-size:13px;">${ev.title}</div>
      <div style="font-size:11px;color:#aaa;margin-top:2px;">${ev.time||'All day'}${ev.location?' · 📍'+ev.location:''}</div></div>
    </div>`).join('')}
  </div>`:'';

  const upH=upcoming.length?upcoming.map((ev,i)=>{
    const d=new Date(ev.date+'T00:00:00');
    const col=icsReady?'#2D5B9E':(EC[ev.type]||'#555');
    const bg=icsReady?'#EDF1FB':(col+'18');
    return `${i?dvd:''}<div style="display:flex;align-items:center;gap:14px;padding:13px 0;">
      <div style="text-align:center;min-width:44px;background:${icsReady?'#EDF1FB':'#F4F2EE'};border-radius:9px;padding:7px 6px;border:1px solid ${icsReady?'#B8C8E8':'#E8E5DF'};flex-shrink:0;">
        <div style="font-size:9px;font-weight:700;color:${icsReady?'#2D5B9E':'#A8924A'};text-transform:uppercase;">${d.toLocaleString('default',{month:'short'})}</div>

// ─── DRAW ─────────────────────────────────────────────────────────────────────
function draw(){
  let main='';
  // Auth guard — force identity screen if not logged in
  const protectedViews = ['dashboard','courses','course','module','calendar','quizzes','quiz','kudos','notes','podcasts','resources','suggestions','admin'];
  if (!S.activeResidentId && protectedViews.includes(S.view)) {
    S.view = 'identity';
  }
  if(S.view==='loading') main=pgLoading();
  else if(S.view==='identity') main=pgIdentity();
  else if(S.view==='dashboard') main=pgDashboard();
  else if(S.view==='courses') main=pgCourses();
  else if(S.view==='course')  main=pgCourse();
  else if(S.view==='module')  main=pgModule();
  else if(S.view==='calendar') main=pgCalendar();
  else if(S.view==='quizzes') main=pgQuizzes();
  else if(S.view==='quiz') main=pgQuiz();
  else if(S.view==='kudos') main=pgKudos();
  else if(S.view==='notes') main=pgNotes();
  else if(S.view==='podcasts') { try { main=pgPodcasts(); } catch(e) { console.error('pgPodcasts crash:',e); main=`<div style="padding:32px;font-family:monospace;font-size:12px;color:#c00;background:#fff8f8;border-radius:12px;margin:20px;"><strong>Podcasts Error:</strong><br>${e.message}<br><pre style="font-size:11px;margin-top:8px;white-space:pre-wrap;">${(e.stack||'').slice(0,600)}</pre></div>`; } }
  else if(S.view==='resources') { try { main=pgResources(); } catch(e) { console.error('pgResources crash:',e); main=`<div style="padding:32px;font-family:monospace;font-size:12px;color:#c00;background:#fff8f8;border-radius:12px;margin:20px;"><strong>Resources Error:</strong><br>${e.message}<br><pre style="font-size:11px;margin-top:8px;white-space:pre-wrap;">${(e.stack||'').slice(0,600)}</pre></div>`; } }
  else if(S.view==='suggestions') main=pgSuggestions();
  else if(S.view==='admin') main=pgAdminFull();

  // Preserve focus + caret + scroll across the full re-render. The app rebuilds
  // #app.innerHTML on every draw(), which otherwise drops focus and jumps scroll.
  // We capture the focused element by id and restore it after the rewrite.
  const _active = document.activeElement;
  const _focusId = _active && _active.id ? _active.id : null;
  let _selStart=null, _selEnd=null;
  if (_focusId && (_active.tagName==='INPUT' || _active.tagName==='TEXTAREA')) {
    try { _selStart=_active.selectionStart; _selEnd=_active.selectionEnd; } catch(e){}
  }
  const _scrollY = window.scrollY;

  document.getElementById('app').innerHTML=
    hdr()+
    `<main id="main-content">${main}</main>`+
    `<footer style="border-top:1px solid #E8E5DF;padding:12px 16px;display:flex;justify-content:space-between;background:#fff;flex-shrink:0;"><span style="font-size:11px;color:#bbb;">© 2026 University of Colorado · Department of Anesthesiology</span><span style="font-size:11px;color:#bbb;">AnesLearn v6.0</span></footer>`+
    adminPanel()+
    modal();

  // Restore focus/caret/scroll (skip when a modal owns focus, e.g. the PIN box).
  if (_focusId && !S.modal) {
    const el = document.getElementById(_focusId);
    if (el) {
      try {
        el.focus({preventScroll:true});
        if (_selStart!=null && (el.tagName==='INPUT' || el.tagName==='TEXTAREA')) el.setSelectionRange(_selStart, _selEnd);
      } catch(e){}
      window.scrollTo(0, _scrollY);
    }
  }

  if(S.modal?.type==='pin'){const i=document.getElementById('pinInp');if(i)i.focus();}
}

// ─── NOTES ────────────────────────────────────────────────────────────────────
let _noteTimer = null;

function noteChanged(val, key) {
  if(!S._notesDirty) S._notesDirty = {};
  S._notesDirty[key] = val;
  const el = document.getElementById('note-status');
  if(el) el.textContent = 'Unsaved…';
  clearTimeout(_noteTimer);
  _noteTimer = setTimeout(() => saveNote(key, true), 1800);
}

async function saveNote(key, auto=false) {
  const el = document.getElementById('note-area');
  const val = el ? el.value : (S._notesDirty?.[key] ?? '');
  if(!S._notes) S._notes = {};
  S._notes[key] = val;
  if(S._notesDirty) S._notesDirty[key] = val;
  const st = document.getElementById('note-status');
  if(st) st.textContent = 'Saving…';
  try {
    await sb.from('settings').upsert({key, value: JSON.stringify(val)});
    if(st) st.textContent = 'Saved ✓';
    if(!auto) draw(); // re-render to update tab indicator
  } catch(e) {
    if(st) st.textContent = 'Save failed — check connection';
  }
}

async function clearNote(key) {
  if(!confirm('Clear these notes?')) return;
  if(!S._notes) S._notes = {};
  S._notes[key] = '';
  await sb.from('settings').upsert({key, value: JSON.stringify('')});
  draw();
}

async function loadAllNotes(resId) {
  if(!resId) return;
  try {
    const {data} = await sb.from('settings').select('key,value').like('key', `note_${resId}_%`);
    if(!S._notes) S._notes = {};
    (data||[]).forEach(row => {
      try { S._notes[row.key] = JSON.parse(row.value); } catch { S._notes[row.key] = row.value; }
    });
  } catch(e) { console.warn('loadAllNotes:', e); }
}

function exportNotes() {
  const res = getRes();
  if(!res) return;
  const notes = S._notes || {};
  const allCourses = S.courses;
  let lines = [];
  lines.push(`ANESLEARN — PERSONAL NOTES`);
  lines.push(`${res.name} · ${res.year}`);
  lines.push(`Exported: ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}`);
  lines.push('═'.repeat(60));
  let hasAny = false;
  allCourses.forEach(course => {
    const courseNotes = [];
    course.modules.forEach(mod => {
      const key = `note_${res.id}_${mod.id}`;
      const txt = (notes[key] || '').trim();
      if(txt) courseNotes.push({mod, txt});
    });
    if(!courseNotes.length) return;
    hasAny = true;
    lines.push('');
    lines.push(`${course.icon}  ${course.title.toUpperCase()}`);
    lines.push('─'.repeat(60));
    courseNotes.forEach(({mod, txt}) => {
      lines.push('');
      lines.push(`  Week ${mod.week}: ${mod.title}`);

      txt.split('\n').forEach(l => lines.push('  ' + l));
      lines.push('');
    });
  });
  if(!hasAny) { alert('No notes to export yet.'); return; }
  const blob = new Blob([lines.join('\n')], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  a.download = `AnesLearn_Notes_${res.name.replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.txt`;

}

// SHA-256 hex of a string (used for admin PIN verification).
async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function doPin(){

  // seeded on first run (see bootstrap). It is NOT in the page source.
  let ok=false;
  try {
    const stored = await dbGetSetting('admin_pin_hash', '');
    ok = stored && (await sha256Hex(v)) === stored;
  } catch(e){ console.error('doPin', e); }
  if(ok){S.adminUnlocked=true;S.modal=null;S.showAdmin=true;draw();}

}

const VAPID_PUBLIC = 'BIFGZZ9ZfWBPMl1pbGRQ8my_YLShMQbu4Y_jH2HqU8cegRyHZLIw8rxbj8vnehcctf00MhWA4yRD6F3fkVvzEcA';

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

async function checkPushStatus() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      S.pushRegistered = true;
      draw();
    }
  } catch(e) { console.warn('Push check failed:', e); }
}

async function registerPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    alert('Push notifications are not supported in this browser.');
    return;
  }
  try {
    const permission = await Notification.requestPermission();
    if (permission === 'denied') {
      alert('Notifications are blocked. In Safari: go to Safari → Settings → Websites → Notifications, allow this site, then try again.');
      return;
    }
    if (permission !== 'granted') {
      alert('Notification permission was not granted (status: ' + permission + ').');
      return;
    }
    const reg = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC)
    });
    const res = getRes();
    if (res) {
      await dbUpsert('settings', { key: 'push_' + res.id, value: JSON.stringify(sub) });
    }
    S.pushRegistered = true;
    draw();
    alert('✅ Notifications enabled!');
  } catch(e) {
    console.error('Push registration failed:', e);
    alert('Could not enable notifications: ' + (e.message || e));
  }
}

async function unregisterPush() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) await sub.unsubscribe();
    const res = getRes();
    if (res) await dbDelete('settings', 'key', 'push_' + res.id);
    S.pushRegistered = false;
    S.modal = null;
    draw();
  } catch(e) { console.error('Unregister failed:', e); }
}

  if (S.pushRegistered) {

  }

function uploadRosterCSV() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.csv';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    const text = await file.text();
    const parsed = parseRosterCSV(text);
    if (!parsed.length) { alert('No valid rows found. Check your CSV format.'); return; }
    // Show preview before committing
    S.modal = { type: 'rosterPreview', data: { residents: parsed } };
    draw();
  };
  input.click();
}

function parseRosterCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/"/g,''));
  const nameIdx    = headers.findIndex(h => h === 'name');
  const emailIdx   = headers.findIndex(h => h === 'email');
  const yearIdx    = headers.findIndex(h => h === 'year');
  const degreeIdx  = headers.findIndex(h => h === 'degree');
  const chiefIdx   = headers.findIndex(h => h === 'chief');
  const enrollIdx  = headers.findIndex(h => h === 'enrolled');

  if (nameIdx === -1 || emailIdx === -1 || yearIdx === -1) {
    alert('CSV must have name, email, and year columns.');
    return [];
  }

  const results = [];
  for (let i = 1; i < lines.length; i++) {
    // Handle quoted fields
    const cols = lines[i].match(/(".*?"|[^,]+|(?<=,)(?=,)|(?<=,)$|^(?=,))/g) || [];
    const clean = cols.map(c => c.replace(/^"|"$/g,'').trim());
    const name = clean[nameIdx];
    if (!name) continue;
    const enrolledRaw = enrollIdx >= 0 ? (clean[enrollIdx]||'') : '';
    const enrolled = enrolledRaw ? enrolledRaw.split(',').map(x=>parseInt(x.trim())).filter(n=>!isNaN(n)) : [];
    results.push({
      id: 'r' + Date.now() + '_' + i,
      name:    name,
      email:   clean[emailIdx]  || '',
      year:    clean[yearIdx]   || 'CA-1',
      degree:  degreeIdx >= 0 ? (clean[degreeIdx] || 'MD') : 'MD',
      chief:   chiefIdx >= 0 ? (clean[chiefIdx]||'').toLowerCase() === 'true' : false,
      enrolled,
    });
  }
  return results;
}

  if (lines.length < 2) return [];
  // Parse header
  const header = parseCSVLine(lines[0]).map(h => h.trim().toLowerCase());
  const col = name => {
    const aliases = {
      title:    ['subject','title','summary','event'],
      date:     ['start date','date','start','startdate','dtstart'],
      time:     ['start time','time','starttime'],
      end:      ['end date','end','enddate','dtend'],
      type:     ['categories','category','type','label'],
      location: ['location'],
    };
    for (const a of (aliases[name]||[name])) {
      const i = header.indexOf(a);
      if (i !== -1) return i;
    }
    return -1;
  };

  const events = [];
  for (let i = 1; i < lines.length; i++) {
    const cells = parseCSVLine(lines[i]);
    const title = cells[col('title')]?.trim();
    const rawDate = cells[col('date')]?.trim();
    const rawTime = cells[col('time')]?.trim() || '';
    const rawType = cells[col('type')]?.trim() || '';
    if (!title || !rawDate) continue;
    const date = normalizeDate(rawDate);
    if (!date) continue;
    const time = normalizeTime(rawTime);
    const type = mapEventType(rawType);
    events.push({ id: Date.now() + Math.random(), title, date, time, type });
  }
  return events;
}

function parseICS(text) {
  const events = [];
  const vevents = text.split('BEGIN:VEVENT').slice(1);
  for (const block of vevents) {
    const get = key => {
      const m = block.match(new RegExp(key + '[^:]*:([^\r\n]+)'));
      return m ? m[1].trim() : '';
    };
    const summary = get('SUMMARY').replace(/\,/g, ',').replace(/\n/g, ' ');
    const dtstart = get('DTSTART');
    const categories = get('CATEGORIES');
    const location = get('LOCATION');
    if (!summary || !dtstart) continue;
    const date = parseICSDate(dtstart);
    const time = parseICSTime(dtstart);
    if (!date) continue;
    events.push({ id: Date.now() + Math.random(), title: summary, date, time, type: mapEventType(categories) });
  }
  return events;
}

function parseCSVLine(line) {
  const result = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQ = !inQ; }
    else if (ch === ',' && !inQ) { result.push(cur); cur = ''; }
    else cur += ch;
  }
  result.push(cur);
  return result;
}

function normalizeDate(raw) {
  if (!raw) return null;
  // MM/DD/YYYY or M/D/YYYY
  let m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  // YYYY-MM-DD
  m = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  // DD-Mon-YYYY
  m = raw.match(/^(\d{1,2})-([A-Za-z]+)-(\d{4})$/);
  if (m) {
    const months = {jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
    const mon = months[m[2].toLowerCase().slice(0,3)];
    if (mon) return `${m[3]}-${mon}-${m[1].padStart(2,'0')}`;
  }
  return null;
}

function normalizeTime(raw) {
  if (!raw) return '';
  // Already formatted like "3:30 PM"
  const m = raw.match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  if (!m) return raw;
  let h = parseInt(m[1]), min = m[2], ampm = (m[3]||'').toUpperCase();
  if (!ampm) ampm = h < 12 ? 'AM' : 'PM';
  if (ampm === 'PM' && h < 12) h += 12;
  if (ampm === 'AM' && h === 12) h = 0;
  const disp = (h % 12 || 12) + ':' + min + ' ' + (h < 12 ? 'AM' : 'PM');
  return disp;
}

function parseICSDate(dtstart) {
  const m = dtstart.match(/(\d{4})(\d{2})(\d{2})/);
  return m ? `${m[1]}-${m[2]}-${m[3]}` : null;
}

function parseICSTime(dtstart) {
  const m = dtstart.match(/T(\d{2})(\d{2})/);
  if (!m) return '';
  let h = parseInt(m[1]), min = m[2];
  return (h % 12 || 12) + ':' + min + ' ' + (h < 12 ? 'AM' : 'PM');
}

function mapEventType(raw) {
  if (!raw) return 'Event';
  const r = raw.toLowerCase();
  if (/lecture|grand round|talk|didactic|conference/.test(r)) return 'Lecture';
  if (/workshop|lab|hands.on|skill/.test(r)) return 'Workshop';
  if (/sim|simulation/.test(r)) return 'Simulation';
  if (/deadline|due|exam|test|quiz/.test(r)) return 'Deadline';
  return 'Event';
}

function saveICS(){
  const url = document.getElementById('ics_url')?.value?.trim()||'';
  persist('icsUrl', url);
  if(url){ S.showAdmin=false; fetchICS(); }
  else draw();
}
function clearICS(){ S.icsUrl=''; S.icsEvents=[]; saveL('al6_ics',''); draw(); }

async function fetchICS(){
  const url = (S.icsUrl||'').trim();
  if(!url){ draw(); return; }
  S.icsFetching=true; draw();
  try {
    // Try direct fetch first, fall back to CORS proxy
    let text = null;
    const proxies = [
      url,  // direct (works if server has CORS headers or app is served, not file://)
      `https://corsproxy.io/?${encodeURIComponent(url)}`,
      `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    ];
    for(const src of proxies){
      try {
        const res = await fetch(src, {cache:'no-store'});
        if(res.ok){ text = await res.text(); break; }
      } catch(e){ continue; }
    }
    if(text && text.includes('BEGIN:VCALENDAR')){
      const events = parseICS(text);
      S.icsEvents = events;
      S.icsLastFetched = Date.now();
      saveL('al6_ics_cache', {events, fetched: S.icsLastFetched});
    } else {
      // Try loading from cache
      const cached = loadL('al6_ics_cache', null);
      if(cached){ S.icsEvents=cached.events; S.icsLastFetched=cached.fetched; }
      if(!text) alert('Could not fetch Outlook ICS feed. This is usually a CORS restriction when running as a local HTML file.\n\nTry opening the app via a local web server:\n  python3 -m http.server\nThen visit http://localhost:8000');
    }
  } catch(e){
    const cached = loadL('al6_ics_cache', null);
    if(cached){ S.icsEvents=cached.events; S.icsLastFetched=cached.fetched; }
  }
  S.icsFetching=false; draw();
}



// ─── INDEXED DB — PDF STORAGE ─────────────────────────────────────────────────
const DB_NAME = 'AnesLearnDB', DB_VER = 2, STORE = 'pdfs';
let _db = null;

function openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => { const d = e.target.result; if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, {keyPath: 'id'}); };
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror = () => reject(req.error);
  });
}

async function idbSave(id, dataUrl, name) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put({id, dataUrl, name});
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

async function idbGet(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const req = db.transaction(STORE,'readonly').objectStore(STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function idbDelete(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

// Upload a PDF file, store in IndexedDB, attach to current module
async function uploadPDF() {
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'application/pdf';
  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    if (!file) return;
    if (file.type !== 'application/pdf') { alert('Please select a PDF file.'); return; }

    // Show loading state
    const btn = document.getElementById('uploadPdfBtn');
    if (btn) { btn.textContent = 'Uploading…'; btn.disabled = true; }

    const reader = new FileReader();
    reader.onload = async e => {
      const dataUrl = e.target.result;
      const sizeMB = (dataUrl.length * 0.75 / 1024 / 1024).toFixed(1);
      const label = document.getElementById('ct_label')?.value?.trim() || file.name.replace(/\.pdf$/i,'');
      const id = 'pdf_' + Date.now();

      try {
        await idbSave(id, dataUrl, file.name);
        // Set the form fields so saveCt picks it up
        const labelEl = document.getElementById('ct_label');
        const urlEl   = document.getElementById('ct_url');
        const typeEl  = document.getElementById('ct_type');
        if (labelEl && !labelEl.value.trim()) labelEl.value = file.name.replace(/\.pdf$/i,'');
        if (urlEl)  urlEl.value  = id;   // store the IDB key as the "url"
        if (typeEl) typeEl.value = 'upload';
        const hint = document.getElementById('ct_hint');
        if (hint) {
          hint.textContent = `✓ PDF stored locally (${sizeMB} MB) — click Attach to save`;
          hint.style.color = '#2D7D4F';
        }
      } catch(err) {
        alert('Failed to store PDF: ' + err.message);
      }
      if (btn) { btn.textContent = '📎 Upload PDF'; btn.disabled = false; }
    };
    reader.readAsDataURL(file);
  };
  fileInput.click();
}

// Open a stored PDF in a new tab (for the ↗ button)
async function openStoredPDF(id) {
  try {
    const rec = await idbGet(id);
    if (!rec) { alert('PDF not found in local storage. It may have been cleared.'); return; }
    const blob = dataURLToBlob(rec.dataUrl);
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  } catch(e) { alert('Could not open PDF: ' + e.message); }
}

function dataURLToBlob(dataUrl) {
  const [header, data] = dataUrl.split(',');
  const mime = header.match(/:(.*?);/)[1];
  const bytes = atob(data);
  const arr = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  return new Blob([arr], {type: mime});
}

// Render a stored PDF inside an iframe using a blob URL
// Called after pgModule renders — attaches blob URL to iframe
async function renderStoredPDF(iframeId, idbKey) {
  try {
    const rec = await idbGet(idbKey);
    if (!rec) return;
    const blob = dataURLToBlob(rec.dataUrl);
    const url = URL.createObjectURL(blob);
    const iframe = document.getElementById(iframeId);
    if (iframe) iframe.src = url;
  } catch(e) { console.error('renderStoredPDF:', e); }
}

// Delete PDF from IndexedDB when content item is removed
async function deleteStoredPDF(idbKey) {
  try { await idbDelete(idbKey); } catch(e) {}
}

async function setQuizRotation(id, rotation) {

async function handleQuizFiles(files) {
  if (!files.length) return;
  S.modal = { type: 'quizUploading', data: { total: files.length, done: 0, errors: [] } };
  draw();
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    try {
      const arrayBuffer = await file.arrayBuffer();
      const docxBytes = Array.from(new Uint8Array(arrayBuffer));
      const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer.slice(0) });
      const questions = await parseQuizWithAI(result.value);
      await dbUpsert('quizzes', {
        id: 'quiz_' + Date.now() + '_' + i,
        name: file.name.replace(/\.docx$/i, ''),
        questions: questions,
        docx_bytes: docxBytes,
        attempts: 0
      });
    } catch(e) {
      S.modal.data.errors.push(file.name + ': ' + e.message);
    }
    S.modal.data.done = i + 1;
    draw();
  }
  const qrows = await dbGet('quizzes');
  S.quizzes = qrows.map(q=>({...q, docxBytes:q.docx_bytes}));
  S.modal = null;
  draw();
}

function parseQuizWithAI(text) {
  // Parse locally — no API call needed
  return Promise.resolve(parseQuizLocally(text));
}

function parseQuizLocally(text) {
  const questions = [];
  // Split on numbered question patterns: "1." "1)" "Q1." "Question 1"
  const lines = text.split(/\n/).map(l => l.trim()).filter(l => l);
  let currentQ = null;
  const qPattern = /^(?:Q(?:uestion)?\s*)?\d+[.):]\s+(.+)/i;

  for (const line of lines) {
    const match = line.match(qPattern);
    if (match) {
      if (currentQ) questions.push(currentQ);
      currentQ = { q: match[1], answer: '' };
    } else if (currentQ && line.length > 0) {
      // If line doesn't look like a new question number, treat as continuation
      if (!line.match(/^\d+[.)]/)) {
        currentQ.q += ' ' + line;
      }
    }
  }
  if (currentQ) questions.push(currentQ);

  // If numbered pattern found nothing, try splitting on blank lines
  // and treat each non-empty paragraph as a question
  if (!questions.length) {
    const paras = text.split(/\n\s*\n/).map(p => p.replace(/\n/g,' ').trim()).filter(p => p.length > 20);
    return paras.map(p => ({ q: p, answer: '' }));
  }
  return questions;
}

  const bytes = quiz.docxBytes || quiz.docx_bytes;
  if (!quiz || !bytes) { alert('Original file not available.'); return; }
  const blob = new Blob([new Uint8Array(bytes)], {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = quiz.name + '.docx'; a.click();
  URL.revokeObjectURL(url);
}

async function submitKudos() {
  const recipientId = document.getElementById('kudos_recipient')?.value;
  const badgeId     = document.querySelector('input[name="kudos_badge"]:checked')?.value;
  const message     = document.getElementById('kudos_message')?.value?.trim();

  if (!recipientId) { alert('Please select a recipient.'); return; }
  if (!badgeId)     { alert('Please select a badge.'); return; }
  if (!message)     { alert('Please write a short note.'); return; }
  if (message.length > 280) { alert('Keep it under 280 characters.'); return; }

  const recipient  = S.residents.find(r => r.id === recipientId);
  const badge      = KUDOS_BADGES.find(b => b.id === badgeId);
  const giver      = getRes();
  const giverName  = giver?.name || 'A colleague';
  const firstName  = (recipient?.name || '').split(' ')[0] || 'there';

  const kudo = {
    id:             'k_' + Date.now(),
    from_id:        S.activeResidentId,
    recipient_id:   recipientId,
    recipient_name: recipient?.name || 'Unknown',
    badge_id:       badgeId,
    badge_emoji:    badge?.emoji || '⭐',
    badge_label:    badge?.label || '',
    message,
    ts:             Date.now(),
  };

  await dbUpsert('kudos', kudo);

  // Send email + SMS to recipient
  try {
    const recipientEmail = recipient?.email;
    const recipientPhone = recipient?.phone;
    const resendKey = await dbGetSetting('resend_api_key', '');
    const emailFrom = await dbGetSetting('email_from', 'AnesLearn <noreply@cuaneslearn.com>');
    const twilioSid  = await dbGetSetting('twilio_sid', '');
    const twilioToken = await dbGetSetting('twilio_token', '');
    const twilioFrom = await dbGetSetting('twilio_from', '');

    // Email
    if (resendKey && recipientEmail) {
      await fetch('https://api.resend.com/emails', {
        method: 'POST',
        headers: {'Content-Type':'application/json','Authorization':'Bearer '+resendKey},
        body: JSON.stringify({
          from: emailFrom,
          to: [recipientEmail],
          subject: `${badge?.emoji || '⭐'} ${giverName} sent you a K-Hole Kudo!`,
          html: `<div style="font-family:sans-serif;max-width:500px;margin:0 auto;background:#1B1B1B;border-radius:14px;overflow:hidden;">
            <div style="background:#CFB87C;padding:20px 24px;text-align:center;">
              <div style="font-size:48px;">${badge?.emoji || '⭐'}</div>
              <div style="font-size:18px;font-weight:800;color:#1B1B1B;margin-top:8px;">K-Hole Kudos</div>
            </div>
            <div style="padding:24px;color:#fff;">
              <p style="font-size:16px;margin:0 0 12px;">Hey ${esc(firstName)},</p>
              <p style="font-size:15px;margin:0 0 16px;color:#CFB87C;font-weight:700;">${badge?.emoji} ${badge?.label}</p>
              <p style="font-size:15px;margin:0 0 20px;line-height:1.6;">${esc(message)}</p>
              <p style="font-size:13px;color:rgba(255,255,255,.5);margin:0;">— Sent anonymously via AnesLearn K-Hole Kudos</p>
            </div>
          </div>`
        })
      });
    }

    // SMS via Twilio
    if (twilioSid && twilioToken && twilioFrom && recipientPhone) {
      const smsBody = `${badge?.emoji || '⭐'} K-Hole Kudos!\n\n${badge?.label}\n\n"${message}"\n\n— Sent anonymously via AnesLearn`;
      const formData = new URLSearchParams({
        From: twilioFrom,
        To: recipientPhone,
        Body: smsBody
      });
      await fetch(`https://api.twilio.com/2010-04-01/Accounts/${twilioSid}/Messages.json`, {
        method: 'POST',
        headers: {
          'Authorization': 'Basic ' + btoa(twilioSid + ':' + twilioToken),
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: formData
      });
    }
  } catch(emailErr) { console.warn('Kudos notification failed:', emailErr); }

  // Reload kudos from DB
  const rows = await dbGet('kudos');
  S.kudos = rows.sort((a,b)=>b.ts-a.ts).map(k=>({
    ...k, recipientId:k.recipient_id, recipientName:k.recipient_name,
    badgeId:k.badge_id, badgeEmoji:k.badge_emoji, badgeLabel:k.badge_label
  }));
  S.modal = { type: 'kudosSent', data: { kudo: {...kudo, recipientName:kudo.recipient_name, badgeEmoji:kudo.badge_emoji, badgeLabel:kudo.badge_label} } };
  draw();
}

async function saveResourceItem(key, showFlag) {
  var label = (document.getElementById('rai-label') || {}).value || '';
  var url   = (document.getElementById('rai-url')   || {}).value || '';
  var desc  = (document.getElementById('rai-desc')  || {}).value || '';
  label = label.trim(); url = url.trim(); desc = desc.trim();
  if (!label || !url) { alert('Name and URL required.'); return; }
  var stateKey = key === 'admin_resources' ? 'adminResources' : key === 'rotation_resources' ? 'rotationResources' : 'professionalResources';
  var resources = (S[stateKey] || []).concat([{label: label, url: url, desc: desc}]);
  S[stateKey] = resources;
  await sb.from('settings').upsert({key: key, value: JSON.stringify(resources)});
  S[showFlag] = false;
  draw();
}

async function deleteResourceItem(key, showFlag, idx) {
  if (!confirm('Remove this resource?')) return;
  var stateKey = key === 'admin_resources' ? 'adminResources' : key === 'rotation_resources' ? 'rotationResources' : 'professionalResources';
  var resources = (S[stateKey] || []).filter(function(_, i) { return i !== idx; });
  S[stateKey] = resources;
  await sb.from('settings').upsert({key: key, value: JSON.stringify(resources)});
  draw();
}

            id: 'mod_'+item.id, label: item.label, url: item.url, type: item.type});

  // Standalone podcasts (admin-uploaded directly to this page)
  const standalone = (S.podcastLibrary || []).map(p => ({
    source: p.source || 'standalone', course:null, mod:null, item:p,
    id: 'sa_'+p.id, label:p.label, url:p.url, type:p.type,
    description: p.description||'', tags: p.tags||''

  const allEpisodes = [...standalone, ...moduleEpisodes];

function podcastUrlHint(url) {
  const el = document.getElementById('pc-url-hint');
  if(!el) return;
  const t = detectType(url);
  if(!url) { el.textContent=''; return; }
  if(t==='spotify') el.textContent='✓ Spotify detected — will embed inline';
  else if(t==='podcast') el.textContent='✓ Podcast host detected — will open in external player';
  else el.textContent='⚠ Unrecognized host — will open in external player';
  el.style.color = (t==='spotify'||t==='podcast') ? '#2D7D4F' : '#B87C2D';
}

async function deletePodcastFolder(folder) {
  const eps = (S.podcastLibrary||[]).filter(ep => {
    if (ep.url && ep.url.includes('accrac.com')) return ep.source === folder;
    if (ep.source && ep.source !== 'module' && ep.source !== 'standalone') return ep.source === folder;
    if (ep.url && ep.url.includes('spotify.com')) return folder === 'Spotify' && (!ep.source || ep.source === 'standalone');
    return folder === 'Other';
  });
  if (!eps.length) return;
  S._confirmFn = async () => {
    const lib = (S.podcastLibrary||[]).filter(ep => {
      if (ep.url && ep.url.includes('accrac.com')) return ep.source !== folder;
      if (ep.source && ep.source !== 'module' && ep.source !== 'standalone') return ep.source !== folder;
      if (ep.url && ep.url.includes('spotify.com')) return !(folder === 'Spotify' && (!ep.source || ep.source === 'standalone'));
      return folder !== 'Other';
    });
    S.podcastLibrary = lib;
    await dbSet('podcast_library', lib);
    draw();
  };
  S.modal = {type:'confirm', data:{title:'Delete "' + folder + '" folder?', msg:'This will permanently remove all ' + eps.length + ' episodes in this folder. This cannot be undone.'}};
  draw();
}


async function deletePodcastItem(epId) {
  S._confirmFn = async () => {
    const lib = (S.podcastLibrary||[]).filter(p => p.id !== epId);
    S.podcastLibrary = lib;
    await sb.from('settings').upsert({key:'podcast_library', value: JSON.stringify(lib)});
    draw();
  };
  S.modal = {type:'confirm', data:{title:'Remove podcast?', msg:'This will remove it from the library. Module-linked episodes are not affected.'}};
  draw();
}

async function getSpotifyToken() {
  const clientId     = await dbGetSetting('spotify_client_id', '');
  const clientSecret = await dbGetSetting('spotify_client_secret', '');
  if (!clientId || !clientSecret) {
    throw new Error('Spotify credentials not configured. Add spotify_client_id and spotify_client_secret to Supabase settings.');
  }
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/x-www-form-urlencoded',
      'Authorization': 'Basic ' + btoa(clientId + ':' + clientSecret)
    },
    body: 'grant_type=client_credentials'
  });
  if (!res.ok) throw new Error('Failed to get Spotify token: ' + res.status);
  const data = await res.json();
  return data.access_token;
}

function extractSpotifyShowId(url) {
  const m = url.match(/spotify\.com\/show\/([A-Za-z0-9]+)/);
  return m ? m[1] : null;
}

async function previewImportShow(url) {
  const el = document.getElementById('import-show-preview');
  if (!el) return;
  const showId = extractSpotifyShowId(url);
  if (!showId) { el.textContent = ''; return; }
  el.textContent = 'Looking up show...';
  try {
    const token = await getSpotifyToken();
    const res = await fetch('https://api.spotify.com/v1/shows/' + showId + '?market=US', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!res.ok) throw new Error('Show not found');
    const show = await res.json();
    el.innerHTML = '<strong style="color:#1DB954;">✓ ' + show.name + '</strong> — ' + show.total_episodes + ' episodes · by ' + show.publisher;
    // Pre-fill source label
    const srcInput = document.getElementById('import-show-source');
    if (srcInput && !srcInput.value) srcInput.value = show.name;
  } catch(e) {
    el.textContent = 'Could not find show: ' + e.message;
  }
}

async function importSpotifyShow() {
  const url    = document.getElementById('import-show-url')?.value.trim();
  const source = document.getElementById('import-show-source')?.value.trim();
  const status = document.getElementById('import-status');

  if (!url) { alert('Please enter a Spotify show URL.'); return; }
  const showId = extractSpotifyShowId(url);
  if (!showId) { alert('Could not find a show ID in that URL. Use a URL like https://open.spotify.com/show/XXXX'); return; }
  if (!source) { alert('Please enter a source label (folder name).'); return; }

  if (status) status.textContent = 'Getting access token...';

  try {
    const token = await getSpotifyToken();

    // Fetch all episodes (paginated, 50 per page)
    let episodes = [];
    let offset = 0;
    const limit = 50;
    let total = Infinity;

    while (offset < total) {
      if (status) status.textContent = 'Fetching episodes ' + (offset+1) + '–' + Math.min(offset+limit, total) + '...';
      const res = await fetch('https://api.spotify.com/v1/shows/' + showId + '/episodes?market=US&limit=' + limit + '&offset=' + offset, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (!res.ok) throw new Error('API error: ' + res.status);
      const data = await res.json();
      total = data.total;
      episodes = episodes.concat(data.items);
      offset += limit;
      if (data.items.length === 0) break;
    }

    if (status) status.textContent = 'Saving ' + episodes.length + ' episodes...';

    // Build podcast library entries
    const existing = S.podcastLibrary || [];
    const existingUrls = new Set(existing.map(p => p.url));

    const newEpisodes = episodes
      .filter(ep => ep && ep.id)
      .filter(ep => !existingUrls.has('https://open.spotify.com/episode/' + ep.id))
      .map(ep => ({
        id: 'spotify_' + ep.id,
        label: ep.name,
        source: source,
        url: 'https://open.spotify.com/episode/' + ep.id,
        type: 'spotify',
        description: ep.description ? ep.description.slice(0, 200) : '',
      }));

    const updatedLib = [...existing, ...newEpisodes];
    S.podcastLibrary = updatedLib;

    if (status) status.textContent = 'Saving to database...';

    // Use dbSet which is the standard settings save path
    await dbSet('podcast_library', updatedLib);

    // Verify save
    if (status) status.textContent = 'Verifying...';
    const verifyData = await sb.from('settings').select('value').eq('key','podcast_library').single();
    if (verifyData.error) {
      console.error('Save verify error:', verifyData.error);
      alert('Warning: Save may have failed: ' + verifyData.error.message);
    } else {
      let savedCount = 0;
      try { savedCount = JSON.parse(verifyData.data.value).length; } catch {}
      console.log('Verified: ' + savedCount + ' episodes in database');
    }

    S.showImportForm = false;
    if (status) status.textContent = '';

    alert('✓ Imported ' + newEpisodes.length + ' new episodes from "' + source + '"!\n(' + (episodes.length - newEpisodes.length) + ' duplicates skipped)\nTotal in library: ' + updatedLib.length);
    draw();

  } catch(e) {
    if (status) status.textContent = '';
    alert('Import failed: ' + e.message);
    console.error('importSpotifyShow error:', e);
  }
}

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff/60000);
  const h = Math.floor(diff/3600000);
  const d = Math.floor(diff/86400000);
  if (m < 1)  return 'just now';
  if (m < 60) return m + 'm ago';
  if (h < 24) return h + 'h ago';
  if (d < 7)  return d + 'd ago';
  return new Date(ts).toLocaleDateString();
}

    return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;padding:20px;">
      <div style="${card}padding:40px;max-width:380px;width:100%;text-align:center;">
        <div style="width:52px;height:52px;border-radius:14px;background:#1B1B1B;color:#CFB87C;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;margin:0 auto 16px;font-family:'Playfair Display',serif;">${inits(r?.name||'?')}</div>
        <h2 style="font-size:20px;font-weight:800;font-family:'Playfair Display',serif;margin-bottom:6px;">Hi, ${firstName}</h2>
        <p style="font-size:13px;color:#aaa;margin-bottom:24px;">Enter your 4-digit PIN to sign in.</p>
        <input id="pin_input" type="password" inputmode="numeric" maxlength="4" autofocus
          onkeydown="if(event.key==='Enter')identitySubmitPin()"
          oninput="if(this.value.length===4)identitySubmitPin()"
          style="${inp}text-align:center;font-size:28px;letter-spacing:.4em;padding:14px;max-width:180px;margin:0 auto 6px;display:block;"/>
        <div id="pin_err" style="font-size:12px;color:#B83232;min-height:18px;margin-bottom:16px;"></div>
        <div style="display:flex;gap:10px;">
          <button onclick="identityBack()" style="${gBtn}flex:1;">← Back</button>
          <button onclick="identitySubmitPin()" style="${pBtn()}flex:1;">Sign In</button>
        </div>
      </div>
    </div>`;
  }

  if (_identityStep === 'setpin') {
    return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;padding:20px;">
      <div style="${card}padding:40px;max-width:380px;width:100%;text-align:center;">
        <div style="font-size:40px;margin-bottom:16px;">🔐</div>
        <h2 style="font-size:20px;font-weight:800;font-family:'Playfair Display',serif;margin-bottom:6px;">Create your PIN</h2>
        <p style="font-size:13px;color:#aaa;margin-bottom:24px;">Choose a 4-digit PIN. You'll use this every time you sign in on a new device.</p>
        <input id="pin_input" type="password" inputmode="numeric" maxlength="4" autofocus
          onkeydown="if(event.key==='Enter')identityConfirmPin()"
          oninput="if(this.value.length===4)identityConfirmPin()"
          style="${inp}text-align:center;font-size:28px;letter-spacing:.4em;padding:14px;max-width:180px;margin:0 auto 6px;display:block;"/>
        <div id="pin_err" style="font-size:12px;color:#B83232;min-height:18px;margin-bottom:16px;"></div>
        <div style="display:flex;gap:10px;">
          <button onclick="identityBack()" style="${gBtn}flex:1;">← Back</button>
          <button onclick="identityConfirmPin()" style="${pBtn()}flex:1;">Next →</button>
        </div>
      </div>
    </div>`;
  }

  if (_identityStep === 'confirmpin') {
    return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;padding:20px;">
      <div style="${card}padding:40px;max-width:380px;width:100%;text-align:center;">
        <div style="font-size:40px;margin-bottom:16px;">🔐</div>
        <h2 style="font-size:20px;font-weight:800;font-family:'Playfair Display',serif;margin-bottom:6px;">Confirm your PIN</h2>
        <p style="font-size:13px;color:#aaa;margin-bottom:24px;">Enter your PIN one more time to confirm.</p>
        <input id="pin_input" type="password" inputmode="numeric" maxlength="4" autofocus
          onkeydown="if(event.key==='Enter')identityFinishSetPin()"
          oninput="if(this.value.length===4)identityFinishSetPin()"
          style="${inp}text-align:center;font-size:28px;letter-spacing:.4em;padding:14px;max-width:180px;margin:0 auto 6px;display:block;"/>
        <div id="pin_err" style="font-size:12px;color:#B83232;min-height:18px;margin-bottom:16px;"></div>
        <div style="display:flex;gap:10px;">
          <button onclick="_identityStep='setpin';_identityNewPin=null;draw();" style="${gBtn}flex:1;">← Back</button>
          <button onclick="identityFinishSetPin()" style="${pBtn()}flex:1;">Set PIN & Sign In</button>
        </div>
      </div>
    </div>`;
  }
  return '';
}

function identityBack() {
  _identityStep = 'pick';
  _identityResId = null;
  _identityNewPin = null;
  draw();
}

async function identityNext() {
  const id = document.getElementById('identity_select')?.value;
  if (!id) { alert('Please select your name.'); return; }
  _identityResId = id;
  // Check if this resident already has a PIN in Supabase
  try {
    const rows = await dbGet('settings', 'key', 'pin_' + id);
    if (rows && rows.length > 0) {
      _identityStep = 'pin';
    } else {
      _identityStep = 'setpin';
    }
  } catch(e) {
    _identityStep = 'setpin';
  }
  draw();
  setTimeout(() => document.getElementById('pin_input')?.focus(), 100);
}

// Show a PIN-screen error and reset the box — tolerant of the screen having already changed.
function pinFail(msg) {
  const e = document.getElementById('pin_err'), i = document.getElementById('pin_input');
  if (e) e.textContent = msg;
  if (i) { i.value = ''; i.focus(); }
}

async function identitySubmitPin() {
  const entered = document.getElementById('pin_input')?.value;
  if (!entered || entered.length < 4) return;
  try {
    const rows = await dbGet('settings', 'key', 'pin_' + _identityResId);
    const stored = rows?.[0]?.value?.replace(/"/g, '');
    if (entered === stored) {
      await identityComplete(_identityResId);
    } else {
      pinFail('Incorrect PIN. Try again.');
    }
  } catch(e) {
    pinFail('Error checking PIN. Try again.');
  }
}

function identityConfirmPin() {
  const pin = document.getElementById('pin_input')?.value;
  if (!pin || pin.length < 4) return;
  _identityNewPin = pin;
  _identityStep = 'confirmpin';
  draw();
  setTimeout(() => document.getElementById('pin_input')?.focus(), 100);
}

async function identityFinishSetPin() {
  const confirm = document.getElementById('pin_input')?.value;
  if (!confirm || confirm.length < 4) return;
  if (confirm !== _identityNewPin) {
    pinFail('PINs don\'t match. Try again.');
    return;
  }
  // Save PIN to Supabase
  await dbUpsert('settings', { key: 'pin_' + _identityResId, value: JSON.stringify(_identityNewPin) });
  await identityComplete(_identityResId);
}

async function identityComplete(id) {
  saveL('al6_identity', id);
  S.activeResidentId = id;
  _identityStep = 'pick';
  _identityResId = null;
  _identityNewPin = null;
  // Load progress
  if (S.dbReady) {
    try {
      const progressRows = await dbGet('progress', 'resident_id', id);
      const completedModIds = new Set(progressRows.filter(p=>p.completed).map(p=>String(p.module_id)));
      S.courses = S.courses.map(c => ({...c, modules: c.modules.map(m => ({
        ...m, completed: completedModIds.has(String(m.id))
      }))}));
    } catch(e) {}
    // Load notes in background
    loadAllNotes(id);
  }
  S.view = 'dashboard';
  draw();
}



// ─── APP BOOTSTRAP ────────────────────────────────────────────────────────────
async function bootstrap() {
  draw(); // show loading screen

  try {
    // Load all data in parallel
    const [resRows, courseRows, eventRows, kudosRows, quizRows, evalRows, suggRows, icsUrlSetting, podcastLibSetting, adminResourcesSetting, rotResourcesSetting, profResourcesSetting, greenBookSetting] = await Promise.all([
      dbGet('residents'),
      dbGet('courses'),
      dbGet('events'),
      dbGet('kudos'),
      dbGet('quizzes'),
      dbGet('evaluations'),
      dbGet('suggestions'),
      dbGetSetting('icsUrl', ''),
      dbGetSetting('podcast_library', '[]'),
      dbGetSetting('admin_resources', '[]'),
      dbGetSetting('rotation_resources', '[]'),
      dbGetSetting('professional_resources', '[]'),
      dbGetSetting('green_book', null),
    ]);

    // Hydrate residents
    S.residents = resRows.map(r => ({
      id:r.id, name:r.name, year:r.year, chief:r.chief, enrolled:r.enrolled||[], email:r.email||'', phone:r.phone||''
    }));

    // Hydrate courses — merge with progress for this resident
    const resId = S.activeResidentId;
    const progressRows = resId ? await dbGet('progress','resident_id',resId) : [];
    const completedModIds = new Set(progressRows.filter(p=>p.completed).map(p=>String(p.module_id)));

    S.courses = courseRows.map(row => {
      const c = row.data;
      return {...c, modules: c.modules.map(m => ({
        ...m, completed: completedModIds.has(String(m.id))
      }))};
    }).sort((a,b) => a.id - b.id);

    // Hydrate events
    S.events = eventRows;

    // Hydrate kudos
    S.kudos = kudosRows.sort((a,b) => b.ts - a.ts).map(k => ({
      ...k, recipientId:k.recipient_id, recipientName:k.recipient_name,
      badgeId:k.badge_id, badgeEmoji:k.badge_emoji, badgeLabel:k.badge_label
    }));

    // Hydrate quizzes
    S.quizzes = quizRows.map(q => ({...q, docxBytes:q.docx_bytes}));

    // Hydrate evaluations
    S.evaluations = evalRows || [];
    try { S.adminResources = JSON.parse(adminResourcesSetting || '[]'); } catch { S.adminResources = []; }
    try { S.rotationResources = JSON.parse(rotResourcesSetting || '[]'); } catch { S.rotationResources = []; }
    try { S.professionalResources = JSON.parse(profResourcesSetting || '[]'); } catch { S.professionalResources = []; }
    S.suggestions = suggRows || [];

    // Seed Green Book on first run from greenbook-default.json.
    if (greenBookSetting && typeof greenBookSetting === 'object' && Object.keys(greenBookSetting).length) {
      S.greenBook = greenBookSetting;
    } else {
      S.greenBook = {...(await loadDefaultGB())};
      try { await dbSet('green_book', S.greenBook); } catch(e) { console.warn('green_book seed failed:', e); }
    }

    // Seed the admin PIN hash on first run (from ADMIN_PIN_SEED) if none is set.
    try {
      const existingPin = await dbGetSetting('admin_pin_hash', '');
      if (!existingPin) await dbSet('admin_pin_hash', await sha256Hex(ADMIN_PIN_SEED));
    } catch(e){ console.warn('admin_pin seed failed:', e); }

    // Hydrate ICS url
    S.icsUrl = icsUrlSetting || '';
    try { S.podcastLibrary = Array.isArray(podcastLibSetting) ? podcastLibSetting : JSON.parse(podcastLibSetting || '[]'); } catch { S.podcastLibrary = []; }

    S.dbReady = true;

    // Check if we need identity selection
    const savedId = loadL('al6_identity', null);
    const validId = savedId && S.residents.find(r => r.id === savedId);
    if (!validId) {
      S.view = 'identity';
    } else {
      S.activeResidentId = savedId;
      S.view = 'dashboard';
      // Load notes in background for returning resident
      loadAllNotes(savedId);
    }

  } catch(e) {
    console.error('Bootstrap failed:', e);
    // Fall back to static data
    S.dbReady = false;
    S.view = 'identity';
  }

  draw();

  // Auto-fetch ICS if configured
  if (S.icsUrl) {
    try { fetchICS(); } catch(e) {}
  }

  // Check push status and register if first time
  await checkPushStatus();
  if (!S.pushRegistered && Notification.permission === 'default') {
    // Prompt after a short delay so it doesn't feel abrupt
    setTimeout(registerPush, 3000);
  }
}

bootstrap();
