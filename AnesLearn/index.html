\"><strong>PCEA bolus</strong></th></tr>\n<tr><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\"><strong>\"walking\" PCEA</strong></td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">5cc/hr CONT</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">_None_</td></tr>\n<tr><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\"><strong>Standard PCEA</strong></td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">10cc/45min PIEB</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">5cc q 10min</td></tr>\n<tr><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\"><strong>Intrathecal catheter</strong></td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">2-3cc CONT</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">_None_</td></tr>\n</table></div>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">remember: LA requirements reduced by 30% in pregnancy</li>\n<li style=\"font-size:13px;\">assess frequently for motor block</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Safety Tips</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Motor block is intrathecal catheter until proven otherwise</li>\n<li style=\"font-size:13px;\">High block (above T2-4) is intrathecal until proven otherwise</li>\n<li style=\"font-size:13px;\">Lack of block is intravascular catheter until proven otherwise</li>\n<li style=\"font-size:13px;\">Nausea after spinal or epidural dose is hypotension until proven otherwise</li>\n<li style=\"font-size:13px;\">Patchy bblock is likely a subdural catheter; Plan to replace</li>\n</ul>\n<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">Cesarean Delivery</h1>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">CS with epidural</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Cesarean deliveries under epidural require a more dense analgesia than laboring.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Typical LA dose is <strong>20cc bolus</strong> for cesarean delivery (T4 level) but some parturients may require up to 40cc.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">C-Section's can occur across a spectrum of urgencies and will impact LA choice.</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Emergent  ->  <strong>20cc 3% 2-CP</strong></li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- This is <strong>least toxic</strong>, has the <strong>fastest onset</strong>, but is <strong>short duration</strong> (<45min)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- May need to bolus Bupi 0.25% in PACU to cover pain until morphine hits</p>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Non-emergent  ->  <strong>1-20cc LEBF</strong> (see table below)</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- LEBF is a mix of Lido + Epi + Bicarb + Fentanyl</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- after 20cc of lido if more LA needed always switch to 2-CP for LAST considerations</p>\n</ul>\n<div style=\"overflow-x:auto;margin:12px 0;\"><table style=\"width:100%;border-collapse:collapse;font-size:12px;\">\n<tr><th style=\"padding:7px 10px;border:1px solid #E8E5DF;background:#F4F2EE;font-weight:700;text-align:left;\"><strong>Component</strong></th><th style=\"padding:7px 10px;border:1px solid #E8E5DF;background:#F4F2EE;font-weight:700;text-align:left;\"><strong>Dose</strong><br>_(per mL LA)_</th><th style=\"padding:7px 10px;border:1px solid #E8E5DF;background:#F4F2EE;font-weight:700;text-align:left;\"><strong>Max Dose</strong></th></tr>\n<tr><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\"><strong>L</strong>ido 2%</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">1-19mL</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">20cc</td></tr>\n<tr><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\"><strong>E</strong>pi</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">2-5 mcg</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">40-100mcg</td></tr>\n<tr><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\"><strong>B</strong>icarb</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">0.1mL</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">2mL</td></tr>\n<tr><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\"><strong>F</strong>entanyl</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">100mcg</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\"></td></tr>\n</table></div>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">CS with spinal</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">A cesarean spinal mix should contain <strong>Local anesthetic (LA)</strong> + <strong>Fent</strong> +/- <strong>morphine or dilaudid</strong> +/- <strong>Epi</strong></p>\n<div style=\"overflow-x:auto;margin:12px 0;\"><table style=\"width:100%;border-collapse:collapse;font-size:12px;\">\n<tr><th style=\"padding:7px 10px;border:1px solid #E8E5DF;background:#F4F2EE;font-weight:700;text-align:left;\"><strong>Component</strong></th><th style=\"padding:7px 10px;border:1px solid #E8E5DF;background:#F4F2EE;font-weight:700;text-align:left;\"><strong>Primary</strong></th><th style=\"padding:7px 10px;border:1px solid #E8E5DF;background:#F4F2EE;font-weight:700;text-align:left;\"><strong>Alternative</strong></th></tr>\n<tr><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">LA (Bupi 0.75%)</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">1.5cc (11mg)</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">1.6cc (12mg)</td></tr>\n<tr><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">Fast narcotic</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">fent 12.5 - 25mcg</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\"></td></tr>\n<tr><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">Long narcotic</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">morphine 100-250mcg</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">hydromorphone 50-100mcg</td></tr>\n<tr><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">Prolong</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\">Epi 100-200mcg</td><td style=\"padding:7px 10px;border:1px solid #E8E5DF;text-align:left;\"></td></tr>\n</table></div>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">CSE is also an option if 12-48hrs of extended analgesia is needed</li>\n<li style=\"font-size:13px;\">2nd dose of neuraxial morphine can be given prior to epidural removal at ~18-24h mark</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">CS with GETA</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Almost all GETA C-sections are emergent. Anes Att. (preferably OB) should <strong>always</strong> be present for induction. <strong>No exceptions</strong></p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Preoxygenate immediately w/ 100% FiO2 by facemask</li>\n<li style=\"font-size:13px;\">RSI w/ <strong>hypnotic</strong> + <strong>succinylcholine</strong> with <strong>cricoid pressure</strong> (required)</li>\n<li style=\"font-size:13px;\">Hypnotics</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- <strong>Etomidate</strong> 0.2-0.3mg/kg (most <em>readily availble</em> and <em>HDS</em>)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- <strong>Ketamine</strong> 1-1.5mg/kg IV</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- <strong>Propofol</strong> 1.5-2.5mg/kg</p>\n<li style=\"font-size:13px;\">Acute hypertension adjuncts</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- lido 1.5 mg/kg</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- esmolol 0.5-1 mg/kg</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- labetalol 5-20 mg</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- nitroglycerin 2mcg/kg</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- remi 1mcg/kg</p>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">in emergent GA use high conc. sevo (1-1.5 MAC) w/ 100% FiO2 until delivery</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- After delivery reduce to <0.5MAC to prevent <strong>uterine atony</strong>. Supplement with N2O 50-70%</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Consider switching to TIVA; ask attending.</p>\n</ul>\n<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">Postpartum tubal ligation</h1>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Discuss use of epidural vs single shot spinal (SSS) with attending</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Regardless of choice, <strong>never</strong> use neuraxial <strong>long acting opioids</strong></p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">if using <strong>epidural</strong>:</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- 2-chloroprocaine 3% <em>or</em></p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Lidocaine 2%</p>\n<li style=\"font-size:13px;\">if using <strong>spinal</strong>:</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Heavy bupi (0.75%) 11-12mg + Fent 15-25mcg</p>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">These are NOT elective cases per ACOG, however following NPO guidelinens is mandatory</p>\n<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">Cervical Cerclage</h1>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Spinal preferred; T10 level required</li>\n<li style=\"font-size:13px;\">Subarachnonid block is most commonly used w/ 7.5mg spinal bupi + fent 10-25mcg</li>\n<li style=\"font-size:13px;\">Do not use long acting opioids</li>\n</ul>",
  "ct-att": "<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">CT Anesthesia Attending preferences</h1>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!NOTE]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">The following are updated statements directly from each attending</div>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Abrams</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">There is no \"cardiac setup\" or \"cardiac induction\". Make a plan specific to the patient's pathophysiology and operation.</li>\n<li style=\"font-size:13px;\">Call with any significant changes in vasoactive medications or the administration of blood products.</li>\n<li style=\"font-size:13px;\">Ultrasound-guided line placement means you actually visualize the tip of the needle entering the vessel. Procedure efficiency is important, but you should take your time during this step.</li>\n<li style=\"font-size:13px;\">Plan to reverse neuromuscular blockade prior to leaving the OR for most cases. Rare exceptions may include an open chest and/or significant ventilator support.</li>\n<li style=\"font-size:13px;\">All medications should be given through the central line once it is in place.</li>\n<li style=\"font-size:13px;\">Do not use propofol as an antihypertensive medication.</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Ahlgren</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Know your patient and discuss induction with attending or fellow the night before.</li>\n<li style=\"font-size:13px;\">Know optimal hemodynamics for valvular disorders.</li>\n<li style=\"font-size:13px;\"><strong>Like ketamine for induction.</strong></li>\n<li style=\"font-size:13px;\">When any doubt of easy airway securement- use a CMAC. CMAC for all double lumen tube placements.</li>\n<li style=\"font-size:13px;\">Pre-induction a-line if you are going to use an a-line (why not have it for a hemodynamically significant part of the case (induction)).</li>\n<li style=\"font-size:13px;\">Put TEE probe in before central line placement and always use ultrasound for line placement- if you are struggling with the a-line- use an ultrasound- don't turn your patient into a bruised mess.</li>\n<li style=\"font-size:13px;\">When in doubt of bleeding risk- use a MAC- more access is always better.</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- <em>Consider contralateral cordis for additional access for redos.</em></p>\n<li style=\"font-size:13px;\">When doing lines, untangling IVs, etc- watch the patient.</li>\n<li style=\"font-size:13px;\">MAP above 60 at all times.</li>\n<li style=\"font-size:13px;\">Doesn't care how paralyzed pt is, as long as reversible and doesn't move unless waking up for extubation.</li>\n<li style=\"font-size:13px;\">Defib pads on for all redos, mitral stenosis, VADs, heart transplants, left main dx or left main equivalent.</li>\n<li style=\"font-size:13px;\">Levophed poppers 12.8 mcg/mL should be available for most cases- along with standard poppers.</li>\n<li style=\"font-size:13px;\">Have ketamine for most cases.</li>\n<li style=\"font-size:13px;\">If you don't understand something- ask.</li>\n<li style=\"font-size:13px;\">If you have never done something- ask before you do it.</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Alber</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Have clear patient history and anesthetic plan when you call the night before.</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Especially their ICU course and consultant input</p>\n<li style=\"font-size:13px;\">Induction with midazolam/fentanyl/sevo/muscle relaxant.</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Doesnt prefer etomidate, propofol okay for most cardiac patients</p>\n<li style=\"font-size:13px;\">Discuss +/-PAC, especially in ‘healthy’ patients</li>\n<li style=\"font-size:13px;\">Avoid circumferential taping on arterial line arm boards</li>\n<li style=\"font-size:13px;\">Look at the pictures of imaging studies (you learn so much, and sometimes find things the radiologist maybe didn’t think was important for us)</li>\n<li style=\"font-size:13px;\">Make sure the ear isn’t folded over in the donut in lateral cases</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Grae</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Wants inpatients seen and consented the day before.</li>\n<li style=\"font-size:13px;\">Look for antibodies on type and screen so case is not delayed due to difficult cross match.</li>\n<li style=\"font-size:13px;\">Call the night before the case to discuss the plan for the day. Have clear induction, drip, line, blood availability, etc. plans when you call to tell her about the patient.</li>\n<li style=\"font-size:13px;\">Likes Standard Narcotic bag with 20 ml Fentanyl, 10 ml Versed, +/- Ketamine to supplement the bag.</li>\n<li style=\"font-size:13px;\">A-line before induction for all cardiac cases and lung transplants. For first start cases, arterial line should be placed early enough to ensure we are in the room and ready to induce on time. No strong preference pre-op versus in room, just wants it done on time.</li>\n<li style=\"font-size:13px;\">Defib pads on for all redo’s, aortic stenosis, left main (or equivalent) lesions, and patients with inactivated ICDs. If in doubt, place defib pads on patient.</li>\n<li style=\"font-size:13px;\">If patient has pacemaker or AICD, have a plan to manage it peri-operatively.</li>\n<li style=\"font-size:13px;\"><strong>Call for all significant intra-operative events or questions, even if you think you can handle it. She may or may not come but needs to stay in the loop.</strong></li>\n<li style=\"font-size:13px;\">Start Precedex without bolus after hemodynamically stable off bypass, unless earlier administration is discussed with her during case planning.</li>\n<li style=\"font-size:13px;\">Place OGT after TEE probe removed but before transporting to ICU and ensure all stopcocks and lines are cleaned up and capped. Cleanliness and organization will earn bonus points.</li>\n<li style=\"font-size:13px;\"><strong>Has low threshold for Belmont. When in doubt, have it around.</strong></li>\n<li style=\"font-size:13px;\">Consider EJ PIV if difficult IV access.</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Kowalsky</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">If you have never done something or have questions at any time, please call or ask before you do it. Communicate all major CPB-related events (heparin in, warming, cross clamp off, etc.) as well as hemodynamic, oxygenation/ventilation issues or other concerns to either fellow or attending so everyone is in the loop even if you think you can handle it. </li>\n<li style=\"font-size:13px;\">Please have inpatients seen and consented day prior to surgery.</li>\n<li style=\"font-size:13px;\">Work to ensure no delays from anesthesia side. Consent and arterial line in pre-op early with US guidance and room setup appropriately for smooth transition through start of case. - Easily preventable delays are primarily related to blood bank and CIED management. Blood bank needs two samples for release of pRBCs. Ensure appropriate timing/phase of care for labs as they require two samples prior to releasing RBCs and pre-op may not see this order if you place them after patient has checked in. Blood bank may require phone call if antibodies are present.</li>\n<li style=\"font-size:13px;\">It is often easiest to staff bigger cases on the phone or, even better, in person day prior. I am happy to text and find a time that is mutually convenient but please at least try to reach out earlier rather than later. Unfortunately, there are no standard cases so having a shared gameplan for the day is beneficial and understanding the reasoning behind a plan is part of the education for the day. </li>\n<li style=\"font-size:13px;\">When staffing cases, try to keep your presentation brief and follow the order of the case (something like relevant pt info and proposed surgical plan, pre-op labs/meds/blood ordering, monitors, induction, lines and infusions planned, pre/intra/post-CPB, any other special concerns, etc)</li>\n<li style=\"font-size:13px;\">Defib pads on for all cardiac cases. Ensure safe plan for patient with ICD deactivated coming to OR, often easiest to deactivate in the OR for heart transplants or those with high-risk hemodynamic lesions or frequent shocks.</li>\n<li style=\"font-size:13px;\">For lung transplants, call CTICU RT at 87452 for inhaled nitric oxide and Pharmacy early during setup to get access to continuous antibiotics and immunosuppressive agents as these are the usual hangup.</li>\n<li style=\"font-size:13px;\">Standard bag + ketamine 100 mg + cardiac narc bag for cardiac cases. Ketamine 50 mg for most thoracic cases. It only takes a few seconds to pull extra medications up so please don’t pull up medications that we have not discussed or anticipate using.</li>\n<li style=\"font-size:13px;\">Normal geometry VL (CMAC or Glidescope) for all double lumen ETTs and available for any airway that looks remotely challenging.</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Seres</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Call him for discussion of the patient and prepare talking about: Echo data: systolic fun, diastolic fun, BP and heart rate, Cath lab data, Presence of pacemaker, Exercise tolerance and of course airway</li>\n<li style=\"font-size:13px;\">Formulate plan for induction and specific medications or drips based on the above data. He asks you to select induction agents for cardiac cases based on H&P data. Examples:</li>\n<li style=\"font-size:13px;\">Normal or high BP and normal EF: propofol with fentanyl</li>\n<li style=\"font-size:13px;\">Normal or high BP low EF: etomidate with fentanyl</li>\n<li style=\"font-size:13px;\">Low BP normal EF: etomidate with fentanyl or propofol, fentanyl with phenylephrine</li>\n<li style=\"font-size:13px;\">Low BP low EF: etomidate or ketamine with fentanyl</li>\n<li style=\"font-size:13px;\">He starts Dexmedetomidine infusion after induction. He uses Sedline monitor to check the depth of anesthesia and minimize the amounts of anesthetic agents during cardiac cases.</li>\n<li style=\"font-size:13px;\">He gives midazolam when it is indicated, and he likes to give Dilaudid 2mg before skin incision.</li>\n<li style=\"font-size:13px;\">He uses cerebral oximetry for almost all the cardiac cases in combination with the Sedline. Put the Sedline sticker first close to the eyebrow and the cerebral oximetry stickers on the free space of the forehead.</li>\n<li style=\"font-size:13px;\">Prepare for doing all the lines when you work with him. He does not like to start a-line in the holding area. He puts the monitors on and pre-oxygenates the patient while you start the a-line in the OR. After induction and intubation, he inserts the TEE probe and cleans the neck while you prepare for the central line. He or the fellow will start a second IV if time is limited.</li>\n<li style=\"font-size:13px;\">Patient has good veins: introducer and 2 peripheral IVs, one of them 16G.</li>\n<li style=\"font-size:13px;\">Patient has poor venous access: MAC catheter and 1 peripheral IV.</li>\n<li style=\"font-size:13px;\">Room preparation: he is looking for the premade syringes from pharmacy: phenylephrine, epinephrine and vasopressin.</li>\n<li style=\"font-size:13px;\">Drips: carrier, phenylephrine, and epinephrine. Extra drips based on the specific history or hemodynamics during the case.</li>\n<li style=\"font-size:13px;\">He is looking for your vigilance on hemodynamics: use phenylephrine and glycopyrrolate to keep SBP > 100, HR > 50.</li>\n<li style=\"font-size:13px;\"><strong>Preop Aline for all first cases, all subsequent cases can have the Aline done in the room (especially for TAVRs).</strong></li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Stoops</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Thinks it's ridiculous this preference list exists and hopes she never has more than this for an entry</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Sullivan</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">All inpatients need to be seen and consented the night before.</li>\n<li style=\"font-size:13px;\">Resident should know the hemodynamic goals for the lesion being fixed.</li>\n<li style=\"font-size:13px;\">Resident should know the medical comorbidities of the patient undergoing the surgery.</li>\n<li style=\"font-size:13px;\">Resident should know the basics of the surgery being performed.</li>\n<li style=\"font-size:13px;\">Resident should have an induction plan and a plan for lines.</li>\n<li style=\"font-size:13px;\">Drugs to have available: epi syringes, epi infusion, NE infusion, nicardipine infusion (don't need to open it), ketamine, dobutamine (don't need to open it), milrinone (don't need to open it)</li>\n<li style=\"font-size:13px;\">Prefers the ultrasound to be on the same side as the IJ that you are planning to access.</li>\n<li style=\"font-size:13px;\">Prefers opiates/benzo w/ inhalational induction, especially for sick patients.</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- <strong>Does not like etomidate</strong></p>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Wilkey</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Wants inpatients seen and consented the day before. </li>\n<li style=\"font-size:13px;\">Look for antibodies on type and screen the day before the case so case is not delayed due to difficult cross match. </li>\n<li style=\"font-size:13px;\">Have a clear induction plan when you call to tell her about the patient. Induction plan should be based upon patient and situation. Generally does not like propofol as primary induction agent but can be convinced in some cases. Consider having a vial of propofol available for patients who need to avoid hypertension with induction. </li>\n<li style=\"font-size:13px;\">A-line before induction for all cardiac cases and lung transplants. For first start cases, arterial line should be in by 730 Tuesday through Friday and 830 on Monday. No strong preference pre-op versus in room, just wants it done on time. </li>\n<li style=\"font-size:13px;\">Defib pads on for all redos and patients with inactivated ICDs. </li>\n<li style=\"font-size:13px;\">If pt has pacemaker have a plan to manage it peri-operatively. </li>\n<li style=\"font-size:13px;\">Put TEE probe in before central line placement and always use ultrasound for central line placement. </li>\n<li style=\"font-size:13px;\">Call for all bad intra-operative events, even if you think you can handle it. She may or may not come but needs to stay in the loop. </li>\n<li style=\"font-size:13px;\">Place OGT after TEE probe removed but before transporting to ICU.</li>\n<li style=\"font-size:13px;\">Like PIV in the EJ if difficult IV access.</li>\n<li style=\"font-size:13px;\">Like ROTEMs following complex aortic cases, redos, transplants and VADs… or anything else that has bled significantly prior to coming off bypass.</li>\n</ul>",
  "vpn": "<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">VPN / EMR remote access</h1>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">UCH</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><a href=\"https://myapps.uchealth.org/Citrix/InternalWeb/\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">myapps.uchealth.org</a></p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Domain: UNIVERSITY</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">DH</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Citrix Remote Access:</strong></p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><a href=\"https://dhremoteaccess.dhha.org/\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">dhremoteaccess.dhha.org</a></p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Domain:</strong> dnvrhlth</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><a href=\"https://denverhealth.identitynow.com/passwordreset\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">Sailpoint password reset</a></p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><a href=\"tel:+1-303-436-3777\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">303-436-3777</a></p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">CHCO</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><a href=\"https://go.childrenscolorado.org/vpn/index.html\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">go.childrenscolorado.org</a></p>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">It will likely redirect you to a microsoft login, you will need to get the email address from CHCO helpdesk</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">Password should be the same as your epic and computer login</div>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">VHA</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">TBD</p>",

Email: Bethany.benish@dhha.org</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Phone: <a href=\"tel:+14023504138\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">tel:+14023504138</a></p>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Dr. Kenji Tanabe</strong> - Intern Program Director</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Email: Kenji.tanabe@cuanschutz.edu</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Phone: <a href=\"tel:+17196599079\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">tel:+17196599079</a></p>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Dr. Mario Villasenor</strong> - Associate Residency Program Director</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Email: mario.villasenor@cuanschutz.edu</p>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Administrative Contacts</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Alyson Poeppelman</strong> - Fellowship/Residency Coordinator</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Email: alyson.poeppelman@cuanschutz.edu</p>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Bonnie Caywood</strong> - Education Program Coordinator for Residents/Fellows</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Email: bonnie.caywood@cuanschutz.edu</p>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Chief Residents</h2>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Administrative Chiefs</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Amy Krepps</strong></p>\n<ul style=\"marg e-height:1.7;margin:6px 0;\">- Phone: <a href=\"tel:+15415542176\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">tel:+15415542176</a></p>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>University of Colorado</strong>: Dr. Rachel Kacmar</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Email: Rachel.kacmar@cuanschutz.edu</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- Phone: <a href=\"tel:+16145604361\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">tel:+16145604361</a></p>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>UCH Anesthesiology charge email</strong>: anesthesia.charge@ucdenver.edu</li>\n</ul>",
  "qgenda": "<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">QGenda Glossary</h1>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><em>Kelsey Repine MD, Brian Tashjian MD, Added July 2023</em></p>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!NOTE]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\"><a href=\"https://app.qgenda.com/link/view?linkKey=a2f4aeb1-b6da-4b0f-b430-c6ef72935427\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">Resident Call</a> - </div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\"><a href=\"https://app.qgenda.com/Link/view?linkKey=0918c1e2-da08-49b4-b2a2-c3942f460789\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">Faculty Call</a></div>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">We use <a href=\"https://app.qgenda.com/Dashboard/Company/33280b0e-7779-4a51-a205-9cd2cd934f2c\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">QGenda</a> for our scheduling and there are a lot of abbreviations. Below is a list of common abbreviations and what that actually means for your schedule.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Shift names</h2>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">UCH</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Res-OR</strong>: General OR rotation</li>\n<li style=\"font-size:13px;\"><strong>R1A</strong>: Weekend inhouse call, 7A-7P</li>\n<li style=\"font-size:13px;\"><strong>R1P</strong>: Weekend inhouse call, 7P-7A</li>\n<li style=\"font-size:13px;\"><strong>R1</strong>: Weekday inhouse overnight, 3P-7A</li>\n<li style=\"font-size:13px;\"><strong>R2</strong>: Weekday home call, 11P-7A</li>\n<li style=\"font-size:13px;\"><strong>Res</strong>: 12hr Late resident, stay until 2 rooms left (~7PM)</li>\n<li style=\"font-size:13px;\"><strong>Res-NF</strong>: Night float for CT and Transplant cases</li>\n<li style=\"font-size:13px;\"><strong>Res-DJ</strong>: Day jeopardy, 7A-7P</li>\n<li style=\"font-size:13px;\"><strong>Res-NJ</strong>: Night jeopardy, 7P-7A</li>\n<li style=\"font-size:13px;\"><strong>Res-CC</strong>: Cherry Creek</li>\n<li style=\"font-size:13px;\"><strong>Res-INV</strong>: Inverness</li>\n<li style=\"font-size:13px;\"><strong>Res-Priority</strong>: Priority resident prioritized for relief from the general call pool</li>\n<li style=\"font-size:13px;\"><strong>Res-X</strong>: Postcall/day off/no clinical duties</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">APS</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Res-APS Pain</strong>: Pain rounding service</li>\n<li style=\"font-size:13px;\"><strong>Res-APS Regional</strong>: Pain block service</li>\n<li style=\"font-size:13px;\"><strong>Res-APS Late</strong>: Last resident out, 7pm signout</li>\n<li style=\"font-size:13px;\"><strong>Res-APS 12 Hour</strong>: Weekend coverage, 7a-7p</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">CTICU</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Res-CTICU Rounding</strong>: Day rounding, 6a-4p (signout)</li>\n<li style=\"font-size:13px;\"><strong>Res-CTICU Call</strong>: Weekdays: 4p-6a, Weekends 24hr (6a-6a)</li>\n<li style=\"font-size:13px;\"><strong>Res-CTICU X</strong>: Postcall/Day off/No clinical duties</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">STICU</h3>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">OB</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>OBA</strong>: \"Long person\", 6a-6p</li>\n<li style=\"font-size:13px;\"><strong>OB Short</strong>: \"Short person\", 6a-3p (usually; relieved by attendings)</li>\n<li style=\"font-size:13px;\"><strong>OBP</strong>: Overnight 6p-6a</li>\n<li style=\"font-size:13px;\"><strong>OBX</strong>: Postcall/Day off/No clinical duties</li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Miscellaneous</h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>Res ADM</strong>: Administrative Day</li>\n<li style=\"font-size:13px;\"><strong>Res A</strong>: Academic Day</li>\n<li style=\"font-size:13px;\"><strong>Res E</strong>: Education/Conference Day</li>\n<li style=\"font-size:13px;\"><strong>Res P</strong>: Personal or parental Leave</li>\n<li style=\"font-size:13px;\"><strong>Res V</strong>: Vacation Leave</li>\n<li style=\"font-size:13px;\"><strong>Res S</strong>: Sick Leave</li>\n<li style=\"font-size:13px;\"><strong>Res Holiday</strong>: Holiday staffing, no clinical duties</li>\n</ul>",
  "interns": "<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">Intern Information</h1>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><em>Dominic Royster MD, Kenji Tanabe MD, Kelsey Repine MD</em></p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Welcome to CU Anesthesiology! We are so excited to have you join us this year! Below is a starter to give you some idea of what is to come this year.  We are excited to welcome you to the Department of Anesthesia and to work with you to make this year as educational and integrated as possible!  We are continually seeking to optimize the learning opportunities and experience of the year, so please don’t hesitate to reach out to any of us if you have any questions or suggestions.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">INTERN YEAR BREAKDOWN:</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">5 Anesthesia-related months</li>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- 2 months <a href=\"../r/uch\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">UCH OR Anesthesia</a></p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- 1 month <a href=\"../r/cticu\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">CTICU</a></p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- 1 month <a href=\"../r/sticu\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">STICU</a></p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- 1 month <a href=\"../r/aps\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">Acute Pain Service</a></p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- 1 month <a href=\"../r/pps\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">Pre-Procedure Services</a></p>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">3 Surgery months</li>\n<li style=\"font-size:13px;\">2 Medicine-based months (1 month IM Wards at the VA, 1 month cardiology at UCH) </li>\n<li style=\"font-size:13px;\">1 ED month</li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>1 Intern Week</strong> – last week of intern year (Unpaid, but no clinical duties the week immediately prior to starting CA1 Year)</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">EDUCATION FUNDS AND CONFERENCES</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">As an intern, you have two different categories of educational funds available to you:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">1) Discretionary Educational Funds: All PGY-1 residents will receive up to $500 of discretionary funds per year.  These can be used for any educational materials except for exam registration fees (i.e. USMLE Step 3 registration).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">2) Scholarly Presentation Funds: In the event a PGY-1 resident presents scholarly work at a meeting, the resident can apply to the department (Residency PD, VC Education, Education Manager) for travel support. Up to $1500 per year may be awarded depending on the nature of the presentation and meeting details. Note: Since any funds awarded are for specific presentation/trip, they do not rollover and these funds cannot be used for other purposes.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Interns are allotted a maximum of 2 non-clinical education days throughout the year to attend a conference at which they are presenting (must be presenting to use these days).  Rotations where obtaining non-clinical time to attend a conference is feasible include your anesthesiology OR rotation, CTICU, and STICU.  For APS and PPS, conference attendance may be feasible, but this requires 3-month advanced notice for planning. For EM, conference attendance can take place between scheduled clinical shifts.  Conference attendance is not feasible during internal medicine and surgical rotations.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">STEP 3 AND ITE</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Step 3 should be completed by the end of March of your intern year. For ease of scheduling,  please take the exam on anesthesia-based rotations (i.e. STICU, CTICU, APS, PPS, OR Anesthesiology).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">As noted above, you will have available a total of $500 for discretionary educational funds (i.e. study materials).  You will need to show a receipt to the education department and these funds can only be used for study materials. As a word of general advice, don’t use it to pay for a full year of Uworld - you don’t have time for that. Most IM intern groups will have discounted group buy-ins for ~$400 for 6 months Uworld.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The Inservice Training Exam (ITE) is an anesthesiology knowledge-based test. You will sit this exam in early February each year from Intern to CA-3. As an intern, you are not expected to study for this exam nor will your scores matter. Your priorities are Step 3, learning to become a doctor, and starting to prepare for anesthesiology residency. CA-1 and beyond it is highly encouraged to perform well as this assessment reflects your anesthesia knowledge with each passing year.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">ORIENTATION:</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Week 1: IM Intern Bootcamp </li>\n<li style=\"font-size:13px;\">Week 2: Starting your rotations</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">IMPORTANT CONTACT INFORMATION</h2>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Anesthesiology Contacts</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There's a separate section specifically for noteworthy department <a href=\"./contacts\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">contacts</a></p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><a href=\"./contacts#chief-residents\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">Anesthesia Chief Residents</a></li>\n<li style=\"font-size:13px;\"><a href=\"./contacts#administrative-contacts\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">Administrative contacts</a></li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Surgery Contact</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>R5 Admin Chiefs</strong> – Manage the schedule at the VA and University Hospital</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Madeline Thomas\t| Madeline.Thomas@cuanschutz.edu | 262-215-9176 </li>\n<li style=\"font-size:13px;\">Sudheer Vemuru\t| Sudheer.Vemuru@cuanschutz.edu\t| 678-756-3906 </li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>R4 Admin Chiefs</strong> – Manage the schedule at Denver Health</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Otto Thielen | otto.thielen@cuanschutz.edu | 786-378-3409 </li>\n<li style=\"font-size:13px;\">Bailey Lyttle | bailey.lyttle@cuanschutz.edu | 615-945-5681 </li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Internal Medicine Contact:</h3>\n<div style=\"overflow-x:auto;margin:12px 0;\"><table style=\"width:100%;border-collapse:collapse;font-size:12px;\">\n<tr><th style=\"padding:7px 10px;border:1px solid #E8E5DF;backg tyle=\"font-size:13px;\">Tim McGinnis: timothy.e.mcginnis@cuanschutz.edu, (303) 907-1526 </li>\n<li style=\"font-size:13px;\">Minh Do: minh.do@cuanschutz.edu, (713) 732-1940 </li>\n<li style=\"font-size:13px;\">Julia Blast: julia.bast@cuanschutz.edu, (608) 732-6373 </li>\n<li style=\"font-size:13px;\">Ellen Brinza: ellen.brinza@cuanschutz.edu, (248) 721-3085 </li>\n<li style=\"font-size:13px;\">Gavi Roda: ellen.brinza@cuanschutz.edu, (720) 299-6799 </li>\n<li style=\"font-size:13px;\">Brittany Denzer: brittany.denzer@cuanschutz.edu, (808) 936-7941</li>\n</div></details>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Emergency Medicine Contact:</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Emedschedule@Cudenver.edu (administrative point of contact for all scheduling items)</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">ANESTHESIA ROTATION SCHEDULING</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">We use <a href=\"https://www.qgenda.com\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">QGenda</a> for all resident scheduling. This can be accessed on your phone via the app or online at www.qgenda.com. You will get access granted at orientation from Anesthesia Education administration.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">QGenda is the place to check your schedule while you are on anesthesia rotations. Program may seem cumbersome at first, but you will get very comfortable with QGenda as it is what we use all of residency!</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">While on your anesthesia blocks, you will rotate through the STICU, CTICU, Acute pain service, General OR at UCH, Chronic Pain, Preprocedural Services. See rotation specifics below:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Disclaimer: day to day hours may vary on each rotation!</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">For specifics regarding the day-to-day details of these rotations, please refer to their respective sections within the green book.</p>",

// ─── PODCASTS PAGE ────────────────────────────────────────────────────────────
function pgPodcasts() {
  const res = getRes();
  const myCourses = res ? S.courses.filter(c => res.enrolled.includes(c.id)) : S.courses;

  // Module-linked podcast items (spotify OR podcast type)
  const moduleEpisodes = [];
  myCourses.forEach(course => {
    course.modules.forEach(mod => {
      (mod.content || []).forEach(item => {
        if(isPodcastType(item.type)) {
          moduleEpisodes.push({source:'module', course, mod, item,
            id: 'mod_'+item.id, label: item.label, url: item.url, type: item.type});
        }
      });
    });
  });

  // Standalone podcasts (admin-uploaded directly to this page)
  const standalone = (S.podcastLibrary || []).map(p => ({
    source:'standalone', course:null, mod:null, item:p,
    id: 'sa_'+p.id, label:p.label, url:p.url, type:p.type,
    description: p.description||'', tags: p.tags||''
  }));

  const allEpisodes = [...standalone, ...moduleEpisodes];

  // Filters
  const sourceFilter = S.podcastSourceFilter || 'all';
  const q = (S.podcastSearch || '').toLowerCase();
  let filtered = allEpisodes;
  if(sourceFilter === 'standalone') filtered = filtered.filter(e => e.source === 'standalone');
  if(sourceFilter === 'module') filtered = filtered.filter(e => e.source === 'module');
  if(q) filtered = filtered.filter(e =>
    e.label.toLowerCase().includes(q) ||
    (e.description||'').toLowerCase().includes(q) ||
    (e.tags||'').toLowerCase().includes(q) ||
    (e.mod?.title||'').toLowerCase().includes(q)
  );

  // Add/edit form (admin only)
  const editId = S.podcastEditId || null;
  const editItem = editId ? (S.podcastLibrary||[]).find(p=>p.id===editId) : null;
  const showForm = S.showPodcastForm || false;

  const addFormH = S.adminUnlocked ? (showForm ? `
    <div style="${card}padding:22px 24px;margin-bottom:24px;border:2px solid #E2CFA0;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
        <div style="${sLbl}">${editId?'Edit Podcast':'Add Podcast'}</div>
        <button onclick="cancelPodcastForm()" style="${gBtn}padding:5px 12px;font-size:12px;">✕ Cancel</button>
      </div>
      <div style="display:grid;gap:14px;">
        <div>
          <label style="${lbl}">Title / Episode Name *</label>
          <input id="pc-label" type="text" placeholder="e.g. ACCRAC Ep. 41 – Local Anesthetics" value="${(editItem?.label||'').replace(/"/g,'&quot;')}" style="${inp}" />
        </div>
        <div>
          <label style="${lbl}">URL *</label>
          <input id="pc-url" type="url" placeholder="Spotify, ACCRAC, Apple Podcasts, Buzzsprout, etc." value="${(editItem?.url||'').replace(/"/g,'&quot;')}" oninput="podcastUrlHint(this.value)" style="${inp}" />
          <div id="pc-url-hint" style="font-size:11px;color:#aaa;margin-top:4px;"></div>
        </div>
        <div>
          <label style="${lbl}">Description <span style="font-weight:400;color:#aaa;">(optional)</span></label>
          <textarea id="pc-desc" placeholder="Brief description or learning objectives…" style="${inp}min-height:72px;resize:vertical;">${editItem?.description||''}</textarea>
        </div>
        <div>
          <label style="${lbl}">Tags <span style="font-weight:400;color:#aaa;">(optional — comma separated)</span></label>
          <input id="pc-tags" type="text" placeholder="e.g. regional, ACCRAC, CA-1" value="${(editItem?.tags||'').replace(/"/g,'&quot;')}" style="${inp}" />
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;">
          <button onclick="cancelPodcastForm()" style="${gBtn}">Cancel</button>
          <button onclick="savePodcast(${editId?`'${editId}'`:'null'})" style="${pBtn()}padding:9px 20px;">
            ${editId?'Save Changes':'+ Add Podcast'}
          </button>
        </div>
      </div>
    </div>` : `<button onclick="S.showPodcastForm=true;S.podcastEditId=null;draw()" style="${pBtn()}display:inline-flex;align-items:center;gap:7px;padding:10px 18px;font-size:13px;margin-bottom:24px;">+ Add Podcast</button>`
  ) : '';

  // Episode cards
  
  // ── Build episode card (shared renderer) ──────────────────────────────────
  const buildEpCard = (ep) => {
    const active = S.activePlayer === ep.id;
    const isSpotify = ep.type === 'spotify';
    const isPodcast = ep.type === 'podcast';
    const eUrl = (isSpotify || isPodcast) ? buildEmbed(ep.url, ep.type) : null;
    const accentColor = isSpotify ? '#1DB954' : '#CFB87C';
    const bgActive = isSpotify ? '#F0FAF4' : '#FAF3DF';
    const borderActive = isSpotify ? '#1DB954' : '#A8924A';
    const sourceTag = ep.source ? `<span style="font-size:10px;padding:2px 8px;border-radius:99px;background:${isSpotify?'#E8FAF0':'#FAF3DF'};color:${isSpotify?'#1DB954':'#A8924A'};border:1px solid ${isSpotify?'#B8EDD0':'#E2CFA0'};font-weight:700;">${ep.source}</span>` : '';
    const embedHTML = (() => {
      if (!active) return '';
      if (isPodcast && ep.url.includes('accrac.com')) {
        return `<div style="margin-top:8px;border-radius:12px;overflow:hidden;border:1.5px solid #E2CFA0;">
          <div style="background:linear-gradient(135deg,#CFB87C 0%,#A8924A 100%);padding:14px 18px;display:flex;align-items:center;gap:12px;">
            <div style="width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">🎙️</div>
            <div style="flex:1;min-width:0;"><div style="font-size:10px;font-weight:700;color:rgba(27,27,27,.6);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px;">ACCRAC Podcast</div>
            <div style="font-size:14px;font-weight:700;color:#1B1B1B;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${ep.label}</div></div>
            <a href="${ep.url}" target="_blank" rel="noopener" style="font-size:11px;color:rgba(27,27,27,.6);text-decoration:none;flex-shrink:0;">accrac.com ↗</a>
          </div>
          <iframe src="${eUrl}" width="100%" height="380" frameborder="0" scrolling="no" class="podcast-embed-frame" style="display:block;background:#fff;" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-presentation allow-forms"></iframe>
        </div>`;
      }
      if (isSpotify) {
        return `<div style="margin-top:8px;border-radius:12px;overflow:hidden;border:1.5px solid #E2CFA0;">
          <div style="background:linear-gradient(135deg,#1DB954 0%,#158A3E 100%);padding:14px 18px;display:flex;align-items:center;gap:12px;">
            <div style="width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">🎧</div>
            <div style="flex:1;min-width:0;"><div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px;">Podcast / Audio</div>
            <div style="font-size:14px;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${ep.label}</div></div>
          </div>
          <iframe style="border-radius:0;" src="${eUrl}" width="100%" height="152" frameborder="0" allowfullscreen allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>`;
      }
      return '';
    })();

    return `<div style="${card}padding:16px 18px;">
      <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;">
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px;">${sourceTag}</div>
          <div style="font-weight:700;font-size:14px;color:#1a1a1a;line-height:1.35;">${ep.label}</div>
          ${ep.description ? `<div style="font-size:12px;color:#aaa;margin-top:3px;line-height:1.4;">${ep.description}</div>` : ''}
        </div>
        ${S.adminUnlocked ? `<button onclick="editPodcast('${ep.id}')" style="${gBtn}padding:5px 9px;font-size:11px;flex-shrink:0;">✏️</button>` : ''}
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <button onclick="togglePlayer(${ep.id})" style="flex:1;text-align:left;padding:8px 12px;border-radius:8px;border:1.5px solid ${active?borderActive:'#E8E5DF'};background:${active?bgActive:'#fff'};font-size:12px;font-weight:600;cursor:pointer;color:${active?accentColor:'#555'};">
          ${isPodcast ? (active?'▲ Close':'🎙️ Play')+' · ACCRAC Podcast' : isSpotify ? (active?'▲ Close':'🎧 Play')+' · Spotify' : '↗ Open'}
        </button>
        ${S.adminUnlocked ? `<button onclick="deletePodcastItem('${ep.id}')" style="${dBtn}padding:6px 10px;font-size:12px;">🗑</button>` : ''}
      </div>
      ${embedHTML}
    </div>`;
  };

  // ── Group into folders ─────────────────────────────────────────────────────
  const getFolder = (ep) => {
    // ACCRAC episodes — from library or module-linked
    if (ep.url && ep.url.includes('accrac.com')) return 'ACCRAC';
    if (ep.url && ep.url.includes('spotify.com') && ep.source !== 'module') return 'Spotify';
    // Module-linked non-ACCRAC episodes — group by course name
    if (ep.source === 'module') return ep.course?.title || 'Modules';
    // Library episodes with explicit source label
    if (ep.source && ep.source !== 'standalone') return ep.source;
    return 'Other';
  };

  const folderMap = {};
  filtered.forEach(ep => {
    const folder = getFolder(ep);
    if (!folderMap[folder]) folderMap[folder] = [];
    folderMap[folder].push(ep);
  });

  // Sort folders: ACCRAC first, then alphabetical
  const folderOrder = Object.keys(folderMap).sort((a,b) => {
    if (a === 'ACCRAC') return -1;
    if (b === 'ACCRAC') return 1;
    return a.localeCompare(b);
  });

  const openFolders = S.openPodcastFolders || {};

  const foldersH = filtered.length === 0 ?
    `<div style="grid-column:1/-1;text-align:center;padding:48px 0;color:#aaa;">No podcasts found. ${S.adminUnlocked?'Click "+ Add Podcast" above to add one.':''}</div>` :
    folderOrder.map(folder => {
      const eps = folderMap[folder];
      const isOpen = openFolders[folder] !== false; // default open
      const count = eps.length;
      return `<div style="grid-column:1/-1;">
        <button onclick="S.openPodcastFolders=S.openPodcastFolders||{};S.openPodcastFolders['${folder}']=!${isOpen};draw()" style="width:100%;display:flex;align-items:center;gap:10px;padding:12px 16px;background:${isOpen?'#1B1B1B':'#F4F2EE'};border:1.5px solid ${isOpen?'#1B1B1B':'#E8E5DF'};border-radius:10px;cursor:pointer;margin-bottom:${isOpen?'12px':'4px'};">
          <span style="font-size:18px;">${folder==='ACCRAC'?'🎙️':folder==='Spotify'?'🎧':folder==='YouTube'?'📺':'📁'}</span>
          <span style="flex:1;text-align:left;font-weight:700;font-size:14px;color:${isOpen?'#CFB87C':'#1a1a1a'};">${folder}</span>
          <span style="font-size:12px;color:${isOpen?'rgba(255,255,255,.4)':'#aaa'};">${count} episode${count!==1?'s':''}</span>
          <span style="font-size:14px;color:${isOpen?'rgba(255,255,255,.5)':'#ccc'};">${isOpen?'▲':'▼'}</span>
        </button>
        ${isOpen ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:20px;">${eps.map(buildEpCard).join('')}</div>` : ''}
      </div>`;
    }).join('');


  return `<div class="fade">
  <div style="margin-bottom:20px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;">
    <div>
      <div style="${sLbl}margin-bottom:6px;">Curriculum Audio</div>
      <h1 class="pg-title">Podcasts</h1>
      <p style="font-size:13px;color:#aaa;margin-top:6px;">${allEpisodes.length} episode${allEpisodes.length!==1?'s':''} · ${standalone.length} in library, ${moduleEpisodes.length} from modules</p>
    </div>
  </div>

  ${addFormH}

  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;">
    <div style="position:relative;flex:1;min-width:180px;">
      <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#bbb;pointer-events:none;">🔍</span>
      <input type="text" placeholder="Search podcasts…" value="${(S.podcastSearch||'').replace(/"/g,'&quot;')}"
        oninput="S.podcastSearch=this.value;draw()"
        style="${inp}padding-left:34px;font-size:13px;" />
    </div>
    <div style="display:flex;gap:6px;flex-shrink:0;">
      ${['all','standalone','module'].map((f,i)=>{
        const l=['All','Library','From Modules'][i];
        return `<button onclick="S.podcastSourceFilter='${f}';draw()" style="padding:7px 14px;border:1.5px solid ${sourceFilter===f?'#1B1B1B':'#E8E5DF'};border-radius:99px;background:${sourceFilter===f?'#1B1B1B':'#fff'};color:${sourceFilter===f?'#CFB87C':'#555'};font-size:12px;font-weight:${sourceFilter===f?700:400};cursor:pointer;white-space:nowrap;">${l}</button>`;
      }).join('')}
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;">${foldersH}</div>
</div>`;
}

function podcastUrlHint(url) {
  const el = document.getElementById('pc-url-hint');
  if(!el) return;
  const t = detectType(url);
  if(!url) { el.textContent=''; return; }
  if(t==='spotify') el.textContent='✓ Spotify detected — will embed inline';
  else if(t==='podcast') el.textContent='✓ Podcast host detected — will open in external player';
  else el.textContent='⚠ Unrecognized host — will open in external player';
  el.style.color = (t==='spotify'||t==='podcast') ? '#2D7D4F' : '#B87C2D';
}

async function deletePodcastItem(epId) {
  S._confirmFn = async () => {
    const lib = (S.podcastLibrary||[]).filter(p => p.id !== epId);
    S.podcastLibrary = lib;
    await sb.from('settings').upsert({key:'podcast_library', value: JSON.stringify(lib)});
    draw();
  };
  S.modal = {type:'confirm', data:{title:'Remove podcast?', msg:'This will remove it from the library. Module-linked episodes are not affected.'}};
  draw();
}

async function savePodcast(editId) {
  const label = document.getElementById('pc-label')?.value.trim();
  const url = document.getElementById('pc-url')?.value.trim();
  const desc = document.getElementById('pc-desc')?.value.trim();
  const tags = document.getElementById('pc-tags')?.value.trim();
  if(!label||!url) { alert('Title and URL are required.'); return; }
  const type = detectType(url);
  const lib = [...(S.podcastLibrary||[])];
  if(editId) {
    const idx = lib.findIndex(p=>p.id===editId);
    if(idx>=0) lib[idx] = {...lib[idx], label, url, type, description:desc, tags};
  } else {
    lib.push({id:'pc_'+Date.now(), label, url, type, description:desc, tags});
  }
  S.podcastLibrary = lib;
  S.showPodcastForm = false;
  S.podcastEditId = null;
  await sb.from('settings').upsert({key:'podcast_library', value:JSON.stringify(lib)});
  draw();
}

function editPodcast(id) {
  S.podcastEditId = id;
  S.showPodcastForm = true;
  draw();
}

async function deletePodcast(id) {
  if(!confirm('Delete this podcast?')) return;
  S.podcastLibrary = (S.podcastLibrary||[]).filter(p=>p.id!==id);
  await sb.from('settings').upsert({key:'podcast_library', value:JSON.stringify(S.podcastLibrary)});
  draw();
}

function cancelPodcastForm() {
  S.showPodcastForm = false;
  S.podcastEditId = null;
  draw();
}

function openModuleFromPodcast(courseId, modId) {
  S.activeCourseId = courseId;
  S.activeModuleId = modId;
  S.moduleTab = 'content';
  S.view = 'module';
  draw();
}

// ─── NOTES PAGE ───────────────────────────────────────────────────────────────
function pgNotes() {
  const res = getRes();
  if(!res) return '';
  const notes = S._notes || {};

  // Build list of all modules with notes across all enrolled courses
  const myCourses = S.courses.filter(c => res.enrolled.includes(c.id));
  const allNotedModules = [];
  myCourses.forEach(course => {
    course.modules.forEach(mod => {
      const key = `note_${res.id}_${mod.id}`;
      const txt = (notes[key] || '').trim();
      if(txt) allNotedModules.push({course, mod, key, txt});
    });
  });

  // Search/filter
  const q = (S.notesSearch || '').toLowerCase();
  const courseFilter = S.notesFilterCourse || 'all';
  let filtered = allNotedModules;
  if(q) filtered = filtered.filter(n => n.txt.toLowerCase().includes(q) || n.mod.title.toLowerCase().includes(q));
  if(courseFilter !== 'all') filtered = filtered.filter(n => String(n.course.id) === courseFilter);

  // Course filter buttons
  const courseFilterBtns = [
    {id:'all', label:'All Courses'},
    ...myCourses.map(c => ({id: String(c.id), label: c.icon + ' ' + c.title.split(' ').slice(0,3).join(' ')}))
  ].map(b => `<button onclick="S.notesFilterCourse='${b.id}';draw()" style="padding:6px 14px;border:1.5px solid ${courseFilter===b.id?'#1B1B1B':'#E8E5DF'};border-radius:99px;background:${courseFilter===b.id?'#1B1B1B':'#fff'};color:${courseFilter===b.id?'#CFB87C':'#555'};font-size:12px;font-weight:${courseFilter===b.id?700:400};cursor:pointer;white-space:nowrap;">${b.label}</button>`
  ).join('');

  // Notes cards
  const noteCards = filtered.length ? filtered.map(({course, mod, key, txt}) => {
    const cc = CC[course.id] || CC[1];
    const preview = txt.length > 200 ? txt.slice(0, 200) + '…' : txt;
    const lines = txt.split('\n').filter(l=>l.trim()).length;
    return `<div style="${card}padding:0;overflow:hidden;cursor:pointer;transition:box-shadow .15s;"
      onmouseover="this.style.boxShadow='0 6px 24px rgba(0,0,0,.08)'"
      onmouseout="this.style.boxShadow=''"
      onclick="openNoteFromPage(${course.id},${mod.id})">
      <div style="background:${cc.bg};padding:12px 18px;display:flex;align-items:center;gap:10px;">
        <div style="width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">${course.icon}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:10px;font-weight:700;color:${cc.accent};text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px;">${course.title}</div>
          <div style="font-size:13px;font-weight:700;color:${cc.text};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Wk ${mod.week}: ${mod.title}</div>
        </div>
        <span style="font-size:10px;color:rgba(255,255,255,.4);flex-shrink:0;">${lines} line${lines!==1?'s':''}</span>
      </div>
      <div style="padding:14px 18px;">
        <p style="font-size:13px;color:#444;line-height:1.65;margin:0 0 12px;white-space:pre-wrap;word-break:break-word;">${preview}</p>
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
          <span style="font-size:11px;color:#CFB87C;font-weight:600;">Open module to edit →</span>
          <button onclick="event.stopPropagation();clearNoteFromPage('${key}')" style="${dBtn}font-size:11px;padding:3px 10px;">Delete</button>
        </div>
      </div>
    </div>`;
  }).join('') : `<div style="${card}padding:48px;text-align:center;">
    <div style="font-size:48px;margin-bottom:16px;">📝</div>
    <div style="font-size:16px;font-weight:700;margin-bottom:8px;">${q||courseFilter!=='all'?'No matching notes':'No notes yet'}</div>
    <div style="font-size:13px;color:#aaa;margin-bottom:20px;">${q||courseFilter!=='all'?'Try adjusting your search or filter.':'Open any module and click the Notes tab to start writing.'}</div>
    ${q||courseFilter!=='all'?`<button onclick="S.notesSearch='';S.notesFilterCourse='all';draw()" style="${gBtn}">Clear filters</button>`:`<button onclick="go('courses')" style="${pBtn()}">Browse Courses</button>`}
  </div>`;

  const totalCount = allNotedModules.length;

  return `<div class="fade">
  <div style="margin-bottom:24px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;">
    <div>
      <div style="${sLbl}margin-bottom:6px;">Personal Study Notes</div>
      <h1 class="pg-title">My Notes</h1>

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff/60000);
  const h = Math.floor(diff/3600000);
  const d = Math.floor(diff/86400000);
  if (m < 1)  return 'just now';
  if (m < 60) return m + 'm ago';
  if (h < 24) return h + 'h ago';
  if (d < 7)  return d + 'd ago';
  return new Date(ts).toLocaleDateString();
}

function identityBack() {
  _identityStep = 'pick';
  _identityResId = null;
  _identityNewPin = null;
  draw();
}

async function identityNext() {
  const id = document.getElementById('identity_select')?.value;
  if (!id) { alert('Please select your name.'); return; }
  _identityResId = id;
  // Check if this resident already has a PIN in Supabase
  try {
    const rows = await dbGet('settings', 'key', 'pin_' + id);
    if (rows && rows.length > 0) {
      _identityStep = 'pin';
    } else {
      _identityStep = 'setpin';
    }
  } catch(e) {
    _identityStep = 'setpin';
  }
  draw();
  setTimeout(() => document.getElementById('pin_input')?.focus(), 100);
}

async function identitySubmitPin() {
  const entered = document.getElementById('pin_input')?.value;
  if (!entered || entered.length < 4) return;
  try {
    const rows = await dbGet('settings', 'key', 'pin_' + _identityResId);
    const stored = rows?.[0]?.value?.replace(/"/g, '');
    if (entered === stored) {
      await identityComplete(_identityResId);
    } else {
      document.getElementById('pin_err').textContent = 'Incorrect PIN. Try again.';
      document.getElementById('pin_input').value = '';
      document.getElementById('pin_input').focus();
    }
  } catch(e) {
    document.getElementById('pin_err').textContent = 'Error checking PIN. Try again.';
  }
}

function identityConfirmPin() {
  const pin = document.getElementById('pin_input')?.value;
  if (!pin || pin.length < 4) return;
  _identityNewPin = pin;
  _identityStep = 'confirmpin';
  draw();
  setTimeout(() => document.getElementById('pin_input')?.focus(), 100);
}

async function identityFinishSetPin() {
  const confirm = document.getElementById('pin_input')?.value;
  if (!confirm || confirm.length < 4) return;
  if (confirm !== _identityNewPin) {
    document.getElementById('pin_err').textContent = 'PINs don\'t match. Try again.';
    document.getElementById('pin_input').value = '';
    document.getElementById('pin_input').focus();
    return;
  }
  // Save PIN to Supabase
  await dbUpsert('settings', { key: 'pin_' + _identityResId, value: JSON.stringify(_identityNewPin) });
  await identityComplete(_identityResId);
}

async function identityComplete(id) {
  saveL('al6_identity', id);
  S.activeResidentId = id;
  _identityStep = 'pick';
  _identityResId = null;
  _identityNewPin = null;
  // Load progress
  if (S.dbReady) {
    try {
      const progressRows = await dbGet('progress', 'resident_id', id);
      const completedModIds = new Set(progressRows.filter(p=>p.completed).map(p=>String(p.module_id)));
      S.courses = S.courses.map(c => ({...c, modules: c.modules.map(m => ({
        ...m, completed: completedModIds.has(String(m.id))
      }))}));
    } catch(e) {}
    // Load notes in background
    loadAllNotes(id);
  }
  S.view = 'dashboard';
  draw();
}

// ─── APP BOOTSTRAP ────────────────────────────────────────────────────────────
async function bootstrap() {
  draw(); // show loading screen

  try {
    // Seed residents if table is empty
    const existingResidents = await dbGet('residents');
    if (!existingResidents.length) {
      await Promise.all(DEF_RESIDENTS.map(r => dbUpsert('residents', {
        id:r.id, name:r.name, year:r.year, chief:!!r.chief, enrolled:r.enrolled
      })));
    }

    // Seed courses if table is empty
    const existingCourses = await dbGet('courses');
    if (!existingCourses.length) {
      await Promise.all(COURSES_DATA.map(c => dbUpsert('courses', {id:c.id, data:c})));
    }

    // Load all data in parallel
    const [resRows, courseRows, eventRows, kudosRows, quizRows, evalRows, suggRows, icsUrlSetting, podcastLibSetting, adminResourcesSetting, rotResourcesSetting, profResourcesSetting] = await Promise.all([
      dbGet('residents'),
      dbGet('courses'),
      dbGet('events'),
      dbGet('kudos'),
      dbGet('quizzes'),
      dbGet('evaluations'),
      dbGet('suggestions'),
      dbGetSetting('icsUrl', ''),
      dbGetSetting('podcast_library', '[]'),
      dbGetSetting('admin_resources', '[]'),
      dbGetSetting('rotation_resources', '[]'),
      dbGetSetting('professional_resources', '[]'),
    ]);

    // Hydrate residents
    S.residents = resRows.map(r => ({
      id:r.id, name:r.name, year:r.year, chief:r.chief, enrolled:r.enrolled||[], email:r.email||'', phone:r.phone||''
    }));

    // Hydrate courses — merge with progress for this resident
    const resId = S.activeResidentId;
    const progressRows = resId ? await dbGet('progress','resident_id',resId) : [];
    const completedModIds = new Set(progressRows.filter(p=>p.completed).map(p=>String(p.module_id)));

    S.courses = courseRows.map(row => {
      const c = row.data;
      return {...c, modules: c.modules.map(m => ({
        ...m, completed: completedModIds.has(String(m.id))
      }))};
    }).sort((a,b) => a.id - b.id);

    // Hydrate events
    S.events = eventRows;

    // Hydrate kudos
    S.kudos = kudosRows.sort((a,b) => b.ts - a.ts).map(k => ({
      ...k, recipientId:k.recipient_id, recipientName:k.recipient_name,
      badgeId:k.badge_id, badgeEmoji:k.badge_emoji, badgeLabel:k.badge_label
    }));

    // Hydrate quizzes
    S.quizzes = quizRows.map(q => ({...q, docxBytes:q.docx_bytes}));

    // Hydrate evaluations
    S.evaluations = evalRows || [];
    try { S.adminResources = JSON.parse(adminResourcesSetting || '[]'); } catch { S.adminResources = []; }
    try { S.rotationResources = JSON.parse(rotResourcesSetting || '[]'); } catch { S.rotationResources = []; }
    try { S.professionalResources = JSON.parse(profResourcesSetting || '[]'); } catch { S.professionalResources = []; }
    S.suggestions = suggRows || [];

    // Hydrate ICS url
    S.icsUrl = icsUrlSetting || '';
    try { S.podcastLibrary = JSON.parse(podcastLibSetting || '[]'); } catch { S.podcastLibrary = []; }

    S.dbReady = true;

    // Check if we need identity selection
    const savedId = loadL('al6_identity', null);
    const validId = savedId && S.residents.find(r => r.id === savedId);
    if (!validId) {
      S.view = 'identity';
    } else {
      S.activeResidentId = savedId;
      S.view = 'dashboard';
      // Load notes in background for returning resident
      loadAllNotes(savedId);
    }

  } catch(e) {
    console.error('Bootstrap failed:', e);
    // Fall back to static data
    S.dbReady = false;
    S.view = 'identity';
  }

  draw();

  // Auto-fetch ICS if configured
  if (S.icsUrl) {
    try { fetchICS(); } catch(e) {}
  }

  // Check push status and register if first time
  await checkPushStatus();
  if (!S.pushRegistered && Notification.permission === 'default') {
    // Prompt after a short delay so it doesn't feel abrupt
    setTimeout(registerPush, 3000);
  }
}

bootstrap();


</script></body></html>
