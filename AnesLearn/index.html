d:#fff;text-align:left;cursor:pointer;font-size:13px;font-weight:600;width:100%;\">🚑 Denver Health</button></div></div><div><div style=\"font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 6px;\">Subspecialty OR</div><div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;\"><button onclick=\"S.rotationSubsec='ob';draw()\" style=\"padding:10px 14px;border-radius:8px;border:1.5px solid #E8E5DF;background:#fff;text-align:left;cursor:pointer;font-size:13px;font-weight:600;width:100%;\">🤱 OB Anesthesia</button><button onclick=\"S.rotationSubsec='txp';draw()\" style=\"padding:10px 14px;border-radius:8px;border:1.5px solid #E8E5DF;background:#fff;text-align:left;cursor:pointer;font-size:13px;font-weight:600;width:100%;\">🫀 Transplant</button><button onclick=\"S.rotationSubsec='ct';draw()\" style=\"padding:10px 14px;border-radius:8px;border:1.5px solid #E8E5DF;background:#fff;text-align:left;cursor:pointer;font-size:13px;font-weight:600;width:100%;\">❤️ Cardiothoracic</button><button onclick=\"S.rotationSubsec='neuro';draw()\" style=\"padding:10px 14px;border-radius:8px;border:1.5px solid #E8E5DF;background:#fff;text-align:left;cursor:pointer;font-size:13px;font-weight:600;width:100%;\">🧠 Neuroanesthesia</button><button onclick=\"S.rotationSubsec='chco';draw()\" style=\"padding:10px 14px;border-radius:8px;border:1.5px solid #E8E5DF;background:#fff;text-align:left;cursor:pointer;font-size:13px;font-weight:600;width:100%;\">👶 Children's (CHCO)</button><button onclick=\"S.rotationSubsec='cp';draw()\" style=\"padding:10px 14px;border-radius:8px;border:1.5px solid #E8E5DF;background:#fff;text-align:left;cursor:pointer;font-size:13px;font-weight:600;width:100%;\">🩺 Chronic Pain</button></div></div><div><div style=\"font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 6px;\">ICU</div><div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;\"><button onclick=\"S.rotationSubsec='sticu';draw()\" style=\"padding:10px 14px;border-radius:8px;border:1.5px solid #E8E5DF;background:#fff;text-align:left;cursor:pointer;font-size:13px;font-weight:600;width:100%;\">🩻 STICU</button><button onclick=\"S.rotationSubsec='cticu';draw()\" style=\"padding:10px 14px;border-radius:8px;border:1.5px solid #E8E5DF;background:#fff;text-align:left;cursor:pointer;font-size:13px;font-weight:600;width:100%;\">🏥 CTICU</button></div></div><div><div style=\"font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 6px;\">CA-3</div><div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;\"><button onclick=\"S.rotationSubsec='senior';draw()\" style=\"padding:10px 14px;border-radius:8px;border:1.5px solid #E8E5DF;background:#fff;text-align:left;cursor:pointer;font-size:13px;font-weight:600;width:100%;\">⭐ Senior Month</button><button onclick=\"S.rotationSubsec='pacu';draw()\" style=\"padding:10px 14px;border-radius:8px;border:1.5px solid #E8E5DF;background:#fff;text-align:left;cursor:pointer;font-size:13px;font-weight:600;width:100%;\">🛏️ PACU</button><button onclick=\"S.rotationSubsec='pocus';draw()\" style=\"padding:10px 14px;border-radius:8px;border:1.5px solid #E8E5DF;background:#fff;text-align:left;cursor:pointer;font-size:13px;font-weight:600;width:100%;\">🔊 POCUS</button><button onclick=\"S.rotationSubsec='inverness';draw()\" style=\"padding:10px 14px;border-radius:8px;border:1.5px solid #E8E5DF;background:#fff;text-align:left;cursor:pointer;font-size:13px;font-weight:600;width:100%;\">🏔️ Inverness</button></div></div><div><div style=\"font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 6px;\">Reference</div><div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;\"><button onclick=\"S.rotationSubsec='ob-cookbook';draw()\" style=\"padding:10px 14px;border-radius:8px;border:1.5px solid #E8E5DF;background:#fff;text-align:left;cursor:pointer;font-size:13px;font-weight:600;width:100%;\">📖 OB Cookbook</button><button onclick=\"S.rotationSubsec='ct-att';draw()\" style=\"padding:10px 14px;border-radius:8px;border:1.5px solid #E8E5DF;background:#fff;text-align:left;cursor:pointer;font-size:13px;font-weight:600;width:100%;\">👨‍⚕️ CT Attending Prefs</button><button onclick=\"S.rotationSubsec='vpn';draw()\" style=\"padding:10px 14px;border-radius:8px;border:1.5px solid #E8E5DF;background:#fff;text-align:left;cursor:pointer;font-size:13px;font-weight:600;width:100%;\">🔐 VPN / Remote Access</button><button onclick=\"S.rotationSubsec='contacts';draw()\" style=\"padding:10px 14px;border-radius:8px;border:1.5px solid #E8E5DF;background:#fff;text-align:left;cursor:pointer;font-size:13px;font-weight:600;width:100%;\">📞 Contacts</button><button onclick=\"S.rotationSubsec='qgenda';draw()\" style=\"padding:10px 14px;border-radius:8px;border:1.5px solid #E8E5DF;background:#fff;text-align:left;cursor:pointer;font-size:13px;font-weight:600;width:100%;\">📅 QGenda Glossary</button><button onclick=\"S.rotationSubsec='interns';draw()\" style=\"padding:10px 14px;border-radius:8px;border:1.5px solid #E8E5DF;background:#fff;text-align:left;cursor:pointer;font-size:13px;font-weight:600;width:100%;\">🌱 Intern Info</button><button onclick=\"S.rotationSubsec='links';draw()\" style=\"padding:10px 14px;border-radius:8px;border:1.5px solid #E8E5DF;background:#fff;text-align:left;cursor:pointer;font-size:13px;font-weight:600;width:100%;\">🔗 Useful Links</button></div></div></div>",
  "aps": "<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">Acute Pain Service (APS)</h1>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Most Recently Updated by Alex Linse MD, June 2025</p>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!WARNING]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">Currently a <strong>Draft</strong>; still needs reformatting</div>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Important People</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Director, Acute Pain Service: Dr. Olivia Romano</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">APS Attendings: Drs. Roland Flores, Adrian Hendrickse, Kyle Marshall, Marina Shindell, Inge Tamm-Daniels, Matt Lyman, Jake Lloyd, Keleigh McLaughlin, Mike Canepa, Simrat Kaur, Aidan Hoie, Nathan Reitberg, Mitchell Gist, Renuka George</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">APS Advanced Practice Providers (APPs): Rob Montgomery (Lead), Robin Konrad, Allison Wines, Holly Bender, Leah Vick, Morgan Klas</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Acute pain is a different rotation since you are not in the OR. You will be placing pre-operative regional nerve blocks and epidurals for post-operative pain management. You will be managing patients with epidurals and nerve block catheters on the floor, and you will be performing pain consults throughout the hospital for patients with complex pain management. It can be hectic at times and being very organized is key! You will be managing orders and checking out drugs for many different patients over the course of the day and there is a lot of paperwork!</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There is typically a CA-1 on APS-Pain (rounding service), a CA-1 on APS-Regional (blocks), and a CA-3 on APS-Regional. Occasionally, there will be an intern on APS-Pain as well. Each resident, from both the Pain and Regional services, will cover one weekend of rounding, including interns.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Prior to starting</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Get an orientation from the residents currently on service. Be sure they show you where to find equipment in the storeroom, how to make the daily block lists, the order-sets for blocks/ultrasound and epidurals, and which services to sign into on Haiku</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Meet with Rob Montgomery. Rob is our Clinical Nurse Specialist on service and is very helpful in familiarizing you with the ins and outs of the EPIC and APS rounding lists as well as how to navigate the ZZ PAIN MEDICINE context.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">MOST IMPORTANT: READ!! You will be expected to know WHY you are performing the blocks, not just HOW to do them. This is a good time to familiarize yourself with topics such as:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Local anesthetics -- mechanisms of action, toxicity, allergies, use in peripheral v. neuraxial anesthesia.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Upper extremity blocks -- interscalene, supraclavicular, infraclavicular, axillary</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Lower extremity blocks -- femoral, saphenous, popliteal, ankle</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Neuraxial -- Epidurals (difference between thoracic and lumbar), spinal, combined spinal epidural.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Videos and ultrasound images of the various blocks</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Block Buddy Pro ($99/year - can use education funds)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Great resource for quick reference, great US technique instructions and pictures.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">ASRA coags App</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Each afternoon…</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">“The List”</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The OR Schedule for the following day will be delivered to you by the pre-op charge nurse in the late morning or early afternoon. Your job is to mark the cases that will need blocks with a “B” on that list and then fill out the indicated information on the APS block list worksheet for the following day. This block list is located on Microsoft Teams, under Department of Anesthesiology/APS/Files/APS Daily Block list.xls.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The columns include Patient name, Procedure/Block, Sedation/Meds, Block Note, PostOp Orders, APS Rounding List, Anesthesia Consult, EPIC List</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Once you have finished writing down the info you need from the case list, return it to the charge nurse so those patients can be placed in bays near the APS desk in the morning. This is usually one of their final tasks before going home, so they appreciate your expedience in returning it to them ;).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If you are unsure if a particular case or patient requires a block, ask your attending or fellow. It has become customary to email the attending surgeon the day prior to confirm if they want regional anesthesia for their patient(s). This is typically the job of the APS fellow.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Most Orthopedic surgeons (Dayton, Hogan) expect blocks for their total joints and typically do not need to be emailed unless there are extenuating circumstances. However, you MUST email the Ortho Trauma surgeons (Gorman, Stoneback, Alfonso) and Dr. Lindeque for confirmation. They often prefer post-op blocks or no block at all.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Be sure to CC the following day’s APS team including the attending, fellow, and resident (if not yourself), as well as the in-room attending and resident to be sure everyone is on the same page.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Note the number of first case starts as you may need to call in reinforcements (e.g., APS Rounding Resident, Senior Days, Wildcard) to get them all done.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If there are transplant or thoracic patients requiring epidurals, you may need to recruit the in room resident. It is your responsibility to contact and confirm this with that resident. You will need to get the pertinent information from this resident for The Rounding list (LOR, catheter depth, etc.) and to complete orders.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The above communication with the other residents and the surgeons should be noted on the Block List.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Peri-Op Order Sets</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There is an APS Peri and Post op order set (see end of section). This order set has been organized as a combined effort between these surgical teams and the APS to include certain pain medications these patients should receive perioperatively and post op (Total Joints). If patients are on a particular pain regimen at home, this needs to be reviewed with the patient prior to going into surgery and addressed at the time of placing postop orders.  It may be appropriate to reorder home pain meds immediately or have alternative analgesia ordered.  It is best to coordinate these decisions with the primary team.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Placing orders the night before eliminates confusion and keeps things moving in the morning. It is helpful to put these orders in while you are making the Block list for the following day as you will already be in the patient’s chart at that time.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Equipment</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Syringes for controlled meds</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The APS team administers ketamine, versed, and fentanyl for procedures that are separate from the in-room provider’s standard narcotic bag. Be sure to have 3cc syringes with 18g needles on them ready.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Neuraxial Blocks</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Epidurals</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There are lists of what items should be gathered for an epidural hanging in the storeroom. Make sure the current resident on service shows you how to put these together.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">ProTip: If you ever have to place an epidural on the floor or in the ICU, be sure to take 2 of everything with you because these supplies are lacking in off-site locations. Also, be sure to grab a pair of gloves for your attending.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Spinals</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Intrathecal morphine (ITM) and other spinal injections are typically performed in the OR by the in-room providers. They should be prepared to get their own supplies for these procedures in the morning.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">HOWEVER, you are still responsible for the other ‘administrative’ tasks surrounding that patient so the rounding team can follow-up on POD1...more on that later...</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Peripheral Nerve Blocks (PNBs)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Note in the “Cookbook” (in the storeroom, have the current resident on service show you) the likely volume you will need and set up your syringe/3-way stopcocks accordingly (Ex: 1-20cc and 1-10cc syringe on a 3-way stopcock will get you through most PNBs). Remember these medications should be drawn up as close to procedure time as possible as they all have expiration times after being drawn up. Store them in the LOCKED cart I the APS storage room</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Overnight call</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Please refer to the Rounding resident responsibilities for information on call/weekend tasks including the role our APPs play in the care of our patients.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">In the morning…</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You should arrive early to make sure there have been no major changes to the OR schedule affecting your planned first case starts.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Beginning at 0630 (0730 on Mondays), you may begin consenting the patients. However, you should arrive much earlier than this to allow time for any unanticipated roadblocks that may result in a late first-case start.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Prior to 0630, you should double-check the schedule (as previously mentioned) making sure you have heard back from the surgical team regarding blocks you may have been unsure about the evening prior. If you have not heard back and still have questions, now is a good time to look in Amion and page the surgical team to find out. (Amion password: uco)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">This is also a good time to start drawing up local anesthetic for the first-case starts</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Consents</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">As each patient is ready to be consented, be sure to do the following:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Introduce yourself as part of the APS and what your role is (will not be in the OR, Rounding team plans to follow-up with you on POD1, despite looking so young you are, in fact, a doctor, etc.)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Perform a brief H&P</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">H/o regional/neuraxial anesthesia?</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Allergies to local anesthetics?</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">On blood thinners?</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If so, what? When was last dose?</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You will need to familiarize yourself with the ASRA guidelines (get the ASRA Coags App) regarding anticoagulants/antiplatelet medications for this rotation -- AND THE BOARDS!</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Any neuropathies? Weakness? Numbness? Movement disorders?</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Perform a basic neuro exam on all patients recieving a block.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Make sure you document these in your block note, it’s called CYA!</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Airway exam</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Chronic pain issues, and home pain regimen</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">LOOK AT THE SITE TO BE BLOCKED!</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Note any rashes, bruising, swelling, scars, hardware, bandages/casts.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Consents should include, but not be limited to risk of infection, bleeding, nerve damage, failed block, pain, LAST.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Be sure to always consent for general anesthesia along with your neuraxial/peripheral block and any other lines, procedures, depths of anesthesia the in-room providers may need.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Once you consent the patient, indicate that on the Block list. Before you move on to the next patient, politely ask that patient’s nurse to begin putting on monitors so once you grab your local, ultrasound, ketamine/versed, and glove up-- you’re all set!</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Performing the block</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Make sure all consents are signed prior to administering sedation. If there is not a surgical consent yet avoid sedating medicines.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">For procedures with laterality, the site must be marked. We are also rolling out a new process that the site must be marked by an APS fellow or attending prior to block.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Make sure to place an order for the “Ultrasound Guided Nerve Block-APS” so you can pull the patient up on the ultrasound and save the block images to their chart.  This order is located in the Nerve Block Order Set and the Preop Anesthesia Order Set.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Politely ask family members to step out. Be sure to have on your mask, cap, and sterile gloves. Perform a time out with the patient’s preop nurse; make sure you touch on allergies, pre-existing neuropathy/weakness, and anticoagulation.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Block with the attending present.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Once you have finished your block, be sure to clean up your sharps, return the ultrasound to the storeroom and clean it, use the block list to document your narcotics, loss of resistance and catheter depth, test dose, time of placement, and any other pertinent information needed for your epidural orders or block note -- which you can write a little later when things settle down.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Block Documentation</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">It is your responsibility to place each new block patient on the rounding list (this also includes the patients on Total Joint Protocol who do not get a block)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">APS Rounding list can be found via Epic, ask Rob Montgomery or any on service to share access to the patient list with you.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Include the specifics of each block, PCEA settings, and prn meds on your sign out. Also include pertinent home meds, such as their pain regimen, and pertinent medical history. Rob is great in terms of instructing you on how to fill out the Rounding list.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Ex: T8-9, PCEA B0.1 H7 8/4/15 (i.e., bupivacaine 0.1%, hydromorphone 7 mcg/ml, basal 8ml/h, demand 4ml, q15 min lockout).  Save time and effort by abbreviating as much as possible, but don’t sacrifice the meaning.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">EPIC list: find \"patient lists\" tab on the top of the EPIC screen. Find \"shared patient list\" on the left side and click the \"+\" sign. APS should pop up. To add your patient, click [Add Patient], and then click on them under the recent patients tab.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">All blocks also need to be charted in EPIC. To do this, get into the intraop record and click the button titled \"blocks\". Follow the tabs and fill out accordingly.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Rounding Resident Duties:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">NOTE: Some days you may be asked to arrive in time to help with first start blocks. Work this out with your co-resident and fellow.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Pre-rounding</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Rounding is best done from the ZZ Pain Medicine context (also used in your pain clinic rotation).  You can do some rounding activities from the ZZ Anesthesia context, but it is much less robust: with a patient highlighted in patient lists, choose the “Rounding” button in the patient list menu directly above the list.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You are expected to look up the floor patients (pre-round) in EPIC after placing first start blocks in order to speed up team rounds. Pay close attention to pain scores, vitals, PCA/PCEA usage, labs, anticoagulation, primary team notes.  In the Summary activity tab within ZZ Pain, add (wrench in) the following reports: Pain, Adult Comprehensive, Med History, Active Meds, Labs.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">AM Rounds</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Weekday: Team rounds (attending, resident, pharmacist, +/-APP) typically start at 9am but this may vary depending on census or attending.  Discuss the rounding plan the evening before with the rounding attending.  The day APP will divide the rounding list between you and the other APP(s) on that day. Make sure you print a list for the attending as well. You will see all the ICU patients and typically also patients you rounded on or blocked the day before.  The list is usually divided evenly to distribute the workload.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Discuss with your attending/fellow that week to determine if you need to pre-round on patients. Usually, you just chart review and then everyone rounds together.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Pharmacists will place orders under your direction during rounds, be sure to clearly communicate with them so as not to forget or duplicate orders.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">After rounds, write notes for all the patients that you rounded on, refer to helpful Smart (dot) phrases below.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Weekends: Sign out from the overnight APP will occur at 7 am. Touch base with your attending beforehand to decide a start time for rounds. Usually there is an APP, and you should split the patients. If not, you must round on and write notes on all of them.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Contact pharmacist prior to starting so they can meet you before rounds.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">After rounds, write notes on all patients and take care of floor duties. You are expected to stay at the hospital covering the service / pager until sign out to the overnight APP at 7pm</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">ProTip: Make a little bag with 1% lidocaine, phenylephrine, dressing supplies to bring on rounds to troubleshoot epidurals. Note: Do not change/bolus a PCEA or IVPCA pump on rounds or in PACU.  If something needs to be done immediately, notify the RN and they will do it.  If you syringe bolus an epidural with local anesthetic, you are responsible for staying at the patient’s bedside for at least 30 minutes monitoring the patient. (See APS Protocol for Epidural Placement/Bolus on the Floor).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Post-Rounds</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">After your notes are done, you take care of any floor duties and try to follow up on patients that were blocked that day, either in the PACU or on the floor. When it’s busy, prioritize checking on the epidurals so you can give the overnight APP a good sign out about them. Update both the APS Rounding and EPIC lists, ensure all new patient’s info is entered, including their room numbers so the overnight APP can do PM rounds on them. In the afternoon between ~3-4pm, the day APPs will sign their patients and any new consults out to you, after which you will be responsible for all the patients on service and any new consults until sign out to the overnight APP at 7pm. Of note, some attendings may want to do afternoon rounds whereas others just run the list.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">PM Sign Out</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There will be an APP or fellow in house overnight every day of the month. Sign out occurs in the APS area of preop, have an updated Rounding list (with room numbers) printed to review with the APP.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If there is no APP (2/2 acation, leave etc.), then you will likely sign out to the Senior Nights resident.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Their shift begins at 9pm. If you are the late resident, you will stay in-house until 7pm and take home call from 7p-9p when you can call the Senior Nights resident to provide handoff.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">When to Sign-Off Patients</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Epidurals: will follow until the day you pull the epidural out. Be sure to check if the patient is on any anticoagulants and follow the ASRA guidelines in regard to timing for pulling epidural catheters. It is recommended to d/c or modify the current anticoag order to skip a dose, then reorder as appropriate. Using a nursing communication to hold an anticoag dose can be missed by the RN. It is standard to transition the patient to oral pain medicines after the infusion has been stopped but before pulling the actual catheter (make sure their pain is controlled with PO meds!). Place a note after pulling the catheter noting the patient's anticoagulation status and include that the \"tip was intact\". Moreover, always discuss your plans with the surgical team before pulling your epidural (especially CT!) Patients with chest tubes typically maintain their epidural until their chest tube is removed.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">IT Duramorph/hydromorphone/spinal anesthetic: sign off 24 hrs post-block.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Peripheral nerve blocks: sign off POD#1 if single-shot block performed (ensure complete block resolution). For nerve catheters, follow patients for as long as they have catheter in place.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Resources </h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">The course syllabus </li>\n<li style=\"font-size:13px;\">TrueLearn </li>\n<li style=\"font-size:13px;\">Barash, Miller, Morgan and Mikhail</li>\n<li style=\"font-size:13px;\">ASRA.com </li>\n</ul>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Latest guidelines and advisories </h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">NYSORA.com, SafeUltrasound.org</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Smart/Dot Phrases</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Rob will share with you dot phrases for use in writing notes.  Be sure to consistently use these note templates to initiate new notes and to copy forward existing notes where appropriate.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Order sets</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">UCH APS Peri & Post op Pain Management</p>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">Protocol for total joints, open abdominal and thoracic cases. Place preop orders the night before. </div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">Must follow all total joints for at least 24h regardless of whether a block or spinal morphine is placed (see Total Joint Pain Management Protocol) * </div>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">UCH Continuous Nerve Block Infusion and Single Shot Nerve Block</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">UCH Intrathecal Morphine Injection</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">normal dose 100-250mcg Duramorph (if shortage, 50-100mcg IT hydromorphone)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">UCH IV PCA</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">UCH PCEA</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">UCH Ketamine Continuous Infusion for Analgesia</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">UCH Intrathecal Infusion Analgesia</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">UCH Ambulatory Continuous Nerve Block Infusion</p>",
  "chco": "<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">Childrens Hospital Colorado (CHCO)</h1>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">Most recently updated by Alex Linse, MD in September, 2025</div>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Primary Contacts </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Residency Rotation Site Director</strong></p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Carolyn Weinberger, MD </li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- carolyn.Weinberger@childrenscolorado.org</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Administrative Assistants:</strong></p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Rotation coordinator: Lindsay Baumgartner (x74999),lindsay.baumgartner@childrenscolorado.org </li>\n<li style=\"font-size:13px;\">Stephanie Tymoszuk (x72648) or Delores Cano (x73163) anesthesiascheduling@childrenscolorado.org </li>\n</ul>\n<details style=\"margin:8px 0;border:1px solid #E8E5DF;border-radius:8px;padding:10px 14px;\"><summary style=\"cursor:pointer;font-weight:600;font-size:13px;\">**Phone Numbers: (also see cards)**</summary><div style=\"margin-top:10px;\">\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Main CHCO Hospital Operator: x71234 </li>\n<li style=\"font-size:13px;\">Anesthesiologist Charge: \t\tx78339 </li>\n<li style=\"font-size:13px;\">Anesthetist Charge:  \t\t\tx72255 </li>\n<li style=\"font-size:13px;\">Anesthesia Tech Charge:\t\tx73939 </li>\n<li style=\"font-size:13px;\">Acute Pain Service (APS):\t\tx75433 (7-LIFE) </li>\n<li style=\"font-size:13px;\">Chronic Pain Clinic/Consults:\t\tx74122 </li>\n<li style=\"font-size:13px;\">Anesthesia OB Provider:\t\tx70037</li>\n<li style=\"font-size:13px;\">Omnicell:      x76747</li>\n<li style=\"font-size:13px;\">OR/ICU pharmacy:\t\t\tx76741/76742 </li>\n<li style=\"font-size:13px;\">PICU:\t\t\t\t\tx73239 </li>\n<li style=\"font-size:13px;\">NICU:\t\t\t\t\tx76857 </li>\n<li style=\"font-size:13px;\">Main OR Front Desk:  \t\t             x76492 </li>\n<li style=\"font-size:13px;\">General Computer Help: \t\tx74357 (7-HELP) </li>\n<li style=\"font-size:13px;\">EPIC help:\t\t\t\tx73739 (7-EREX) </li>\n</div></details>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Emergency Operator (Codes, Massive Transfusion, Security): x75555</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">One Call (paging provider to provider): x73999 (also see “On-Call Finder”, top right in EPIC)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">## Remote access, including Epic and CHC intranet:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">https://go.childrenscolorado.org/vpn/index.html</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">To setup Haiku (or Canto), visit <a href=\"https://haikusetup.childrenscolorado.org\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">haikusetup.childrenscolorado.org</a></p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The CHCO EPIC helpdesk can also assist with getting haiku configured.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Phone tips: </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">To reach an extension from off campus call 720-77 + [the 5-digit extension starting with 7].  Extensions starting with 6 can only be reached from off campus via the CHC operator.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Prior to the rotation, you will be provided a phone list each via email (“roster”) with all the attendings’ home/office phone numbers and pager numbers for calling your attending the afternoon or evening before cases.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Potential shifts </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Res-CHC-OR</strong> – (~6am- 5pm) This is a “normal” OR day (non-holiday, non-weekend). The days are busy, fun, and full of learning. Cases turn over faster than at UCH (OR staff will bring the patient back to OR before they count instruments). In a busy, high turnover room you can do ~10 cases in a day. Expect to finish the cases in your room, and you may be surprised with early relief. The “expectation” is to be out around 5PM. However, if you stay past 5PM the charge attendings do communicate with each other and they often try to get you out a little early the next day.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Res-CHC-C2</strong> – (7am – 7am Weekdays): This is a Weekday call/late shift with a post-call day the following day. You will be the last person relieved from the OR with the exception of the overnight call C1 fellow. Once you are sent home, you will be on home call for the remainder of the shift and will be required to report back to CHCO from home within 30 minutes of being called. You may be asked to come in the next day in the case of a mass casualty. Expect to take about 1 of these per week, sometimes 2.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Res-CHC-C1P</strong> - (5pm Saturday – 7am Sunday): This is a Saturday overnight call shift, typically they try to assign you a “short” assignment the Friday before in which you will actually round with the acute pain service, so you know the patients on the pain service before your Saturday shift. You should plan to arrive around 4:15pm for your first shift to receive handoff from the APS advanced practice provider, change into scrubs, and receive sign-out from the anesthetist in the OR before assuming patient care promptly at 5pm. You may arrive a bit later on subsequent shifts once you know your way around and exactly how much time you will need. Call the APS phone (x75433) when you first arrive to arrange for sign-out. Sign into the “Anes Emergency Alert” role on your PCD upon arrival so you are notified of any codes/ airways/ Level 1 trauma pages. Take over the Code Team badge from the day anesthetist. Please keep your cell phone on Saturday morning in case of a massive casualty situation where we would need all available help earlier in the day.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Res-CHC-C1A</strong> – (7am Sunday – 7pm Sunday): Report in time to take over any ongoing cases by 7am, or early enough to set up for a 7:30 start. Sign into the “Anes Emergency Alert” role on your PCD upon arrival. Take over the Code Team badge from the overnight resident. Check the board on EPIC/go to the Control Desk to see what is scheduled or call the attending charge phone (this is a dynamic process on weekends). You may be covering this shift on holidays as well.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Occasionally you may be asked to cover a weekend or holiday C2 call if the fellows cannot cover it. You will be expected to report to the OR in the AM for C2 call, if there are 2 rooms running on the weekend, without being called. However, if you think you may not be needed (check the OR board from home for case schedule), call the attending in charge around 06:00-06:30 to see if you need to come in. If you are not needed for the first case, you must be able to be in the OR in 30 minutes after being contacted at all times during your shift. C2 call is for 24 hours, and home call after the 2nd room is done for the day.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">This rotation is no longer eligible for Academic Wellness Days as there are enough Non-Clinical Days now that residents are taking the C2 Call during the week. Please schedule appointments on the non-clinical days or swap shifts with your co-residents if you need to make an appointment on a certain day. The chiefs can help facilitate this.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Day 1 at CHCO:  </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Your first day will solely be orientation.  You do not need to get oriented prior to this from other residents (as with most other rotations).  This will include a morning of Epic training, badge collection and parking information and access. You will be required to either bring a copy of your car’s registration OR know your license plate number to obtain a parking pass.  On the first day you may park in the visitor lot out the front of the hospital.  On subsequent days (once you have a CHCO parking sticker on your car) you will be ticketed if you do not park in the assigned lot.  Your badge will be your method of access to the parking lot, hospital and all departments and doors in the OR (includes the anesthesia work room.)  After your Epic training, you will have a brief tour.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">At completion of your tour please be sure to accomplish the following:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Check that Lindsay has your correct contact info, including your UCH email (very important that you confirm your email is included in daily case assignments and OR schedules), cell phone#, and obtain the attending cell phone roster, lecture and call schedules.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Check you have working Omnicell and Epic access.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Know where the items are on the list at the end of this document.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Obtain iStat training (Bryan King, NP does iSTAT training - can be on a later day)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Know how to access the resident SharePoint site.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Take a look at the OSA screening (STUBR) training on the resident SharePoint site.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Please read this manual as well as the orientation guidelines received this day and ask questions if anything doesn’t make sense.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Lindsay Baumgartner will assign lockers; depending on the number of residents, you may need to share.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Following orientation, start working on your pre-ops for the next day so that you may call your attending in a timely manner.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">General Info: </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Attendings will sometimes run their own room, sometimes work one on one with residents and other times have 2 residents and fellows to supervise.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">For your first 5 days, you should be scheduled with an attending one-on-one.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There are also AAs and CRNAs working at Children’s. Be kind to them!</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">All patient information is on electronic boards in pre-op, post-op and ORs. Check this board before you set up anything as cases cancel/delay more often than at UCH.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Be sure to communicate with pre-op and OR nurses about pre-meds if you have ordered them (oral midazolam needs ~30 minutes to be effective so be proactive!)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Call room:  located on the 2nd floor, past the bridge and Castle Peak conference room and through the double doors.  Code 8-6-4-2.  Our call room is labeled (#3) and the code is again 8-6-4-2.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Please know where the following items are prior to your first day: </h3>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Belmont infuser </li>\n<li style=\"font-size:13px;\">Trauma line cart and central line omnicell</li>\n<li style=\"font-size:13px;\">Emergency airway cart</li>\n<li style=\"font-size:13px;\">Advanced airway tools</li>\n<li style=\"font-size:13px;\">MH cart</li>\n<li style=\"font-size:13px;\">Code carts for OR and PACU</li>\n<li style=\"font-size:13px;\">Main omni (“Mommy Omni”)</li>\n<li style=\"font-size:13px;\">520 tube station</li>\n<li style=\"font-size:13px;\">Main OR blood refrigerator </li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Weekday Daily Workflow: </h2>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Set up: </h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The next day schedule should be out by 2-4 pm by email.  All names by initials (see Roster).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Do your pre-op H&Ps on Epic for outpatients coming into the hospital as completely as you can the night before.  Mark note as “incomplete” until finalized (if you do not check the box at the top of the note that says “this note is incomplete” it may be deleted by Epic overnight!!!!!)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Contact your attending (early in the afternoon/evening if possible) to present your plan (and explain why) for your patients.  Before 7 pm is typically better.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Give yourself 15 - 30 minutes to set-up your OR before any morning conferences (in Castle Peak conference room down hall from locker rooms 0630- 0700 Tues/Thurs)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Check the Epic status board before you set up since there may be last-minute changes!</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Let the anesthesia techs know, in advance, if you need any special equipment for your case. Please (1) write it on the white board with room number and (2) speak with the tech (PST).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Please ask your attending to show you how to avoid iatrogenic contamination of your patients and keep lines air-free.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Generally speaking, do not place syringes that have touched the patient’s lines, dirty airway equipment, dirty fingers/gloves, or anything else “dirty” on or in the Omnicell.   The anesthesia machine is generally considered a dirty area after the start of the case.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Pre-op: </h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Arrive in Pre-op by 7:00 (8:00 on Mondays) to see your patient.  Our window is 07:00-07:10, but you can see them earlier if they are “ready” per the pre-op RN (purple on Epic status board).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">To find your patient- check the electronic board showing name and room.  Child may be in the play area; you will see a sign on/next to the door to their pre-op room.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Make sure you ID the child and find correct parent(s).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You can use the in-room computers to fill out your pre-op note.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Decide early on (ideally > 30 min prior to OR) if your patient needs pre-anesthesia PO midazolam (“pre med”) as it takes some time for the RN to administer and ~30min to reach clinical effect.  The 2–4-year age group is most common.  You will need to inform the pre-op RN directly for timely administration of the premed. If the patient has active or recent URI symptoms (last 2-4 weeks), speak with the attending before ordering any medications, as this may warrant case cancellation.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If you would like an IV placed in a patient (typically >12 yo), this order may be placed in EPIC the night before. Pre-op acetaminophen orders may be placed once the patient weight is verified; notify the RN that an order has been placed.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">After you’ve evaluated the patient, complete your pre-op note and click “Ready for Procedure” before 7:20 (8:20 on Mondays). The patient cannot be brought back to the OR until this is done.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If doing an inhalation induction, you can ask the child to pick out a chapstick flavor to make the mask smell fun.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">When done with pre-op, you may wait for the patient in the OR—nurses bring patients and parents back to OR.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Many times, you will need an interpreter—typically there is an in-person interpreter floating around pre-op for first case starts.  If you need an interpreter for a case later in the day, you likely will need to use a translator phone or iPad.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">First case start times may be a little more lax than at UCH, but it is always good practice to get your preop done and room ready—try not be the reason there is a delay.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Some attendings will pre-op the next patient while others will ask you to do so (communicate with them). Be prepared to drop a patient off in PACU, speak with that patient’s parents in the waiting area, and then go to pre-op to see your next patient, all prior to going back to the OR to get your room ready and waste your drugs for the next case.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Parents are almost never present at induction.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">In the OR: </h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Go back to the room and do a final check while you wait for the child to come back to the OR with the circulating nurse (you do not bring the patient back, the circulator does unless you are giving IV midazolam).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Now is a good time to touch base with your attending and confirm the plan you discussed the previous night.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Before induction, follow the pre-induction “anesthesia time-in” checklist, line by line.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Be sure to introduce yourself clearly at timeouts and signouts in the PACU and ICU and to the colleagues you will be working with for the day.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Pay attention and avoid doing other tasks during this and during the time in and surgical time out.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">SCDs must be on prior to induction, if indicated.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Use your skills (iPad) to keep the child engaged and happy while you give approximately 35 to 40% nitrous oxide in oxygen.  Usually okay to turn on 8% sevoflurane for induction except for certain patients (ie, Trisomy 21).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Open communication and distraction with something interesting and enjoyable to the child is commonly preferred over repeated reassurances of “you’re ok” which are in stark contradiction to what the patient is experiencing.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">N2O is an odorless way of getting the induction started though it is no longer available in the hospital gas supply, you must open the tanks on the back of the anesthesia machine if you want to use it.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If the patient is a small baby and is asleep then leave the pacifier in and perform a “steal” induction without touching the baby and hopefully without waking them.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Some kids do better if sitting up on the OR bed or being - wrap a warm blanket around their shoulders and hug their arms to their sides as they drift off.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Once the kiddo is asleep, often the attending will take over the airway while you get IV access. This can sometimes be a challenge, especially in the chubby 2 yo child. You will quickly improve and learn to use the tools (WeeLight, snake light, wires, ultrasound) to help you. Saphenous sticks are common in babies and those getting caudal blocks for urological procedures.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Anesthesia techs place airway bags on anesthesia machine—be sure to correctly size tubes (cuffed and uncuffed) and blades (with working lights) are available in these bags.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Emergence, Post-op : </h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You will chart in EPIC similarly to at UCH, with a few minor changes.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">PACU orders are done in EPIC, complete before leaving the OR.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">For efficiency, orders may be filled out prior to the case start if the patient weight and allergies have been entered for that encounter.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You will frequently remove the patient’s ETT/LMA before awakening, aka “deep extubate.”  However, there are a few medical/attending specific exceptions such as airway concerns, very large, very small, etc.  Also be aware, for PICU bound patients, they will not receive the same airway attention that our PACU patients receive.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">When traveling with your patient to PACU or the ICU, you must bring the patient’s facemask, O2 tank, and any additional airway equipment or emergency medication (propofol, sux) that may be required.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">In PACU, do a verbal hand off by following step-by-step the blue handoff sheet.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Use the mobile laptop stations or the CHCO iPhone to mark your I/O totals as correct and hit “Handoff Complete” (these are in the post-Op tab of EPIC)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Also see PICU section below</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">For complex cases that stay >24-48 hrs (major trauma, major ortho, major neuro, index cases, etc.) a post op follow-up note should be placed as a matter of professionalism and for your education of typical post-op course but is not mandated.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Also see PICU/NICU section below for additional info</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">End of day: </h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Ask for feedback and with your attending before leaving on a daily basis.  Please be proactive and help to facilitate this.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If you get out of the OR more than an hour before your colleagues, please work as a team and help your fellow resident with pre-ops if they are going to be stuck there late.  You can either break them out or see their inpatients for them.  This is especially helpful when a resident has a late case one day with a busy ENT/urology room the following day (sometimes up to 10 pre-ops).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Before going home, make sure all pre, intra, and post-op documentation for all your patients are complete.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Work on your pre-ops and see inpatients for the next day.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">For adverse outcomes or near misses, use QSRS on Epic.  Coordinate w/ your attending.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Discuss with your attending who will be responsible for completing the post op notes for your patients (typically the attending does these unless the patient is admitted postoperatively, in which case you are/may be expected to do it)</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">ICU (NICU and PICU): </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">For patients going to NICU or PICU, a member of the anesthesia team must call the ICU to give a brief report to the ICU attending or fellow/PA prior to leaving the OR. Usually within ~30 minutes of expected arrival time to ICU.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Typically, patients going to the ICU will go directly to the ICU without going to PACU first.  Extubated patients should be managed so that little airway support is needed by the ICU staff.  ICU has neither the same resources nor the experience in managing a heavily sedated patient’s airway as does our PACU.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There is a separate protocolized sign-out for the ICU that is done as a multi-disciplinary team after the first set of vital signs are obtained.  Your OR RN will provide the template for you. Follow line by line.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">For PICU bound patients you must chart your own handoff in this scenario.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Ask attending about how to appropriately document VS and transport events in Epic.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Drugs/Pharmacy: </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Controlled drugs are in Omnicells in each OR</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Omni by the main OR desk has additional meds (lovingly referred to as the “Mommy Omni”)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">At CHC ephedrine is in your Pyxis machine and considered a monitored substance, and propofol must be accounted for, like other controlled substances.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">At the end of each case, the unused/dirty medications need to be returned to the bin on the right side of the Omnicell before the next patient enters the room.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Please charge for all medications taken out of the Omnicell.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Our pharmacy is now adjacent to the ORs, by the locker rooms.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Pharmacy will make up drips and epidural infusions for you.  Some cases will have order sets that make it extremely easy to order drips from pharmacy.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Main OR desk tube station is 520.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Epidural infusions, however, should be sent to the PACU and set up there on a pump and then brought into the OR.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Any infusions continued post op must be made up by the pharmacy.  You can make up your own infusions if solely used in the OR (best to order from pharmacy).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Drug vials are treated as single dose only and have to be discarded before the next patient enters the room.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Get in the habit of calculating IM doses of sux/atropine for all patients—induction takes place prior to IV placement thus you may need to give meds IM in case of laryngospasm.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">IV acetaminophen is available from the OR pharmacy—clarify with attending if okay to use since it is expensive.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Drugs given in the OR need to be charted on Epic by the time you sign out.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">On Epic, there is a link to protocols and educational materials on sharepoint via the “Anes Sharepoint site.”</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">All drugs need to be labeled, including propofol. All ORs now have label printing machines, which print labels as well as charges for drugs.  Be sure to double check concentrations as some drugs need to be diluted (ie, narcotics, ephedrine, epi).</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Lectures</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You are expected to attend all morning lectures Tues, Thurs at 6:30-07:00 (check your email for location/zoom links)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Mondays you will attend any CHC M&M or grand rounds.  If there is no presentation at CHC, attend the CU grand rounds. You will not attend department staff meetings.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Acute Pain Service  </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Will give you sign out and their PCD on C1 Saturday overnight call.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">When you come in, call the PCD at x75433 to meet up for sign out.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Keep track of any patients added overnight/changes made for AM sign-out.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Always see patients when an evaluation is needed.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Briefly document all significant changes in plan and all patient visits on Epic.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There is an APS attending on call every night, available by phone.  Make sure you get their contact info at sign-out.  Call for all updates and changes in pain management.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Ask plenty of questions at APS sign-out, especially about the plan for problems.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Give report to the pain service APN or fellow by 7am the next morning.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">APS team will sign out to C2 fellow or mid-level on Sunday PM, so Sunday resident does NOT cover APS.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The C1 Saturday overnight resident is assigned to the Acute Pain Service (APS) on Friday before the C1 PM Saturday shift. This allows you to become familiar with the APS service on rounds, learn about acute pediatric pain medicine, and perform blocks prior to holding the APS pager overnight that weekend. Please reach out to the APS attending on Thursday before that shift to determine when and where to meet on Friday AM.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Codes:  </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Coordinate with your attending by phone or in person for all codes</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Level One Trauma or Trauma Red – MUST attend STAT. Sign in when you arrive via access card reader</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Level Two Trauma – do NOT need to attend.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Our responsibility is the airway.  Once verified/secured, ask the code/trauma code leader (ICU, surgery, or ED attending/fellow) if you need to provide additional assistance, otherwise return to your other responsibilities.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">When called to the ER, the ED fellow may ask to place the airway.  Use your discretion and do what is best for the patient.  You may respectfully decline if you do not feel comfortable with this.  Please discuss with your attending, if possible.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">They have a Glidescope, LMA’s, and standard intubation equipment available in the ED.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Emergency Medical Response/” Code Blue” – MUST attend.  If in OR, call your attending immediately.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Stroke alert level 1 – heads-up.  May require urgent imaging (typically MRI) under anesthesia.  Begin to prepare and pre-op patient, if possible, coordinate with your attending</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Stroke alert level 2 – Need to start scan now.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">RRT – ICU team will respond to eval.  Not required to attend, but 30% will become a code blue.  Review prior anesthetic record, co-morbidies on Epic and be prepared for possible escalation.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Don’t forget to swipe your code access card when you exit the elevator to release it.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Airway Box - there is NO tackle box at CHC, but you may need to take a Glidescope if going to a difficult airway child.  Also, no neonatal microcuff tubes or LMA’s on the units, so bring those with you if you know they are needed.  Be sure to call your attending as soon as you get the code.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Discuss with your attending how to document all patient care delivered outside the OR, including procedures.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Blood</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Please leave blood products in the OR refrigerator until you are going to transfuse them (except emergencies) to avoid temperature indicator color change.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Tips for success</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">CHCO is a place to let your inner type-A shine! Attendings appreciate attention to detail and cleanliness more than efficiency. You will notice that the entire OR works together to provide the safest, best care we can (i.e., the circulator will typically be near the head of the bed helping with induction, people with help you with IVs, etc). It is a very team-oriented, patient-focused learning site so enjoy!</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You may find yourself being more closely supervised at CHC than other rotations, especially when you are new here.  Do not take this personally.  As we get to know you that will typically change.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">We realize that taking care of very ill and traumatically injured children can be emotionally challenging.  Please let us know if this is an issue so we can address it sooner rather than later. Good resources are Drs. Bielsky or Janosy, the CHCO Fellows, and the chiefs.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Spine fusions, acetabular osteotomy cases, VPS, ERAS, and transplant cases are complex and highly protocol driven.  Please ensure you obtain a copy of the protocol from sharepoint (clinical section), discuss the case with your attending, and give yourself adequate time to set up.  Always look to see if a protocol exists for major cases (or ask attending during pre-op discussion if one exists).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Please use the central line insertion kit for all central lines</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Please wash, gown and glove for all catheter placements.  Use a probe cover for all U/S blocks.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You will need to log out of the Omnicell and both computers when you leave the room and secure all medications.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Please refer to the CHC policies and procedures for additional information on topics such as: trauma codes, massive transfusion protocol, blood transfusions, admission following GA due to young age, and others. https://info.childrenscolorado.org/sites/search/Pages/results_policies.aspx?k=</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There are now 2 computers screens in all OR’s.  The one above the APL valve is a touch screen and automatically links to anesthesia machine (you must login on this computer in order for VS to automatically load into Epic); the regular computer is not linked to anesthesia machine (you must manually link it if you want it to record vitals).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Attendings here have trained in a variety of places—it is very common to do very similar cases and procedures one way with one attending and completely different another day with another attending. It can be extremely frustrating at first, so be very patient. Be sure to have a thorough and complete plan for your cases that day. In the end, it is good to see different ways of doing things so that you can adapt and develop your own practice based on what has worked for you.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Professionalism: </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Please be helpful, respectful, and courteous to everyone you encounter at CHC.  If you cannot address their concerns, or have issues, please contact your attending.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Be proactive in your communication at all times (from pre op planning, problems/concerns/questions, and your documentation responsibilities)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">For complex cases and blocks, please make an effort to personally post-op patients that stay > 24 hrs inpatient.  See (or call patients at home) that had nerve blocks to see how they did with any blocks you placed.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Resources</h2>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Protocols</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">CHCO has an internal sharepoint with protocols for a subset of the cases you might see. Access to this sharepoint may be restricted without a CHCO email address which residents rotating there won't have. The link below is a folder containing some of these that were shared by email.</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><a href=\"https://olucdenver-my.sharepoint.com/:f:/g/personal/elijah_christensen_cuanschutz_edu/Eg307Sh4LURCisZnThnq9i0B5xnF0HtjkF2gr68NbnnHqA?e=COLi64\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">CHCO Protocols</a></li>\n</ul>",
  "cp": "<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">Pain Medicine Service</h1>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Pain Medicine (formerly known as Chronic Pain or Interventional Pain) is a specialty with fellows from any of the four core disciplines in pain medicine: Anesthesiology, Physical Medicine and Rehabilitation (PM&R), Neurology or Psychiatry. At the University Hospital you will work with an attending and fellow who are anesthesiologists. There are PM&R staff that you will see on at morning Pain Didactics and Journal Club. During this rotation, a variety of pain conditions are primarily treated using fluoroscopy- and ultrasound-guided injections. These range from familiar peripheral nerve blocks (femoral, popliteal, TAP), familiar neuraxial procedures (epidural steroid injections), to Pain Medicine specific procedures like vertebral facet medial branch blocks, trigger point injections, Botox injections for migraines, spinal cord stimulator implants, and many other things. Time on this rotation is roughly equally divided between performing these procedures and seeing new and follow-up patients in clinic. In clinic you will do H&Ps and get the chance to help manage chronic pain specific medications.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">This rotation is a definite change of pace from the OR with many back-to-back patients and quick transitions.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Overall, this is a fast-paced month with lots of hands-on experience and a chance to brush up on anatomy while learning more advanced procedures and specialized medications.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">People </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Attendings:</strong> Rachael Rzasa-Lynn, MD (pronounced \"Razzah\"); Narayana Varhabhatla (Var-ha-baht-la; you can also call him Dr. V), MD; Tushar Sharma, MD; Marisa Wiktor, DO</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>2023-2024 Chronic Pain Fellow:</strong> Michael Harlander-Locke, Michael.harlander-locke@cuanschutz.edu</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Phone numbers:</strong></p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Pain Medicine pager: 303-266-7291 </li>\n<li style=\"font-size:13px;\">University Clinic phone: 720-848-1970 </li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Preparation: </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Plan on stopping by the UCH plain clinic prior to starting your rotation in order to orient yourself to the new area and get help setting up your new Epic for the month. The pain clinic is located on the first floor of the hospital next to the atrium pharmacy in the inpatient pavilion.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Set your Epic context to \"ZZ Pain\" for the correct screen layout. You can also use “AMC Pain clinic OP” and “AMC Specialty Proc OP” for contexts. Ask the fellow, or an outgoing resident to help you set up your Epic clinic schedule and receive pertinent shared SmartPhrases. Start reading to become familiar with the field and learn about the unique blocks and medications. Common topics to look up: medial branch blocks; SI joint injections; epidural steroid injections; trigger point injections; lumbar sympathetic blocks and celiac plexus blocks; fibromyalgia, complex regional pain syndrome; back pain, and back physical exam; radiation safety. Faust, M&M and Miller have pain medicine chapters. You will receive material through your email to review as well before starting the month.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Location: </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The clinic is at UCH on the first floor near AOP. The easiest way to get there for your first time to clinic would be to enter through the AIP main entrance. You will see the atrium pharmacy right upon entering the rotunda. Make a right, going past the pharmacy and follow the signs to the Interventional Pain Clinic. You will end up in the waiting room/ check-in desk. Tell them you're a resident and they will let you back.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Another option is just to ask your fellow resident who is currently on the rotation for directions straight into the locker room area. The locker room entrance is located on the first floor 1.031 along the hallway that connects AIP and AOP. The conference room used for journal club and didactics is at 1.028 directly across from the locker rooms. If you need to store your lunch or want to eat in the conference room, it is next to the conference room at 1.012.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The clinic space is shared with PM&R, Ortho spine, and Neuro spine. You may need to email someone to get badge access, see emails. There are scrubs and lockers available for use during the rotation just remember to bring your own lock. Green hospital issued scrubs are provided for use, although you can wear your own scrubs for clinic days or wear business casual.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Schedule: </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Residents typically arrive for clinic or procedures at 0645 and stay until the last patient is seen, which is usually about 1600. Check next day's schedule for first patient start time and to review what procedures you will be performing. If multiple residents are on rotation, it’s possible you can stagger early and late starts. Plan to go to all
