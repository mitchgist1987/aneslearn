der-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">ALWAYS CHECK YOUR ORs at the start of the shift. This is especially important at night when there is less help. You never want to be caught off guard when a stat C-section comes in.</div>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">The ORs should always be set up for an emergent C-section type scenario. Believe me, you do not want this scenario to happen when there is no laryngoscope in the OR… or no Etomidate/Propofol available, etc. So just check that everything is ready to go as if you were going to do a crash section This includes making sure videoscope is prepped/functional (either C-MAC or Glidescope in each L&D OR).</li>\n</ul>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!IMPORTANT]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">Just like the main OR all airway equipment must remain sealed until it is going to be used—this is per hospital infection control requirement.</div>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">OR Pyxis contains all narcotics. We now have L&D narcotic bags, Type “L&D” to search for the narcotic bag in the pyxis</li>\n</ul>\n<details style=\"margin:8px 0;border:1px solid #E8E5DF;border-radius:8px;padding:10px 14px;\"><summary style=\"cursor:pointer;font-weight:600;font-size:13px;\">Details</summary><div style=\"margin-top:10px;\">\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>L&D Narc Bag</strong>:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- P20 x1</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- fent 100 mcg</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- ephedrine 50 mg</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- morphine 5mg (or 10 mg – check prior)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- midazolam 2mg.</p>\n</div></details>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">We no longer have direct access to uterotonics (other than Pitocin). The floor nurses can pull the other uterotonics for you. If you need everything emergently, you can also request a “tackle box” from the nurses, but these should be reserved for higher acuity situations. During the timeout, please discuss the potential need for other uterotonics so the circulating RN can get it for you.</li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Use the APPs as a resource. The APPs that do OB have had a lot of OB experience. You can ask them questions, ask them for help, whatever. This is especially helpful at night. Don't forget to call them for help with difficult epidurals. They can be a helpful second (or third) set of hands in those situations.</li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Always call the OB APP (x85911) for any STAT cases or other emergencies.</strong></p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">OB RNs are very involved with their patients. They really want what is best for their patients. Sometimes that may come across as them trying to push us around. For the majority of them, this is not true. They want us to put epidurals in ASAP so that their patients will not be miserable and in pain. Exactly what we want. However, we all understand that we have to do it safely. As a rule, we have told them that if a patient calls for an epidural, they should expect us within 10 MINUTES. If you do not believe you can be there in that time, please have them call the APP.</li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">You may also be called to “consent a patient who wants an epidural but is not ready yet”. This is not a high priority but should be done as soon as reasonably possible as it does allow a more streamline approach at the time of actual request.</li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Figure out how to restock the carts properly at the very beginning of the month. We have to restock our own epidural carts from the workroom supplies. Learn how to do it at the beginning so all of the carts aren't missing stuff by the middle of the month. The carts must be restocked and cleaned in between each patient and then placed back in the clean room ready for the next patient. If you have an AA student rotating with you this is something they are typically VERY helpful with. The floor RN will bring the cart to the anesthesia workroom for cleaning, but you must place it back in the patient rooms. If you do need anesthesia tech support, call the usual phone numbers.</li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">EPIC charting on the OB floors will look different than what you are used to in the OR. It is best to log in and open the chart in the workroom or on a computer in the hall. There is a macro listed for OB Labor Epidurals, OB regional C/S, etc. These are really helpful. When doing an epidural, pick the \"OB Labor Epidural\" macro and then Start Anesthesia and \"Link Device\" and select the appropriate monitor. This will automatically populate your vitals. </li>\n</ul>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!WARNING] </div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">If you do not link the device, you will not receive vital signs during the epidural placement.</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\"></div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">It's possible to backfill the vitals, but most of the attendings won't know how to do this and it's not intuitive</div>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">After you finish the procedure unlink the device. If you forget to unlink, the nurses will call you because they cannot do their charting.</li>\n<li style=\"font-size:13px;\">You should remain near the patient monitoring them for at least 15 minutes after the epidural placement or a bolus. After the initial placement, you must put vital signs in the chart every hour to get these vitals in EPIC under the flowsheet and enter them in our record by hand. It is a good idea to do this a couple times during your shift or whenever you get some downtime, so you don't fall behind. Things can go from quiet to crazy relatively quickly on the floor. After placing an epidural or doing any other procedure (C/S, cerclage, etc), add the patient to our shared OB patient list with any pertinent information to be followed up in a postop visit. More detailed information regarding charting can be found in the procedure handout you receive prior to starting.</li>\n</ul>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!NOTE]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">OB is a very service-oriented rotation, if you get called while you are doing something and cannot get there in a timely manner, please let the RN know and ask them to call the APP that is on or if both you and APP are busy, please let attending know.</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!TIP]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">As always, it is best to spend some time on the OB floor getting oriented before your first day on OB. </div>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There are many differences to your OB month, so it's best to know where the OR/workroom/pyxis/call rooms are located. This rotation can be a lot of fun, but things happen quickly and it's nice to be prepared.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Common Situations on the OB Floor</h2>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Called for Labor Epidural</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">1. Ask how far along they are (dosing for spinal depending on how far along they are; see cookbook for details)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">2. Log into Pyxis (under OR anesthesia, not floor. This is important in order to find fent and epidural bag)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">3. Prior to heading into the room go to intraop tab, anesthesia start, link anesthesia device (Important to do this step or else you will not get vitals)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">4. Grab materials from either workroom or cart outside the room.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">5. Call OB attending</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">6. Help RN position patient (sitting edge of bed, expose back, and remove anything that will be in your way)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">7. Remove ALL jewelry, watches, and sleeves below the elbow.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">8. Open kit and have everything ready to go.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">9. Glove up.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">10. Place epidural with attending present</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">11. Set up CADD pump with epidural bag.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">a. Full epidural: \"PIB+PCEA\" @ 10cc/q45 mins w/ 10min PCEA lockout</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">b. Walking epidural: “Continuous + PCEA” run 5cc/q1h continuous remove PCEA button.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">c. Intrathecal catheter: “Continuous + PCEA” run 2cc/1h continuous remove PCEA button.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">12. Obtain “timeout” and “IT” time for chart from RN.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">13. Finish charting “Staff”, “Px Note” and “Meds” given.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">14. Update handoff</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Patient having more pain with an epidural</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">1. Look at chart and see if patient has walking vs full epidural.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">a. If walking attempt to talk to patient about converting to a full epidural</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">b. Change pump settings and attach the PCEA button.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">c. Can also give bolus of 10-20 cc of bupi 0.125% if having a lot of pain or one-sided coverage.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">2. Ask how far along she is, if 8-10 cm or quick progress she may have sacral sparing.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">a. If sacral sparing (vaginal pain or low back or buttock pain) bolus with bupivacaine 0.125% (15-20cc) in increments of 5 cc at a time. Can add Fentanyl 100mcg into epidural as well.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">b. Ask RN to get frequent vitals for next 20 minutes to evaluate blood pressures.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">c. Reevaluate in 20-30 minutes.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">i. If comfortable: good job!</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">ii. If not comfortable or slight relief: would attempt to replace epidural.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">3. Unilateral coverage with full epidural.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">a. Consider pulling back 1-2cm, discuss with attending.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">b. Bolus with 10-20 cc bupi 0.125% and see if you can get better bilateral coverage in 20-30 minutes.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">i. If unable would replace epidural</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">4. \"Failed epidural\" (2 boluses given with relief but repeat breakthrough pain)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">a. Replace epidural unless strong reason not to (patient refusal, extremely difficult initial placement, etc.)</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Called for Stat C-section with Epidural</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">1. Grab 20 cc syringe and chloroprocaine 3%.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">2. Attempt to find charge RN or OB chief/attending (most likely at bedside) to see timing of c-section.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">3. If going back emergently or urgently dose all 20 cc of 3% 2-chloroprocaine into epidural stay with patient, have phenylephrine on hand, call OB CRNA to start setting up whichever OR, and call OB Attending. WILL NEED TO REDOSE at 30-45minute mark DURING CASE as Chloroprocaine has a very short half-life. Discuss with attending whether to use 2-Chloroprocaine or another local anesthetic.</p>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!CAUTION]</div>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">><strong><em>Depending on timing of how quickly you are rolling back, be ready to convert to general</strong></em></p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">4. If NON-emergent discuss with attending prior to dosing.</p>",
  "pacu": "<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">PACU Rotation</h1>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Your time in the PACU will be very different from your OR rotations. Your role in the PACU is to serve as an easily accessible and reliable physician resource to the PACU staff.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You will gain valuable experience managing patients in the postoperative setting and may be the first person called for any PACU complications or emergencies.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Hours:</strong> Monday through Friday, 10:00 am to 8:00 pm</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There currently is a PACU resident CISCO phone (extension 34398) that you should carry with you or forward to your personal phone. As we transition to using our own devices, you may have to assign yourself to the PACU care team, if the option becomes available. To facilitate easy and efficient communication with nursing staff, it is recommended that you write your name and number on the whiteboard by the charge desk and confirm your number to nurses during handoffs.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There is a designated PACU resident computer at the main PACU desk near the large status boards. The PACU nurses prefer that you sit here during the day (unless at lunch, lecture, or seeing patients) so they know where to find you if they need help with something.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The majority of your day will be focused on receiving patients in the PACU from the ORs, assisting with the ongoing management of patients as needed or requested by the team or the PACU nurse, and assessing patients for discharge from the PACU. A generic sequence of events for patient care in the PACU is as follows:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Assess patients as they arrive in the PACU from the OR. Ideally, listen to sign-out from the OR anesthesia team and ask if they anticipate any post-operative problems (nausea, hypotension, challenging pain management, etc.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Address any issues or emergencies as needed. Call the in-room anesthesia attending or the anesthesia charge attending if you think you might (or definitely) need back-up.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The attendings prefer that you get in touch with them pre-emptively, even if you don’t necessarily need their help, instead of not being informed and potentially getting into a dangerous situation later on.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The following are examples of situations that should always be communicated to the charge or in-room attending as soon as possible (depending on time of day and who is still in-house):</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Refractory hypotension or hypertension (e.g., giving multiple boluses of vasoactive medications and/or before starting vasoactive infusions). </li>\n<li style=\"font-size:13px;\">Refractory postoperative pain (e.g., before you order ketamine, methadone, propofol, or drips, and/or contacting APS about performing a block or neuraxial procedure).</li>\n<li style=\"font-size:13px;\">Altered mental status (e.g., before calling a stroke alert, ordering naloxone, etc.) </li>\n<li style=\"font-size:13px;\">Refractory hypoxia (e.g., not responsive to incentive spirometry, coughing, deep breathing, or patient is too somnolent to engage in these maneuvers; rapidly escalating oxygen requirements; apnea). </li>\n<li style=\"font-size:13px;\">Emergencies. These include codes, re-intubations, suspected laryngospasm, bronchospasm, or other form of airway compromise, severe hemodynamic instability (this includes profound hypotension/shock and unstable arrhythmias e.g., high grade heart block), hemorrhage, etc. A good rule to follow during this rotation is to call for back-up if you are even slightly unsure of what to do in one of these situations. </li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Assist with any challenges in patient disposition from PACU. You may be requested to assess a patient and communicate with surgical teams, consult teams, etc if a patient needs a higher level of care after the PACU or is unable to safely discharge home. However, these orders should always be placed by the primary team.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Prior to discharging the patient from the PACU, inform the in-room anesthesia attending or the anesthesia charge attending of any changes in disposition (if applicable). You can help bycompleting the Anesthesia Attending Post-Operative note in Epic, though not necessary.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Anesthesia Assistant students are now rotating through the PACU and may be scheduled to work with you. You will be contacted by an AA coordinator with the dates ahead of time. They primarily shadow the PACU resident but can assist with any clinical tasks as appropriate.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Daily Workflow</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>10 am</strong> - Arrive in PACU, pick up the resident phone, and check in with the PACU charge nurse. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>10:15 am</strong> - Attend the PACU nurses’ morning huddle. During this time, you will get an overview of the number of patients expected to go through the PACU that day, as well as the acuity and disposition of these patients (outpatient, floor, ICU). </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>3-5 pm</strong> - Attend resident didactics when applicable. Check in with the PACU charge nurse (extension 35363) before leaving for these lectures. It is helpful to take a walk around the PACU about 30 minutes before you go to lecture to address any needs and let the nurses know you will be in lecture for the next two hours. You should also forward your phone to the charge anesthesiology attending for the duration of these lectures. This will minimize the amount of phone calls you receive during lecture and ensure that the patients in the PACU receive timely care from a nearby provider. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>6:45 pm</strong> - Check in with the APS Rounding resident (extension 34426) before they leave at 7:00 pm to identify any patients that may need post-op blocks. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>7:15-7:45 pm</strong> - The nurses will appreciate it if you do a final lap around the PACU to check on their patients and see if they need anything before you head out. Let them know that you will be leaving for the night at 8:00 pm, and that they may call the charge anesthesiology attending for any needs or concerns after that time. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><strong>7:45 pm</strong> - Check in with the anesthesia charge attending (extension 85920) before you leave for the night at 8:00 pm. During this time, you should sign out any PACU patients that have active issues or may need to be watched. Check in with the PACU charge nurse a final time (extension 83563) before you leave for the night. </li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">PACU Pearls</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">The PACU’s code cart and airway bag can be found under the large status boards by the main PACU desk (between bays 43 and 67) to the left of the tube station. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Do not start non-invasive positive pressure ventilation (e.g., CPAP or BiPAP) on any patient with upper GI anastomoses (e.g., esophagectomy, bariatric surgery, Nissen fundoplication, etc.) unless specifically approved by the patient’s surgical attending or senior resident. More often than not, they will not want you to initiate this type of ventilation. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">You may be called for issues that should be addressed by the patient’s surgical team. Some examples include increasing quantity or change in quality of output from surgical drains, altered mental status in craniotomy patients, neurological changes or deficits in spine surgery or vascular patients, loss of peripheral pulses in vascular patients, peritoneal signs (distention, severe pain despite escalating doses of narcotics, rebound tenderness) in abdominal surgery patients, persistent oozing or frank bleeding in any patient, etc. Communicate with the surgical team if any concerns.  </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Frequent check-ins or ‘rounds’ in the PACU will build rapport with the nursing staff and help keep you informed about issues or any unstable patients. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">If a PACU nurse calls you about a potential corneal abrasion, order the Corneal Abrasion order set in Epic and notify the in-room attending (this is more to keep them in the loop than to tell them that you need their help). </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Occasionally, a patient will require supplemental oxygen upon discharge due to postoperative hypoxia. Nurses are now able to place orders and coordinate this if the patient requires less than 2L nasal cannula. They may still request your expert opinion prior to placing orders to optimize the patient. After assessing the patient, recommendations can include incentive spirometry, albuterol inhalers, ambulation with portable pulse ox, etc. However, if the patient still requires >2L nasal cannula, you will need to place the orders and help coordinate with respiratory therapy. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">If an anesthesiology attending approves the use of ketamine for postoperative pain and the patient did not receive ketamine during their case, PACU guidelines dictate that a physician (you) must push the first dose. After that dose, the PACU nurse may continue to administer ketamine if you order it. You may also administer the additional doses if the PACU nurse prefers. Make sure you communicate with them as to who will document these administrations, as ketamine is a controlled substance and will need to be accounted for. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">If a patient is suffering from dissociation that you have attributed to ketamine, low-dose midazolam can help moderate this side effect. Make sure that your patient is not too somnolent and that you call your attending before ordering midazolam for this purpose.</li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Liver transplant patients may come straight to the PACU for extended stay if extubated, instead of direct transfer to the ICU. If so, you will be requested to assist with the ongoing management and resuscitation. These patients may require more attention, especially to drain output, hemodynamics, coagulation, and follow up labs, and you and the nursing staff may be the first ones to detect any clinical changes. Always communicate with the transplant surgery team if there are any concerns or interventions in these patients. </li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">PACU Curriculum</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There are five modules with associated quizzes on the Anesthesia Toolbox to be completed during the first half of your rotation.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You will be provided with a series of case descriptions or PBLDs during the second half of your rotation. You may work through these in person with Dr. Tamm-Daniels (or the APS attending if Dr. Tamm-Daniels is unavailable).</p>",
  "pocus": "<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">POCUS Rotation</h1>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The ultrasound rotation is a 2 week block, depending on the day you'll either be with the echo techs scanning patients who have had inpatient TTE's ordered, scanning patients in the ED, or doing TEE's in the cardiac OR or CTICU.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Daily Workflow</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Varies by day</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Denver health</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">please coordinate with Dr. Ferrone the afternoon before your scheduled day there – you can email adam.ferrone@cuanschutz.edu or text him</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Cardiology</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">For the days you are in the echo lab, echo techs arrive around 7a and their office is on the third floor between IR/cath lab and outpatient US.  Please meet them at that time. They know which days to expect you.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">TEE/CTICU</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Go to CT OR’s (usually 39 and 40 +/- 31 to 38) and check in with CT anesthesia fellow/attending at normal start time. They will discuss options for going over TEE with you. If there are no TEE cases, or if CT cases wrap up before 2 pm, go to CTICU and speak to the fellow or available attending and they will help you find patients to scan! I will be on service during your first week on the rotation and look forward to scanning with you when possible.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">ED</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You will meet with the ED attendings at 10:00 am at the charge desk in the ED. Please reach out to Mair Wallis if you have issues meeting up. These sessions run about 3 hours long.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">U/S Curriculum</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Prior to the start of the rotation, please read the following chapters in <a href=\"http://accessanesthesiology.mhmedical.com/book.aspx?bookid=1115\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">Levitov’s Critical Care Ultrasonography</a></p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\"><a href=\"https://accessanesthesiology.mhmedical.com/content.aspx?bookid=1115&sectionid=62618069\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">Chapter 7</a> TTE</li>\n<li style=\"font-size:13px;\"><a href=\"https://accessanesthesiology.mhmedical.com/content.aspx?bookid=1115&sectionid=62618323\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">Chapter 9</a> LV Function</li>\n<li style=\"font-size:13px;\"><a href=\"https://accessanesthesiology.mhmedical.com/content.aspx?bookid=1115&sectionid=62618411\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">Chapter 10</a> Preload Responsiveness</li>\n<li style=\"font-size:13px;\"><a href=\"https://accessanesthesiology.mhmedical.com/content.aspx?bookid=1115&sectionid=62618462\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">Chapter 11</a> RV Function</li>\n<li style=\"font-size:13px;\"><a href=\"https://accessanesthesiology.mhmedical.com/content.aspx?bookid=1115&sectionid=62618550\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">Chapter 12</a> Cardiac Tamponade</li>\n<li style=\"font-size:13px;\">(additional chapters in Section II are optional)</li>\n</ul>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">must be on campus or logged into VPN to access book online</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">Textbook pdf chapters <a href=\"https://olucdenver-my.sharepoint.com/:f:/g/personal/elijah_christensen_cuanschutz_edu/EjtRvFCfrrJLk7u3gAY6jnEBQ-2NvTyeIj2TP5qjKI6T5Q?e=2GaDYg\" target=\"_blank\" rel=\"noopener\" style=\"color:#CFB87C;\">here</a></div>",
  "pps": "<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">Pre-procedure Services (PPS)</h1>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Clinic Staffing:  </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Medical Director: Angela Selzer, MD</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Rotation Director: Jillian Vitter, MD</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You can address any questions/concerns/suggestions about the clinic or rotation to either Dr. Selzer or Dr. Vitter.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Daily Attending: You will work directly with an assigned attending anesthesiologist every day. There is a specific team of anesthesiologists assigned to clinic and this person will usually vary daily.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Clinical Director: Katie Conyers, NP is the lead NP and Clinical Director of the clinic.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Nurse Practitioners: There are currently eight other NP/PAs working with Katie in the clinic.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Nurse Manager: There is a nurse manager for the clinic who supervises and manages the operation of the clinic and the RNs, MAs and PARs.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Charge Nurse: There is a charge nurse who helps with the daily management of the clinic.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Registered Nurses: There are approximately ten RNs in the clinic, some of whom assist with scheduling and coordinating clinic patient appointments, the rest are dedicated to calling patients prior to surgery and obtaining a thorough history over the phone.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Medical Assistants: There are four MAs in the clinic. They room the clinic patients, take vitals, draw labs and EKGs. They also assist with scheduling, check-in and record retrieval.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Patient Access Representative: There is one PAR who checks in patients and schedules upcoming appointments.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Pre-op Overview:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Preoperative medicine is a unique subspecialty within the field of anesthesiology. The successful preoperative management of patients has been shown to lead to better outcomes: reduced morbidity and mortality, decreased hospital lengths of stay, improved patient experience and a reduction in OR cancellations and delays. The field of preoperative medicine is expanding, and hospitals are looking to anesthesiologists to help manage and run hospital preoperative clinics.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Our primary goal with this rotation is to ensure that each resident graduates capable of performing a thorough evaluation and able to implement evidence-based plans for preoperative assessment and optimization. However, we also seek to expose residents to the basic understanding of how a preoperative clinic is run, managed and financed in order to assist them in their future careers and enable them to contribute to this burgeoning subspecialty.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">At our Pre-Procedure Services Clinic, in the University of Colorado Anschutz Campus, we see approximately 6,000 patients/year. These patients have complex comorbidities and are mainly ASA 3’s & 4’s. During their one-month rotation (for interns), or two-week rotation (for CA1-CA3s), residents will see from 40-60 patients of their own, supervised by an attending anesthesiologist, and complete a preoperative medicine curriculum.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Goals </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">To learn how to obtain a comprehensive medical history.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">To perform a comprehensive physical examination</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">To gain proficiency in point of care ultrasonography</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">To appropriately order necessary diagnostic studies and tests</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">To formulate an individualized pre-habilitation plan for each patient</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">To integrate the information obtained to determine that a patient is adequately optimized or to develop a plan to optimize the patient further.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">To develop an appropriate anesthesia plan and communicate it to the patient.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">To understand the basics of how a functioning preoperative clinic is staffed, managed and financed.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">The Details</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Clinic Location: AOP, First Floor, near Dazbog. Follow signs to Pre-Procedure Services.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Clinic Phone: x81263</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Prerequisites: Prior to starting your rotation, you will need to make sure that you have the appropriate EPIC access and have completed E&M training (these visits will primarily be billed as level 3-5 consult visits). You will have received information on how to complete this training, but you need to make sure that this has been completed prior to day one of the rotation. We recommend stopping by clinic prior to the start of the rotation to check in.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Clinic Hours: The clinic is open from 8am-5pm.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Daily Schedule: You will be seeing around 3-6 patients per day. The visits are scheduled for one hour. Your patients will mostly be scheduled in advance, but you may have one or two “walk-ins” or last-minute add-ons. We try to see patients a week before surgery, but more typically see them 2-4 days prior to surgery. Day before cases are made as exceptions primarily for patients travelling from out of town.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The expectation is that you have completed a chart review prior to seeing the patient and will have an idea of what additional information and testing are needed prior to the appointment.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The schedule will likely look something like this:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Day 1: Morning: Orientation & 1 patient visit, Afternoon: 2-3 patient visits</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">First Half: 3-4 patient visits/day</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Second Half: 3-6 patient visits/day</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Daily Responsibilities</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">3-6 Patient consults:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Pre-visit chart review</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Review of systems, history taking and focused physical exam (if in-person visit)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Presentation of findings and plan to attending</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Evidence based ordering of labs/EKG/testing, requests for records if applicable.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Providing an After Visit Summary to patient with day of surgery instructions</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Completion of consult note in timely fashion.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Follow up on labs/testing, addendum to notes when applicable.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Assist with NP/RN questions about anesthesia and preoperative evals.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Rotation Responsibilities</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Before the end of the rotation, you will present an article to the PPS clinic MDs, NPs and RNs. The article should be approved by a Preoperative Medicine Attending.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You will also complete a preoperative curriculum, which will include daily reading assignments and topics for discussion with your assigned attending. This will be provided to you prior to the start of your rotation.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The POCUS curriculum has been moved to a part of the PPS rotation. You will be required to review some materials pertinent to POCUS prior to starting the rotation. You are also expected to discuss/consent each patient for a brief POCUS while in clinic.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You will be invited to attend clinic meetings where appropriate in order to get a better idea of how outpatient clinics are run.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">EPIC Logistics: The clinic uses certain templates for note writing, after visit summaries, and risk calculators. There is a “how-to” with screenshots on the Teams Page and you should receive it by email (ask for it if you don’t!)  Make sure you ask to have these shared with you before your first day.</p>",
  "senior": "<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">Senior Month</h1>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">This rotation was created to give seniors the opportunity to engage in out-of-OR, attending and pre-tending opportunities.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Additionally, the Day and night jeopardy rotations are designed so residents are pulled from other educational activities less often.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">This rotation is an opportunity for self-guided, senior level learning, and gives residents the opportunity to drive their experience, so please be proactive in getting what you want out of this experience.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">This month consists of the following breakdown:</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">1 week at of \"Pretending\" </li>\n<li style=\"font-size:13px;\">1-week Senior nights (see senior nights section for details) </li>\n<li style=\"font-size:13px;\">1 week Day Jeopardy, “Senior Days” </li>\n<li style=\"font-size:13px;\">1 week Night Jeopardy, “Wildcard” </li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Day Jeopardy, “Senior Days” </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">When you are on your day jeopardy rotation, you are jeopardy Mon-Sun for any day shift for which someone calls out. If you are not called in, you arrive to UCH at 645-7am during the week.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Opportunities for the senior day resident:</strong></p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Sign into the airway/trauma pager and responding to codes in the hospital during the day </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">It is expected you respond to trauma and airways (communicate with the lead APP and charge of the day) </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Field inpatient consults  </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Assist urgent matters in the PACU and perioperative area (e.g., “Anesthesia STAT” calls).  </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Running the board with charge and learn the logistics of that process. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Pre-tending with an attending and a junior resident.  </li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If you are not called to another location, you are relieved at ~3 pm once most of the afternoon board running has been completed (check with charge before you leave). You do not come in on weekends unless called in for a jeopardy shift.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Night Jeopardy, “Wildcard” </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You are jeopardy Mon-Sun for any night shift for which someone calls out. If you are not called in the night prior, you arrive at 7am.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If the DAY jeopardy was pulled, you will assume that role (above).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Opportunities for the night jeopardy, wildcard resident:</strong></p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Sign into airway and trauma pagers to help the day jeapordy resident as above</li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Assist with starting cases/pre-tending for junior residents/helping out where necessary (AKA OB is getting crushed and need a hand or East needs someone to manage all the blocks for the day).  </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Help with difficult airway management if it is occurring in a non-resident room (e.g., attending solo room).  </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Help APS with first start epidurals/blocks. </li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If the chief residents find out you are going to be called in for a night shift, you will be sent home as soon as possible to rest for the shift and will not have to come in during the day the next day. You could still be called in for a night shift the next night. If you are not called in, you are relieved at ~3pm with the Day Jeopardy resident. You do not come in on weekends unless called in for a jeopardy shift.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If a 24-hour ICU shift needs to be covered, the day and night jeopardy residents will split the ICU shift in half (7-7).</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Jr-Attending (Res-Pretend):</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">You will function as the attending for the case, at the guidance of the faculty attending. With this in mind, you are responsible for the plan, induction, intraoperative management, emergence, resident teaching, and hand-off to the oncoming attending if the case is still going when you are relieved for the day.</li>\n<li style=\"font-size:13px;\">The junior residents staff with you, and you staff with the attending the night before.</li>\n<li style=\"font-size:13px;\">You are on the same call schedule as your faculty attending, and they are responsible for releasing you for the day.  </li>\n<li style=\"font-size:13px;\">We ask that you take ownership of this role! Great leadership and attending practice.</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Senior Nights</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Senior Nights are a wonderful chance to gain experience in anesthesia supervision and board running. You will be expected to act as the charge attending. Be sure to take advantage of the opportunity to practice as an independent attending, while still having supervision and backup if you need it.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Hours</strong></p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">9PM- 7AM, Monday, Tuesday, Wednesday, Thursday, and Friday nights.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Typical Workflow</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Upon arrival at 9pm- sign into both the trauma and airway emergency teams on epic., and call the C1 charge (85920) to get an update on any ongoing/pending cases and any concerning PACU patients that may need your attention. Let the C1 know that you will be forwarding the charge phone to your PCD/cellphone as well. Be sure to clarify which C1 faculty is responsible for what cases overnight (e.g. usually they switch over around 2:30am).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">During your shift, you will be acting as the overnight attending for all cases. You are expected to check in with both the R1 resident and C1 APP. They should be calling you for the usual things they would call the C1 attending for such as changes in patient status, plans for new patients, induction, extubation, transport assistance, or breaks. Typically you will be responsible for seeing and consenting patients in preop. You should clarify with the attendings of the night what they want to be notified for (e.g. call when a case is booked, or text when getting ready to induce and emerge). Be sure to keep the balance of cases roughly even between the R1 resident and C1 APP (typically alternate every other case). If things are light, you can discuss what call rooms are available with the C1 attending. There is a Leprino call room specifically for senior nights.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Cardiac and transplant cases overnight should be covered by the assigned on-call or float resident. However, there may be emergent cases that will require your help to setup and start while the on-call resident is on their way to the hospital, or the float resident is occupied. If such a case develops, please discuss with the C1 attending and the appropriate specialty faculty (CT1/LT1).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">At 7am call the daytime charge attending to let them know of any sick or post-calls from overnight (e.g. did anyone call the phone to call out sick? Or did you call in R2 and they are post-call), you will also handoff any ongoing/pending cases to the AIP Charge attending. Before leaving, please ensure that you have forwarded the charge phone to the AIP charge.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Communication</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Even though you are “independently” practicing, you will continue to follow the Policy for Supervision of Anesthesiology Residents. Briefly, the responsible C1 attending anesthesiologist must be called when:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">1) A trauma activation occurs. Be prepared to provide additional details such as patient location, mode of injury, extent of injuries, and whether operative management is needed.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">2) Airway emergencies are received. Be prepared to provide additional details such as patient location, patient respiratory status, urgent or emergent nature of securing the airway, and whether any other airway tools may be needed.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">3) Specific perioperative events.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- When the patient is set to be transported from the preoperative environment to the operating room.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">- When the patient is ready for induction of anesthesia.</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">When the patient is ready for emergence from anesthesia. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">When any perceived patient safety issue exists. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">When any significant change in patient clinical status occurs. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">When any regional or neuraxial procedure is underway. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">When any central line placement is underway. </li>\n</ul>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">When any difficult arterial line placement occurs. </li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Calls to the charge phone often require guidance from the responsible C1 attending anesthesiologist. Call the attending when any surgeon/surgical issue arises (e.g., cases that need bumped because of an emergency, multiple concurrent emergent cases, discussion of complex cases, etc.). For stroke alerts, be prepared to provide details such as patient location, time of stroke onset, extent of injury, the IR suite for the procedure, and whether general anesthesia or sedation is requested. This list is not exhaustive, please use your best judgement and do not hesitate to contact the C1 attending about any questions/concerns.</p>",
  "sticu": "<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">STICU</h1>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Most Recently updated June 2025 by _Sean Stevens MD_</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Anesthesia Attendings:</strong> Jason Brainard, MD; Naveen Kukreja, MD; Ben Scott, MD; Josh Douin, MD; Jacob Basak, MD</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>EM/Critical Care Attendings:</strong> Julie Winkle, MD</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>Surgical ICU Attendings:</strong> Clay Burlew, MD; Mitch Cohen, MD; Michael Cripps, MD; Joanna Etra, MD; Kristy Hawley, MD; Juan Pablo Idrovo, MD; Whitney Jenson, MD; Aaron Marshall, MD; Robert McIntyre, MD: Lauren Steward, MD; Catherine Velopulos, MD; Frank Wright, MD;</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><strong>STICU APPs:</strong> Zach Asher PA,  Marcus Barlow PA, Kimberly Berry NP, Lauren Fukuhara PA, Gregory Gleckler PA, Madison Hexter PA, Drea Horne PA, Frankie Macri PA, Caroline Kirby PA, Heather Stuart PA, Annabelle Thomas NP, Stephanie Victoria PA</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Schedule and Call   </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The schedule loosely follows a standard rotating schedule of “rounding, rounding, late, call, post-call.”</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If the call shift lands during a weekday, it’s an overnight shift, see details below.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If the call shift lands on a weekend, it’s a 24-hour shift, see details below.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If rounding lands on a weekday, it’s a day shift, see details below.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If rounding lands on a weekend, it’s a day off (no clinical duties)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Rounding – Weekdays. Come in prepared by 6 am and receive sign-out from the overnight team. Round and be primary for your patients until sign-out begin at 4pm.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Late – On weekdays, come in at 6 am like a rounding provider. No change to daytime schedule except you will receive sign out on your team from the other residents/APPs at 3pm and will stay until 7 pm and sign out to the moonlighter. This was implemented to reduce handoffs and the number of patients the call overnight person had in the late afternoon. Late days typically happen 1x/resident/week and often are the day before your call shift.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Call- Weekdays you come in at 3pm. You will receive sign out or do a brief walk/work rounds to find out what happened during the day.  Drs. Scott & Brainard, in particular, prefer walk rounds. Once sign-out is complete, the other resident and APP(s) will leave for the day.  At that point, you will manage the team overnight. Usually, a fellow will be available (from home) throughout the night and will be your point of contact. If a fellow is not scheduled to work that night, you will contact your attending. Some attendings will want you to call around 7-8pm to run the list. A moonlighter will come in at 6:30 pm, who takes half of the patients and will split admissions. After everything has settled, you will do brief walking rounds with the Moonlighter + Charge nurse at 10pm to see if the bedside RN needs anything or has any questions.</p>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!TIP]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\"><strong>PRO-TIP</strong> – if you do these night rounds well, your overnight calls/messages will be drastically reduced. </div>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Weekends/Holiday - come in and round like a normal day at 6am, stay all day and overnight (24 hours + 4 hours as needed to finish patient care tasks). Round with the charge RN around 10pm. Sign-out to team coming on at 6am.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Post call- You will sign-out patients to the day team in the morning and head home.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You don’t come in on the weekends except the days you are scheduled to be on call.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Daily Workflow</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Pre-Rounds: Sign out occurs at 6am sharp. You should plan to be there 5 minutes before to print your list and get settled. At 6 am, you will receive sign-out from the post-call resident to see what happened to your patients overnight (they bled, they coded, etc.), and see if there were any overnight admissions that need to be seen.  Patients are divided between the residents / APPs. You will sign-in to each of your patients as their “Primary contact” in EPIC (if unsure of how to do this ask a senior resident to APP). Please remember to also sign in to the STICU Admit team, as well. Then go around and see your patients, talk to their RN, and perform a quick and focused exam. Pre-rounding physical exam should include surgical wound exam and knowledge of color, consistency, and volume of all surgical drains. Next, review patient data (labs, I/Os, cultures) in EPIC, start the daily progress note (see EPIC instructions below) and write any urgent orders (transfuse, replace electrolytes, etc…).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">If time permits, write/review orders for the next day’s labs, films, etc. The STICU is a single order entry unit.  We (the STICU team) put in most of the orders (the exception being that all immunosuppression orders are entered by the transplant team).  However, the co-managing surgical team (TACS, Green, Transplant, ENT, etc.) places the initial admission orders.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Make sure everyone is seen by the time rounds start.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Rounds</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">STICU rounds start at 8 AM on weekdays and weekends. Rounds are variable and attending dependent but expect to go from room to room starting with co-rounding on transplant patients (often starting with the post-call resident’s patients) and each resident will present their patients.  The other resident (who is not presenting) should grab a “workstation on wheels” to round with and write any orders that might come up and make sure there are orders for the next AM.  If you are not presenting or writing orders, you are expected to update sign-out. These tasks are often divided between the rounding APPs and residents; good communication is key!</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Once rounds are finished, make sure all orders have been placed as discussed on rounds, any consults are placed, procedures are taken care of, and get your notes done. Patient care should take priority over documentation, so make sure that the patient care tasks take precedent.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Transplant patients will be presented by the transplant APPs. Many attendings will want to round on the patient again for thoroughness.</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Presentations</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">All attendings prefer system-based presentations. Start with Name, POD# s/p ‘x’ surgery.  Followed by significant 24hr events. The bedside RN will present pain, sedation, mobility, skin, and indwelling lines.  Then jump to Assessment/Plan by system: Neuro-including sedation/pain, CV, Pulm, Renal, GI, ID, Heme, Fluids/Electrolytes/Nutrition. Finish with review of invasive lines (plans on whether they need to remain or can be removed), big daily plan and disposition. Make sure to know urine and drain output – both quantity and character (i.e., 150cc of serosanguinous output overnight).</p>\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 8px;color:#A8924A;\">Rest of the day</h3>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Check the OR board for expected ICU admits.  If time permits, read about them briefly and add them to the list and update the sign-out with basic information from the chart (PMH, PSH, Medications, ect.).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">All major changes in clinical status (intubation, pressors, etc.) should be communicated to the primary teams.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Monday, Tuesday, Wednesday, and Friday there is lecture from 12-12:30 about various critical care topics.  Please make every attempt to attend. It will rotate between the 2nd floor CTICU conference room and the 5th floor STICU conference room in AIP2 unless otherwise specified. Thursday there is noon critical care grand rounds, which you are expected to attend via Zoom.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">New admits  </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">When a patient is admitted to STICU, the primary team writes the initial admission orders. They also should talk to you either in person or over the phone to give you report (reason for admitting, OR events, plans).</p>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!TIP]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">PRO-TIP – Key items to clarify with primary team in admission include diet, anticoagulation / antibiotic plans, return to OR plans and any vital sign parameters (SBP, MAP, ICP, etc.) that will need to be closely monitored </div>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Patients will usually come directly from the OR to ICU accompanied by an OR RN, anesthesia provider, and member of the surgical team. On occasion, they go to PACU because ICU was not initially intended or there are no ICU beds available. In these instances, make sure to speak with the anesthesia/surgical teams (they should reach out to you, but do not always do so) and go down to PACU and evaluate the patient to make sure they do not have any problems that require immediate attention.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Make sure you evaluate the patient, do a focused physical exam, & review EPIC for pertinent info (brief medical hx, meds, labs).  The OR Anesthesia team should also contact you to give you report (OR course, airway, I/O’s, drugs given, drips, IV access, invasive monitors, etc.).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You will write a STICU Accept Note (progress note) in EPIC. (note template is .sticuprog24) Then order/follow up on labs/CXRs and manage critical care issues that arise including placing any invasive monitors if needed.</p>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!INFO]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">Note: Some teams are VERY hands on (transplant), and some don’t care what you do (ENT, ortho).  </div>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">In general, discuss all major management decisions with the primary surgical service (during the day); not for their permission, but just to maintain good communication among the team members.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">For liver transplant patients, run just about every management decision (no matter how small) by the transplant fellow. You should also be expecting to communicate with them every hour (phone call or EPIC message depending on their preference) with new labs and drain output immediately after they come from the OR.  You will quickly get a feel for how hands-on vs. off they will be for each individual patient.</p>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!TIP]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\"><strong>PRO-TIP</strong> – For all new patients, know and document the exact location of every drain and what portion of the body it is draining (i.e., Drain #2 liver bed, next to caval anastomosis), neuro exam for vascular or trauma patients, pulse exam, etc. Surgical attendings will want you to be very specific.  </div>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">EPIC for STICU</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">How to modify your EPIC for ICU use:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Use the EPIC button on the top left to “change context” to “zz intensivist” from “zz anesthesia.” to “zz intensivist.”</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">From the “patient summary” button use the wrench function to add parameters to your toolbar. (Names may change slightly from year to year)</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Comprehensive flow sheet (or “adult comprehensive” or “comp”)  </li>\n<li style=\"font-size:13px;\">Pain management (or “pain”)</li>\n<li style=\"font-size:13px;\">Microbiology (or “micro”)</li>\n<li style=\"font-size:13px;\">MAR (or “meds history”)</li>\n<li style=\"font-size:13px;\">Fever (or “fever”)</li>\n<li style=\"font-size:13px;\">Intake/Output</li>\n<li style=\"font-size:13px;\">LDA (or “lines/drains/airway”)</li>\n<li style=\"font-size:13px;\">Blood Transfusion (or “transfusion”)</li>\n<li style=\"font-size:13px;\">Anticoagulation</li>\n<li style=\"font-size:13px;\">Alcohol Withdrawal Monitoring (or “ETOH”) </li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Add order sets to your favorite list by right clicking on “order sets” Useful ones are:</p>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">UCH Adult IV insulin Infusion</li>\n<li style=\"font-size:13px;\">UCH Subcutaneous Insulin for TPN or Tube Feeding</li>\n<li style=\"font-size:13px;\">UCHS Subcutaneous Insulin: Basal/Bolus for PO, NPO, or bolus TF  </li>\n<li style=\"font-size:13px;\">UCH Pain/Agitation Management for mechanically ventilated patient in the ICU  </li>\n<li style=\"font-size:13px;\">UCH Blood Administration: Inpatient and Emergency Department  </li>\n<li style=\"font-size:13px;\">UCH Heparin Continuous Infusion CTICU/STICU Anticoagulation  </li>\n<li style=\"font-size:13px;\">UCH Intravenous Patient Controlled Analgesia (IV PCA)  </li>\n<li style=\"font-size:13px;\">UCH Enteral Tube Feeding  </li>\n<li style=\"font-size:13px;\">UCH ICU Electrolyte Replacement Guideline  </li>\n<li style=\"font-size:13px;\">UCH End-of-Life Care for the Intensive Care Patient  </li>\n<li style=\"font-size:13px;\">UCH Neuromuscular Blockade – Adult ICU  </li>\n</ul>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">To get to the STICU Patient lists (this must be shared with you):</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Patient lists at top → Shared Patient lists → STICU…</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">To add someone to your shared lists (SubIs or new Residents coming on service), Click on the list, click “Properties” the “Advanced” tab. Scroll to the bottom of the list and add the name and under Access Level—type “5” then accept.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Add & Remove Patients from the STICU list as they are admitted and discharged.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">(Remember to also add the patient to the SICU Sign-Out Report)</p>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">[!TIP]</div>\n<div style=\"border-left:3px solid #CFB87C;background:#FAF3DF;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;\">PRO-TIP: Do not copy and paste from EPIC to the signout. This messes up the font. It is acceptable to copy and paste from the signout to EPIC.    </div>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">To add templates for STICU notes:</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">EPIC → Tools → Smartphase Manager → Change USER to Anesthesia, Resident → click GO.  This will automatically import STICU progress note, STICU accept note, STICU CT progress note templates that have been created and have already been shared with you. Highlight all templates. Then click on “Share” then accept to share this with yourself.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Now to start a note---go to “New Note” then to add a template, click on the “list my phases” to the left of the green plus sign (little dude in purple shirt). Pick STICU progress note (or STICU accept note for new patients)</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Finish notes by scrolling through dot phrases etc. using F2 button.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">You can copy your progress note from the day prior by selecting the “Copy” button on the upper left corner of the note pane. This will automatically refresh any lab links. Be sure to edit all the info in that note, so that you aren’t still writing that the patient is intubated and sedated when they are not.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">STICU Pearls:  </h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">It is helpful to come to the STICU ahead of your rotation as time/schedule permits to get orientated, access to the shared patient list, and tour the unit.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Never transfuse a transplant patient without talking to their team first (usually not team pager/first contact, but senior resident/fellow or attending).</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Call your attending with any major issues, or with any questions, they would rather you call than not, and they only do 1 week at a time, so it’s not as bad for them.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Discuss all consults with primary team, especially ID and palliative care.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Sign out should be given to the primary team for all downgraded patients especially ortho and TACS. You don’t have to write a transfer summary as the primary team already knows the patient. TACS requests a handoff note if transferring to a lower level of care after 6pm</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Talk to the nurses about what they might need BEFORE you lay down, if you get the chance (between 8pm and midnight is a good time). Walking around with the charge nurse and a “workstation on wheels” during these unofficial rounds helps ensure everyone is on the same page and allows you to rapidly add/change orders.  This will save you 2 am phone calls and build your rapport with the nursing staff.  This vastly improves your ICU experience!</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There is ALWAYS an in-house TACSs attending and an in-house intensivist (MICU) to call if you need help with a line or if there are any questions. There is also a surgical R3 who may be available in the ER or OR.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">When extubating, get ABG on PSV, weaning parameters (NIF, FVC, secretions, cuff leak test) - obtained by the RT, RSBI, and then call the attending with your plan.  Only write the order to extubate after confirming with you attending. The RT will usually do the physical extubation for you, but it is a good idea to be present.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Ask for help if you need it, from nurses, APPs, fellows, surgical and other anesthesia residents, or attendings. We are all here to take care of patients and work toward their best possible outcomes.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The STICU protocols that Dr. McIntyre and Dr. Brainard have put together is a helpful resource and is now online. Make sure to peruse it before you start your rotation! http://www.ucdenver.edu/academics/colleges/medicalschool/departments/surgery/divisions/Trauma/Trauma-at-UCH/Pages/STICU-Protocols.aspx</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The STICU APPs are listed at the beginning of the section. They see about the same # of patients as you each day and are staffed on both weekend days. They are an extremely valuable source of information about how the STICU service works, critical care, and attending preferences so learn from them and treat them well! Please notify Zach Asher (Zachary.asher@cuanschutz.edu ) if there are any concerns about the APPs in the STICU.</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">There is always a STICU fellow (sometimes 2), who is also helpful. The Fellow may run rounds, do procedures with you, or act as first call or attending during certain times.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Door Codes</h2>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Call Room -- badge access</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Store/Pyxis Room -- 3030#</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Break room -- 9669#</p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">Rooms that don’t have badge access -- 9669#</p>",
  "txp": "<h1 style=\"font-size:22px;font-weight:800;margin-bottom:16px;\">Transplant Anesthesia Rotation Guide</h1>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\"><em>Most recently edited by Dominic Royster DO, July 2023</em></p>\n<p style=\"font-size:13px;line-height:1.7;margin:6px 0;\">The primary focus of this month will be liver transplants, with time spent doing kidney transplants and high acuity general cases (i.e. Whipples & HIPECs). Liver transplant recipients have many major physiology derangements within multiple organ systems and the surgery often involves significant blood loss, coagulopathy, and hemodynamic instability. The high acute nature of liver transplants provides incredible insight into massive transfusion protocols, interpreting TEGs, and large bore line placement. You will be 1:1 with your attending for liver transplants and may have a liver transplant fellow that works with you.</p>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Transplant Anesthesiology Attendings</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Adrian Hendrickse MD (Fellowship Director)</li>\n<li style=\"font-size:13px;\">Seth Aly MD</li>\n<li style=\"font-size:13px;\">Fareed Azam MD</li>\n<li style=\"font-size:13px;\">Cara Crouch MD</li>\n<li style=\"font-size:13px;\">Ana Fernandez-Bustamante MD</li>\n<li style=\"font-size:13px;\">Naveen Kukreja MD</li>\n<li style=\"font-size:13px;\">Barbara Wilkey MD</li>\n<li style=\"font-size:13px;\">Pat Henthorn MD</li>\n</ul>\n<h2 style=\"font-size:18px;font-weight:800;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8E5DF;\">Rotation Breakdown</h2>\n<ul style=\"margin:6px 0 6px 20px;line-height:1.7;\">\n<li style=\"font-size:13px;\">Typically, two residents on rotation sharing 24hr call every other day 7am-7am.</li>\n<li style=\"font-size:13px;\">Non-call days usually in a high acuity general OR
