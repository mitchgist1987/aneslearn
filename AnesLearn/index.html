<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#F4F2EE;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column;}
button,select,input,textarea{font-family:'Inter',sans-serif;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:#ddd;border-radius:10px;}
.fade{animation:fadeUp .18s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
input:focus,select:focus{outline:2px solid #CFB87C;outline-offset:1px;}
a{color:inherit;text-decoration:none;}

/* ── HEADER ── */
#hdr-top{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:50px;background:#1B1B1B;border-bottom:1px solid rgba(255,255,255,.08);}
#hdr-nav{background:#1B1B1B;border-bottom:2px solid #A8924A;display:flex;overflow-x:auto;padding:0 8px;scrollbar-width:none;}
#hdr-nav::-webkit-scrollbar{display:none;}
header{position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);flex-shrink:0;}
.hdr-actions{display:flex;align-items:center;gap:6px;}

/* ── MAIN CONTENT ── */
#main-content{flex:1;max-width:1160px;width:100%;margin:0 auto;padding:20px 16px;}

/* ── DASHBOARD GRID ── */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}

/* ── COURSES GRID ── */
.courses-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}

/* ── KUDOS ── */
.kudos-grid{display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start;}

/* ── MODAL ── */
.modal-wrap{position:fixed;inset:0;background:rgba(27,27,27,.7);z-index:600;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px);}
.modal-inner{background:#fff;border-radius:14px;padding:28px 32px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.25);animation:fadeUp .18s ease;}

/* ── PAGE TITLES ── */
.pg-title{font-size:28px;font-weight:800;font-family:'Playfair Display',serif;line-height:1.2;}

/* ── ADMIN PANEL ── */
.admin-resident-actions{display:flex;gap:6px;flex-shrink:0;}

/* ── MOBILE ── */
@media(max-width:640px){
  .gb-sidebar{width:100% !important;max-height:200px !important;border-right:none !important;border-bottom:1px solid #E8E5DF;}
  .gb-content{max-height:none !important;padding:16px !important;}
  [style*="display:flex;gap:0;border-radius:14px"]{flex-direction:column !important;}
  #hdr-top{padding:0 12px;height:48px;}
  #main-content{padding:14px 12px;}

  /* header */
  .hdr-logo-text{display:none;}
  .hdr-admin-label{display:none;}
  .hdr-switch-label{display:none;}
  .hdr-bell{padding:5px 7px !important;}
  .hdr-admin{padding:5px 8px !important;}
  .hdr-user{padding:3px 4px !important;}

  /* dashboard */
  .dash-grid{grid-template-columns:1fr;}
  .stats-grid{grid-template-columns:repeat(2,1fr);}

  /* courses */
  .courses-grid{grid-template-columns:1fr;}

  /* admin */
  .admin-panel-inner{max-width:100% !important;}
  .admin-resident-actions{flex-wrap:wrap;}

  /* kudos */
  .kudos-grid{grid-template-columns:1fr;}

  /* modal */
  .modal-wrap{padding:8px;}
  .modal-inner{padding:20px 16px;border-radius:12px;max-width:100%;}

  /* page titles */
  .pg-title{font-size:21px;}

  /* worksheets */
  .quiz-grid{grid-template-columns:1fr !important;}

  /* podcasts — make iframe height smaller on mobile */
  .podcast-embed-frame{height:300px !important;}

  /* resources quick links */
  .resources-links{grid-template-columns:1fr !important;}

  /* suggestion category buttons */
  #sugg-cats{gap:6px;}
  #sugg-cats button{font-size:12px !important;padding:6px 10px !important;}

  /* module page tabs */
  .module-tabs{overflow-x:auto;scrollbar-width:none;}

  /* admin full page */
  .admin-full-tabs{gap:2px;}
  .admin-full-tabs button{font-size:12px !important;padding:6px 10px !important;}

  /* eval/suggestion cards in admin */
  .eval-card-row{flex-direction:column !important;}

  /* Green Book / Anesthesia In-Sight iframes */
  iframe{max-height:400px;}

  /* dashboard quick links grid */
  .dash-links{grid-template-columns:1fr 1fr !important;}
}

@media(max-width:400px){
  .stats-grid{grid-template-columns:1fr 1fr;}
  #hdr-top{gap:6px;}
  .dash-links{grid-template-columns:1fr !important;}
}
</style>

async function dbGet(table, col, val){
  const q = val!==undefined ? sb.from(table).select('*').eq(col,val) : sb.from(table).select('*');
  const {data,error} = await q;
  if(error) console.error('dbGet',table,error);
  return data||[];
}
async function dbUpsert(table, row){
  const {error} = await sb.from(table).upsert(row);
  if(error) console.error('dbUpsert',table,error);
}
async function dbDelete(table, col, val){
  const {error} = await sb.from(table).delete().eq(col,val);
  if(error) console.error('dbDelete',table,error);
}
async function dbSet(key, value){
  await sb.from('settings').upsert({key, value: JSON.stringify(value)});
}
async function dbGetSetting(key, def){
  const {data} = await sb.from('settings').select('value').eq('key',key).single();
  if(!data) return def;
  try{return JSON.parse(data.value);}catch{return def;}
}

// ─── PERSIST (Supabase-backed) ────────────────────────────────────────────────
async function persist(key, val){
  S[key] = val;
  draw();
  if(key==='courses'){
    // Store each course as a row
    await Promise.all(val.map(c => dbUpsert('courses', {id:c.id, data:c})));
  } else if(key==='residents'){
    await Promise.all(val.map(r => dbUpsert('residents', {
      id:r.id, name:r.name, year:r.year, chief:!!r.chief, enrolled:r.enrolled, email:r.email||'', phone:r.phone||''
    })));
  } else if(key==='events'){
    // Full replace: delete all then insert
    await sb.from('events').delete().neq('id','___');
    if(val.length) await sb.from('events').insert(val.map(e=>{
      return {id:String(e.id), title:e.title, date:e.date, time:e.time||'', type:e.type||'Lecture'};
    }));
  } else if(key==='icsUrl'){
    await dbSet('icsUrl', val);
  } else if(key==='kudos'){
    // kudos are appended individually — see submitKudos
  }
}

function detectType(url){
  if(!url)return'other';
  if(/youtube\.com\/watch|youtu\.be\//.test(url))return'youtube';
  if(/docs\.google\.com\/presentation/.test(url))return'gslides';
  if(/drive\.google\.com|docs\.google\.com/.test(url))return'gdrive';
  if(/open\.spotify\.com\/(episode|show|track)/.test(url))return'spotify';
  if(/sharepoint\.com|onedrive\.live|1drv\.ms/.test(url))return'sharepoint';
  if(/accrac\.com|buzzsprout\.com|podbean\.com|simplecast\.com|transistor\.fm|anchor\.fm|spreaker\.com|soundcloud\.com|pinecast\.com|captivate\.fm|podcasts\.apple\.com|podcast\.apple\.com/.test(url))return'podcast';
  if(/\.pdf($|\?)/.test(url))return'pdf';
  return'other';
}
function buildEmbed(url,type){
  try{
    if(type==='youtube'){const m=url.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);if(m)return`https://www.youtube.com/embed/${m[1]}?rel=0&modestbranding=1`;}
    if(type==='gslides'){const m=url.match(/\/presentation\/d\/([^/]+)/);if(m)return`https://docs.google.com/presentation/d/${m[1]}/embed?start=false&loop=false`;}
    if(type==='gdrive'){const m=url.match(/\/d\/([^/]+)/);if(m)return`https://drive.google.com/file/d/${m[1]}/preview`;if(url.includes('/preview'))return url;}
    if(type==='spotify'){const m=url.match(/open\.spotify\.com\/(episode|show|track)\/([a-zA-Z0-9]+)/);if(m)return`https://open.spotify.com/embed/${m[1]}/${m[2]}?utm_source=generator`;}
    if(type==='podcast'&&url.includes('accrac.com')){
      // ACCRAC WordPress embed — just append /embed/ to episode URL
      return url.replace(/\/+$/,'')+'/embed/';
    }
    if(type==='pdf')return url;
    if(type==='upload')return url; // base64 data URL stored in IndexedDB
  }catch{}return null;
}

        </details>

          <button onclick="cancelCt()" style="${gBtn}font-size:12px;padding:6px 14px;">Cancel</button>

        </div>
      </div>`;
    }
    if(S.adminUnlocked&&!S.showAddContent){
      contentH+=`<button onclick="showCt()" style="${pBtn()}padding:7px 16px;font-size:12px;margin-top:8px;">+ Attach Content</button>`;
    }
  }

  // Reading tab
  let readingH='';
  if(tab==='reading'){
    if(!reading.trim()){
      readingH='<p style="font-size:13px;color:#aaa;font-style:italic;padding:8px 0;">No reading assigned for this module.</p>';
    } else {
      const srcColors={'M&M':['#1A3A1A','#EDF7F1'],'ACCRAC':['#1E3A6E','#EDF1FB'],'Barash':['#4A1A0A','#FDF0E8'],"Miller's":['#1A1A4A','#EEEDF7'],'Miller':['#1A1A4A','#EEEDF7'],'Ehrenwerth':['#1A3A3A','#EDF7F7'],'Stoelting':['#3A1A3A','#F7EDF7']};
      readingH='<div style="margin-top:4px;">';
      let first=true;
      reading.split('\n').forEach(line=>{
        line=line.trim(); if(!line)return;
        const isCat=/^[A-Z][A-Za-z&']+:/.test(line)&&line.includes(':');
        if(isCat){
          const colon=line.indexOf(':');
          const src=line.slice(0,colon).trim();
          const rest=line.slice(colon+1).trim();
          const [fg,bg]=srcColors[src]||['#333','#F4F2EE'];
          readingH+=`${first?'':'</div>'}<div style="margin-top:${first?0:16}px;"><div style="display:inline-block;padding:3px 10px;border-radius:5px;background:${bg};color:${fg};font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;">${src}</div>`;
          if(rest) readingH+=`<div style="font-size:13px;color:#444;line-height:1.65;padding-left:4px;">${rest}</div>`;
          first=false;
        } else {
          readingH+=`<div style="font-size:13px;color:#555;line-height:1.65;padding-left:12px;border-left:3px solid #E8E5DF;margin-bottom:4px;">${line}</div>`;
        }
      });
      if(!first)readingH+='</div>';
      readingH+='</div>';
    }
  }

  // Notes tab
  const notesH = `<div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
      <div>
        <div style="${sLbl}margin-bottom:3px;">Personal Notes</div>
        <p style="font-size:12px;color:#aaa;margin:0;">Saved per module, per user. Export all notes anytime.</p>
      </div>
      <button onclick="exportNotes()" style="${gBtn}font-size:12px;padding:7px 14px;display:inline-flex;align-items:center;gap:6px;">⬇ Export All Notes</button>
    </div>
    <textarea id="note-area"
      oninput="noteChanged(this.value,'${noteKey}')"
      placeholder="Type your notes here… Key concepts, mnemonics, clinical pearls, questions to follow up on."
      style="width:100%;min-height:260px;padding:14px 16px;border:1.5px solid #E0DDD8;border-radius:10px;font-size:13px;color:#1a1a1a;line-height:1.7;resize:vertical;background:#FDFCFA;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s;"
      onfocus="this.style.borderColor='#CFB87C'" onblur="this.style.borderColor='#E0DDD8'"
    >${noteText}</textarea>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;flex-wrap:wrap;gap:8px;">
      <span id="note-status" style="font-size:11px;color:#bbb;">${noteText.trim()?'Notes saved ✓':''}</span>
      <div style="display:flex;gap:8px;">
        ${noteText.trim()?`<button onclick="clearNote('${noteKey}')" style="${dBtn}font-size:11px;padding:4px 10px;">Clear</button>`:''}
        <button onclick="saveNote('${noteKey}')" style="${pBtn()}font-size:12px;padding:7px 16px;">Save Notes</button>
      </div>
    </div>
  </div>`;

  return `<div class="fade">
  <button onclick="backToCourse()" style="${gBtn}border:none;background:none;color:#777;margin-bottom:20px;padding-left:0;">← Back to ${c.title}</button>
  <div style="background:${cc.bg};border-radius:14px;padding:26px 30px;margin-bottom:20px;position:relative;overflow:hidden;">
    <div style="position:absolute;top:-20px;right:-20px;font-size:130px;opacity:.04;line-height:1;pointer-events:none;">${c.icon}</div>
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;">
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
          <span style="${tag(cc.accent+'40',cc.text)}">${cc.tag}</span>
          <span style="font-size:12px;color:rgba(255,255,255,.35);font-weight:500;">Week ${m.week}</span>
        </div>
        <h1 style="font-size:21px;font-weight:800;color:${cc.text};font-family:'Playfair Display',serif;line-height:1.3;margin-bottom:12px;">${m.title}</h1>
        <div style="display:flex;gap:16px;flex-wrap:wrap;">
          ${m.faculty?`<span style="font-size:12px;color:rgba(255,255,255,.45);">👩‍⚕️ ${m.faculty}</span>`:''}
          ${m.date?`<span style="font-size:12px;color:rgba(255,255,255,.45);">📅 ${m.date}</span>`:''}
          ${m.subspecialty?`<span style="font-size:12px;color:rgba(255,255,255,.45);">🏥 ${m.subspecialty}</span>`:''}
        </div>
        ${advanced?`<div style="margin-top:12px;padding:10px 14px;background:rgba(255,255,255,.07);border-radius:8px;border-left:3px solid ${cc.accent};"><div style="font-size:10px;font-weight:700;color:${cc.accent};letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;">Advanced Topics</div><div style="font-size:12px;color:rgba(255,255,255,.5);line-height:1.6;white-space:pre-line;">${advanced}</div></div>`:''}
      </div>
      <button onclick="toggleDone()" style="flex-shrink:0;padding:9px 18px;border-radius:8px;border:1.5px solid ${m.completed?'rgba(255,255,255,.3)':'rgba(255,255,255,.2)'};background:${m.completed?'rgba(45,125,79,.4)':'transparent'};color:${m.completed?'#7AC99A':cc.text};font-weight:700;font-size:13px;cursor:pointer;">${m.completed?'✓ Completed':'Mark Complete'}</button>
    </div>
  </div>

  ${S.adminUnlocked ? `<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
    <button onclick="showEditModule()" style="${gBtn}padding:7px 14px;font-size:12px;">✏️ Edit Module</button>
    <button onclick="deleteModule()" style="${dBtn}font-size:12px;">🗑 Delete Module</button>
    <button onclick="addModuleBelow()" style="${gBtn}padding:7px 14px;font-size:12px;">+ Add Module Below</button>
  </div>` : ''}

  ${S.editingModule ? `<div style="${card}padding:20px 24px;margin-bottom:16px;border:1.5px solid #E2CFA0;">
    <div style="font-weight:700;font-size:14px;margin-bottom:16px;">Edit Module</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
      <div style="grid-column:1/-1;"><label style="${lbl}">Title</label><input id="em-title" style="${inp}" value="${m.title||''}"/></div>
      <div><label style="${lbl}">Faculty</label><input id="em-faculty" style="${inp}" value="${m.faculty||''}"/></div>
      <div><label style="${lbl}">Date</label><input id="em-date" style="${inp}" value="${m.date||''}"/></div>
      <div><label style="${lbl}">Week</label><input id="em-week" type="number" style="${inp}" value="${m.week||''}"/></div>
      <div><label style="${lbl}">Subspecialty</label><input id="em-subspec" style="${inp}" value="${m.subspecialty||''}"/></div>
      <div style="grid-column:1/-1;"><label style="${lbl}">Advanced Topics</label><textarea id="em-advanced" style="${inp}resize:vertical;min-height:60px;">${m.advanced||''}</textarea></div>
      <div style="grid-column:1/-1;"><label style="${lbl}">Reading</label><textarea id="em-reading" style="${inp}resize:vertical;min-height:60px;">${m.reading||''}</textarea></div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;">
      <button onclick="S.editingModule=false;draw()" style="${gBtn}font-size:12px;padding:7px 14px;">Cancel</button>
      <button onclick="saveModuleEdits()" style="${pBtn()}font-size:12px;padding:7px 16px;">Save Changes</button>
    </div>
  </div>` : ''}

  <div style="${card}overflow:hidden;">
    <div style="display:flex;border-bottom:1px solid #F0EDE8;padding:0 24px;">${tabs}</div>
    <div style="padding:22px 24px;">${tab==='content'?contentH:tab==='reading'?readingH:notesH}</div>
  </div>

  <!-- Lecture Evaluation -->
  ${(()=>{
    const evalKey = 'al6_eval_' + m.id;
    const alreadySubmitted = localStorage.getItem(evalKey);
    if(alreadySubmitted) return `
      <div style="margin-top:16px;padding:16px 20px;background:#F4FAF6;border:1.5px solid #B8DFC9;border-radius:12px;display:flex;align-items:center;gap:10px;">
        <span style="font-size:20px;">✅</span>
        <div>
          <div style="font-weight:700;font-size:13px;color:#2D7D4F;">Feedback submitted</div>
          <div style="font-size:12px;color:#5a9a72;">Thank you for evaluating this lecture.</div>
        </div>
      </div>`;
    return `
      <div style="margin-top:16px;padding:20px 24px;background:#FAFAFA;border:1.5px solid #E8E5DF;border-radius:12px;">
        <div style="font-weight:700;font-size:14px;margin-bottom:4px;">📝 Evaluate this lecture</div>
        <div style="font-size:12px;color:#aaa;margin-bottom:12px;">Anonymous · one response per lecture</div>
        <textarea id="eval-text-${m.id}" placeholder="Share your feedback — content quality, clinical relevance, teaching style, suggestions..." style="width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1.5px solid #E8E5DF;font-size:13px;font-family:inherit;resize:vertical;min-height:90px;outline:none;" onfocus="this.style.borderColor='#CFB87C'" onblur="this.style.borderColor='#E8E5DF'"></textarea>
        <div style="display:flex;justify-content:flex-end;margin-top:10px;">
          <button onclick="submitEval(${m.id}, ${c.id})" style="${pBtn()}padding:9px 20px;font-size:13px;">Submit Feedback</button>
        </div>
      </div>`;
  })()}

</div>`;
}

// ─── MODULE MANAGEMENT ────────────────────────────────────────────────────────
function showEditModule() { S.editingModule = true; draw(); }

async function saveModuleEdits() {
  const c = getCourse(), m = getMod();
  if(!c || !m) return;
  const title     = document.getElementById('em-title')?.value.trim();
  const faculty   = document.getElementById('em-faculty')?.value.trim();
  const date      = document.getElementById('em-date')?.value.trim();
  const week      = parseInt(document.getElementById('em-week')?.value) || m.week;
  const subspec   = document.getElementById('em-subspec')?.value.trim();
  const advanced  = document.getElementById('em-advanced')?.value.trim();
  const reading   = document.getElementById('em-reading')?.value.trim();
  if(!title) { alert('Title is required.'); return; }
  const updMod = {...m, title, faculty, date, week, subspecialty:subspec, advanced, reading};
  const updCourse = {...c, modules: c.modules.map(x => x.id===m.id ? updMod : x)};
  S.courses = S.courses.map(x => x.id===c.id ? updCourse : x);
  S.editingModule = false;
  await persist('courses', S.courses);
}

async function deleteModule() {
  const c = getCourse(), m = getMod();
  if(!c || !m) return;
  S._confirmFn = async () => {
    const updCourse = {...c, modules: c.modules.filter(x => x.id !== m.id)};
    S.courses = S.courses.map(x => x.id===c.id ? updCourse : x);
    await persist('courses', S.courses);
    go('course');
  };
  S.modal = {type:'confirm', data:{title:`Delete "${m.title}"?`, msg:'This will permanently delete this module and all its content. This cannot be undone.'}};
  draw();
}

async function addModuleBelow() {
  const c = getCourse(), m = getMod();
  if(!c || !m) return;
  const newMod = {
    id: Date.now(),
    week: (m.week || 1) + 1,
    title: 'New Module',
    faculty: '',
    date: '',
    subspecialty: '',
    reading: '',
    advanced: '',
    content: [],
    completed: false
  };
  const idx = c.modules.findIndex(x => x.id === m.id);
  const newModules = [...c.modules.slice(0, idx+1), newMod, ...c.modules.slice(idx+1)];
  const updCourse = {...c, modules: newModules};
  S.courses = S.courses.map(x => x.id===c.id ? updCourse : x);
  await persist('courses', S.courses);
  S.moduleId = newMod.id;
  S.editingModule = true;
  draw();
}


// ─── COURSE MANAGEMENT ────────────────────────────────────────────────────────
function showEditCourse() { S.editingCourse = true; draw(); }

async function saveCourseEdits() {
  const c = getCourse();
  if(!c) return;
  const title    = document.getElementById('ec-title')?.value.trim();
  const subtitle = document.getElementById('ec-subtitle')?.value.trim();
  const icon     = document.getElementById('ec-icon')?.value.trim() || '📋';
  const category = document.getElementById('ec-cat')?.value.trim();
  if(!title) { alert('Title is required.'); return; }
  const updCourse = {...c, title, subtitle, icon, category};
  S.courses = S.courses.map(x => x.id===c.id ? updCourse : x);
  S.editingCourse = false;
  await persist('courses', S.courses);
}

async function deleteCourse() {
  const c = getCourse();
  if(!c) return;
  S._confirmFn = async () => {
    S.courses = S.courses.filter(x => x.id !== c.id);
    await persist('courses', S.courses);
    go('courses');
  };
  S.modal = {type:'confirm', data:{title:`Delete "${c.title}"?`, msg:'This will permanently delete this entire course and ALL its modules. This cannot be undone.'}};
  draw();
}

async function addNewCourse() {
  const newCourse = {
    id: Date.now(),
    icon: '📋',
    title: 'New Course',
    subtitle: '',
    category: 'New',
    modules: []
  };
  S.courses = [...S.courses, newCourse];
  await persist('courses', S.courses);
  S.courseId = newCourse.id;
  S.editingCourse = true;
  go('course');
}

async function addNewModule() {
  const c = getCourse();
  if(!c) return;
  const newMod = {
    id: Date.now(),
    week: (c.modules.length > 0 ? Math.max(...c.modules.map(m => m.week||0)) : 0) + 1,
    title: 'New Module',
    faculty: '',
    date: '',
    subspecialty: '',
    reading: '',
    advanced: '',
    content: [],
    completed: false
  };
  const updCourse = {...c, modules: [...c.modules, newMod]};
  S.courses = S.courses.map(x => x.id===c.id ? updCourse : x);
  await persist('courses', S.courses);
  S.moduleId = newMod.id;
  S.editingModule = true;
  go('module');
}

// ─── CALENDAR ─────────────────────────────────────────────────────────────────
function pgCalendar(){
  const icsReady = (S.icsEvents||[]).length > 0;
  const hasUrl   = !!(S.icsUrl||'').trim();
  const fetching = !!S.icsFetching;

  // Merge: ICS events take over if connected, otherwise fall back to manual events
  const allEvents = icsReady ? S.icsEvents : S.events;
  const y=S.calYear, m=S.calMonth;
  const days=new Date(y,m+1,0).getDate();
  const first=new Date(y,m,1).getDay();
  const mName=new Date(y,m).toLocaleString('default',{month:'long'});
  const evForDay=d=>allEvents.filter(e=>{const ed=new Date(e.date+'T00:00:00');return ed.getFullYear()===y&&ed.getMonth()===m&&ed.getDate()===d;});
  const upcoming=[...allEvents].filter(e=>new Date(e.date+'T00:00:00')>=new Date()).sort((a,b)=>new Date(a.date)-new Date(b.date));

  let grid=['S','M','T','W','T','F','S'].map(d=>`<div style="text-align:center;font-size:10px;font-weight:700;color:#bbb;padding:4px 0;">${d}</div>`).join('');
  for(let i=0;i<first;i++)grid+='<div></div>';
  for(let d=1;d<=days;d++){
    const evs=evForDay(d),isSel=S.calSel===d,isToday=d===3&&m===2&&y===2026;
    grid+=`<div onclick="calSel(${d})" style="aspect-ratio:1;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:12px;background:${isToday?'#1B1B1B':isSel?'#FAF3DF':'transparent'};color:${isToday?'#CFB87C':'#1a1a1a'};border:1.5px solid ${isSel?'#A8924A':'transparent'};font-weight:${isToday||isSel?700:400};">${d}${evs.length?`<div style="display:flex;gap:2px;margin-top:1px;">${evs.slice(0,3).map(()=>`<div style="width:3px;height:3px;border-radius:50%;background:${isToday?'#CFB87C':'#A8924A'};"></div>`).join('')}</div>`:''}</div>`;
  }

  const selH=S.calSel&&evForDay(S.calSel).length?`<div style="margin-top:16px;padding-top:14px;border-top:1px solid #F0EDE8;">
    <div style="${sLbl}margin-bottom:8px;">${mName} ${S.calSel}</div>
    ${evForDay(S.calSel).map(ev=>`<div style="display:flex;gap:10px;padding:8px 0;align-items:flex-start;">
      <div style="width:3px;min-height:32px;border-radius:2px;background:#2D5B9E;flex-shrink:0;margin-top:3px;"></div>
      <div><div style="font-weight:600;font-size:13px;">${ev.title}</div>
      <div style="font-size:11px;color:#aaa;margin-top:2px;">${ev.time||'All day'}${ev.location?' · 📍'+ev.location:''}</div></div>
    </div>`).join('')}
  </div>`:'';

  const upH=upcoming.length?upcoming.map((ev,i)=>{
    const d=new Date(ev.date+'T00:00:00');
    const col=icsReady?'#2D5B9E':(EC[ev.type]||'#555');
    const bg=icsReady?'#EDF1FB':(col+'18');
    return `${i?dvd:''}<div style="display:flex;align-items:center;gap:14px;padding:13px 0;">
      <div style="text-align:center;min-width:44px;background:${icsReady?'#EDF1FB':'#F4F2EE'};border-radius:9px;padding:7px 6px;border:1px solid ${icsReady?'#B8C8E8':'#E8E5DF'};flex-shrink:0;">
        <div style="font-size:9px;font-weight:700;color:${icsReady?'#2D5B9E':'#A8924A'};text-transform:uppercase;">${d.toLocaleString('default',{month:'short'})}</div>
        <div style="font-size:19px;font-weight:800;font-family:'Playfair Display',serif;line-height:1.2;">${d.getDate()}</div>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${ev.title}</div>
        <div style="font-size:12px;color:#aaa;margin-top:2px;">${ev.time||'All day'}${ev.location?' · 📍'+ev.location:''}</div>
      </div>
      ${icsReady?'':`<span style="${tag(bg,col)}">${ev.type}</span>`}
    </div>`;
  }).join(''):`<p style="font-size:13px;color:#aaa;padding:8px 0;">${hasUrl?'No upcoming events in your Outlook calendar.':'No events yet.'}</p>`;

  // Status bar
  const statusBar = hasUrl ? `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:${icsReady?'#EDF1FB':'#FFF8EE'};border-radius:9px;margin-bottom:16px;gap:12px;flex-wrap:wrap;">
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="font-size:14px;">${fetching?'⟳':icsReady?'🔄':'⚠️'}</span>
      <div>
        <div style="font-size:12px;font-weight:600;color:${icsReady?'#2D5B9E':'#B87C2D'};">${fetching?'Syncing with Outlook…':icsReady?'Synced from Outlook':'Sync pending'}</div>
        <div style="font-size:11px;color:#aaa;">${S.icsLastFetched?'Last updated: '+new Date(S.icsLastFetched).toLocaleTimeString():'Fetching on load…'}</div>
      </div>
    </div>
    <button onclick="fetchICS()" ${fetching?'disabled':''} style="${pBtn('#2D5B9E','#fff')}font-size:11px;padding:6px 14px;opacity:${fetching?0.5:1};">🔄 Sync now</button>
  </div>` : `<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#FAF3DF;border-radius:9px;margin-bottom:16px;border:1px solid #E2CFA0;">
    <span style="font-size:14px;">📡</span>
    <div style="flex:1;font-size:12px;color:#A8924A;font-weight:500;">No Outlook feed connected. ${S.adminUnlocked?`<span onclick="setAT('feeds');S.showAdmin=true;draw()" style="cursor:pointer;text-decoration:underline;font-weight:700;">Set up in Admin →</span>`:'Unlock Admin to connect your Outlook calendar.'}</div>
  </div>`;

  return `<div class="fade">
  <div style="margin-bottom:24px;"><div style="${sLbl}margin-bottom:6px;">Schedule</div><h1 class="pg-title">Calendar</h1></div>
  ${statusBar}
  <div style="display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:start;">
    <div style="${card}padding:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <button onclick="calNav(-1)" style="${gBtn}padding:4px 10px;border:none;font-size:16px;">‹</button>
        <span style="font-weight:700;font-size:14px;font-family:'Playfair Display',serif;">${mName} ${y}</span>
        <button onclick="calNav(1)" style="${gBtn}padding:4px 10px;border:none;font-size:16px;">›</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">${grid}</div>
      ${selH}
    </div>
    <div style="${card}padding:22px 24px;">
      <div style="${sLbl}margin-bottom:18px;">${icsReady?'Upcoming from Outlook':'Upcoming Events'}</div>
      ${upH}
    </div>
  </div>
</div>`;
}

// ─── ADMIN PANEL ──────────────────────────────────────────────────────────────

function getAdminBody(tab) {
  let body='';
  if(tab==='residents'){

      <div><div style="${sLbl}">Roster</div><h2 style="font-size:20px;font-weight:800;font-family:'Playfair Display',serif;">Residents (${S.residents.length})</h2></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button onclick="uploadRosterCSV()" style="${gBtn}font-size:12px;padding:7px 14px;">📥 Import CSV</button>

      <div style="font-size:12px;color:#374151;line-height:1.6;">Required columns: <code style="background:#E0EDFF;padding:1px 4px;border-radius:3px;">name, email, year</code> &nbsp;·&nbsp; Optional: <code style="background:#E0EDFF;padding:1px 4px;border-radius:3px;">degree, chief, enrolled</code><br>
      Year values: <code style="background:#E0EDFF;padding:1px 4px;border-radius:3px;">Intern</code> <code style="background:#E0EDFF;padding:1px 4px;border-radius:3px;">CA-1</code> <code style="background:#E0EDFF;padding:1px 4px;border-radius:3px;">CA-2</code> <code style="background:#E0EDFF;padding:1px 4px;border-radius:3px;">CA-3</code> &nbsp;·&nbsp;
      Enrolled: comma-separated course IDs e.g. <code style="background:#E0EDFF;padding:1px 4px;border-radius:3px;">"1,2,4"</code> &nbsp;·&nbsp;
      Chief: <code style="background:#E0EDFF;padding:1px 4px;border-radius:3px;">true</code> or <code style="background:#E0EDFF;padding:1px 4px;border-radius:3px;">false</code><br>
      <a href="#" onclick="downloadRosterTemplate();return false;" style="color:#1D4ED8;font-weight:600;">⬇ Download template CSV</a></div>
    </div>
    ${resH}`;
  }
  if(tab==='events'){
    const evH=[...S.events].sort((a,b)=>new Date(a.date)-new Date(b.date)).map(ev=>{
      const d=new Date(ev.date+'T00:00:00');const col=EC[ev.type]||'#555';

        <div style="text-align:center;min-width:44px;background:#F4F2EE;border-radius:8px;padding:7px 6px;border:1px solid #E8E5DF;flex-shrink:0;">
          <div style="font-size:9px;font-weight:700;color:#A8924A;text-transform:uppercase;">${d.toLocaleString('default',{month:'short'})}</div>
          <div style="font-size:18px;font-weight:800;font-family:'Playfair Display',serif;line-height:1.2;">${d.getDate()}</div>
        </div>
        <div style="flex:1;"><div style="font-weight:700;font-size:14px;">${ev.title}</div><div style="font-size:12px;color:#aaa;margin-top:3px;">${ev.time} · <span style="${tag(col+'18',col)}">${ev.type}</span></div></div>
        <div style="display:flex;gap:8px;flex-shrink:0;">
          <button onclick="editEv(${ev.id})" style="${gBtn}padding:6px 12px;font-size:12px;">✏️ Edit</button>
          <button onclick="delEv(${ev.id})" style="${dBtn}">Delete</button>
        </div>
      </div></div>`;
    }).join('');
    body=`<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;"><div><div style="${sLbl}">Schedule</div><h2 style="font-size:20px;font-weight:800;font-family:'Playfair Display',serif;">Events</h2></div><button onclick="editEv('new')" style="${pBtn()}">+ Add Event</button></div>${evH}`;
  }

  if(tab==='kudos'){
    const now = Date.now();
    const THIRTY = 30*24*60*60*1000;
    const active = S.kudos.filter(k => (now - k.ts) < THIRTY).sort((a,b)=>b.ts-a.ts);
    const rows = active.length ? active.map(k => {
      const daysLeft = Math.ceil((THIRTY - (now - k.ts)) / (24*60*60*1000));
      return `<div style="${card}margin-bottom:10px;padding:14px 18px;">
        <div style="display:flex;align-items:center;gap:12px;">

    </div>${rows}`;
  }
  if(tab==='evals'){
    const evals = S.evaluations || [];

    const byModule = {};

      byModule[key].items.push(e);
    });
    const modules = Object.entries(byModule).sort((a,b) => b[1].items.length - a[1].items.length);

    const exportCSV = () => {
      const rows = [['Module','Course','Feedback','Flagged','Date']];
      evals.forEach(e => {
        rows.push([
          (e.module_title||'').replace(/,/g,' '),
          e.course_id,
          (e.feedback||'').replace(/,/g,' ').replace(/\n/g,' '),
          e.flagged ? 'Yes' : 'No',
          e.ts ? new Date(e.ts).toLocaleDateString() : ''
        ]);
      });
      const csv = rows.map(r => r.join(',')).join('\n');
      const a = document.createElement('a');
      a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
      a.download = 'aneslearn_evaluations.csv';
      a.click();
    };

    const flaggedCount = evals.filter(e => e.flagged).length;

    const moduleCards = modules.length ? modules.map(([modId, mod]) => {
      const flagged = mod.items.filter(e => e.flagged);
      const unflagged = mod.items.filter(e => !e.flagged);
      const responseItems = mod.items.map(e => `
        <div style="padding:12px 14px;background:${e.flagged?'#FFF8F0':'#FAFAFA'};border:1px solid ${e.flagged?'#F5C6C0':'#E8E5DF'};border-radius:8px;margin-bottom:8px;">

            <button onclick="toggleEvalFlag('${e.id}',${!e.flagged})" style="flex-shrink:0;padding:4px 10px;border-radius:6px;border:1px solid ${e.flagged?'#F5C6C0':'#E8E5DF'};background:${e.flagged?'#FDF0EE':'#fff'};font-size:11px;cursor:pointer;color:${e.flagged?'#C0392B':'#777'};">${e.flagged?'🚩 Flagged':'Flag'}</button>
          </div>
          <div style="font-size:11px;color:#aaa;margin-top:6px;">${e.ts ? new Date(e.ts).toLocaleDateString() : ''}</div>

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <div>
            <div style="font-weight:700;font-size:14px;">${mod.title}</div>
            <div style="font-size:11px;color:#aaa;margin-top:2px;">${mod.items.length} response${mod.items.length!==1?'s':''}${flagged.length?' · '+flagged.length+' flagged':''}</div>
          </div>
        </div>
        ${responseItems}
      </div>`;
    }).join('') : `<div style="text-align:center;padding:48px 0;color:#aaa;font-size:14px;">No evaluations submitted yet.</div>`;

    body = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div>
        <div style="${sLbl}">Lecture Evaluations</div>
        <h2 style="font-size:20px;font-weight:800;font-family:'Playfair Display',serif;margin-top:4px;">${evals.length} Response${evals.length!==1?'s':''}</h2>

      </div>
      ${evals.length ? `<button onclick="(${exportCSV})()" style="${pBtn()}padding:9px 18px;font-size:13px;">⬇ Export CSV</button>` : ''}
    </div>
    ${moduleCards}`;
  }

  if(tab==='suggestions'){
    const suggs = (S.suggestions||[]).sort((a,b)=>b.ts-a.ts);
    const flagged = suggs.filter(s=>s.flagged);

    const exportCSV = () => {
      const rows = [['Category','Feedback','Flagged','Date']];
      suggs.forEach(s => rows.push([
        (s.category||'').replace(/,/g,' '),
        (s.feedback||'').replace(/,/g,' ').replace(/\n/g,' '),
        s.flagged?'Yes':'No',
        s.ts?new Date(s.ts).toLocaleDateString():''
      ]));
      const csv = rows.map(r=>r.join(',')).join('\n');
      const a=document.createElement('a');
      a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
      a.download='aneslearn_suggestions.csv';
      a.click();
    };

    const cards = suggs.length ? suggs.map(s => `
      <div style="${card}margin-bottom:10px;padding:16px 20px;border:1.5px solid ${s.flagged?'#F5C6C0':'#E8E5DF'};">

          <div style="flex:1;">
            <div style="font-size:12px;font-weight:700;color:#CFB87C;margin-bottom:4px;">${s.category||'General'}</div>
            <div style="font-size:13px;color:#1a1a1a;line-height:1.6;">${s.feedback}</div>
            <div style="font-size:11px;color:#aaa;margin-top:6px;">${s.ts?new Date(s.ts).toLocaleDateString():''}</div>
          </div>
          <button onclick="toggleSuggFlag('${s.id}',${!s.flagged})" style="flex-shrink:0;padding:4px 10px;border-radius:6px;border:1px solid ${s.flagged?'#F5C6C0':'#E8E5DF'};background:${s.flagged?'#FDF0EE':'#fff'};font-size:11px;cursor:pointer;color:${s.flagged?'#C0392B':'#777'};">${s.flagged?'🚩 Flagged':'Flag'}</button>
        </div>
      </div>`).join('') : `<div style="text-align:center;padding:48px 0;color:#aaa;font-size:14px;">No suggestions yet.</div>`;

    body = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div>
        <div style="${sLbl}">Suggestion Box</div>
        <h2 style="font-size:20px;font-weight:800;font-family:'Playfair Display',serif;margin-top:4px;">${suggs.length} Submission${suggs.length!==1?'s':''}</h2>
        ${flagged.length?`<div style="font-size:12px;color:#C0392B;margin-top:4px;">🚩 ${flagged.length} flagged</div>`:''}
      </div>
      ${suggs.length?`<button onclick="(${exportCSV})()" style="${pBtn()}padding:9px 18px;font-size:13px;">⬇ Export CSV</button>`:''}
    </div>
    ${cards}`;
  }

  if(tab==='feeds'){
    const ics = S.icsUrl||'';
    body=`
    <div style="margin-bottom:28px;"><div style="${sLbl}">Live Calendar Feeds</div><h2 style="font-size:20px;font-weight:800;font-family:'Playfair Display',serif;margin-top:4px;">Calendar Integration</h2><p style="font-size:13px;color:#777;margin-top:6px;">Connect your calendars once — the app fetches events automatically each time you open it.</p></div>

    <div style="${card}padding:24px;margin-bottom:20px;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
        <div style="width:36px;height:36px;border-radius:9px;background:#EDF1FB;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">🔄</div>
        <div><div style="font-size:15px;font-weight:700;">Outlook / Microsoft 365</div><div style="font-size:12px;color:#aaa;">ICS feed — syncs your calendar every time you open the app</div></div>
        ${ics?'<span style="margin-left:auto;font-size:11px;padding:3px 8px;border-radius:4px;background:#EDF7F1;color:#2D7D4F;font-weight:700;border:1px solid #C2E0CE;">Connected</span>':'<span style="margin-left:auto;font-size:11px;padding:3px 8px;border-radius:4px;background:#F4F2EE;color:#aaa;font-weight:700;">Not set</span>'}
      </div>
      <div style="margin-bottom:12px;">
        <label style="${lbl}">Outlook Published ICS URL</label>
        <input id="ics_url" style="${inp}" value="${ics}" placeholder="https://outlook.live.com/owa/calendar/.../reachcalendar.ics"/>
        <div style="font-size:11px;color:#aaa;margin-top:5px;line-height:1.5;">In Outlook Web: Settings → View all Outlook settings → Calendar → Shared calendars → Publish a calendar → select calendar → <strong>Can view all details</strong> → copy the <strong>ICS link</strong></div>
      </div>
      <div style="display:flex;gap:8px;">
        <button onclick="saveICS()" style="${pBtn()}font-size:12px;padding:7px 16px;">Save ICS Feed</button>
        ${ics?`<button onclick="fetchICS()" style="${pBtn('#2D5B9E','#fff')}font-size:12px;padding:7px 16px;">🔄 Sync Now</button>`:''}
        ${ics?`<button onclick="clearICS()" style="${dBtn}">Disconnect</button>`:''}

    </div>

    <div style="${card}padding:18px 22px;border-left:3px solid #E8A030;background:#FFF8EE;">
      <div style="font-size:11px;font-weight:700;color:#B87C2D;margin-bottom:6px;">HOW IT WORKS</div>
      <div style="font-size:12px;color:#666;line-height:1.7;">
        <strong>Outlook ICS:</strong> The app fetches your published ICS feed on page load and parses it into the custom event list. Hit "Sync Now" to refresh manually. Note: Outlook's ICS URLs may be blocked by browser CORS policy when running as a local file — if sync fails, try opening the app through a local web server (e.g. VS Code Live Server, or Python's <code style="background:#F4F2EE;padding:1px 4px;border-radius:3px;">python -m http.server</code>).
      </div>
    </div>`;
  }

  if(tab==='danger'){
    const resetRow = (icon, title, desc, fn, color='#C0392B') => `
    <div style="${card}padding:20px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
      <div style="width:40px;height:40px;border-radius:10px;background:#FDF0EE;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">${icon}</div>
      <div style="flex:1;min-width:180px;">
        <div style="font-size:14px;font-weight:700;color:#1a1a1a;">${title}</div>
        <div style="font-size:12px;color:#aaa;margin-top:2px;">${desc}</div>
      </div>
      <button onclick="${fn}" style="padding:8px 18px;border-radius:8px;border:1.5px solid ${color};background:#fff;color:${color};font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;">Reset</button>
    </div>`;

    body=`
    <div style="margin-bottom:24px;">
      <div style="${sLbl}">Admin Controls</div>
      <h2 style="font-size:20px;font-weight:800;font-family:'Playfair Display',serif;margin-top:4px;">Reset & Clear Data</h2>
      <p style="font-size:13px;color:#777;margin-top:6px;">These actions permanently delete data from the database. They cannot be undone.</p>
    </div>

    <div style="${card}padding:22px 24px;margin-bottom:24px;border:2px solid #C0392B;background:#FDF5F5;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
        <div style="font-size:28px;">💣</div>
        <div>
          <div style="font-size:15px;font-weight:800;color:#C0392B;">Reset Everything</div>
          <div style="font-size:12px;color:#aaa;margin-top:2px;">Clears all PINs, all notes, and all kudos in one action</div>
        </div>
      </div>
      <p style="font-size:12px;color:#888;margin-bottom:16px;line-height:1.6;">
        This will delete every resident's PIN, all module notes across all residents, and all kudos entries. Residents, courses, events, quizzes, and the podcast library are unaffected.
      </p>
      <button onclick="resetAll()" style="width:100%;padding:11px;border-radius:9px;border:none;background:#C0392B;color:#fff;font-size:14px;font-weight:800;cursor:pointer;letter-spacing:.02em;">
        💣 Reset All PINs, Notes & Kudos
      </button>
    </div>

    <!-- Change Admin PIN -->
    <div style="${card}padding:18px 20px;margin-bottom:20px;border:1.5px solid #E2CFA0;">
      <div style="font-weight:700;font-size:14px;margin-bottom:4px;">🔑 Change Admin PIN</div>
      <div style="font-size:12px;color:#aaa;margin-bottom:14px;">Update the admin PIN without touching Supabase.</div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <input id="new-admin-pin" type="password" placeholder="New PIN" maxlength="12" style="padding:8px 12px;border-radius:8px;border:1.5px solid #E8E5DF;font-size:14px;width:140px;letter-spacing:.2em;" oninput="this.style.borderColor='#CFB87C'">
        <input id="new-admin-pin-confirm" type="password" placeholder="Confirm PIN" maxlength="12" style="padding:8px 12px;border-radius:8px;border:1.5px solid #E8E5DF;font-size:14px;width:140px;letter-spacing:.2em;" oninput="this.style.borderColor='#CFB87C'">
        <button onclick="changeAdminPin()" style="${pBtn()}padding:8px 18px;font-size:13px;">Save PIN</button>
      </div>
    </div>

    <div style="display:grid;gap:12px;">
      ${resetRow('🔐','Reset All PINs','Removes every resident\'s saved PIN — they will be prompted to create a new one on next login','resetPins()')}
      ${resetRow('📝','Clear All Notes','Deletes all module notes saved by all residents','resetNotes()')}
      ${resetRow('🏆','Clear All Kudos','Deletes all kudos entries from the database','resetKudos()')}
      ${resetRow('🗒️','Clear All Evaluations','Deletes all anonymous lecture evaluations from the database','resetEvals()')}
      ${resetRow('💬','Clear All Suggestions','Deletes all anonymous suggestion box submissions','resetSuggestions()')}
    </div>`;
  }

  return body;
}

// ─── NOTES ────────────────────────────────────────────────────────────────────
let _noteTimer = null;

function noteChanged(val, key) {
  if(!S._notesDirty) S._notesDirty = {};
  S._notesDirty[key] = val;
  const el = document.getElementById('note-status');
  if(el) el.textContent = 'Unsaved…';
  clearTimeout(_noteTimer);
  _noteTimer = setTimeout(() => saveNote(key, true), 1800);
}

async function saveNote(key, auto=false) {
  const el = document.getElementById('note-area');
  const val = el ? el.value : (S._notesDirty?.[key] ?? '');
  if(!S._notes) S._notes = {};
  S._notes[key] = val;
  if(S._notesDirty) S._notesDirty[key] = val;
  const st = document.getElementById('note-status');
  if(st) st.textContent = 'Saving…';
  try {
    await sb.from('settings').upsert({key, value: JSON.stringify(val)});
    if(st) st.textContent = 'Saved ✓';
    if(!auto) draw(); // re-render to update tab indicator
  } catch(e) {
    if(st) st.textContent = 'Save failed — check connection';
  }
}

async function clearNote(key) {
  if(!confirm('Clear these notes?')) return;
  if(!S._notes) S._notes = {};
  S._notes[key] = '';
  await sb.from('settings').upsert({key, value: JSON.stringify('')});
  draw();
}

async function loadAllNotes(resId) {
  if(!resId) return;
  try {
    const {data} = await sb.from('settings').select('key,value').like('key', `note_${resId}_%`);
    if(!S._notes) S._notes = {};
    (data||[]).forEach(row => {
      try { S._notes[row.key] = JSON.parse(row.value); } catch { S._notes[row.key] = row.value; }
    });
  } catch(e) { console.warn('loadAllNotes:', e); }
}

function exportNotes() {
  const res = getRes();
  if(!res) return;
  const notes = S._notes || {};
  const allCourses = S.courses;
  let lines = [];
  lines.push(`ANESLEARN — PERSONAL NOTES`);
  lines.push(`${res.name} · ${res.year}`);
  lines.push(`Exported: ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}`);
  lines.push('═'.repeat(60));
  let hasAny = false;
  allCourses.forEach(course => {
    const courseNotes = [];
    course.modules.forEach(mod => {
      const key = `note_${res.id}_${mod.id}`;
      const txt = (notes[key] || '').trim();
      if(txt) courseNotes.push({mod, txt});
    });
    if(!courseNotes.length) return;
    hasAny = true;
    lines.push('');
    lines.push(`${course.icon}  ${course.title.toUpperCase()}`);
    lines.push('─'.repeat(60));
    courseNotes.forEach(({mod, txt}) => {
      lines.push('');
      lines.push(`  Week ${mod.week}: ${mod.title}`);
      if(mod.date) lines.push(`  📅 ${mod.date}${mod.faculty?' · 👩‍⚕️ '+mod.faculty:''}`);
      lines.push('');
      txt.split('\n').forEach(l => lines.push('  ' + l));
      lines.push('');
    });
  });
  if(!hasAny) { alert('No notes to export yet.'); return; }
  const blob = new Blob([lines.join('\n')], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `AnesLearn_Notes_${res.name.replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

const VAPID_PUBLIC = 'BIFGZZ9ZfWBPMl1pbGRQ8my_YLShMQbu4Y_jH2HqU8cegRyHZLIw8rxbj8vnehcctf00MhWA4yRD6F3fkVvzEcA';

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

async function checkPushStatus() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      S.pushRegistered = true;
      draw();
    }
  } catch(e) { console.warn('Push check failed:', e); }
}

async function registerPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    alert('Push notifications are not supported in this browser.');
    return;
  }
  try {
    const permission = await Notification.requestPermission();
    if (permission === 'denied') {
      alert('Notifications are blocked. In Safari: go to Safari → Settings → Websites → Notifications, allow this site, then try again.');
      return;
    }
    if (permission !== 'granted') {
      alert('Notification permission was not granted (status: ' + permission + ').');
      return;
    }
    const reg = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC)
    });
    const res = getRes();
    if (res) {
      await dbUpsert('settings', { key: 'push_' + res.id, value: JSON.stringify(sub) });
    }
    S.pushRegistered = true;
    draw();
    alert('✅ Notifications enabled!');
  } catch(e) {
    console.error('Push registration failed:', e);
    alert('Could not enable notifications: ' + (e.message || e));
  }
}

async function unregisterPush() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) await sub.unsubscribe();
    const res = getRes();
    if (res) await dbDelete('settings', 'key', 'push_' + res.id);
    S.pushRegistered = false;
    S.modal = null;
    draw();
  } catch(e) { console.error('Unregister failed:', e); }
}

function togglePushPrompt() {
  if (S.pushRegistered) {
    S.modal = { type: 'pushSettings', data: {} };
    draw();
  } else {
    registerPush();
  }
}

function uploadRosterCSV() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.csv';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    const text = await file.text();
    const parsed = parseRosterCSV(text);
    if (!parsed.length) { alert('No valid rows found. Check your CSV format.'); return; }
    // Show preview before committing
    S.modal = { type: 'rosterPreview', data: { residents: parsed } };
    draw();
  };
  input.click();
}

function parseRosterCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/"/g,''));
  const nameIdx    = headers.findIndex(h => h === 'name');
  const emailIdx   = headers.findIndex(h => h === 'email');
  const yearIdx    = headers.findIndex(h => h === 'year');
  const degreeIdx  = headers.findIndex(h => h === 'degree');
  const chiefIdx   = headers.findIndex(h => h === 'chief');
  const enrollIdx  = headers.findIndex(h => h === 'enrolled');

  if (nameIdx === -1 || emailIdx === -1 || yearIdx === -1) {
    alert('CSV must have name, email, and year columns.');
    return [];
  }

  const results = [];
  for (let i = 1; i < lines.length; i++) {
    // Handle quoted fields
    const cols = lines[i].match(/(".*?"|[^,]+|(?<=,)(?=,)|(?<=,)$|^(?=,))/g) || [];
    const clean = cols.map(c => c.replace(/^"|"$/g,'').trim());
    const name = clean[nameIdx];
    if (!name) continue;
    const enrolledRaw = enrollIdx >= 0 ? (clean[enrollIdx]||'') : '';
    const enrolled = enrolledRaw ? enrolledRaw.split(',').map(x=>parseInt(x.trim())).filter(n=>!isNaN(n)) : [];
    results.push({
      id: 'r' + Date.now() + '_' + i,
      name:    name,
      email:   clean[emailIdx]  || '',
      year:    clean[yearIdx]   || 'CA-1',
      degree:  degreeIdx >= 0 ? (clean[degreeIdx] || 'MD') : 'MD',
      chief:   chiefIdx >= 0 ? (clean[chiefIdx]||'').toLowerCase() === 'true' : false,
      enrolled,
    });
  }
  return results;
}

function importCalendar(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    const isICS = file.name.toLowerCase().endsWith('.ics');
    const parsed = isICS ? parseICS(text) : parseOutlookCSV(text);
    if (!parsed.length) {
      alert('No events found in this file. Make sure it is an Outlook CSV or .ics calendar export.');
      input.value = '';
      return;
    }
    S.modal = {
      type: 'importPreview',
      data: { events: parsed }
    };
    input.value = '';
    draw();
  };
  reader.readAsText(file);
}

function parseOutlookCSV(text) {
  const lines = text.split('\n').map(l=>l.replace(/\r$/,'')).filter(l=>l.trim());
  if (lines.length < 2) return [];
  // Parse header
  const header = parseCSVLine(lines[0]).map(h => h.trim().toLowerCase());
  const col = name => {
    const aliases = {
      title:    ['subject','title','summary','event'],
      date:     ['start date','date','start','startdate','dtstart'],
      time:     ['start time','time','starttime'],
      end:      ['end date','end','enddate','dtend'],
      type:     ['categories','category','type','label'],
      location: ['location'],
    };
    for (const a of (aliases[name]||[name])) {
      const i = header.indexOf(a);
      if (i !== -1) return i;
    }
    return -1;
  };

  const events = [];
  for (let i = 1; i < lines.length; i++) {
    const cells = parseCSVLine(lines[i]);
    const title = cells[col('title')]?.trim();
    const rawDate = cells[col('date')]?.trim();
    const rawTime = cells[col('time')]?.trim() || '';
    const rawType = cells[col('type')]?.trim() || '';
    if (!title || !rawDate) continue;
    const date = normalizeDate(rawDate);
    if (!date) continue;
    const time = normalizeTime(rawTime);
    const type = mapEventType(rawType);
    events.push({ id: Date.now() + Math.random(), title, date, time, type });
  }
  return events;
}

function parseICS(text) {
  const events = [];
  const vevents = text.split('BEGIN:VEVENT').slice(1);
  for (const block of vevents) {
    const get = key => {
      const m = block.match(new RegExp(key + '[^:]*:([^\r\n]+)'));
      return m ? m[1].trim() : '';
    };
    const summary = get('SUMMARY').replace(/\,/g, ',').replace(/\n/g, ' ');
    const dtstart = get('DTSTART');
    const categories = get('CATEGORIES');
    const location = get('LOCATION');
    if (!summary || !dtstart) continue;
    const date = parseICSDate(dtstart);
    const time = parseICSTime(dtstart);
    if (!date) continue;
    events.push({ id: Date.now() + Math.random(), title: summary, date, time, type: mapEventType(categories) });
  }
  return events;
}

function parseCSVLine(line) {
  const result = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQ = !inQ; }
    else if (ch === ',' && !inQ) { result.push(cur); cur = ''; }
    else cur += ch;
  }
  result.push(cur);
  return result;
}

function normalizeDate(raw) {
  if (!raw) return null;
  // MM/DD/YYYY or M/D/YYYY
  let m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  // YYYY-MM-DD
  m = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  // DD-Mon-YYYY
  m = raw.match(/^(\d{1,2})-([A-Za-z]+)-(\d{4})$/);
  if (m) {
    const months = {jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
    const mon = months[m[2].toLowerCase().slice(0,3)];
    if (mon) return `${m[3]}-${mon}-${m[1].padStart(2,'0')}`;
  }
  return null;
}

function normalizeTime(raw) {
  if (!raw) return '';
  // Already formatted like "3:30 PM"
  const m = raw.match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  if (!m) return raw;
  let h = parseInt(m[1]), min = m[2], ampm = (m[3]||'').toUpperCase();
  if (!ampm) ampm = h < 12 ? 'AM' : 'PM';
  if (ampm === 'PM' && h < 12) h += 12;
  if (ampm === 'AM' && h === 12) h = 0;
  const disp = (h % 12 || 12) + ':' + min + ' ' + (h < 12 ? 'AM' : 'PM');
  return disp;
}

function parseICSDate(dtstart) {
  const m = dtstart.match(/(\d{4})(\d{2})(\d{2})/);
  return m ? `${m[1]}-${m[2]}-${m[3]}` : null;
}

function parseICSTime(dtstart) {
  const m = dtstart.match(/T(\d{2})(\d{2})/);
  if (!m) return '';
  let h = parseInt(m[1]), min = m[2];
  return (h % 12 || 12) + ':' + min + ' ' + (h < 12 ? 'AM' : 'PM');
}

function mapEventType(raw) {
  if (!raw) return 'Event';
  const r = raw.toLowerCase();
  if (/lecture|grand round|talk|didactic|conference/.test(r)) return 'Lecture';
  if (/workshop|lab|hands.on|skill/.test(r)) return 'Workshop';
  if (/sim|simulation/.test(r)) return 'Simulation';
  if (/deadline|due|exam|test|quiz/.test(r)) return 'Deadline';
  return 'Event';
}

// ─── CALENDAR FEED ACTIONS ────────────────────────────────────────────────────

function saveICS(){
  const url = document.getElementById('ics_url')?.value?.trim()||'';
  persist('icsUrl', url);
  if(url){ S.showAdmin=false; fetchICS(); }
  else draw();
}
function clearICS(){ S.icsUrl=''; S.icsEvents=[]; saveS('al6_ics',''); draw(); }

async function fetchICS(){
  const url = (S.icsUrl||'').trim();
  if(!url){ draw(); return; }
  S.icsFetching=true; draw();
  try {
    // Try direct fetch first, fall back to CORS proxy
    let text = null;
    const proxies = [
      url,  // direct (works if server has CORS headers or app is served, not file://)
      `https://corsproxy.io/?${encodeURIComponent(url)}`,
      `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    ];
    for(const src of proxies){
      try {
        const res = await fetch(src, {cache:'no-store'});
        if(res.ok){ text = await res.text(); break; }
      } catch(e){ continue; }
    }
    if(text && text.includes('BEGIN:VCALENDAR')){
      const events = parseICS(text);
      S.icsEvents = events;
      S.icsLastFetched = Date.now();
      saveS('al6_ics_cache', JSON.stringify({events, fetched: S.icsLastFetched}));
    } else {
      // Try loading from cache
      const cached = loadS('al6_ics_cache', null);
      if(cached){ S.icsEvents=cached.events; S.icsLastFetched=cached.fetched; }
      if(!text) alert('Could not fetch Outlook ICS feed. This is usually a CORS restriction when running as a local HTML file.\n\nTry opening the app via a local web server:\n  python3 -m http.server\nThen visit http://localhost:8000');
    }
  } catch(e){
    const cached = loadS('al6_ics_cache', null);
    if(cached){ S.icsEvents=cached.events; S.icsLastFetched=cached.fetched; }
  }
  S.icsFetching=false; draw();
}

// Auto-fetch ICS on load if URL is set
(function autoFetchOnLoad(){
  if(S.icsUrl){
    // Load cache immediately for instant display, then refresh in background
    const cached = loadS('al6_ics_cache', null);
    if(cached){ S.icsEvents=cached.events; S.icsLastFetched=cached.fetched; }
    setTimeout(fetchICS, 800); // slight delay so initial render is fast
  }
})();


// ─── INDEXED DB — PDF STORAGE ─────────────────────────────────────────────────
const DB_NAME = 'AnesLearnDB', DB_VER = 1, STORE = 'pdfs';
let _db = null;

function openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => e.target.result.createObjectStore(STORE, {keyPath: 'id'});
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror = () => reject(req.error);
  });
}

async function idbSave(id, dataUrl, name) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put({id, dataUrl, name});
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

async function idbGet(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const req = db.transaction(STORE,'readonly').objectStore(STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function idbDelete(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

// Upload a PDF file, store in IndexedDB, attach to current module
async function uploadPDF() {
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'application/pdf';
  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    if (!file) return;
    if (file.type !== 'application/pdf') { alert('Please select a PDF file.'); return; }

    // Show loading state
    const btn = document.getElementById('uploadPdfBtn');
    if (btn) { btn.textContent = 'Uploading…'; btn.disabled = true; }

    const reader = new FileReader();
    reader.onload = async e => {
      const dataUrl = e.target.result;
      const sizeMB = (dataUrl.length * 0.75 / 1024 / 1024).toFixed(1);
      const label = document.getElementById('ct_label')?.value?.trim() || file.name.replace(/\.pdf$/i,'');
      const id = 'pdf_' + Date.now();

      try {
        await idbSave(id, dataUrl, file.name);
        // Set the form fields so saveCt picks it up
        const labelEl = document.getElementById('ct_label');
        const urlEl   = document.getElementById('ct_url');
        const typeEl  = document.getElementById('ct_type');
        if (labelEl && !labelEl.value.trim()) labelEl.value = file.name.replace(/\.pdf$/i,'');
        if (urlEl)  urlEl.value  = id;   // store the IDB key as the "url"
        if (typeEl) typeEl.value = 'upload';
        const hint = document.getElementById('ct_hint');
        if (hint) {
          hint.textContent = `✓ PDF stored locally (${sizeMB} MB) — click Attach to save`;
          hint.style.color = '#2D7D4F';
        }
      } catch(err) {
        alert('Failed to store PDF: ' + err.message);
      }
      if (btn) { btn.textContent = '📎 Upload PDF'; btn.disabled = false; }
    };
    reader.readAsDataURL(file);
  };
  fileInput.click();
}

// Open a stored PDF in a new tab (for the ↗ button)
async function openStoredPDF(id) {
  try {
    const rec = await idbGet(id);
    if (!rec) { alert('PDF not found in local storage. It may have been cleared.'); return; }
    const blob = dataURLToBlob(rec.dataUrl);
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  } catch(e) { alert('Could not open PDF: ' + e.message); }
}

function dataURLToBlob(dataUrl) {
  const [header, data] = dataUrl.split(',');
  const mime = header.match(/:(.*?);/)[1];
  const bytes = atob(data);
  const arr = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  return new Blob([arr], {type: mime});
}

// Render a stored PDF inside an iframe using a blob URL
// Called after pgModule renders — attaches blob URL to iframe
async function renderStoredPDF(iframeId, idbKey) {
  try {
    const rec = await idbGet(idbKey);
    if (!rec) return;
    const blob = dataURLToBlob(rec.dataUrl);
    const url = URL.createObjectURL(blob);
    const iframe = document.getElementById(iframeId);
    if (iframe) iframe.src = url;
  } catch(e) { console.error('renderStoredPDF:', e); }
}

// Delete PDF from IndexedDB when content item is removed
async function deleteStoredPDF(idbKey) {
  try { await idbDelete(idbKey); } catch(e) {}
}

function uploadQuiz() {
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = '.docx';
  fileInput.multiple = true;
  fileInput.onchange = () => handleQuizFiles(Array.from(fileInput.files));

async function handleQuizFiles(files) {
  if (!files.length) return;
  S.modal = { type: 'quizUploading', data: { total: files.length, done: 0, errors: [] } };
  draw();
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    try {
      const arrayBuffer = await file.arrayBuffer();
      const docxBytes = Array.from(new Uint8Array(arrayBuffer));
      const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer.slice(0) });
      const questions = await parseQuizWithAI(result.value);
      await dbUpsert('quizzes', {
        id: 'quiz_' + Date.now() + '_' + i,
        name: file.name.replace(/\.docx$/i, ''),
        questions: questions,
        docx_bytes: docxBytes,
        attempts: 0
      });
    } catch(e) {
      S.modal.data.errors.push(file.name + ': ' + e.message);
    }
    S.modal.data.done = i + 1;
    draw();
  }
  const qrows = await dbGet('quizzes');
  S.quizzes = qrows.map(q=>({...q, docxBytes:q.docx_bytes}));
  S.modal = null;
  draw();
}

function parseQuizWithAI(text) {
  // Parse locally — no API call needed
  return Promise.resolve(parseQuizLocally(text));
}

function parseQuizLocally(text) {
  const questions = [];
  // Split on numbered question patterns: "1." "1)" "Q1." "Question 1"
  const lines = text.split(/\n/).map(l => l.trim()).filter(l => l);
  let currentQ = null;
  const qPattern = /^(?:Q(?:uestion)?\s*)?\d+[.):]\s+(.+)/i;

  for (const line of lines) {
    const match = line.match(qPattern);
    if (match) {
      if (currentQ) questions.push(currentQ);
      currentQ = { q: match[1], answer: '' };
    } else if (currentQ && line.length > 0) {
      // If line doesn't look like a new question number, treat as continuation
      if (!line.match(/^\d+[.)]/)) {
        currentQ.q += ' ' + line;
      }
    }
  }
  if (currentQ) questions.push(currentQ);

  // If numbered pattern found nothing, try splitting on blank lines
  // and treat each non-empty paragraph as a question
  if (!questions.length) {
    const paras = text.split(/\n\s*\n/).map(p => p.replace(/\n/g,' ').trim()).filter(p => p.length > 20);
    return paras.map(p => ({ q: p, answer: '' }));
  }
  return questions;
}

  if (!quiz) return `<p>Quiz not found. <button onclick="go('quizzes')" style="${pBtn()}">Back</button></p>`;
  const questions = quiz.questions || [];
  const revealed = S.quizRevealed || {};
  const total = questions.length;
  const doneCount = Object.keys(revealed).length;

  const cards = questions.map((q, i) => {
    const isRevealed = !!revealed[i];
    const responseKey = 'qr_' + S.activeQuizId + '_' + i;
    const savedResponse = S.quizResponses?.[responseKey] || '';
    const hasAnswer = !!(q.answer||'').trim();

    return `<div style="${card}padding:24px 28px;margin-bottom:14px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <span style="font-size:11px;font-weight:700;color:#A8924A;letter-spacing:.06em;">QUESTION ${i+1} OF ${total}</span>
        ${isRevealed?'<span style="font-size:11px;color:#2D7D4F;font-weight:700;">✓ Reviewed</span>':''}
      </div>
      <div style="font-size:15px;font-weight:600;line-height:1.65;margin-bottom:18px;">${q.q}</div>

      ${!isRevealed ? `
        <div style="margin-bottom:12px;">
          <label style="font-size:11px;font-weight:700;color:#888;letter-spacing:.05em;display:block;margin-bottom:6px;">YOUR RESPONSE</label>
          <textarea id="resp_${i}" rows="3" placeholder="Type your answer before revealing…" style="width:100%;padding:11px 14px;border-radius:9px;border:1.5px solid #E8E5DF;font-size:13px;font-family:inherit;resize:vertical;color:#1a1a1a;background:#fff;box-sizing:border-box;">${savedResponse}</textarea>
        </div>
        <button onclick="revealAnswer(${i})" style="width:100%;padding:12px;border-radius:9px;background:${hasAnswer?'#1B1B1B':'#F4F2EE'};border:1.5px solid ${hasAnswer?'#CFB87C':'#D0CCC5'};cursor:pointer;font-size:13px;font-weight:600;color:${hasAnswer?'#CFB87C':'#888'};">
          ${hasAnswer ? 'Reveal Answer ▾' : 'Mark as Reviewed ✓'}
        </button>`
      : `
        ${savedResponse ? `
          <div style="margin-bottom:16px;">
            <div style="font-size:11px;font-weight:700;color:#888;letter-spacing:.05em;margin-bottom:8px;">YOUR RESPONSE</div>
            <div style="font-size:13px;color:#555;background:#F9F9F9;padding:12px 14px;border-radius:9px;border:1px solid #E8E5DF;line-height:1.6;white-space:pre-wrap;">${savedResponse}</div>
          </div>` : ''}
        ${hasAnswer ? `
          <div style="border-top:1px solid #E8E5DF;padding-top:16px;">
            <div style="font-size:11px;font-weight:700;color:#2D5B9E;margin-bottom:8px;letter-spacing:.06em;">ANSWER</div>
            <div style="font-size:14px;color:#1a1a1a;line-height:1.7;background:#EDF1FB;padding:14px 16px;border-radius:9px;border-left:3px solid #2D5B9E;">${q.answer}</div>
          </div>` : `
          <div style="padding:12px 14px;background:#F4F2EE;border-radius:9px;font-size:13px;color:#aaa;font-style:italic;">No answer provided yet — check back when answers are added.</div>`
        }
        <button onclick="unrevealAnswer(${i})" style="background:none;border:none;cursor:pointer;font-size:11px;color:#ccc;margin-top:10px;padding:0;">↺ Try again</button>`
      }
    </div>`;
  }).join('');

  return `<div class="fade">
    <button onclick="go('quizzes')" style="${gBtn}border:none;background:none;color:#777;margin-bottom:20px;padding-left:0;">← All OR Worksheets</button>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:10px;">
      <div><div style="${sLbl}margin-bottom:6px;">Quiz</div><h1 style="font-size:24px;font-weight:800;font-family:'Playfair Display',serif;">${quiz.name}</h1></div>
      <div style="display:flex;align-items:center;gap:10px;">
        ${(quiz.docxBytes||quiz.docx_bytes)?`<button onclick="downloadQuizDocx('${quiz.id}')" style="${gBtn}font-size:12px;padding:7px 14px;">⬇ .docx</button>`:''}
        <span style="font-size:13px;color:#aaa;">${doneCount} / ${total} reviewed</span>
      </div>
    </div>
    <div style="background:#F4F2EE;border-radius:8px;height:5px;margin-bottom:24px;overflow:hidden;">
      <div style="background:#CFB87C;height:100%;width:${total?Math.round(doneCount/total*100):0}%;border-radius:8px;transition:width .3s;"></div>
    </div>
    ${cards}
  </div>`;
}

function revealAnswer(idx) {
  // Save whatever was typed before revealing
  const ta = document.getElementById('resp_' + idx);
  if (ta) {
    const key = 'qr_' + S.activeQuizId + '_' + idx;
    S.quizResponses = {...(S.quizResponses||{}), [key]: ta.value};
  }
  S.quizRevealed = {...(S.quizRevealed||{}), [idx]: true};
  draw();
}
function unrevealAnswer(idx) { const r={...(S.quizRevealed||{})}; delete r[idx]; S.quizRevealed=r; draw(); }

function renderQuizUploadingModal(data) {
  const {total, done, errors} = data;
  const pct = total ? Math.round(done/total*100) : 0;
  return `
    <h2 style="font-size:18px;font-weight:700;font-family:'Playfair Display',serif;margin-bottom:20px;">Uploading OR Worksheets…</h2>
    <div style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;font-size:13px;color:#666;margin-bottom:8px;">
        <span>Processing ${done} of ${total} files</span><span>${pct}%</span>
      </div>
      <div style="background:#F4F2EE;border-radius:8px;height:10px;overflow:hidden;">
        <div style="background:#CFB87C;height:100%;width:${pct}%;border-radius:8px;transition:width .3s;"></div>
      </div>
    </div>
    ${errors.length?`<div style="margin-top:14px;font-size:12px;color:#B83232;">${errors.map(e=>'<div>⚠ '+e+'</div>').join('')}</div>`:''}
    <p style="font-size:12px;color:#aaa;margin-top:14px;">Please wait — AI is parsing each document…</p>`;
}

const KUDOS_BADGES = [
  { id:'brain',   emoji:'🧠', label:'Big Brain',       desc:'Exceptional clinical knowledge'    },
  { id:'hands',   emoji:'🫀', label:'Steady Hands',    desc:'Technical skill under pressure'    },
  { id:'team',    emoji:'🤝', label:'Team Player',     desc:'Always there for the team'         },
  { id:'hero',    emoji:'🦸', label:'Code Hero',       desc:'Clutch in a crisis'                },
  { id:'teach',   emoji:'📚', label:'Teaching Legend', desc:'Outstanding educator'              },
  { id:'vibes',   emoji:'✨', label:'Good Vibes',      desc:'Lifts the whole room'              },
];

async function submitKudos() {
  const recipientId = document.getElementById('kudos_recipient')?.value;
  const badgeId     = document.querySelector('input[name="kudos_badge"]:checked')?.value;
  const message     = document.getElementById('kudos_message')?.value?.trim();

  if (!recipientId) { alert('Please select a recipient.'); return; }
  if (!badgeId)     { alert('Please select a badge.'); return; }
  if (!message)     { alert('Please write a short note.'); return; }
  if (message.length > 280) { alert('Keep it under 280 characters.'); return; }

  const recipient  = S.residents.find(r => r.id === recipientId);
  const badge      = KUDOS_BADGES.find(b => b.id === badgeId);
  const giver      = getRes();
  const giverName  = giver?.name || 'A colleague';
  const firstName  = (recipient?.name || '').split(' ')[0] || 'there';

  const kudo = {
    id:             'k_' + Date.now(),
    from_id:        S.activeResidentId,
    recipient_id:   recipientId,
    recipient_name: recipient?.name || 'Unknown',
    badge_id:       badgeId,
    badge_emoji:    badge?.emoji || '⭐',
    badge_label:    badge?.label || '',
    message,
    ts:             Date.now(),
  };

  await dbUpsert('kudos', kudo);

  // Send email + SMS to recipient
  try {
    const recipientEmail = recipient?.email;
    const recipientPhone = recipient?.phone;
    const resendKey = await dbGetSetting('resend_api_key', '');
    const emailFrom = await dbGetSetting('email_from', 'AnesLearn <noreply@cuaneslearn.com>');
    const twilioSid  = await dbGetSetting('twilio_sid', '');
    const twilioToken = await dbGetSetting('twilio_token', '');
    const twilioFrom = await dbGetSetting('twilio_from', '');

    // Email
    if (resendKey && recipientEmail) {
      await fetch('https://api.resend.com/emails', {
        method: 'POST',
        headers: {'Content-Type':'application/json','Authorization':'Bearer '+resendKey},
        body: JSON.stringify({
          from: emailFrom,
          to: [recipientEmail],
          subject: `${badge?.emoji || '⭐'} ${giverName} sent you a K-Hole Kudo!`,
          html: `<div style="font-family:sans-serif;max-width:500px;margin:0 auto;background:#1B1B1B;border-radius:14px;overflow:hidden;">
            <div style="background:#CFB87C;padding:20px 24px;text-align:center;">
              <div style="font-size:48px;">${badge?.emoji || '⭐'}</div>
              <div style="font-size:18px;font-weight:800;color:#1B1B1B;margin-top:8px;">K-Hole Kudos</div>
            </div>
            <div style="padding:24px;color:#fff;">
              <p style="font-size:16px;margin:0 0 12px;">Hey ${firstName},</p>
              <p style="font-size:15px;margin:0 0 16px;color:#CFB87C;font-weight:700;">${badge?.emoji} ${badge?.label}</p>
              <p style="font-size:15px;margin:0 0 20px;line-height:1.6;">${message}</p>
              <p style="font-size:13px;color:rgba(255,255,255,.5);margin:0;">— Sent anonymously via AnesLearn K-Hole Kudos</p>
            </div>
          </div>`
        })
      });
    }

    // SMS via Twilio
    if (twilioSid && twilioToken && twilioFrom && recipientPhone) {
      const smsBody = `${badge?.emoji || '⭐'} K-Hole Kudos!\n\n${badge?.label}\n\n"${message}"\n\n— Sent anonymously via AnesLearn`;
      const formData = new URLSearchParams({
        From: twilioFrom,
        To: recipientPhone,
        Body: smsBody
      });
      await fetch(`https://api.twilio.com/2010-04-01/Accounts/${twilioSid}/Messages.json`, {
        method: 'POST',
        headers: {
          'Authorization': 'Basic ' + btoa(twilioSid + ':' + twilioToken),
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: formData
      });
    }
  } catch(emailErr) { console.warn('Kudos notification failed:', emailErr); }

  // Reload kudos from DB
  const rows = await dbGet('kudos');
  S.kudos = rows.sort((a,b)=>b.ts-a.ts).map(k=>({
    ...k, recipientId:k.recipient_id, recipientName:k.recipient_name,
    badgeId:k.badge_id, badgeEmoji:k.badge_emoji, badgeLabel:k.badge_label
  }));
  S.modal = { type: 'kudosSent', data: { kudo: {...kudo, recipientName:kudo.recipient_name, badgeEmoji:kudo.badge_emoji, badgeLabel:kudo.badge_label} } };
  draw();
}

async function submitSuggestion() {
  const text = document.getElementById('sugg-text')?.value.trim();
  const cat = S._suggCat || 'General';
  if(!text) { alert('Please enter a suggestion before submitting.'); return; }
  try {
    const row = { feedback: text, category: cat, flagged: false, ts: Date.now() };
    await dbUpsert('suggestions', row);
    S.suggestions = [...(S.suggestions||[]), row];
    localStorage.setItem('al6_suggested_' + (S.activeResidentId||''), '1');
    S._suggCat = null;

    // Email admin
    try {
      const adminRes = S.residents.find(r => r.year === 'A');
      const adminEmail = adminRes?.email || 'mitchell.gist@cuanschutz.edu';
      const emailFrom = await dbGetSetting('email_from', 'AnesLearn <noreply@cuaneslearn.com>');
      const resendKey = await dbGetSetting('resend_api_key', '');
      if(resendKey) {
        await fetch('https://api.resend.com/emails', {
          method: 'POST',
          headers: {'Content-Type':'application/json','Authorization':'Bearer '+resendKey},
          body: JSON.stringify({
            from: emailFrom,
            to: [adminEmail],
            subject: `New Suggestion [${cat}]`,
            html: `<div style="font-family:sans-serif;max-width:560px;margin:0 auto;">
              <h2 style="color:#1B1B1B;">New Suggestion Box Submission</h2>
              <p><strong>Category:</strong> ${cat}</p>
              <p><strong>Submitted:</strong> ${new Date().toLocaleDateString()}</p>
              <div style="background:#F4F2EE;border-radius:8px;padding:16px;margin:16px 0;">
                <p style="margin:0;font-size:15px;line-height:1.6;">${text.replace(/\n/g,'<br>')}</p>
              </div>
              <p style="font-size:12px;color:#aaa;">Submitted anonymously via AnesLearn Suggestion Box.</p>
              <a href="https://cuaneslearn.com" style="font-size:12px;color:#CFB87C;">View in Admin Panel →</a>
            </div>`
          })
        });
      }
    } catch(e) { console.warn('Suggestion email failed:', e); }

    draw();
  } catch(e) {
    alert('Could not submit. Please try again.');
    console.error('submitSuggestion error:', e);
  }
}
